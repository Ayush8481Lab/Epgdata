                      <div className="absolute top-32 -right-32 w-[420px] h-[420px] rounded-full bg-fuchsia-500/30 blur-[140px]" style={{ animation: 'float2 18s ease-in-out infinite' }} />
                      <div className="absolute bottom-8 left-1/4 w-[380px] h-[380px] rounded-full bg-cyan-400/25 blur-[130px]" style={{ animation: 'float3 20s ease-in-out infinite' }} />
                      <div className="absolute top-1/2 right-1/3 w-[300px] h-[300px] rounded-full bg-amber-400/15 blur-[110px]" />
                    </div>

                    <header className="sticky top-0 z-30 bg-[#050509]/70 backdrop-blur-2xl border-b border-white/[0.08] px-4 pt-6 pb-4">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
