name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Premium Offline Player UI
        run: |
          mkdir -p www
          cat <<'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Music8481</title>
            <style>body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #07070b; }</style>
          </head>
          <body></body>
          </html>
          EOF

          cat <<'EOF' > www/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>Music8481 Offline</title>
          <style>
          :root {
          --bg:#07070b; --hx:#1ed760; --hx2:#8b5cf6; --hx3:#22d3ee; --surf:rgba(255,255,255,.055); --line:rgba(255,255,255,.09); --txt2:#9ca3af;
          --base:#2c2c2c; --deep:#161616; --accent:#a8a8a8; --light:#bdbdbd; --glow:rgba(255,255,255,.14);
          --active:#fff; --past:rgba(255,255,255,.36); --upcoming:#c4c4c4;
          --c-lyr-a:#2c2c2c; --c-lyr-b:#161616; --c-about-a:#242424; --c-about-b:#101010;
          --c-q-a:#202020; --c-q-b:#0a0a0a; --c-st-a:#363636; --c-st-b:#1e1e1e;
          --mini-fs:16px; --card-fs:24px; --full-fs:34px;
          --st:max(env(safe-area-inset-top),30px); --sb:max(env(safe-area-inset-bottom),14px);
          }
          * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
          html, body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-text-size-adjust:100%; }
          img { pointer-events:none; -webkit-user-drag:none; }
          button { font-family:inherit; border:0; background:none; color:inherit; padding:0; cursor:pointer; }
          input { font-family:inherit; }
          svg { display:block; }
          .scroll-hide { scrollbar-width:none; -ms-overflow-style:none; }
          .scroll-hide::-webkit-scrollbar { display:none; }
          .hide { display:none !important; }
          .mq { overflow:hidden; white-space:nowrap; width:100%; display:block; }
          .mq > span { display:inline-block; white-space:nowrap; }
          .mq.mask-edges { mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%); -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%); }
          @keyframes marquee-pp { 0%,18% { transform:translate3d(0,0,0); } 82%,100% { transform:translate3d(var(--d,0px),0,0); } }
          .marquee-pp { animation:marquee-pp var(--t,8s) ease-in-out infinite alternate; will-change:transform; backface-visibility:hidden; }
          @keyframes eq-dance { 0%,100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }
          .eq { display:flex; align-items:flex-end; gap:3px; height:16px; width:18px; }
          .eq i { width:3px; height:100%; border-radius:99px; background:var(--accent); transform-origin:bottom; animation:eq-dance .9s ease-in-out infinite; }
          .eq i:nth-child(2) { animation-delay:.25s; } .eq i:nth-child(3) { animation-delay:.5s; }
          .eq.paused i { animation-play-state:paused; }
          @keyframes shimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }
          .bgfx { position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(60% 36% at 0% 0%,rgba(30,215,96,.17),transparent 70%),radial-gradient(52% 32% at 100% 14%,rgba(139,92,246,.18),transparent 70%),radial-gradient(60% 30% at 50% 100%,rgba(34,211,238,.07),transparent 70%); }
          #app { position:fixed; inset:0; overflow-y:auto; padding:var(--st) 16px 190px; z-index:1; -webkit-overflow-scrolling:touch; }
          .top { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:16px 0 16px; }
          .hello { min-width:0; }
          .hello small { display:block; color:var(--txt2); font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
          .hello h1 { margin:3px 0 0; font-size:30px; font-weight:900; letter-spacing:-.8px; }
          .net { display:inline-flex; align-items:center; gap:8px; padding:10px 15px; border-radius:99px; font-size:12px; font-weight:900; white-space:nowrap; transition:all .3s; flex-shrink:0; }
          .net.on { background:linear-gradient(135deg,var(--hx),var(--hx3)); color:#03130a; box-shadow:0 10px 26px rgba(30,215,96,.28); cursor:pointer; }
          .net.on:active { transform:scale(.95); }
          .net.off { background:rgba(251,191,36,.12); color:#fbbf24; border:1px solid rgba(251,191,36,.35); }
          .net .dot { width:8px; height:8px; border-radius:50%; background:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.22); }
          .searchbox { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:18px; padding:0 14px; height:50px; margin-bottom:18px; color:rgba(255,255,255,.55); }
          .searchbox:focus-within { border-color:rgba(30,215,96,.55); background:rgba(255,255,255,.09); }
          .searchbox input { flex:1; min-width:0; background:none; border:0; outline:none; color:#fff; font-size:15px; font-weight:600; height:100%; user-select:text; -webkit-user-select:text; }
          .searchbox input::placeholder { color:rgba(255,255,255,.4); }
          .searchbox input::-webkit-search-cancel-button { display:none; }
          .cont { display:flex; align-items:center; gap:14px; padding:12px; border-radius:24px; margin-bottom:14px; background:linear-gradient(120deg,rgba(30,215,96,.22),rgba(139,92,246,.2)); border:1px solid rgba(255,255,255,.12); box-shadow:0 14px 36px rgba(0,0,0,.35); cursor:pointer; }
          .cont:active { transform:scale(.99); }
          .cart { width:64px; height:64px; border-radius:18px; font-size:24px; box-shadow:0 8px 22px rgba(0,0,0,.45); }
          .cinfo { flex:1; min-width:0; }
          .cinfo small { display:block; font-size:10px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--hx); margin-bottom:3px; }
          .cinfo b { display:block; font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .cinfo span { display:block; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
          .cplay { width:46px; height:46px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
          .hero2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
          .hbtn { height:56px; border-radius:20px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:15px; font-weight:900; }
          .hbtn:active { transform:scale(.97); }
          .hbtn.g { background:linear-gradient(135deg,var(--hx),#12a64a); color:#03130a; box-shadow:0 12px 28px rgba(30,215,96,.25); }
          .hbtn.v { background:linear-gradient(135deg,var(--hx2),#6d28d9); color:#fff; box-shadow:0 12px 28px rgba(139,92,246,.25); }
          .hbtn.x { height:44px; border-radius:16px; font-size:13.5px; background:rgba(255,255,255,.09); color:#fff; }
          .hbtn.x.danger { color:#ff6b6b; background:rgba(255,68,68,.1); }
          .pl-new { width:100%; height:50px; margin-bottom:12px; }
          .sec-h { display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
          .sec-h b { font-size:18px; font-weight:900; letter-spacing:-.3px; }
          .sec-h span { font-size:12px; font-weight:700; color:var(--txt2); }
          .car { display:flex; gap:14px; overflow-x:auto; margin:0 -16px 24px; padding:0 16px 4px; scroll-snap-type:x proximity; }
          .tile { width:132px; flex:none; scroll-snap-align:start; cursor:pointer; }
          .tile:active { transform:scale(.97); }
          .tart { width:132px; height:132px; border-radius:20px; font-size:38px; box-shadow:0 12px 26px rgba(0,0,0,.4); margin-bottom:9px; }
          .tile b { display:block; font-size:13.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .tile span { display:block; font-size:12px; font-weight:600; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
          .tabs { display:flex; gap:8px; overflow-x:auto; margin:0 -16px 12px; padding:0 16px; }
          .tab { flex:none; padding:10px 18px; border-radius:99px; background:var(--surf); border:1px solid var(--line); font-size:13.5px; font-weight:800; color:rgba(255,255,255,.75); transition:all .2s; white-space:nowrap; }
          .tab.on { background:#fff; color:#000; border-color:#fff; }
          .subbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
          .subbar > span { font-size:12px; font-weight:700; color:var(--txt2); min-width:0; }
          .sorts { display:flex; gap:6px; flex-wrap:wrap; }
          .sortb { padding:6px 12px; border-radius:99px; font-size:11.5px; font-weight:800; color:var(--txt2); background:var(--surf); white-space:nowrap; }
          .sortb.on { color:#03130a; background:var(--hx); }
          .art { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:900; }
          .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
          .list { display:flex; flex-direction:column; gap:6px; }
          .row { display:flex; align-items:center; gap:12px; padding:8px 6px 8px 8px; border-radius:18px; cursor:pointer; content-visibility:auto; contain-intrinsic-size:auto 64px; border:1px solid transparent; }
          .row:active { background:rgba(255,255,255,.07); }
          .row.active { background:linear-gradient(90deg,rgba(30,215,96,.18),rgba(30,215,96,.03)); border-color:rgba(30,215,96,.35); }
          .row .art { width:52px; height:52px; border-radius:15px; font-size:19px; box-shadow:0 6px 16px rgba(0,0,0,.35); }
          .rt { min-width:0; flex:1; }
          .rtitle { font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .row.active .rtitle { color:var(--hx); }
          .rartist { font-size:12.5px; font-weight:600; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
          .rmeta { font-size:10px; color:#7b8190; margin-top:3px; display:flex; gap:6px; align-items:center; font-weight:700; flex-wrap:wrap; }
          .tagx { padding:1px 6px; border-radius:5px; font-size:9px; font-weight:900; background:rgba(255,255,255,.09); color:#d1d5db; border:1px solid rgba(255,255,255,.14); }
          .tagx.l { color:var(--hx); border-color:rgba(30,215,96,.4); background:rgba(30,215,96,.1); }
          .rmore { width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.5); border-radius:50%; flex-shrink:0; }
          .rmore:active { background:rgba(255,255,255,.1); }
          .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px 14px; }
          .gcard { cursor:pointer; min-width:0; }
          .gcard:active { transform:scale(.98); }
          .gart { width:100%; aspect-ratio:1/1; border-radius:22px; font-size:44px; box-shadow:0 14px 30px rgba(0,0,0,.4); margin-bottom:10px; }
          .gcard b { display:block; font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .gcard span { display:block; font-size:12px; font-weight:600; color:var(--txt2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .arow { display:flex; align-items:center; gap:14px; padding:8px; border-radius:18px; cursor:pointer; }
          .arow:active { background:rgba(255,255,255,.07); }
          .arow .art { width:56px; height:56px; border-radius:50%; font-size:22px; box-shadow:0 6px 16px rgba(0,0,0,.35); }
          .arow .art.plart { border-radius:16px; }
          .arow .rt b { display:block; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .arow .rt span { display:block; font-size:12.5px; font-weight:600; color:var(--txt2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .arow .fld { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(30,215,96,.25)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
          .empty { text-align:center; color:#8b8b95; margin-top:50px; font-weight:600; line-height:1.7; padding:0 24px; }
          .empty .eic { width:84px; height:84px; margin:0 auto 18px; border-radius:28px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(30,215,96,.2),rgba(139,92,246,.2)); color:#fff; }
          .empty b { display:block; color:#fff; font-size:17px; margin-bottom:6px; }
          .skel { height:64px; border-radius:18px; margin-bottom:6px; background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%); background-size:400px 100%; animation:shimmer 1.2s linear infinite; }
          .searching .home-only { display:none !important; }
          .res-h { font-size:13px; font-weight:800; color:var(--txt2); margin:2px 2px 12px; }
          #detail { position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .35s cubic-bezier(.32,.72,0,1); padding-bottom:190px; }
          #detail.open { transform:none; }
          .d-top { position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:calc(var(--st) + 4px) 16px 10px; background:linear-gradient(to bottom,rgba(7,7,11,.92),rgba(7,7,11,0)); }
          .d-top .ib { background:rgba(255,255,255,.1); }
          .d-top span { font-size:11px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.6); }
          .d-head { position:relative; padding:6px 20px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; }
          .d-bg { position:absolute; inset:-90px 0 0 0; pointer-events:none; }
          .d-art { position:relative; width:200px; height:200px; border-radius:26px; font-size:64px; box-shadow:0 24px 60px rgba(0,0,0,.6); margin-bottom:18px; }
          .d-art.avatar { border-radius:50%; font-size:96px; letter-spacing:-2px; }
          .d-head h2 { position:relative; margin:0; font-size:24px; font-weight:900; letter-spacing:-.5px; max-width:100%; word-break:break-word; }
          .d-head p { position:relative; margin:6px 0 16px; color:rgba(255,255,255,.65); font-size:13px; font-weight:700; }
          .d-acts { position:relative; display:flex; gap:12px; width:100%; }
          .d-acts .hbtn { flex:1; height:50px; }
          .d-acts .hbtn.x { height:44px; }
          .d-acts2 { margin-top:10px; }
          #dList { padding:0 16px; }
          #shBack { position:fixed; inset:0; z-index:135; background:rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .25s; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
          #shBack.open { opacity:1; pointer-events:auto; }
          #shBox { width:100%; max-height:88vh; max-height:88dvh; overflow-y:auto; background:#14141b; border-radius:28px 28px 0 0; border-top:1px solid rgba(255,255,255,.1); padding:12px 14px calc(var(--sb) + 14px); transform:translateY(100%); transition:transform .35s cubic-bezier(.32,.72,0,1); box-shadow:0 -20px 60px rgba(0,0,0,.6); }
          #shBack.open #shBox { transform:none; }
          .sh-grab { display:flex; justify-content:center; padding:2px 0 10px; } .sh-grab i { width:40px; height:5px; border-radius:99px; background:rgba(255,255,255,.25); }
          .sh-head { display:flex; align-items:center; gap:12px; padding:4px 8px 14px; border-bottom:1px solid var(--line); margin-bottom:6px; }
          .sh-head .art { width:52px; height:52px; border-radius:14px; font-size:19px; }
          .sh-head b { display:block; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .sh-head span { display:block; font-size:12.5px; color:var(--txt2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .sh-t { min-width:0; flex:1; }
          .sh-x { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; }
          .sh-x:active { background:rgba(255,255,255,.2); }
          .sh-act { width:100%; display:flex; align-items:center; gap:16px; padding:14px 10px; border-radius:16px; font-size:15px; font-weight:700; text-align:left; }
          .sh-act:active { background:rgba(255,255,255,.07); }
          .sh-act svg { color:rgba(255,255,255,.75); flex-shrink:0; }
          .sh-act.danger { color:#ff6b6b; } .sh-act.danger svg { color:#ff6b6b; }
          .sh-act.cancel { justify-content:center; background:rgba(255,255,255,.08); margin-top:8px; font-weight:800; }
          #mini { position:fixed; left:8px; right:8px; bottom:40px; height:56px; border-radius:10px; z-index:90; cursor:pointer; overflow:hidden; display:none; box-shadow:0 10px 30px rgba(0,0,0,.6); background:linear-gradient(100deg,var(--base) 0%,var(--deep) 100%); transition:opacity .35s, transform .35s; }
          #mini.hide { opacity:0; pointer-events:none; transform:translateY(24px) scale(.98); }
          #mini::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,.2); }
          .m-in { position:relative; z-index:1; height:100%; display:flex; align-items:center; padding:0 8px; }
          .m-art { width:40px; height:40px; border-radius:6px; margin-right:12px; font-size:16px; }
          .m-titles { flex:1; min-width:0; padding-right:10px; }
          .m-titles .t { font-size:13px; font-weight:800; line-height:1.15; margin-bottom:2px; }
          .m-titles .a { font-size:12px; font-weight:600; color:rgba(255,255,255,.7); line-height:1.15; }
          .m-btns { display:flex; align-items:center; gap:16px; padding-right:6px; }
          .m-btns button { display:flex; align-items:center; justify-content:center; width:26px; height:26px; }
          .m-btns button:active { transform:scale(.75); }
          .m-prog { position:absolute; left:8px; right:8px; bottom:0; height:2px; background:rgba(255,255,255,.1); border-radius:99px; z-index:2; overflow:hidden; }
          .m-prog i { display:block; height:100%; width:0; background:#fff; border-radius:99px; }
          #player { position:fixed; inset:0; z-index:100; overflow:hidden; background:var(--base); transform:translateY(100%); opacity:0; pointer-events:none; transition:transform .45s cubic-bezier(.32,.72,0,1), opacity .45s, background-color .7s; }
          #player.open { transform:none; opacity:1; pointer-events:auto; }
          .p-bg { position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 55% at 50% 0%,var(--glow) 0%,transparent 65%), linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.72) 100%); }
          .p-scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; }
          .p-main { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
          .p-top { display:flex; align-items:center; justify-content:space-between; padding:calc(var(--st) + 6px) 20px 8px; }
          .ib { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; }
          .ib:active { opacity:.5; }
          .p-ctx { flex:1; min-width:0; text-align:center; padding:0 8px; display:flex; flex-direction:column; gap:2px; }
          .p-ctx-t { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.7); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .p-ctx-n { font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          .p-art-wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 32px; }
          .p-art { width:100%; aspect-ratio:1/1; max-width:380px; max-height:50vh; max-height:50dvh; border-radius:10px; font-size:84px; box-shadow:0 25px 60px -10px var(--glow),0 15px 40px rgba(0,0,0,.5); background:#282828; }
          .p-bottom { padding:8px 20px calc(var(--sb) + 10px); }
