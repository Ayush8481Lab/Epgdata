                          className="px-3.5 py-2 rounded-2xl bg-gradient-to-r from-emerald-500/20 to-cyan-500/20 border border-emerald-400/30 text-xs font-bold text-emerald-300 flex items-center gap-1.5 active:scale-95 transition"
                        >
                          <RefreshCw size={13} /> Refresh
                        </button>
                      </div>

                      <div className="flex flex-col gap-3">
                        <div className="relative group">
                          <div className="absolute -inset-[1px] rounded-2xl bg-gradient-to-r from-emerald-400/60 via-cyan-400/50 to-fuchsia-400/60 opacity-50 group-focus-within:opacity-100 blur-[3px] transition-opacity duration-300" />
                          <div className="relative flex items-center bg-[#0a0a10]/95 rounded-2xl border border-white/10 focus-within:border-white/20 transition-colors">
                            <Search size={16} className="text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                            <input
                              type="text"
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
