                              mPlaying ? "Pause" : "Play", mediaPi(ACT_M_TOGGLE, 7102)).build());
                      nb.addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_next), "Next", mediaPi(ACT_M_NEXT, 7103)).build());

                      nb.setStyle(new Notification.MediaStyle()
