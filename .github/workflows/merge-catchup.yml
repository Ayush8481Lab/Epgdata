                      nb.setSmallIcon(mPlaying ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause)
                        .setContentTitle(mTitle)
                        .setContentText(mArtist)
                        .setSubText(mAlbum != null && !mAlbum.isEmpty() ? mAlbum : "Music8481 Offline")
