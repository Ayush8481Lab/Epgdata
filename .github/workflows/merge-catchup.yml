name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Premium Offline Player UI
        run: |
          mkdir -p www
          cat <<'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Music8481</title>
            <style>body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #07070b; }</style>
          </head>
          <body></body>
          </html>
          EOF
          
          cat <<'EOF' > www/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Music8481 Offline</title>
            <style>
              :root {
                --base:#3a3a3a; --deep:#1b1b1b; --accent:#c9c9c9; --light:#e8e8e8; --glow:rgba(255,255,255,.18);
                --active:#fff; --past:rgba(255,255,255,.36); --upcoming:#dcdcdc;
                --c-lyr-a:#3a3a3a; --c-lyr-b:#1b1b1b; --c-about-a:#2e2e2e; --c-about-b:#141414;
                --c-q-a:#2a2a2a; --c-q-b:#0b0b0b; --c-st-a:#444; --c-st-b:#262626;
                --mini-fs:16px; --card-fs:24px; --full-fs:34px;
                --st:max(env(safe-area-inset-top),30px); --sb:max(env(safe-area-inset-bottom),14px);
              }
              * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
              html, body { margin:0; height:100%; background:#07070b; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
              img { pointer-events:none; -webkit-user-drag:none; }
              button { font-family:inherit; border:0; background:none; color:inherit; padding:0; cursor:pointer; }
              input { font-family:inherit; }
              svg { display:block; }
              .scroll-hide { scrollbar-width:none; -ms-overflow-style:none; }
              .scroll-hide::-webkit-scrollbar { display:none; }

              /* ---------- Ping-pong marquee ---------- */
              .mq { overflow:hidden; white-space:nowrap; width:100%; display:block; }
              .mq > span { display:inline-block; white-space:nowrap; }
              .mq.mask-edges { mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%); -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%); }
              @keyframes marquee-pp { 0%,18% { transform:translate3d(0,0,0); } 82%,100% { transform:translate3d(var(--d,0px),0,0); } }
              .marquee-pp { animation:marquee-pp var(--t,8s) ease-in-out infinite alternate; will-change:transform; backface-visibility:hidden; }
              @keyframes eq-dance { 0%,100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }
              .eq { display:flex; align-items:flex-end; gap:3px; height:16px; width:18px; }
              .eq i { width:3px; height:100%; border-radius:99px; background:var(--accent); transform-origin:bottom; animation:eq-dance .9s ease-in-out infinite; }
              .eq i:nth-child(2) { animation-delay:.25s; } .eq i:nth-child(3) { animation-delay:.5s; }
              .eq.paused i { animation-play-state:paused; }

              /* ---------- Library ---------- */
              #app { position:fixed; inset:0; overflow-y:auto; padding:var(--st) 16px 200px; }
              .glow { position:fixed; pointer-events:none; border-radius:50%; filter:blur(100px); z-index:0; transition:background-color .7s; background:var(--glow); }
              .g1 { top:-90px; left:-90px; width:280px; height:280px; opacity:.9; }
              .g2 { top:240px; right:-110px; width:260px; height:260px; opacity:.55; }
              .hdr { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:14px 0 4px; }
              .brand { font-size:22px; font-weight:900; letter-spacing:-.3px; background:linear-gradient(90deg,#fff,var(--light)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
              .badge { margin-left:8px; font-size:10px; font-weight:800; padding:3px 8px; border-radius:99px; background:rgba(245,158,11,.2); color:#fbbf24; border:1px solid rgba(245,158,11,.4); -webkit-text-fill-color:#fbbf24; }
              .btn-online { background:var(--accent); color:#000; padding:9px 15px; border-radius:14px; font-size:12px; font-weight:900; transition:background-color .6s; }
              .btn-online.pulse { box-shadow:0 0 0 4px rgba(255,255,255,.18); }
              .sub { position:relative; z-index:2; color:#9ca3af; font-size:12px; font-weight:600; margin:2px 0 12px; display:flex; justify-content:space-between; align-items:center; }
              .search { position:relative; z-index:2; width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:12px 16px; color:#fff; font-size:14px; font-weight:600; outline:none; margin-bottom:12px; }
              .search::placeholder { color:rgba(255,255,255,.4); }
              .actions { position:relative; z-index:2; display:flex; gap:10px; margin-bottom:14px; }
              .abtn { flex:1; padding:12px; border-radius:16px; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; }
              .abtn.pri { background:var(--accent); color:#000; transition:background-color .6s; }
              .abtn.sec { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); }
              .link { color:var(--accent); font-weight:800; font-size:12px; }
              #list { position:relative; z-index:2; display:flex; flex-direction:column; gap:8px; }
              .row { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); cursor:pointer; content-visibility:auto; contain-intrinsic-size:auto 66px; }
              .row:active { background:rgba(255,255,255,.09); }
              .row.active { border-color:var(--accent); background:linear-gradient(90deg,var(--glow),rgba(255,255,255,.04)); }
              .art { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:900; }
              .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
              .art.sm { width:48px; height:48px; border-radius:14px; font-size:18px; box-shadow:0 6px 16px rgba(0,0,0,.35); }
              .rt { min-width:0; flex:1; }
              .rtitle { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .rartist { font-size:12px; font-weight:600; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
              .rmeta { font-size:10px; color:#9ca3af; margin-top:3px; display:flex; gap:6px; align-items:center; }
              .rmeta .lrc, .rmeta .dl { padding:1px 6px; border-radius:5px; font-size:9px; font-weight:800; background:rgba(255,255,255,.1); color:var(--light); border:1px solid rgba(255,255,255,.18); }
              .rplay { color:var(--accent); padding-left:6px; }
              .empty { text-align:center; color:#8b8b95; margin-top:60px; font-weight:600; line-height:1.6; padding:0 20px; }

              /* ---------- Mini player ---------- */
              #mini { position:fixed; left:8px; right:8px; bottom:30px; height:56px; border-radius:10px; z-index:90; cursor:pointer; overflow:hidden; display:none; box-shadow:0 10px 30px rgba(0,0,0,.6); background:linear-gradient(100deg,var(--base) 0%,var(--deep) 100%); transition:opacity .35s, transform .35s; }
              #mini.hide { opacity:0; pointer-events:none; transform:translateY(24px) scale(.98); }
              #mini::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,.2); }
              .m-in { position:relative; z-index:1; height:100%; display:flex; align-items:center; padding:0 8px; }
              .m-art { width:40px; height:40px; border-radius:6px; margin-right:12px; font-size:16px; }
              .m-titles { flex:1; min-width:0; padding-right:10px; }
              .m-titles .t { font-size:13px; font-weight:800; line-height:1.15; margin-bottom:2px; }
              .m-titles .a { font-size:12px; font-weight:600; color:rgba(255,255,255,.7); line-height:1.15; }
              .m-btns { display:flex; align-items:center; gap:16px; padding-right:6px; }
              .m-btns button { display:flex; align-items:center; justify-content:center; width:26px; height:26px; }
              .m-btns button:active { transform:scale(.75); }
              .m-prog { position:absolute; left:8px; right:8px; bottom:0; height:2px; background:rgba(255,255,255,.1); border-radius:99px; z-index:2; overflow:hidden; }
              .m-prog i { display:block; height:100%; width:0; background:#fff; border-radius:99px; }

              /* ---------- Full player ---------- */
              #player { position:fixed; inset:0; z-index:100; overflow:hidden; background:var(--base); transform:translateY(100%); opacity:0; pointer-events:none; transition:transform .45s cubic-bezier(.32,.72,0,1), opacity .45s, background-color .7s; }
              #player.open { transform:none; opacity:1; pointer-events:auto; }
              .p-bg { position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 55% at 50% 0%,var(--glow) 0%,transparent 65%), linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.72) 100%); }
              .p-scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; }
              .p-main { min-height:100dvh; display:flex; flex-direction:column; }
              .p-top { display:flex; align-items:center; justify-content:space-between; padding:calc(var(--st) + 6px) 20px 8px; }
              .ib { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
              .ib:active { opacity:.5; }
              .p-ctx { flex:1; min-width:0; text-align:center; padding:0 8px; display:flex; flex-direction:column; gap:2px; }
              .p-ctx-t { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.7); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .p-ctx-n { font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .p-art-wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 32px; }
              .p-art { width:100%; aspect-ratio:1/1; max-width:380px; max-height:50vh; border-radius:10px; font-size:84px; box-shadow:0 25px 60px -10px var(--glow),0 15px 40px rgba(0,0,0,.5); background:#282828; }
              .p-bottom { padding:8px 20px calc(var(--sb) + 10px); }
              .p-mini-lyr { position:relative; width:100%; min-height:75px; margin-bottom:12px; overflow:hidden; display:flex; align-items:center; mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 90%,transparent 100%); -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 90%,transparent 100%); }
              .p-mini-lyr.off { display:none; }
              .ml { position:absolute; left:0; width:100%; text-align:left; padding-right:8px; font-weight:800; line-height:1.28; font-size:var(--mini-fs); color:var(--active); transform:translateY(35px) scale(.9); opacity:0; transform-origin:left center; transition:all 1.2s cubic-bezier(.25,1,.5,1); text-shadow:0 4px 14px rgba(0,0,0,.35); }
              .ml.on { transform:none; opacity:1; }
              .ml.out { transform:translateY(-26px) scale(.96); opacity:0; }
              .p-titlerow { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
              .p-titles { flex:1; min-width:0; padding-right:12px; }
              .p-titles .t { font-size:22px; font-weight:800; letter-spacing:-.2px; }
              .p-titles .a { font-size:15px; font-weight:600; color:#b3b3b3; margin-top:4px; }
              .heart { flex-shrink:0; margin-left:8px; }
              .heart:active { transform:scale(.75); }
              .seek { margin-bottom:16px; }
              input[type=range] { -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:12px; margin:0; border-radius:4px; outline:none; }
              input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:transparent; }
              input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; height:12px; width:12px; border-radius:50%; background:#fff; margin-top:-4px; box-shadow:0 2px 4px rgba(0,0,0,.4); border:0; }
              .seek input { height:4px; border-radius:2px; background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.3) 0%); }
              .seek input::-webkit-slider-runnable-track { height:4px; }
              .times { display:flex; justify-content:space-between; font-size:11px; font-weight:600; color:#a7a7a7; margin-top:8px; }
              .ctrl { display:flex; align-items:center; justify-content:space-between; padding:6px 4px; margin-bottom:14px; }
              .ctrl button:active { opacity:.5; }
              .ctrl .on { color:var(--accent); }
              .playbtn { width:64px; height:64px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.35); }
              .playbtn:active { transform:scale(.95); }
              .tools { display:flex; justify-content:space-between; align-items:center; color:#b3b3b3; padding:0 4px; }
              .tools .lyrbtn { display:none; }
              .tools .lyrbtn.show { display:block; }
              .cards { padding:0 20px 90px; display:flex; flex-direction:column; gap:22px; position:relative; }
              .card { border-radius:26px; padding:22px; border:1px solid rgba(255,255,255,.1); position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.4); }
              .card .blob { position:absolute; top:-70px; right:-70px; width:210px; height:210px; border-radius:50%; background:var(--glow); filter:blur(70px); pointer-events:none; }
              .card h3 { margin:0; font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; }
              .card-lyr { background:linear-gradient(165deg,var(--c-lyr-a),var(--c-lyr-b)); }
              .card-about { background:linear-gradient(160deg,var(--c-about-a),var(--c-about-b)); }
              .card-head { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
              .pill { width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.85); }
              #lyrList, #fullList { position:relative; z-index:1; display:flex; flex-direction:column; gap:20px; }
              #lyrScroll { position:relative; z-index:1; max-height:300px; overflow-y:auto; padding-bottom:40px; }
              .ly { margin:0; cursor:pointer; line-height:1.2; font-size:var(--card-fs); transition:all .8s ease-out; transform-origin:left; font-weight:800; color:var(--upcoming); opacity:.85; transform:translateY(12px); text-shadow:0 1px 10px rgba(0,0,0,.25); }
              .ly.act { font-weight:900; color:var(--active); opacity:1; transform:none; text-shadow:0 0 28px var(--glow),0 2px 18px rgba(0,0,0,.35); }
              .ly.past { font-weight:700; color:var(--past); opacity:1; transform:translateY(-8px); text-shadow:none; }
              #fullList .ly { font-size:var(--full-fs); }
              .lw { display:inline-block; background:linear-gradient(to right,var(--active) calc(var(--p,0%) - 15%),var(--past) var(--p,0%)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; will-change:background; transform:translateZ(0); }
              .ml .lw { background:linear-gradient(to right,var(--active) calc(var(--p,0%) - 15%),rgba(255,255,255,.3) var(--p,0%)); -webkit-background-clip:text; background-clip:text; }
              .abt-head { position:relative; z-index:1; display:flex; align-items:center; gap:12px; margin-bottom:18px; }
              .abt-art { width:52px; height:52px; border-radius:14px; font-size:20px; box-shadow:0 8px 20px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1); }
              .abt-sub { font-size:12px; color:rgba(255,255,255,.55); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
              .grid { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
              .tile { display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07); min-width:0; }
              .tile.wide { grid-column:span 2; }
              .tile .ti { width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
              .tile .tl { font-size:11px; font-weight:700; color:rgba(255,255,255,.45); }
              .tile .tv { font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .tile > div:last-child { min-width:0; }
              .chips { position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
              .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.88); font-size:12px; font-weight:700; }

              /* Fullscreen lyrics */
              #fullLyr { position:absolute; inset:0; z-index:5; display:none; flex-direction:column; background:var(--base); }
              #fullLyr.open { display:flex; }
              #fullLyr .p-bg { z-index:0; }
              .fl-top { position:relative; z-index:2; display:flex; align-items:center; padding:calc(var(--st) + 6px) 20px 6px; gap:10px; }
              .fl-scroll { position:relative; z-index:2; flex:1; overflow-y:auto; padding:16px 24px 36vh; mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 90%,transparent 100%); -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 90%,transparent 100%); }
              .fl-bottom { position:relative; z-index:2; padding:4px 24px calc(var(--sb) + 8px); background:linear-gradient(to top,rgba(0,0,0,.45),transparent); }
              .fl-ctrl { display:flex; align-items:center; justify-content:center; gap:34px; margin-top:12px; }
              .fl-ctrl .playbtn { width:56px; height:56px; }

              /* ---------- Queue page ---------- */
              #queue { position:fixed; inset:0; z-index:110; background:#09090b; display:flex; flex-direction:column; overflow:hidden; transform:translateY(100%); transition:transform .3s; }
              #queue.open { transform:none; }
              .q-bg { position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,var(--c-q-a) 0%,var(--c-q-b) 46%,#070708 100%); transition:background .7s; }
              .q-glow { position:absolute; top:-110px; left:50%; transform:translateX(-50%); width:150%; height:380px; pointer-events:none; opacity:.7; background:radial-gradient(closest-side,var(--glow),transparent); }
              .q-blob { position:absolute; bottom:96px; right:-96px; width:300px; height:300px; border-radius:50%; pointer-events:none; opacity:.3; filter:blur(80px); background:var(--c-st-a); }
              .q-top { position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:calc(var(--st) + 4px) 20px 12px; }
              .q-top .ib { background:rgba(255,255,255,.1); }
              .q-title { display:flex; flex-direction:column; align-items:center; min-width:0; padding:0 12px; }
              .q-title b { font-size:16px; font-weight:800; }
              .q-title span { font-size:10px; font-weight:700; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.14em; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .q-edit { padding:9px 16px; border-radius:99px; background:rgba(255,255,255,.1); font-size:13px; font-weight:800; }
              .q-edit.done { background:var(--accent); color:#000; }
              #qScroll { position:relative; z-index:2; flex:1; overflow-y:auto; padding:0 20px 160px; }
              .q-now { position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding:14px; border-radius:26px; border:1px solid rgba(255,255,255,.12); overflow:hidden; background:linear-gradient(120deg,var(--c-lyr-a) 0%,rgba(255,255,255,.05) 100%); box-shadow:0 16px 40px rgba(0,0,0,.35); }
              .q-now .art { width:64px; height:64px; border-radius:16px; font-size:24px; margin-right:14px; }
              .q-now .nm { min-width:0; flex:1; }
              .q-now .nm small { display:block; font-size:10px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:2px; }
              .q-now .nm b { display:block; font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .q-now .nm span { display:block; font-size:13px; font-weight:600; color:rgba(255,255,255,.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .q-now .bar { position:absolute; left:0; bottom:0; height:3px; width:100%; background:rgba(255,255,255,.1); }
              .q-now .bar i { display:block; height:100%; background:linear-gradient(to right,var(--accent),var(--light)); width:0; }
              .q-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
              .qs { padding:12px; border-radius:18px; border:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:2px; }
              .qs b { font-size:18px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .qs span { font-size:11px; font-weight:700; color:rgba(255,255,255,.55); }
              .q-top-art { padding:16px; border-radius:26px; border:1px solid rgba(255,255,255,.08); background:linear-gradient(160deg,var(--c-about-a),var(--c-about-b)); display:flex; flex-direction:column; gap:12px; margin-bottom:22px; }
