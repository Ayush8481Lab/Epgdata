                        </div>

                        <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-0.5">
                          {([
                            { id: "all", label: `All · ${tracks.length}` },
                            { id: "audio", label: "MP3" },
                            { id: "lrc", label: "LRC" },
                            { id: "video", label: "MP4" },
                          ] as const).map(tab => {
                            const active = filterType === tab.id;
                            return (
                              <button
                                key={tab.id}
                                onClick={() => setFilterType(tab.id)}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all duration-200 ${
                                  active
                                    ? "bg-gradient-to-r from-[#1DB954] to-emerald-400 text-black shadow-[0_4px_16px_rgba(29,185,84,0.45)] scale-[1.02]"
                                    : "bg-white/[0.05] text-zinc-300 border border-white/10 hover:bg-white/[0.09]"
                                }`}
                              >
                                {tab.label}
                              </button>
                            );
                          })}
                        </div>
                      </div>
