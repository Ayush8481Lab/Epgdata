          cat <<'EOF' > src/entry.tsx
          import React, { useState, useEffect } from "react";
          import { createRoot } from "react-dom/client";
          import * as LucideIcons from "lucide-react";
          import InitialOfflinePlayer from "./OfflinePlayer";
          // @ts-ignore
          import * as Babel from "@babel/standalone";

          (window as any).__React = React;
          (window as any).__LucideIcons = LucideIcons;

          function compileRemoteTsx(tsxCode: string): React.ComponentType | null {
            try {
              const cleaned = tsxCode.replace(/^\s*["']use client["'];?\s*/m, "");
              const transformed = Babel.transform(cleaned, {
                filename: "down.tsx",
                presets: [
                  ["env", { modules: "commonjs" }],
                  ["react", { runtime: "classic" }],
                  "typescript"
                ]
              }).code;
              if (!transformed) return null;

              const exportsObj: any = {};
              const moduleObj: any = { exports: exportsObj };
              const customRequire = (mod: string) => {
                if (mod === "react") return React;
                if (mod === "lucide-react") return LucideIcons;
                throw new Error("Unknown module: " + mod);
              };

              const fn = new Function("exports", "module", "require", "React", transformed);
              fn(exportsObj, moduleObj, customRequire, React);
              return moduleObj.exports?.default || exportsObj?.default || null;
            } catch (err) {
              console.error("Dynamic TSX compile fallback to initial bundle:", err);
              return null;
            }
          }

          function AppHost() {
            const [DynamicComp, setDynamicComp] = useState<React.ComponentType | null>(() => {
              if (window.AndroidApp?.getCachedDownTsx) {
                const cachedTsx = window.AndroidApp.getCachedDownTsx();
                if (cachedTsx && cachedTsx.trim().length > 100) {
                  return compileRemoteTsx(cachedTsx);
                }
              }
              return null;
            });

            useEffect(() => {
              (window as any).__onDownTxtUpdated = () => {
                if (window.AndroidApp?.getCachedDownTsx) {
                  const updatedTsx = window.AndroidApp.getCachedDownTsx();
                  if (updatedTsx && updatedTsx.trim().length > 100) {
                    const Comp = compileRemoteTsx(updatedTsx);
                    if (Comp) setDynamicComp(() => Comp);
                  }
                }
              };
            }, []);

            const ActiveComponent = DynamicComp || InitialOfflinePlayer;
            return <ActiveComponent />;
          }

          const rootEl = document.getElementById("root");
          if (rootEl) {
            createRoot(rootEl).render(<AppHost />);
          }
          EOF

