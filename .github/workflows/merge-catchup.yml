              private void requestAllPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          } catch (Exception e) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                              startActivity(intent);
                          }
                      }
                  }

                  List<String> listPermissionsNeeded = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }
                  if (!listPermissionsNeeded.isEmpty()) {
                      ActivityCompat.requestPermissions(this, listPermissionsNeeded.toArray(new String[0]), 101);
                  }
              }

              private String sanitizeFilename(String name, String mimeType) {
                  if (name == null || name.trim().isEmpty()) {
                      name = "Track_" + System.currentTimeMillis();
                  }
                  name = name.replaceAll("[\\\\/:*?\"<>|]", "_").trim();
                  
                  String lower = name.toLowerCase();
                  if (!lower.endsWith(".mp3") && !lower.endsWith(".mp4") && !lower.endsWith(".lrc") && !lower.endsWith(".m4a") && !lower.endsWith(".wav") && !lower.endsWith(".webm")) {
                      if (mimeType != null) {
                          if (mimeType.contains("video") || mimeType.contains("mp4")) name += ".mp4";
                          else if (mimeType.contains("lrc") || mimeType.contains("text") || mimeType.contains("plain")) name += ".lrc";
                          else name += ".mp3";
                      } else {
                          name += ".mp3";
                      }
                  }
                  return name;
              }

