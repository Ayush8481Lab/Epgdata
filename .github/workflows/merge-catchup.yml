name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Built-in Offline Download Manager UI
        run: |
          mkdir -p www
          cat <<'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Music8481</title>
            <style>body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; }</style>
          </head>
          <body></body>
          </html>
          EOF
          
          cat <<'EOF' > www/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Offline Downloads - Music8481</title>
            <style>
              * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
              body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0 0 165px 0; user-select: none; }
              header { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); padding: 18px 16px 12px; border-bottom: 1px solid #222; }
              .top-row { display: flex; align-items: center; justify-content: space-between; }
              .badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 700; margin-left: 8px; }
              .btn { background: #1DB954; color: #000; border: none; padding: 8px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; cursor: pointer; }
              .sub { color: #888; font-size: 12px; margin-top: 4px; }
              .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
              .card { display: flex; align-items: center; justify-content: space-between; background: #121212; border: 1px solid #242424; padding: 12px; border-radius: 16px; cursor: pointer; }
              .card.active { border-color: #1DB954; background: rgba(29, 185, 84, 0.14); }
              .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
              .meta { font-size: 11px; color: #999; margin-top: 3px; display: flex; gap: 6px; align-items: center; }
              .lrc-tag { background: rgba(29,185,84,0.2); color: #1DB954; border: 1px solid rgba(29,185,84,0.4); padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
              .player { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid #262626; padding: 12px 16px 18px; z-index: 30; }
              .lyric-banner { background: rgba(29,185,84,0.12); border: 1px solid rgba(29,185,84,0.3); color: #1DB954; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
              input[type=range] { width: 100%; accent-color: #1DB954; }
              #videoBox { width: 100%; max-height: 240px; background: #000; display: none; border-bottom: 1px solid #222; }
            </style>
          </head>
          <body>
            <header>
              <div class="top-row">
                <div style="display:flex;align-items:center;">
                  <h1 style="font-size:18px;margin:0;">My Downloads</h1>
                  <span class="badge">OFFLINE MODE</span>
                </div>
                <button class="btn" onclick="window.location.href='https://ayushmobileappmusicgaaana.vercel.app/download'">Go Online</button>
              </div>
              <div class="sub">Folder: /Music8481/Download • Plays Offline with .LRC</div>
            </header>

            <video id="videoBox" controls playsinline></video>
            <audio id="audioBox" preload="auto"></audio>

            <div class="list" id="trackList"></div>

            <div class="player" id="playerBar" style="display:none;">
              <div class="lyric-banner" id="lyricBanner" style="display:none;">♪ ...</div>
              <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
              <div class="controls">
                <div style="min-width:0;flex:1;padding-right:10px;">
                  <div class="title" id="nowTitle">Not Playing</div>
                  <div class="meta" id="nowSub">Offline Ready</div>
                </div>
                <div style="display:flex;gap:12px;align-items:center;">
                  <button class="btn" onclick="prevTrack()" style="background:#222;color:#fff;">⏮</button>
                  <button class="btn" id="playBtn" onclick="togglePlay()">▶</button>
                  <button class="btn" onclick="nextTrack()" style="background:#222;color:#fff;">⏭</button>
                </div>
              </div>
            </div>

            <script>
              let tracks = [];
              let currentIdx = -1;
              let currentLyrics = [];
              const audioEl = document.getElementById('audioBox');
              const videoEl = document.getElementById('videoBox');
              const seekBar = document.getElementById('seekBar');
              const lyricBanner = document.getElementById('lyricBanner');

              function parseLrc(text) {
                if (!text) return [];
                const lines = text.split(/\r?\n/);
                const out = [];
                const reg = /\[(\d{1,3}):(\d{2})(?:\.(\d{1,3}))?\]/g;
                lines.forEach(line => {
                  const matches = [...line.matchAll(reg)];
                  const clean = line.replace(reg, '').trim();
                  matches.forEach(m => {
                    const t = parseInt(m[1])*60 + parseInt(m[2]) + (parseInt((m[3]||'0').padEnd(3,'0'))/1000);
                    if (clean) out.push({ time: t, text: clean });
                  });
                });
                return out.sort((a,b) => a.time - b.time);
              }

              function loadOfflineTracks() {
                if (!window.AndroidApp || !window.AndroidApp.getDownloadedFiles) return;
                tracks = JSON.parse(window.AndroidApp.getDownloadedFiles() || "[]");
                const container = document.getElementById('trackList');
                if (!tracks.length) {
                  container.innerHTML = '<p style="text-align:center;color:#666;margin-top:60px;">No files in /Music8481/Download yet.</p>';
                  return;
                }
                container.innerHTML = tracks.map((t, i) => `
                  <div class="card ${i === currentIdx ? 'active' : ''}" onclick="playIndex(${i})">
                    <div>
                      <div class="title">${t.baseName}</div>
                      <div class="meta">
                        <span>${(t.size / (1024*1024)).toFixed(1)} MB</span> • <span>${t.ext.toUpperCase()}</span>
                        ${t.hasLyrics ? '<span class="lrc-tag">LRC LYRICS</span>' : ''}
                      </div>
                    </div>
                    <span style="color:#1DB954;font-weight:700;">▶</span>
                  </div>
                `).join('');
              }

              function playIndex(i) {
                if (i < 0 || i >= tracks.length) return;
                currentIdx = i;
                const t = tracks[i];
                currentLyrics = t.hasLyrics ? parseLrc(t.lrcContent) : [];
                document.getElementById('playerBar').style.display = 'block';
                document.getElementById('nowTitle').innerText = t.baseName;
                document.getElementById('nowSub').innerText = t.hasLyrics ? 'Synced .LRC Active' : 'Local Storage';
                lyricBanner.style.display = currentLyrics.length ? 'block' : 'none';

                if (t.isVideo) {
                  audioEl.pause();
                  videoEl.style.display = 'block';
                  videoEl.src = t.url;
                  videoEl.play();
                } else {
                  videoEl.pause();
                  videoEl.style.display = 'none';
                  audioEl.src = t.url;
                  audioEl.play();
                }
                document.getElementById('playBtn').innerText = '❚❚';
                loadOfflineTracks();
              }

              function activeMedia() {
                return (currentIdx >= 0 && tracks[currentIdx].isVideo) ? videoEl : audioEl;
              }

              function togglePlay() {
                const m = activeMedia();
                if (m.paused) { m.play(); document.getElementById('playBtn').innerText = '❚❚'; }
                else { m.pause(); document.getElementById('playBtn').innerText = '▶'; }
              }

              function nextTrack() { if (tracks.length) playIndex((currentIdx + 1) % tracks.length); }
              function prevTrack() { if (tracks.length) playIndex((currentIdx - 1 + tracks.length) % tracks.length); }

              [audioEl, videoEl].forEach(el => {
                el.addEventListener('timeupdate', () => {
                  if (el.duration) {
                    seekBar.max = el.duration;
                    seekBar.value = el.currentTime;
                  }
                  if (currentLyrics.length) {
                    let active = '';
                    for (let i = 0; i < currentLyrics.length; i++) {
                      if (el.currentTime >= currentLyrics[i].time) active = currentLyrics[i].text;
                      else break;
                    }
                    if (active) lyricBanner.innerText = '♪ ' + active;
                  }
                });
                el.addEventListener('ended', nextTrack);
              });

              seekBar.addEventListener('input', (e) => { activeMedia().currentTime = parseFloat(e.target.value); });
              window.addEventListener('online', () => { window.location.href = 'https://ayushmobileappmusicgaaana.vercel.app/download'; });
              setTimeout(loadOfflineTracks, 300);
            </script>
          </body>
          </html>
          EOF
          
          npx cap init Music8481 com.music8481.app --web-dir www

          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushmobileappmusicgaaana.vercel.app",
              "cleartext": true,
              "errorPath": "error.html"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2500,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidSplashResourceName": "splash",
                "showSpinner": true,
                "spinnerColor": "#1DB954"
              }
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      - name: Inject Permissions & Root Folder Access Meta-Data
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_DATA_SYNC\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          \`;
          if (!xml.includes('android.permission.WAKE_LOCK')) {
              xml = xml.replace('<application', perms + '\n    <application');
              xml = xml.replace('<application', '<application android:hardwareAccelerated=\"true\" android:largeHeap=\"true\" android:usesCleartextTraffic=\"true\" android:requestLegacyExternalStorage=\"true\" android:preserveLegacyExternalStorage=\"true\"');
              xml = xml.replace('<activity', '<activity android:hardwareAccelerated=\"true\" android:supportsPictureInPicture=\"true\"');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Force Android App Theme to Edge-to-Edge
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              const edgeToEdge = \`
                  <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
                  <item name=\"android:windowTranslucentStatus\">true</item>
                  <item name=\"android:windowTranslucentNavigation\">true</item>
                  <item name=\"android:statusBarColor\">@android:color/transparent</item>
                  <item name=\"android:navigationBarColor\">@android:color/transparent</item>
                  <item name=\"android:windowDrawsSystemBarBackgrounds\">false</item>
                  <item name=\"android:windowFullscreen\">true</item>
                  <item name=\"android:windowContentOverlay\">@null</item>
              \`;
              xml = xml.replace(/<\/style>/g, edgeToEdge + '\n</style>');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Inject Custom Download Engine + Local Media Server + First Launch /download Router
        run: |
          cat <<'EOF' > android/app/src/main/java/com/music8481/app/MainActivity.java
          package com.music8481.app;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.PictureInPictureParams;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.media.AudioManager;
          import android.media.MediaScannerConnection;
          import android.net.ConnectivityManager;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.Rational;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.RandomAccessFile;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private boolean isVideoFullscreen = false;
              private boolean isVideoModeActive = false;
              private String pendingDownloadFilename = null;
              private boolean initialRouteHandled = false;

              private static final String CHANNEL_ID = "music8481_download_channel";
              private static final String ACTION_PAUSE = "com.music8481.app.ACTION_PAUSE";
              private static final String ACTION_RESUME = "com.music8481.app.ACTION_RESUME";
              private static final String ACTION_CANCEL = "com.music8481.app.ACTION_CANCEL";

              private NotificationManager notificationManager;
              private final AtomicInteger notificationIdCounter = new AtomicInteger(2000);
              private final ConcurrentHashMap<Integer, DownloadTask> activeTasks = new ConcurrentHashMap<>();

              // =========================================================================
              // 🔥 STREAMING RANGE INPUT STREAM FOR INSTANT LOCAL MP3/MP4 SCRUBBING
              // =========================================================================
              private static class RangeFileInputStream extends InputStream {
                  private final RandomAccessFile raf;
                  private long remaining;

                  RangeFileInputStream(File file, long startOffset, long length) throws IOException {
                      this.raf = new RandomAccessFile(file, "r");
                      this.raf.seek(startOffset);
                      this.remaining = length;
                  }

                  @Override
                  public int read() throws IOException {
                      if (remaining <= 0) return -1;
                      int b = raf.read();
                      if (b != -1) remaining--;
                      return b;
                  }

                  @Override
                  public int read(byte[] b, int off, int len) throws IOException {
                      if (remaining <= 0) return -1;
                      int toRead = (int) Math.min(len, remaining);
                      int read = raf.read(b, off, toRead);
                      if (read > 0) remaining -= read;
                      return read;
                  }

                  @Override
                  public void close() throws IOException {
                      raf.close();
                  }
              }

              // ========================================================
              // 🔥 CUSTOM MULTI-THREADED DOWNLOAD & NOTIFICATION ENGINE
              // ========================================================
              private class DownloadTask {
                  int id;
                  String url;
                  String fileName;
                  String mimeType;
                  String userAgent;
                  String cookies;
                  File targetFile;
                  volatile boolean isPaused = false;
                  volatile boolean isCancelled = false;
                  long downloadedBytes = 0;
                  long totalBytes = -1;
                  int currentProgress = 0;
                  boolean isBlob = false;
                  RandomAccessFile blobRaf = null;

                  DownloadTask(int id, String fileName, String mimeType, boolean isBlob) {
                      this.id = id;
                      this.fileName = fileName;
                      this.mimeType = mimeType;
                      this.isBlob = isBlob;
                      this.targetFile = new File(getMusic8481Directory(), fileName);
                  }

                  void startHttpDownload() {
                      new Thread(() -> {
                          HttpURLConnection conn = null;
                          RandomAccessFile raf = null;
                          InputStream is = null;
                          try {
                              File parent = targetFile.getParentFile();
                              if (parent != null && !parent.exists()) parent.mkdirs();

                              URL u = new URL(url);
                              conn = (HttpURLConnection) u.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(15000);
                              conn.setReadTimeout(30000);
                              if (userAgent != null && !userAgent.isEmpty()) conn.setRequestProperty("User-Agent", userAgent);
                              if (cookies != null && !cookies.isEmpty()) conn.setRequestProperty("Cookie", cookies);

                              if (downloadedBytes > 0 && targetFile.exists()) {
                                  conn.setRequestProperty("Range", "bytes=" + downloadedBytes + "-");
                              }

                              conn.connect();
                              int responseCode = conn.getResponseCode();

                              if (responseCode == HttpURLConnection.HTTP_PARTIAL) {
                                  long contentLength = conn.getContentLengthLong();
                                  if (totalBytes <= 0 && contentLength > 0) {
                                      totalBytes = downloadedBytes + contentLength;
                                  }
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.seek(downloadedBytes);
                              } else if (responseCode == HttpURLConnection.HTTP_OK) {
                                  downloadedBytes = 0;
                                  totalBytes = conn.getContentLengthLong();
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.setLength(0);
                              } else {
                                  throw new Exception("Server HTTP " + responseCode);
                              }

                              is = conn.getInputStream();
                              byte[] buffer = new byte[16384];
                              int len;
                              long lastNotifUpdate = 0;

                              updateNotification(currentProgress, false);

                              while ((len = is.read(buffer)) != -1) {
                                  if (isCancelled) {
                                      raf.close();
                                      is.close();
                                      if (targetFile.exists()) targetFile.delete();
                                      notificationManager.cancel(id);
                                      activeTasks.remove(id);
                                      return;
                                  }
                                  if (isPaused) {
                                      raf.close();
                                      is.close();
                                      updateNotification(currentProgress, true);
                                      return;
                                  }

                                  raf.write(buffer, 0, len);
                                  downloadedBytes += len;

                                  if (totalBytes > 0) {
                                      currentProgress = (int) ((downloadedBytes * 100L) / totalBytes);
                                  }

                                  long now = System.currentTimeMillis();
                                  if (now - lastNotifUpdate >= 350) {
                                      updateNotification(currentProgress, false);
                                      lastNotifUpdate = now;
                                  }
                              }

                              raf.close();
                              is.close();
                              completeDownload();
                          } catch (Exception e) {
                              e.printStackTrace();
                              if (!isCancelled && !isPaused) {
                                  showFailedNotification(e.getMessage());
                              }
                          } finally {
                              try { if (raf != null) raf.close(); } catch (Exception ignored) {}
                              try { if (is != null) is.close(); } catch (Exception ignored) {}
                              if (conn != null) conn.disconnect();
                          }
                      }).start();
                  }

                  void completeDownload() {
                      activeTasks.remove(id);
                      MediaScannerConnection.scanFile(MainActivity.this, new String[]{targetFile.getAbsolutePath()}, null, null);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                              .setContentTitle(fileName)
                              .setContentText("100% • Saved to Music8481/Download")
                              .setSubText("100%")
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved: Music8481/Download/" + fileName, Toast.LENGTH_LONG).show());
                  }

                  void showFailedNotification(String errorMsg) {
                      activeTasks.remove(id);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_notify_error)
                              .setContentTitle("Download Failed: " + fileName)
                              .setContentText(errorMsg != null ? errorMsg : "Connection interrupted")
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                  }

                  void updateNotification(int progress, boolean paused) {
                      Intent pauseOrResumeIntent = new Intent(paused ? ACTION_RESUME : ACTION_PAUSE);
                      pauseOrResumeIntent.setPackage(getPackageName());
                      pauseOrResumeIntent.putExtra("taskId", id);
                      PendingIntent pauseOrResumePending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 1,
                              pauseOrResumeIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Intent cancelIntent = new Intent(ACTION_CANCEL);
                      cancelIntent.setPackage(getPackageName());
                      cancelIntent.putExtra("taskId", id);
                      PendingIntent cancelPending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 2,
                              cancelIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      String statusText;
                      if (paused) {
                          statusText = "Paused at " + progress + "%";
                      } else if (totalBytes > 0) {
                          statusText = "Downloading... " + progress + "% (" + formatSize(downloadedBytes) + " / " + formatSize(totalBytes) + ")";
                      } else {
                          statusText = "Downloading... " + formatSize(downloadedBytes);
                      }

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(paused ? android.R.drawable.ic_media_pause : android.R.drawable.stat_sys_download)
                              .setContentTitle(fileName)
                              .setContentText(statusText)
                              .setSubText(totalBytes > 0 ? progress + "%" : "")
                              .setProgress(100, Math.max(0, Math.min(100, progress)), totalBytes <= 0 && !paused)
                              .setOngoing(!paused)
                              .setOnlyAlertOnce(true)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .addAction(
                                      paused ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause,
                                      paused ? "Resume" : "Pause",
                                      pauseOrResumePending
                              )
                              .addAction(
                                      android.R.drawable.ic_menu_close_clear_cancel,
                                      "Cancel",
                                      cancelPending
                              );

                      notificationManager.notify(id, builder.build());
                  }
              }

              private String formatSize(long bytes) {
                  if (bytes < 1024) return bytes + " B";
                  int exp = (int) (Math.log(bytes) / Math.log(1024));
                  char pre = "KMGTPE".charAt(exp - 1);
                  return String.format("%.1f %sB", bytes / Math.pow(1024, exp), pre);
              }

              private final BroadcastReceiver downloadReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) return;
                      int taskId = intent.getIntExtra("taskId", -1);
                      DownloadTask task = activeTasks.get(taskId);
                      if (task == null) return;

                      String action = intent.getAction();
                      if (ACTION_PAUSE.equals(action)) {
                          task.isPaused = true;
                          task.updateNotification(task.currentProgress, true);
                      } else if (ACTION_RESUME.equals(action)) {
                          if (task.isPaused) {
                              task.isPaused = false;
                              task.updateNotification(task.currentProgress, false);
                              if (!task.isBlob) {
                                  task.startHttpDownload();
                              }
                          }
                      } else if (ACTION_CANCEL.equals(action)) {
                          task.isCancelled = true;
                          task.isPaused = false;
                          try { if (task.blobRaf != null) task.blobRaf.close(); } catch (Exception ignored) {}
                          if (task.targetFile != null && task.targetFile.exists()) {
                              task.targetFile.delete();
                          }
                          notificationManager.cancel(taskId);
                          activeTasks.remove(taskId);
                          Toast.makeText(MainActivity.this, "Cancelled: " + task.fileName, Toast.LENGTH_SHORT).show();
                      }
                  }
              };

              private File getMusic8481Directory() {
                  File rootDir = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  if (!rootDir.exists()) {
                      rootDir.mkdirs();
                  }
                  return rootDir;
              }

              private List<File> getAllDownloadDirectories() {
                  List<File> dirs = new ArrayList<>();
                  File d1 = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  File d2 = new File(Environment.getExternalStorageDirectory(), "Music8481/Downloads");
                  if (!d1.exists()) d1.mkdirs();
                  dirs.add(d1);
                  if (d2.exists()) dirs.add(d2);
                  return dirs;
              }

              private File findLocalMediaFile(String fileName) {
                  for (File dir : getAllDownloadDirectories()) {
                      File f = new File(dir, fileName);
                      if (f.exists() && f.isFile()) return f;
                  }
                  return null;
              }

              private String readTextFile(File file) {
                  try (FileInputStream fis = new FileInputStream(file)) {
                      byte[] data = new byte[(int) file.length()];
                      fis.read(data);
                      return new String(data, StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private boolean isNetworkOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      NetworkCapabilities cap = cm.getNetworkCapabilities(cm.getActiveNetwork());
                      return cap != null && (cap.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                              cap.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ||
                              cap.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET));
                  }
                  return cm.getActiveNetworkInfo() != null && cm.getActiveNetworkInfo().isConnected();
              }

