              private final AtomicInteger notificationIdCounter = new AtomicInteger(2000);
              private final ConcurrentHashMap<Integer, DownloadTask> activeTasks = new ConcurrentHashMap<>();

              // =========================================================================
              // 🔥 BACKGROUND SYNC FOR https://ayushmobileappmusicgaaana.vercel.app/down.txt
              //    - Initial load in background when app opens
              //    - Checks every 3 hours OR when network comes online
              //    - Compares SHA-256 hash; updates cached TSX only if changed
              // =========================================================================
              private File getCachedDownTsxFile() {
                  return new File(getFilesDir(), CACHED_TSX_FILENAME);
              }

              private String sha256(String input) {
                  try {
                      MessageDigest digest = MessageDigest.getInstance("SHA-256");
                      byte[] hash = digest.digest(input.getBytes(StandardCharsets.UTF_8));
                      StringBuilder hex = new StringBuilder();
                      for (byte b : hash) {
                          String h = Integer.toHexString(0xff & b);
                          if (h.length() == 1) hex.append('0');
                          hex.append(h);
                      }
                      return hex.toString();
                  } catch (Exception e) {
                      return String.valueOf(input.hashCode());
                  }
              }

              private void ensureInitialSeedTsx() {
                  File cachedFile = getCachedDownTsxFile();
                  if (cachedFile.exists() && cachedFile.length() > 100) return;
                  try (InputStream is = getAssets().open("public/initial_down.tsx")) {
                      byte[] bytes = readAllBytes(is);
                      String content = new String(bytes, StandardCharsets.UTF_8);
                      if (content.length() > 100) {
                          try (FileOutputStream fos = new FileOutputStream(cachedFile, false)) {
                              fos.write(bytes);
                          }
                          SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                          prefs.edit().putString(KEY_DOWN_HASH, sha256(content)).apply();
                      }
                  } catch (Exception ignored) {}
              }

              private byte[] readAllBytes(InputStream is) throws IOException {
                  ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                  byte[] data = new byte[8192];
                  int nRead;
                  while ((nRead = is.read(data, 0, data.length)) != -1) {
                      buffer.write(data, 0, nRead);
                  }
                  return buffer.toByteArray();
              }

              private void syncDownTxtInBackground(boolean forceCheck) {
                  if (!isNetworkOnline()) return;
                  if (!isSyncingDownTxt.compareAndSet(false, true)) return;

                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                          long now = System.currentTimeMillis();
                          long lastSync = prefs.getLong(KEY_LAST_SYNC, 0L);
                          File cachedFile = getCachedDownTsxFile();

                          if (!forceCheck && cachedFile.exists() && (now - lastSync) < THREE_HOURS_MS) {
                              return;
                          }

                          URL url = new URL(DOWN_TXT_URL + "?t=" + now);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setInstanceFollowRedirects(true);
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(15000);
                          conn.setRequestProperty("Cache-Control", "no-cache");

                          int code = conn.getResponseCode();
                          if (code == HttpURLConnection.HTTP_OK) {
                              try (InputStream is = conn.getInputStream()) {
                                  String remoteCode = new String(readAllBytes(is), StandardCharsets.UTF_8);
                                  if (remoteCode.trim().length() > 100) {
                                      String newHash = sha256(remoteCode);
                                      String oldHash = prefs.getString(KEY_DOWN_HASH, "");

                                      prefs.edit().putLong(KEY_LAST_SYNC, now).apply();

                                      if (!newHash.equals(oldHash) || !cachedFile.exists()) {
                                          try (FileOutputStream fos = new FileOutputStream(cachedFile, false)) {
                                              fos.write(remoteCode.getBytes(StandardCharsets.UTF_8));
                                          }
                                          prefs.edit().putString(KEY_DOWN_HASH, newHash).apply();

                                          runOnUiThread(() -> {
                                              if (bridge != null && bridge.getWebView() != null) {
                                                  bridge.getWebView().evaluateJavascript(
                                                      "window.__onDownTxtUpdated && window.__onDownTxtUpdated();",
                                                      null
                                                  );
                                              }
                                          });
                                      }
                                  }
                              }
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (conn != null) conn.disconnect();
                          isSyncingDownTxt.set(false);
                      }
                  }).start();
              }

              private void startDownTxtBackgroundSchedule() {
                  ensureInitialSeedTsx();

                  // Check every 3 hours while app process is alive (initial check runs immediately)
                  syncScheduler.scheduleWithFixedDelay(
                      () -> syncDownTxtInBackground(true),
                      0L,
                      3L,
                      TimeUnit.HOURS
                  );

                  // Also trigger check whenever device comes online
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              syncDownTxtInBackground(false);
                          }
                      };
                      try {
                          NetworkRequest req = new NetworkRequest.Builder()
                                  .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                                  .build();
                          cm.registerNetworkCallback(req, networkCallback);
                      } catch (Exception ignored) {}
                  }
              }

              private static class RangeFileInputStream extends InputStream {
                  private final RandomAccessFile raf;
                  private long remaining;

                  RangeFileInputStream(File file, long startOffset, long length) throws IOException {
                      this.raf = new RandomAccessFile(file, "r");
                      this.raf.seek(startOffset);
                      this.remaining = length;
                  }

                  @Override
                  public int read() throws IOException {
                      if (remaining <= 0) return -1;
                      int b = raf.read();
                      if (b != -1) remaining--;
                      return b;
                  }

                  @Override
                  public int read(byte[] b, int off, int len) throws IOException {
                      if (remaining <= 0) return -1;
                      int toRead = (int) Math.min(len, remaining);
                      int read = raf.read(b, off, toRead);
                      if (read > 0) remaining -= read;
                      return read;
                  }

                  @Override
                  public void close() throws IOException {
                      raf.close();
                  }
              }

              private class DownloadTask {
                  int id;
                  String url;
                  String fileName;
                  String mimeType;
                  String userAgent;
                  String cookies;
                  File targetFile;
                  volatile boolean isPaused = false;
                  volatile boolean isCancelled = false;
                  long downloadedBytes = 0;
                  long totalBytes = -1;
                  int currentProgress = 0;
                  boolean isBlob = false;
                  RandomAccessFile blobRaf = null;

                  DownloadTask(int id, String fileName, String mimeType, boolean isBlob) {
                      this.id = id;
                      this.fileName = fileName;
                      this.mimeType = mimeType;
                      this.isBlob = isBlob;
                      this.targetFile = new File(getMusic8481Directory(), fileName);
                  }

                  void startHttpDownload() {
                      new Thread(() -> {
                          HttpURLConnection conn = null;
                          RandomAccessFile raf = null;
                          InputStream is = null;
                          try {
                              File parent = targetFile.getParentFile();
                              if (parent != null && !parent.exists()) parent.mkdirs();

                              URL u = new URL(url);
                              conn = (HttpURLConnection) u.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(15000);
                              conn.setReadTimeout(30000);
                              if (userAgent != null && !userAgent.isEmpty()) conn.setRequestProperty("User-Agent", userAgent);
                              if (cookies != null && !cookies.isEmpty()) conn.setRequestProperty("Cookie", cookies);

                              if (downloadedBytes > 0 && targetFile.exists()) {
                                  conn.setRequestProperty("Range", "bytes=" + downloadedBytes + "-");
                              }

                              conn.connect();
                              int responseCode = conn.getResponseCode();

                              if (responseCode == HttpURLConnection.HTTP_PARTIAL) {
                                  long contentLength = conn.getContentLengthLong();
                                  if (totalBytes <= 0 && contentLength > 0) {
                                      totalBytes = downloadedBytes + contentLength;
                                  }
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.seek(downloadedBytes);
                              } else if (responseCode == HttpURLConnection.HTTP_OK) {
                                  downloadedBytes = 0;
                                  totalBytes = conn.getContentLengthLong();
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.setLength(0);
                              } else {
                                  throw new Exception("Server HTTP " + responseCode);
                              }

                              is = conn.getInputStream();
                              byte[] buffer = new byte[16384];
                              int len;
                              long lastNotifUpdate = 0;

                              updateNotification(currentProgress, false);

                              while ((len = is.read(buffer)) != -1) {
                                  if (isCancelled) {
                                      raf.close();
                                      is.close();
                                      if (targetFile.exists()) targetFile.delete();
                                      notificationManager.cancel(id);
                                      activeTasks.remove(id);
                                      return;
                                  }
                                  if (isPaused) {
                                      raf.close();
                                      is.close();
                                      updateNotification(currentProgress, true);
                                      return;
                                  }

                                  raf.write(buffer, 0, len);
                                  downloadedBytes += len;

                                  if (totalBytes > 0) {
                                      currentProgress = (int) ((downloadedBytes * 100L) / totalBytes);
                                  }

                                  long now = System.currentTimeMillis();
                                  if (now - lastNotifUpdate >= 350) {
                                      updateNotification(currentProgress, false);
                                      lastNotifUpdate = now;
                                  }
                              }

                              raf.close();
                              is.close();
                              completeDownload();
                          } catch (Exception e) {
                              e.printStackTrace();
                              if (!isCancelled && !isPaused) {
                                  showFailedNotification(e.getMessage());
                              }
                          } finally {
                              try { if (raf != null) raf.close(); } catch (Exception ignored) {}
                              try { if (is != null) is.close(); } catch (Exception ignored) {}
                              if (conn != null) conn.disconnect();
                          }
                      }).start();
                  }

                  void completeDownload() {
                      activeTasks.remove(id);
                      MediaScannerConnection.scanFile(MainActivity.this, new String[]{targetFile.getAbsolutePath()}, null, null);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                              .setContentTitle(fileName)
                              .setContentText("100% • Saved to Music8481/Download")
                              .setSubText("100%")
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved: Music8481/Download/" + fileName, Toast.LENGTH_LONG).show());
                  }

                  void showFailedNotification(String errorMsg) {
                      activeTasks.remove(id);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_notify_error)
                              .setContentTitle("Download Failed: " + fileName)
                              .setContentText(errorMsg != null ? errorMsg : "Connection interrupted")
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                  }

                  void updateNotification(int progress, boolean paused) {
                      Intent pauseOrResumeIntent = new Intent(paused ? ACTION_RESUME : ACTION_PAUSE);
                      pauseOrResumeIntent.setPackage(getPackageName());
                      pauseOrResumeIntent.putExtra("taskId", id);
                      PendingIntent pauseOrResumePending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 1,
                              pauseOrResumeIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Intent cancelIntent = new Intent(ACTION_CANCEL);
                      cancelIntent.setPackage(getPackageName());
                      cancelIntent.putExtra("taskId", id);
                      PendingIntent cancelPending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 2,
                              cancelIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      String statusText;
                      if (paused) {
                          statusText = "Paused at " + progress + "%";
                      } else if (totalBytes > 0) {
                          statusText = "Downloading... " + progress + "% (" + formatSize(downloadedBytes) + " / " + formatSize(totalBytes) + ")";
                      } else {
                          statusText = "Downloading... " + formatSize(downloadedBytes);
                      }

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(paused ? android.R.drawable.ic_media_pause : android.R.drawable.stat_sys_download)
                              .setContentTitle(fileName)
                              .setContentText(statusText)
                              .setSubText(totalBytes > 0 ? progress + "%" : "")
                              .setProgress(100, Math.max(0, Math.min(100, progress)), totalBytes <= 0 && !paused)
                              .setOngoing(!paused)
                              .setOnlyAlertOnce(true)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .addAction(
                                      paused ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause,
                                      paused ? "Resume" : "Pause",
                                      pauseOrResumePending
                              )
                              .addAction(
                                      android.R.drawable.ic_menu_close_clear_cancel,
                                      "Cancel",
                                      cancelPending
                              );

                      notificationManager.notify(id, builder.build());
                  }
              }

              private String formatSize(long bytes) {
                  if (bytes < 1024) return bytes + " B";
                  int exp = (int) (Math.log(bytes) / Math.log(1024));
                  char pre = "KMGTPE".charAt(exp - 1);
                  return String.format("%.1f %sB", bytes / Math.pow(1024, exp), pre);
              }

              private final BroadcastReceiver downloadReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) return;
                      int taskId = intent.getIntExtra("taskId", -1);
                      DownloadTask task = activeTasks.get(taskId);
                      if (task == null) return;

                      String action = intent.getAction();
                      if (ACTION_PAUSE.equals(action)) {
                          task.isPaused = true;
                          task.updateNotification(task.currentProgress, true);
                      } else if (ACTION_RESUME.equals(action)) {
                          if (task.isPaused) {
                              task.isPaused = false;
                              task.updateNotification(task.currentProgress, false);
                              if (!task.isBlob) {
                                  task.startHttpDownload();
                              }
                          }
                      } else if (ACTION_CANCEL.equals(action)) {
                          task.isCancelled = true;
                          task.isPaused = false;
                          try { if (task.blobRaf != null) task.blobRaf.close(); } catch (Exception ignored) {}
                          if (task.targetFile != null && task.targetFile.exists()) {
                              task.targetFile.delete();
                          }
                          notificationManager.cancel(taskId);
                          activeTasks.remove(taskId);
                          Toast.makeText(MainActivity.this, "Cancelled: " + task.fileName, Toast.LENGTH_SHORT).show();
                      }
                  }
              };

              private File getMusic8481Directory() {
                  File rootDir = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  if (!rootDir.exists()) {
                      rootDir.mkdirs();
                  }
                  return rootDir;
              }

              private List<File> getAllDownloadDirectories() {
                  List<File> dirs = new ArrayList<>();
                  File d1 = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  File d2 = new File(Environment.getExternalStorageDirectory(), "Music8481/Downloads");
                  if (!d1.exists()) d1.mkdirs();
                  dirs.add(d1);
                  if (d2.exists()) dirs.add(d2);
                  return dirs;
              }

              private File findLocalMediaFile(String fileName) {
                  for (File dir : getAllDownloadDirectories()) {
                      File f = new File(dir, fileName);
                      if (f.exists() && f.isFile()) return f;
                  }
                  return null;
              }

              private String readTextFile(File file) {
                  try (FileInputStream fis = new FileInputStream(file)) {
                      byte[] data = new byte[(int) file.length()];
                      fis.read(data);
                      return new String(data, StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private boolean isNetworkOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      NetworkCapabilities cap = cm.getNetworkCapabilities(cm.getActiveNetwork());
                      return cap != null && (cap.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                              cap.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ||
                              cap.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET));
                  }
                  return cm.getActiveNetworkInfo() != null && cm.getActiveNetworkInfo().isConnected();
              }

