                      nb.addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_previous), "Previous", mediaPi(ACT_M_PREV, 7101)).build());
                      nb.addAction(new Notification.Action.Builder(
