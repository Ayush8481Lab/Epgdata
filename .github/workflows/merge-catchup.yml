                  }
              }

              private Bitmap decodeArt(byte[] bytes) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o);
                      int sample = 1;
                      int max = Math.max(o.outWidth, o.outHeight);
                      while (max / sample > 640) sample *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = sample;
                      return BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o2);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private File getMusic8481Directory() {
                  File rootDir = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  if (!rootDir.exists()) {
                      rootDir.mkdirs();
                  }
                  return rootDir;
              }

              private List<File> getAllDownloadDirectories() {
                  List<File> dirs = new ArrayList<>();
                  File d1 = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  File d2 = new File(Environment.getExternalStorageDirectory(), "Music8481/Downloads");
                  if (!d1.exists()) d1.mkdirs();
                  dirs.add(d1);
                  if (d2.exists()) dirs.add(d2);
                  return dirs;
              }

              // ---------- Device audio scanning (offline player) ----------
              private List<File> getScanRoots() {
                  List<File> roots = new ArrayList<>();
                  File ext = Environment.getExternalStorageDirectory();
                  String[] names = {"Music8481/Download", "Music8481/Downloads", "Music", "Download", "Downloads"};
                  for (String n : names) {
                      File f = new File(ext, n);
                      if (f.exists() && f.isDirectory()) roots.add(f);
                  }
                  return roots;
              }

              private boolean isAudioExt(String ext) {
                  return ext.equals("mp3") || ext.equals("m4a") || ext.equals("wav") || ext.equals("ogg")
                          || ext.equals("flac") || ext.equals("aac") || ext.equals("opus");
              }

              private void scanAudio(File dir, int depth, List<File> out, Set<String> seen) {
                  if (dir == null || depth < 0 || out.size() >= 4000) return;
                  File[] files = dir.listFiles();
                  if (files == null) return;
                  for (File f : files) {
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      if (f.isDirectory()) {
                          if (n.equalsIgnoreCase("Android")) continue;
                          scanAudio(f, depth - 1, out, seen);
                      } else if (f.isFile()) {
                          int d = n.lastIndexOf('.');
                          if (d <= 0) continue;
                          String ext = n.substring(d + 1).toLowerCase();
                          if (isAudioExt(ext) && f.length() >= 60 * 1024) {
                              String p = f.getAbsolutePath();
                              if (seen.add(p)) out.add(f);
                          }
                      }
                  }
              }

              private String relPath(File f) {
                  String ext = Environment.getExternalStorageDirectory().getAbsolutePath();
                  String abs = f.getAbsolutePath();
                  return abs.startsWith(ext + "/") ? abs.substring(ext.length() + 1) : abs;
              }

              private String encodePath(String rel) {
                  try {
                      String[] segs = rel.split("/");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < segs.length; i++) {
                          if (i > 0) sb.append("/");
                          sb.append(URLEncoder.encode(segs[i], "UTF-8").replace("+", "%20"));
                      }
                      return sb.toString();
                  } catch (Exception e) {
                      return rel;
                  }
              }

              private File findLocalMediaFile(String rel) {
                  try {
                      File ext = Environment.getExternalStorageDirectory();
                      File f = new File(ext, rel);
                      String cp = f.getCanonicalPath();
                      String ep = ext.getCanonicalPath();
                      if (cp.startsWith(ep + File.separator) && f.isFile()) return f;
                  } catch (Exception ignored) {}
                  for (File dir : getAllDownloadDirectories()) {
                      File f = new File(dir, rel);
                      if (f.exists() && f.isFile()) return f;
                  }
                  return null;
              }

              private Set<String> lrcBases(File dir, Map<String, Set<String>> cache) {
                  String key = dir.getAbsolutePath();
                  Set<String> s = cache.get(key);
                  if (s != null) return s;
                  s = new HashSet<>();
                  File[] fs = dir.listFiles();
                  if (fs != null) {
                      for (File x : fs) {
                          String n = x.getName();
                          if (n.toLowerCase().endsWith(".lrc")) {
                              s.add(n.substring(0, n.length() - 4).trim().toLowerCase());
                          }
                      }
                  }
                  cache.put(key, s);
                  return s;
              }

              private File findLrcFor(File f) {
                  File dir = f.getParentFile();
                  if (dir == null) return null;
                  String n = f.getName();
                  int d = n.lastIndexOf('.');
                  String base = (d > 0 ? n.substring(0, d) : n).trim().toLowerCase();
                  File[] fs = dir.listFiles();
                  if (fs != null) {
                      for (File x : fs) {
                          String xn = x.getName();
                          if (xn.toLowerCase().endsWith(".lrc") && xn.substring(0, xn.length() - 4).trim().toLowerCase().equals(base)) {
                              return x;
                          }
                      }
                  }
                  return null;
              }

              private String readTextFile(File file) {
                  try (FileInputStream fis = new FileInputStream(file)) {
                      byte[] data = new byte[(int) file.length()];
                      int off = 0;
                      while (off < data.length) {
                          int r = fis.read(data, off, data.length - off);
                          if (r < 0) break;
                          off += r;
                      }
                      return new String(data, 0, off, StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              // Reads ID3 / container metadata. withLrc=true also embeds the .lrc content.
              private JSONObject buildMeta(File f, String rel, boolean withLrc) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("id", rel);
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      try {
                          mmr.setDataSource(f.getAbsolutePath());
                          String title = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_TITLE);
                          String artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ARTIST);
                          if (artist == null || artist.trim().isEmpty()) {
                              artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUMARTIST);
                          }
                          String album = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUM);
                          String year = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_YEAR);
                          String genre = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_GENRE);
                          String dur = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);
                          String br = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_BITRATE);
                          byte[] art = mmr.getEmbeddedPicture();

                          o.put("title", title != null ? title.trim() : "");
                          o.put("artist", artist != null ? artist.trim() : "");
                          o.put("album", album != null ? album.trim() : "");
                          o.put("year", year != null ? year.trim() : "");
                          o.put("genre", genre != null ? genre.trim() : "");
                          o.put("duration", dur != null ? Long.parseLong(dur.trim()) / 1000.0 : 0);
                          o.put("bitrate", br != null ? Long.parseLong(br.trim()) : 0);
                          o.put("hasArt", art != null && art.length > 0);
                      } catch (Exception ignored) {
                          if (!o.has("hasArt")) o.put("hasArt", false);
                      } finally {
                          try { mmr.release(); } catch (Exception ignored) {}
                      }
                      if (withLrc) {
                          File lrc = findLrcFor(f);
                          o.put("lrcContent", lrc != null ? readTextFile(lrc) : "");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return o;
              }

