                  // FAST DEVICE AUDIO LIBRARY SCAN (no ID3 here -> instant)
                  @JavascriptInterface
                  public String getDownloadedFiles() {
                      JSONArray result = new JSONArray();
                      try {
                          String base = localServer != null ? localServer.base() : "";
                          List<File> allFiles = new ArrayList<>();
                          Set<String> seen = new HashSet<>();
                          for (File root : getScanRoots()) {
                              scanAudio(root, 3, allFiles, seen);
                          }
                          allFiles.sort((a, b) -> Long.compare(b.lastModified(), a.lastModified()));

                          Map<String, Set<String>> lrcCache = new HashMap<>();

                          for (File f : allFiles) {
                              String name = f.getName();
                              int dotIdx = name.lastIndexOf('.');
                              if (dotIdx <= 0) continue;
                              String baseName = name.substring(0, dotIdx).trim();
                              String ext = name.substring(dotIdx + 1).toLowerCase();
                              String rel = relPath(f);
                              String enc = encodePath(rel);

                              JSONObject obj = new JSONObject();
                              obj.put("id", rel);
                              obj.put("name", name);
                              obj.put("baseName", baseName);
                              obj.put("ext", ext);
                              obj.put("size", f.length());
                              obj.put("lastModified", f.lastModified());
                              obj.put("url", base + "/f/" + enc);
                              obj.put("artUrl", base + "/__art__/" + enc);
                              obj.put("isDownload", rel.startsWith("Music8481/"));

                              File parent = f.getParentFile();
                              String parentRel = rel.contains("/") ? rel.substring(0, rel.lastIndexOf('/')) : "";
                              obj.put("folder", parentRel);

                              boolean hasLrc = parent != null && lrcBases(parent, lrcCache).contains(baseName.toLowerCase());
                              obj.put("hasLyrics", hasLrc);
                              result.put(obj);
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return result.toString();
                  }

                  // Full metadata (+ .lrc content) for ONE track - used when a song is played
                  @JavascriptInterface
                  public String getTrackMeta(String rel) {
                      try {
                          File f = findLocalMediaFile(rel);
                          if (f == null) return "{}";
                          return buildMeta(f, rel, true).toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  // Background indexer: reads metadata for many tracks off the JS thread and streams results back
                  @JavascriptInterface
                  public void indexTracks(final String idsJson) {
                      final int gen = ++indexGen;
                      new Thread(() -> {
                          try {
                              JSONArray ids = new JSONArray(idsJson);
                              JSONArray batch = new JSONArray();
                              for (int n = 0; n < ids.length(); n++) {
                                  if (gen != indexGen) return;
                                  String rel = ids.getString(n);
                                  File f = findLocalMediaFile(rel);
                                  if (f == null) continue;
                                  batch.put(buildMeta(f, rel, false));
                                  if (batch.length() >= 10) {
                                      String js = "window.__onMeta&&window.__onMeta(" + batch.toString().replace("\u2028", "\\u2028").replace("\u2029", "\\u2029") + ")";
                                      pushJs(js);
                                      batch = new JSONArray();
                                      Thread.sleep(10);
                                  }
                              }
                              if (batch.length() > 0 && gen == indexGen) {
                                  String js = "window.__onMeta&&window.__onMeta(" + batch.toString().replace("\u2028", "\\u2028").replace("\u2029", "\\u2029") + ")";
                                  pushJs(js);
                              }
                              if (gen == indexGen) pushJs("window.__onMetaDone&&window.__onMetaDone()");
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }).start();
                  }

                  // Deletes the audio file (+ its .lrc) and reports the REAL result, so the page can refresh instantly
                  @JavascriptInterface
                  public boolean deleteDownloadedFile(String rel) {
                      try {
                          File f = findLocalMediaFile(rel);
                          if (f == null) return true; // already gone
                          File lrc = findLrcFor(f);
                          boolean ok = f.delete();
                          if (!ok) {
                              try { ok = f.getCanonicalFile().delete(); } catch (Exception ignored) {}
                          }
                          if (ok && lrc != null && lrc.exists()) lrc.delete();
                          MediaScannerConnection.scanFile(MainActivity.this, new String[]{f.getAbsolutePath()}, null, null);
                          return !f.exists();
                      } catch (Exception ignored) {}
                      return false;
                  }

                  // ================= Native media notification (offline) =================
                  @JavascriptInterface
                  public void mediaUpdate(String title, String artist, String album, String rel, long durMs, boolean playing, long posMs) {
                      final String newRel = rel == null ? "" : rel;
                      final boolean same = newRel.equals(mRel);
                      mTitle = title == null ? "" : title;
                      mArtist = artist == null ? "" : artist;
                      mAlbum = album == null ? "" : album;
                      mDur = durMs;
                      mPlaying = playing;
                      mPos = posMs;
                      if (!same) {
                          mRel = newRel;
                          mArt = null;
                      }
                      runOnUiThread(MainActivity.this::pushMedia);
                      if (!same && !newRel.isEmpty()) {
                          final String relCopy = newRel;
                          new Thread(() -> {
                              try {
                                  File f = findLocalMediaFile(relCopy);
                                  if (f == null) return;
                                  MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                                  byte[] art = null;
                                  try {
                                      mmr.setDataSource(f.getAbsolutePath());
                                      art = mmr.getEmbeddedPicture();
                                  } finally {
                                      try { mmr.release(); } catch (Exception ignored) {}
                                  }
                                  if (art != null && art.length > 0 && relCopy.equals(mRel)) {
                                      Bitmap bmp = decodeArt(art);
                                      if (bmp != null) {
                                          mArt = bmp;
                                          runOnUiThread(MainActivity.this::pushMedia);
                                      }
                                  }
                              } catch (Exception ignored) {}
                          }).start();
                      }
                  }

                  @JavascriptInterface
                  public void mediaState(boolean playing, long posMs) {
                      mPlaying = playing;
                      mPos = posMs;
                      runOnUiThread(MainActivity.this::pushMedia);
                  }

                  @JavascriptInterface
                  public void mediaClear() {
                      mRel = "";
                      mArt = null;
                      mPlaying = false;
                      runOnUiThread(() -> {
                          try {
                              if (serviceUp) {
                                  stopService(new Intent(MainActivity.this, MusicService.class));
                                  serviceUp = false;
                              }
                              if (notificationManager != null) notificationManager.cancel(PB_NOTI_ID);
                              if (mediaSession != null) mediaSession.setActive(false);
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public int initBlobDownload(String fileName, String mimeType, long totalSize) {
                      int id = notificationIdCounter.incrementAndGet();
                      String cleanName = sanitizeFilename(fileName, mimeType);
                      DownloadTask task = new DownloadTask(id, cleanName, mimeType, true);
                      task.totalBytes = totalSize;
                      try {
                          File parent = task.targetFile.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          task.blobRaf = new RandomAccessFile(task.targetFile, "rw");
                          task.blobRaf.setLength(0);
                          activeTasks.put(id, task);
                          task.updateNotification(0, false);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Downloading: " + cleanName, Toast.LENGTH_SHORT).show());
                      } catch (Exception e) {
                          e.printStackTrace();
                          return -1;
                      }
                      return id;
                  }

                  @JavascriptInterface
                  public String appendBlobChunk(int id, String base64Chunk) {
                      DownloadTask task = activeTasks.get(id);
                      if (task == null || task.isCancelled) return "CANCELLED";
                      if (task.isPaused) return "PAUSED";
                      try {
                          String cleanBase64 = base64Chunk.contains(",") ? base64Chunk.split(",")[1] : base64Chunk;
                          byte[] bytes = Base64.decode(cleanBase64, Base64.DEFAULT);
                          task.blobRaf.write(bytes);
                          task.downloadedBytes += bytes.length;
                          if (task.totalBytes > 0) {
                              task.currentProgress = (int) ((task.downloadedBytes * 100L) / task.totalBytes);
                          }
                          task.updateNotification(task.currentProgress, false);
                          return "OK";
                      } catch (Exception e) {
                          e.printStackTrace();
                          task.showFailedNotification(e.getMessage());
                          return "ERROR";
                      }
                  }

                  @JavascriptInterface
                  public void finishBlobDownload(int id) {
                      DownloadTask task = activeTasks.get(id);
                      if (task == null) return;
                      try {
                          if (task.blobRaf != null) task.blobRaf.close();
                          task.completeDownload();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  INSTANCE = this;

                  notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  createNotificationChannel();
                  setupMediaSession();

                  // Local range-capable media server for the offline player
                  localServer = new LocalServer();
                  localServer.start();

                  // Android back button: first close offline-player overlays (queue, sheet, lyrics...), then minimise
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          final WebView w = (MainActivity.this.bridge != null) ? MainActivity.this.bridge.getWebView() : null;
                          String u = (w != null) ? w.getUrl() : null;
                          if (w != null && u != null && u.startsWith(OFFLINE_PAGE)) {
                              w.evaluateJavascript("(function(){try{return !!(window.__onBack&&window.__onBack());}catch(e){return false;}})()", value -> {
                                  if (!"true".equals(value)) moveTaskToBack(true);
                              });
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(ACTION_PAUSE);
                  filter.addAction(ACTION_RESUME);
                  filter.addAction(ACTION_CANCEL);
                  IntentFilter mfilter = new IntentFilter();
                  mfilter.addAction(ACT_M_PREV);
                  mfilter.addAction(ACT_M_TOGGLE);
                  mfilter.addAction(ACT_M_NEXT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(downloadReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      registerReceiver(mediaReceiver, mfilter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(downloadReceiver, filter);
                      registerReceiver(mediaReceiver, mfilter);
                  }

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams layoutParams = getWindow().getAttributes();
                      layoutParams.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(layoutParams);
                  }

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().getDecorView().setOnApplyWindowInsetsListener((v, insets) -> insets);

                  requestAllPermissions();
                  getMusic8481Directory();

                  // volume keys control media volume (no AudioManager.setMode() call: it could fight the media session and cause crackle)
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();

                      // ---- Hardware acceleration + fast media ----
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);
                      settings.setLoadsImagesAutomatically(true);
                      settings.setBlockNetworkImage(false);
                      settings.setUseWideViewPort(true);
                      try { settings.setRenderPriority(WebSettings.RenderPriority.HIGH); } catch (Throwable ignored) {}
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          settings.setOffscreenPreRaster(true);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          settings.setSafeBrowsingEnabled(false);
                      }
                      try {
                          CookieManager cm = CookieManager.getInstance();
                          cm.setAcceptCookie(true);
                          cm.setAcceptThirdPartyCookies(webView, true);
                      } catch (Throwable ignored) {}

                      webView.setFitsSystemWindows(false);
                      webView.setPadding(0, 0, 0, 0);

                      if (webView.getParent() instanceof ViewGroup) {
                          ((ViewGroup) webView.getParent()).setFitsSystemWindows(false);
                          ((ViewGroup) webView.getParent()).setClipToPadding(false);
                      }

                      webView.removeJavascriptInterface("AndroidApp");
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidApp");

                      // Navigation triggers: online /download -> offline player
                      webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              if (request != null && request.getUrl() != null && isDownloadTrigger(request.getUrl().toString())) {
                                  showOfflinePlayer(view);
                                  return true;
                              }
                              return super.shouldOverrideUrlLoading(view, request);
                          }

                          @Override
                          public void onPageStarted(WebView view, String url, Bitmap favicon) {
                              if (isDownloadTrigger(url)) {
                                  view.stopLoading();
                                  showOfflinePlayer(view);
                                  return;
                              }
                              super.onPageStarted(view, url, favicon);
                              if (isOnlineUrl(url)) injectDownloadHook(view);
                          }

                          @Override
                          public void onPageCommitVisible(WebView view, String url) {
                              super.onPageCommitVisible(view, url);
                              if (isOnlineUrl(url)) {
                                  injectDownloadHook(view);
                                  injectBoost(view);
                              }
                          }

                          // Fires for pushState / client-side (Next.js router) navigations too
                          @Override
                          public void doUpdateVisitedHistory(WebView view, String url, boolean isReload) {
                              super.doUpdateVisitedHistory(view, url, isReload);
                              if (isDownloadTrigger(url)) {
                                  showOfflinePlayer(view);
                              }
                          }

                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              if (url != null && url.startsWith(OFFLINE_PAGE)) {
                                  view.clearHistory();
                              } else if (isOnlineUrl(url)) {
                                  injectDownloadHook(view);
                                  injectBoost(view);
                              }
                          }
                      });

                      // Initial route: normal online homepage (Capacitor server.url).
                      // Only when there is truly no internet at launch do we open the offline player.
                      if (!initialRouteHandled) {
                          initialRouteHandled = true;
                          if (!isNetworkOnline()) {
                              webView.loadUrl(OFFLINE_PAGE);
                          }
                      }

                      webView.setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                              String fileName = pendingDownloadFilename;
                              pendingDownloadFilename = null;

                              if (fileName == null || fileName.trim().isEmpty()) {
                                  fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              }
                              final String cleanFileName = sanitizeFilename(fileName, mimeType);

                              if (url.startsWith("blob:") || url.startsWith("data:")) {
                                  String escapedUrl = url.replace("'", "\\'");
                                  String escapedName = cleanFileName.replace("'", "\\'");
                                  String escapedMime = (mimeType != null ? mimeType : "").replace("'", "\\'");
                                  webView.evaluateJavascript("window.__streamBlobToNative && window.__streamBlobToNative('" + escapedUrl + "', '" + escapedName + "', '" + escapedMime + "');", null);
                              } else {
                                  int id = notificationIdCounter.incrementAndGet();
                                  DownloadTask task = new DownloadTask(id, cleanFileName, mimeType, false);
                                  task.url = url;
                                  task.userAgent = userAgent;
                                  task.cookies = CookieManager.getInstance().getCookie(url);
                                  task.totalBytes = contentLength > 0 ? contentLength : -1;
                                  activeTasks.put(id, task);
                                  Toast.makeText(getApplicationContext(), "Downloading: " + cleanFileName, Toast.LENGTH_SHORT).show();
                                  task.startHttpDownload();
                              }
                          }
                      });

                      webView.postDelayed(() -> {
                          String cu = webView.getUrl();
                          if (isOnlineUrl(cu)) {
                              injectDownloadHook(webView);
                              injectBoost(webView);
                          }
                      }, 600);

                      if (!chromeInstalled) {
                          chromeInstalled = true;
                          final WebChromeClient originalClient = webView.getWebChromeClient();
                          webView.setWebChromeClient(new WebChromeClient() {
                              private View mCustomView;
                              private WebChromeClient.CustomViewCallback mCustomViewCallback;

                              // No more ugly grey default video thumbnail / spinner
                              @Override
                              public Bitmap getDefaultVideoPoster() {
                                  if (transparentPoster == null) {
                                      transparentPoster = Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                                  }
                                  return transparentPoster;
                              }

                              @Override
                              public View getVideoLoadingProgressView() {
                                  View v = new View(MainActivity.this);
                                  v.setBackgroundColor(0x00000000);
                                  return v;
                              }

                              @Override
                              public void onShowCustomView(View view, CustomViewCallback callback) {
                                  if (mCustomView != null) { onHideCustomView(); return; }
                                  mCustomView = view;
                                  isVideoFullscreen = true;
                                  mCustomViewCallback = callback;

                                  runOnUiThread(() -> updatePiPParams(true));
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                                  WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                                  windowInsetsController.hide(WindowInsetsCompat.Type.systemBars());
                                  windowInsetsController.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                                  mCustomView.setFitsSystemWindows(false);
                                  ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                              }

                              @Override
                              public void onHideCustomView() {
                                  ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                                  mCustomView = null;
                                  isVideoFullscreen = false;

                                  runOnUiThread(() -> updatePiPParams(isVideoModeActive));
                                  // free rotation on tablets / foldables, portrait lock only on phones
                                  setRequestedOrientation(getResources().getConfiguration().smallestScreenWidthDp >= 600
                                          ? ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                                          : ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);

                                  WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                                  windowInsetsController.show(WindowInsetsCompat.Type.systemBars());

                                  if (mCustomViewCallback != null) { mCustomViewCallback.onCustomViewHidden(); mCustomViewCallback = null; }
                              }
                              @Override
                              public void onPermissionRequest(android.webkit.PermissionRequest request) { if (originalClient != null) originalClient.onPermissionRequest(request); }
                              @Override
                              public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) { return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams); }
                              @Override
                              public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) { return originalClient != null && originalClient.onConsoleMessage(consoleMessage); }
                          });
                      }
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      if (isInPictureInPictureMode) {
                          String js =
                              "var style = document.getElementById('pip-style-fix');" +
                              "if (!style) {" +
                              "  style = document.createElement('style');" +
                              "  style.id = 'pip-style-fix';" +
                              "  style.innerHTML = '" +
