              private static final String PREFS_NAME = "Music8481Prefs";
              private static final String KEY_DOWN_HASH = "cached_down_txt_sha256";
              private static final String KEY_LAST_SYNC = "cached_down_txt_last_sync";
              private static final String CACHED_TSX_FILENAME = "cached_down.tsx";
              private static final long THREE_HOURS_MS = 3L * 60L * 60L * 1000L;

              private final ScheduledExecutorService syncScheduler = Executors.newSingleThreadScheduledExecutor();
              private final AtomicBoolean isSyncingDownTxt = new AtomicBoolean(false);
