                  .lyric-word-sync { background: linear-gradient(to right, var(--lw-on,#fff) calc(var(--p,0%) - 15%), var(--lw-off,rgba(255,255,255,0.28)) var(--p,0%)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; will-change: background; transform: translateZ(0); }
                  @keyframes eq-dance { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
                  .eq-bar { animation: eq-dance 0.9s ease-in-out infinite; }
                  @keyframes spin-buffer { 100% { transform: rotate(360deg); } }
                  .spotify-spinner { position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,1) 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 2.5px)); animation: spin-buffer 1s linear infinite; }
                  .spotify-spinner-mini { position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,1) 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 1.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 1.5px)); animation: spin-buffer 1s linear infinite; }
                  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,40px) scale(1.08); } }
                  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,30px) scale(1.1); } }
                  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-30px) scale(0.94); } }
                ` }} />

                <audio
                  ref={audioRef}
                  onTimeUpdate={(e) => {
                    const el = e.currentTarget;
                    if (!isSeekingRef.current) {
                      setCurrentTime(el.currentTime);
                      if (el.duration > 0) setProgress((el.currentTime / el.duration) * 100);
                    }
                    if (el.buffered.length && el.duration > 0)
                      setBuffered((el.buffered.end(el.buffered.length - 1) / el.duration) * 100);
                  }}
                  onLoadedMetadata={(e) => { const d = e.currentTarget.duration || 0; setDuration(d); }}
                  onPlay={() => setIsPlaying(true)}
                  onPause={() => setIsPlaying(false)}
                  onWaiting={() => setIsBuffering(true)}
                  onPlaying={() => setIsBuffering(false)}
                  onCanPlay={() => setIsBuffering(false)}
                  onEnded={() => playNext()}
                />
                {isVideo && (
                  <video
                    ref={videoRef} controls playsInline
                    onTimeUpdate={(e) => {
                      const el = e.currentTarget;
                      if (!isSeekingRef.current) {
