name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Offline UI
        run: |
          mkdir -p www
          cat <<EOF > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Loading...</title>
            <style>body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; }</style>
          </head>
          <body></body>
          </html>
          EOF
          
          cat <<EOF > www/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
            <title>Offline</title>
            <style>
              body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .spinner { width: 50px; height: 50px; border: 3px solid rgba(29, 185, 84, 0.3); border-top-color: #1DB954; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
              @keyframes spin { 100% { transform: rotate(360deg); } }
              h1 { font-size: 24px; margin: 0 0 10px; }
              p { color: #a7a7a7; font-size: 14px; text-align: center; max-width: 80%; }
              button { margin-top: 20px; background: #1DB954; color: #000; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <h1>You're Offline</h1>
            <p>Please check your internet connection.</p>
            <button onclick="window.location.href='https://ayushgaana.vercel.app'">Retry Connection</button>
          </body>
          </html>
          EOF
          
          npx cap init Music8481 com.music8481.app --web-dir www

          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushmobileappmusicgaaana.vercel.app",
              "cleartext": true,
              "errorPath": "error.html"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidSplashResourceName": "splash",
                "showSpinner": true,
                "spinnerColor": "#1DB954"
              }
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      - name: Inject Permissions & Vivo Meta-Data
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
          \`;
          if (!xml.includes('android.permission.WAKE_LOCK')) {
              xml = xml.replace('<application', perms + '\n    <application');
              xml = xml.replace('<application', '<application android:hardwareAccelerated=\"true\" android:largeHeap=\"true\"');
              xml = xml.replace('<activity', '<activity android:supportsPictureInPicture=\"true\"');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Force Android App Theme to Edge-to-Edge
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              const edgeToEdge = \`
                  <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
                  <item name=\"android:windowTranslucentStatus\">true</item>
                  <item name=\"android:windowTranslucentNavigation\">true</item>
                  <item name=\"android:statusBarColor\">@android:color/transparent</item>
                  <item name=\"android:navigationBarColor\">@android:color/transparent</item>
                  <item name=\"android:windowDrawsSystemBarBackgrounds\">false</item>
                  <item name=\"android:windowFullscreen\">true</item>
                  <item name=\"android:windowContentOverlay\">@null</item>
              \`;
              xml = xml.replace(/<\/style>/g, edgeToEdge + '\n</style>');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Inject Native Premium Engine & DOM Isolation
        run: |
          cat <<EOF > android/app/src/main/java/com/music8481/app/MainActivity.java
          package com.music8481.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.widget.FrameLayout;
          import android.content.Context;
          import android.os.PowerManager;
          import android.media.AudioManager;
          import android.view.WindowManager;
          import android.app.PictureInPictureParams;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;
          import android.content.res.Configuration;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private boolean isVideoFullscreen = false;
              private boolean isVideoModeActive = false; 

              private void updatePiPParams(boolean enable) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder();
                      builder.setAspectRatio(new Rational(16, 9));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          builder.setAutoEnterEnabled(enable);
                      }
                      setPictureInPictureParams(builder.build());
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void setVideoMode(boolean isVideo) {
                      if (isVideoModeActive != isVideo) {
                          isVideoModeActive = isVideo;
                          runOnUiThread(() -> updatePiPParams(isVideoFullscreen || isVideoModeActive));
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams layoutParams = getWindow().getAttributes();
                      layoutParams.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(layoutParams);
                  }
                  
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  getWindow().getDecorView().setOnApplyWindowInsetsListener((v, insets) -> {
                      return insets;
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      
                      settings.setMediaPlaybackRequiresUserGesture(false); 
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      settings.setDomStorageEnabled(true);
                      
                      webView.setFitsSystemWindows(false);
                      webView.setPadding(0,0,0,0);
                      
                      if (webView.getParent() instanceof ViewGroup) {
                          ((ViewGroup) webView.getParent()).setFitsSystemWindows(false);
                          ((ViewGroup) webView.getParent()).setClipToPadding(false);
                      }

                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidApp");
                      
                      webView.postDelayed(() -> {
                          webView.evaluateJavascript(
                              "setInterval(function() {" +
                              "  var meta = document.querySelector('meta[name=\"viewport\"]');" +
                              "  var content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';" +
                              "  if (meta && meta.content !== content) {" +
                              "      meta.content = content;" +
                              "  } else if (!meta) {" +
                              "      var m = document.createElement('meta');" +
                              "      m.name = 'viewport';" +
                              "      m.content = content;" +
                              "      document.head.appendChild(m);" +
                              "  }" +
                              "  document.documentElement.style.padding = '0';" +
                              "  document.documentElement.style.margin = '0';" +
                              "  document.body.style.padding = '0';" +
                              "  document.body.style.margin = '0';" +
                              "  var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "  var hasVideo = iframe !== null;" +
                              "  if (window.AndroidApp) window.AndroidApp.setVideoMode(hasVideo);" +
                              "}, 500);", null);
                      }, 2000);

                      final WebChromeClient originalClient = webView.getWebChromeClient();
                      webView.setWebChromeClient(new WebChromeClient() {
                          private View mCustomView;
                          private WebChromeClient.CustomViewCallback mCustomViewCallback;

                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) { onHideCustomView(); return; }
                              mCustomView = view;
                              isVideoFullscreen = true;
                              mCustomViewCallback = callback;
                              
                              runOnUiThread(() -> updatePiPParams(true));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.hide(WindowInsetsCompat.Type.systemBars());
                              windowInsetsController.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                              mCustomView.setFitsSystemWindows(false);
                              ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                              mCustomView = null;
                              isVideoFullscreen = false;
                              
                              runOnUiThread(() -> updatePiPParams(isVideoModeActive));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);
                              
                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.show(WindowInsetsCompat.Type.systemBars());
                              
                              if (mCustomViewCallback != null) { mCustomViewCallback.onCustomViewHidden(); mCustomViewCallback = null; }
                          }
                          @Override
                          public void onPermissionRequest(android.webkit.PermissionRequest request) { if (originalClient != null) originalClient.onPermissionRequest(request); }
                          @Override
                          public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) { return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams); }
                          @Override
                          public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) { return originalClient != null && originalClient.onConsoleMessage(consoleMessage); }
                      });
                  }
              }

              // ==========================================
              // 🔥 DOM-TREE ISOLATION ENGINE FOR PiP 🔥
              // ==========================================
              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      if (isInPictureInPictureMode) {
                          String js = 
                              "var style = document.getElementById('pip-style-fix');" +
                              "if (!style) {" +
                              "  style = document.createElement('style');" +
                              "  style.id = 'pip-style-fix';" +
                              "  style.innerHTML = '" +
                              "    body.pip-active { background: #000 !important; overflow: hidden !important; } " +
                              "    body.pip-active .pip-ancestor { position: static !important; transform: none !important; contain: none !important; perspective: none !important; filter: none !important; backdrop-filter: none !important; clip-path: none !important; mask: none !important; overflow: visible !important; margin: 0 !important; padding: 0 !important; background: transparent !important; width: 100% !important; height: 100% !important; } " +
                              "    body.pip-active .pip-target-iframe { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; min-width: 100% !important; min-height: 100% !important; z-index: 2147483647 !important; background: #000 !important; border: none !important; margin: 0 !important; padding: 0 !important; display: block !important; opacity: 1 !important; visibility: visible !important; object-fit: cover !important; } " +
                              "    body.pip-active .pip-hide-sibling { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; } " +
                              "  ';" +
                              "  document.head.appendChild(style);" +
                              "}" +
                              "var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "if (!iframe) iframe = document.querySelector('iframe');" +
                              "if (iframe) {" +
                              "  iframe.classList.add('pip-target-iframe');" +
                              "  var el = iframe;" +
                              "  while (el && el !== document.body && el !== document.documentElement) {" +
                              "    if (el !== iframe) el.classList.add('pip-ancestor');" +
                              "    if (el.parentElement) {" +
                              "      var siblings = el.parentElement.children;" +
                              "      for (var i = 0; i < siblings.length; i++) {" +
                              "        var sib = siblings[i];" +
                              "        if (sib !== el && sib.tagName !== 'SCRIPT' && sib.tagName !== 'STYLE' && sib.tagName !== 'LINK') {" +
                              "          sib.classList.add('pip-hide-sibling');" +
                              "        }" +
                              "      }" +
                              "    }" +
                              "    el = el.parentElement;" +
                              "  }" +
                              "  document.body.classList.add('pip-active');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      } else {
                          String js = 
                              "document.body.classList.remove('pip-active');" +
                              "var elements = document.querySelectorAll('.pip-target-iframe, .pip-ancestor, .pip-hide-sibling');" +
                              "for (var i = 0; i < elements.length; i++) {" +
                              "  elements[i].classList.remove('pip-target-iframe', 'pip-ancestor', 'pip-hide-sibling');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      }
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      try { enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build()); } catch (Exception e) {}
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().onResume(); 
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }
          }
          EOF

      - name: Fix Kotlin Duplicate Classes (Gradle Bug)
        run: |
          cat <<EOF >> android/app/build.gradle
          
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Generate App Icon & Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p assets
          
          wget -q https://raw.githubusercontent.com/Ayush8481Lab/Ayushgaana/refs/heads/main/app/android-chrome-512x512.png -O assets/icon.png
          convert -size 2732x2732 xc:"#000000" assets/icon.png -gravity center -composite assets/splash.png
          npx @capacitor/assets generate --android

      - name: Fix Gradle Daemon & Memory Issues (CI Stability)
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Build & Auto-Sign Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Independent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Independent-APK
          path: android/app/build/outputs/apk/release/app-release.apk
