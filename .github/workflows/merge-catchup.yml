                              .setActions(actions)
                              .setState(mPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, mPos, mPlaying ? 1.0f : 0f, SystemClock.elapsedRealtime())
                              .build();
                      mediaSession.setPlaybackState(ps);
