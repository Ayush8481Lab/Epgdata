                          running = true;
                          pool = Executors.newCachedThreadPool();
                          Thread t = new Thread(() -> {
                              try { android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_AUDIO); } catch (Exception ignored) {}
                              while (running) {
                                  try {
                                      final Socket s = serverSocket.accept();
                                      pool.execute(() -> handle(s));
                                  } catch (Exception e) {
                                      if (!running) break;
                                  }
                              }
                          }, "Music8481-LocalServer");
                          t.setDaemon(true);
                          t.start();
                          return true;
                      } catch (Exception e) {
                          e.printStackTrace();
                          return false;
                      }
                  }

                  void stop() {
                      running = false;
                      try { if (serverSocket != null) serverSocket.close(); } catch (Exception ignored) {}
                      try { if (pool != null) pool.shutdownNow(); } catch (Exception ignored) {}
                  }

                  String base() {
                      return "http://127.0.0.1:" + port + "/" + token;
                  }

                  private String readLine(InputStream in) throws IOException {
                      StringBuilder sb = new StringBuilder();
                      int c;
                      while ((c = in.read()) != -1) {
                          if (c == '\n') break;
                          if (c != '\r') sb.append((char) c);
                          if (sb.length() > 8192) break;
                      }
                      if (c == -1 && sb.length() == 0) return null;
                      return sb.toString();
                  }

                  private void writeHead(OutputStream out, int code, String msg, String type, long len, String extra) throws IOException {
                      StringBuilder sb = new StringBuilder();
                      sb.append("HTTP/1.1 ").append(code).append(' ').append(msg).append("\r\n");
                      if (type != null) sb.append("Content-Type: ").append(type).append("\r\n");
                      sb.append("Content-Length: ").append(len).append("\r\n");
                      sb.append("Accept-Ranges: bytes\r\n");
                      sb.append("Access-Control-Allow-Origin: *\r\n");
                      sb.append("Access-Control-Allow-Headers: Range\r\n");
                      sb.append("Access-Control-Expose-Headers: Content-Length, Content-Range, Accept-Ranges\r\n");
                      if (extra != null) sb.append(extra);
                      sb.append("Connection: close\r\n\r\n");
                      out.write(sb.toString().getBytes(StandardCharsets.ISO_8859_1));
                  }

                  private String mimeFor(String rel) {
                      String lower = rel.toLowerCase();
                      if (lower.endsWith(".m4a")) return "audio/mp4";
                      if (lower.endsWith(".wav")) return "audio/wav";
                      if (lower.endsWith(".flac")) return "audio/flac";
                      if (lower.endsWith(".ogg") || lower.endsWith(".opus")) return "audio/ogg";
                      if (lower.endsWith(".aac")) return "audio/aac";
                      if (lower.endsWith(".mp4")) return "video/mp4";
                      if (lower.endsWith(".webm")) return "video/webm";
                      if (lower.endsWith(".lrc")) return "text/plain";
                      return "audio/mpeg";
                  }

                  private void handle(Socket s) {
                      try {
                          try { android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_AUDIO); } catch (Exception ignored) {}
                          s.setSoTimeout(20000);
                          s.setTcpNoDelay(true);
                          try { s.setSendBufferSize(262144); } catch (Exception ignored) {}
                          InputStream in = new BufferedInputStream(s.getInputStream(), 4096);
                          OutputStream out = new BufferedOutputStream(s.getOutputStream(), 131072);

                          String reqLine = readLine(in);
                          if (reqLine == null || reqLine.isEmpty()) return;
                          String range = null;
                          String h;
                          int guard = 0;
                          while ((h = readLine(in)) != null && !h.isEmpty() && guard++ < 100) {
                              if (h.length() > 6 && h.regionMatches(true, 0, "range:", 0, 6)) range = h.substring(6).trim();
                          }

                          String[] parts = reqLine.split(" ");
                          if (parts.length < 2) return;
                          String method = parts[0];
                          boolean head = method.equalsIgnoreCase("HEAD");

                          if (method.equalsIgnoreCase("OPTIONS")) {
                              writeHead(out, 204, "No Content", null, 0, null);
                              out.flush();
                              return;
                          }

                          String path = parts[1];
                          int q = path.indexOf('?');
                          if (q >= 0) path = path.substring(0, q);
                          String prefix = "/" + token;
                          if (!path.startsWith(prefix + "/")) {
                              writeHead(out, 403, "Forbidden", "text/plain", 0, null);
                              out.flush();
                              return;
                          }
                          path = path.substring(prefix.length());
                          String decoded = URLDecoder.decode(path.replace("+", "%2B"), "UTF-8");

                          if (decoded.startsWith("/f/")) {
                              String rel = decoded.substring(3);
                              File f = findLocalMediaFile(rel);
                              if (f == null) {
                                  writeHead(out, 404, "Not Found", "text/plain", 0, null);
                                  out.flush();
                                  return;
                              }
                              serveFile(out, f, rel, range, head);
                          } else if (decoded.startsWith("/__art__/")) {
                              String rel = decoded.substring(9);
                              serveArt(out, rel, head);
                          } else {
                              writeHead(out, 404, "Not Found", "text/plain", 0, null);
                              out.flush();
                          }
                      } catch (Exception ignored) {
                          // client closed the connection (seek / skip) - totally normal
                      } finally {
                          try { s.close(); } catch (Exception ignored) {}
                      }
                  }

                  private void serveFile(OutputStream out, File f, String rel, String range, boolean head) throws IOException {
                      long len = f.length();
                      long start = 0, end = len - 1;
                      boolean partial = false;
                      if (range != null && range.toLowerCase().startsWith("bytes=")) {
                          String spec = range.substring(6).split(",")[0].trim();
                          int dash = spec.indexOf('-');
                          try {
                              if (dash == 0) {
                                  long n = Long.parseLong(spec.substring(1));
                                  start = Math.max(0, len - n);
                                  partial = true;
                              } else if (dash > 0) {
                                  start = Long.parseLong(spec.substring(0, dash));
                                  String e = spec.substring(dash + 1);
                                  if (!e.isEmpty()) end = Math.min(len - 1, Long.parseLong(e));
                                  partial = true;
                              }
                          } catch (Exception ex) {
                              partial = false;
                              start = 0;
                              end = len - 1;
                          }
                          if (partial && (start >= len || start > end)) {
                              writeHead(out, 416, "Range Not Satisfiable", "text/plain", 0, "Content-Range: bytes */" + len + "\r\n");
                              out.flush();
                              return;
                          }
                      }
                      long cl = Math.max(0, end - start + 1);
                      String mime = mimeFor(rel);
                      if (partial) {
                          writeHead(out, 206, "Partial Content", mime, cl, "Content-Range: bytes " + start + "-" + end + "/" + len + "\r\n");
                      } else {
                          writeHead(out, 200, "OK", mime, len, null);
                      }
                      if (head || cl == 0) {
                          out.flush();
                          return;
                      }
                      RandomAccessFile raf = new RandomAccessFile(f, "r");
                      try {
                          raf.seek(start);
                          byte[] buf = new byte[131072];
                          long remaining = cl;
                          while (remaining > 0) {
                              int r = raf.read(buf, 0, (int) Math.min(buf.length, remaining));
                              if (r < 0) break;
                              out.write(buf, 0, r);
                              remaining -= r;
                          }
                          out.flush();
                      } finally {
                          try { raf.close(); } catch (Exception ignored) {}
                      }
                  }

                  private void serveArt(OutputStream out, String rel, boolean head) throws IOException {
                      File mediaFile = findLocalMediaFile(rel);
                      byte[] art = null;
                      if (mediaFile != null) {
                          MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                          try {
                              mmr.setDataSource(mediaFile.getAbsolutePath());
                              art = mmr.getEmbeddedPicture();
                          } catch (Exception ignored) {
                          } finally {
                              try { mmr.release(); } catch (Exception ignored) {}
                          }
                      }
                      if (art == null || art.length == 0) {
                          writeHead(out, 404, "Not Found", "text/plain", 0, null);
                          out.flush();
                          return;
                      }
                      boolean png = art.length > 4 && (art[0] & 0xFF) == 0x89 && art[1] == 'P' && art[2] == 'N' && art[3] == 'G';
                      writeHead(out, 200, "OK", png ? "image/png" : "image/jpeg", art.length, "Cache-Control: max-age=86400\r\n");
                      if (!head) out.write(art);
                      out.flush();
                  }
              }

              private class DownloadTask {
                  int id;
                  String url;
                  String fileName;
                  String mimeType;
                  String userAgent;
                  String cookies;
                  File targetFile;
                  volatile boolean isPaused = false;
                  volatile boolean isCancelled = false;
                  long downloadedBytes = 0;
                  long totalBytes = -1;
                  int currentProgress = 0;
                  boolean isBlob = false;
                  RandomAccessFile blobRaf = null;

                  DownloadTask(int id, String fileName, String mimeType, boolean isBlob) {
                      this.id = id;
                      this.fileName = fileName;
                      this.mimeType = mimeType;
                      this.isBlob = isBlob;
                      this.targetFile = new File(getMusic8481Directory(), fileName);
                  }

                  void startHttpDownload() {
                      new Thread(() -> {
                          HttpURLConnection conn = null;
                          RandomAccessFile raf = null;
                          InputStream is = null;
                          try {
                              File parent = targetFile.getParentFile();
                              if (parent != null && !parent.exists()) parent.mkdirs();

                              URL u = new URL(url);
                              conn = (HttpURLConnection) u.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(15000);
                              conn.setReadTimeout(30000);
                              if (userAgent != null && !userAgent.isEmpty()) conn.setRequestProperty("User-Agent", userAgent);
                              if (cookies != null && !cookies.isEmpty()) conn.setRequestProperty("Cookie", cookies);

                              if (downloadedBytes > 0 && targetFile.exists()) {
                                  conn.setRequestProperty("Range", "bytes=" + downloadedBytes + "-");
                              }

                              conn.connect();
                              int responseCode = conn.getResponseCode();

                              if (responseCode == HttpURLConnection.HTTP_PARTIAL) {
                                  long contentLength = conn.getContentLengthLong();
                                  if (totalBytes <= 0 && contentLength > 0) {
                                      totalBytes = downloadedBytes + contentLength;
                                  }
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.seek(downloadedBytes);
                              } else if (responseCode == HttpURLConnection.HTTP_OK) {
                                  downloadedBytes = 0;
                                  totalBytes = conn.getContentLengthLong();
                                  raf = new RandomAccessFile(targetFile, "rw");
                                  raf.setLength(0);
                              } else {
                                  throw new Exception("Server HTTP " + responseCode);
                              }

                              is = conn.getInputStream();
                              byte[] buffer = new byte[16384];
                              int len;
                              long lastNotifUpdate = 0;

                              updateNotification(currentProgress, false);

                              while ((len = is.read(buffer)) != -1) {
                                  if (isCancelled) {
                                      raf.close();
                                      is.close();
                                      if (targetFile.exists()) targetFile.delete();
                                      notificationManager.cancel(id);
                                      activeTasks.remove(id);
                                      return;
                                  }
                                  if (isPaused) {
                                      raf.close();
                                      is.close();
                                      updateNotification(currentProgress, true);
                                      return;
                                  }

                                  raf.write(buffer, 0, len);
                                  downloadedBytes += len;

                                  if (totalBytes > 0) {
                                      currentProgress = (int) ((downloadedBytes * 100L) / totalBytes);
                                  }

                                  long now = System.currentTimeMillis();
                                  if (now - lastNotifUpdate >= 350) {
                                      updateNotification(currentProgress, false);
                                      lastNotifUpdate = now;
                                  }
                              }

                              raf.close();
                              is.close();
                              completeDownload();
                          } catch (Exception e) {
                              e.printStackTrace();
                              if (!isCancelled && !isPaused) {
                                  showFailedNotification(e.getMessage());
                              }
                          } finally {
                              try { if (raf != null) raf.close(); } catch (Exception ignored) {}
                              try { if (is != null) is.close(); } catch (Exception ignored) {}
                              if (conn != null) conn.disconnect();
                          }
                      }).start();
                  }

                  void completeDownload() {
                      activeTasks.remove(id);
                      MediaScannerConnection.scanFile(MainActivity.this, new String[]{targetFile.getAbsolutePath()}, null, null);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                              .setContentTitle(fileName)
                              .setContentText("100% • Saved to Music8481/Download")
                              .setSubText("100%")
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved: Music8481/Download/" + fileName, Toast.LENGTH_LONG).show());
                  }

                  void showFailedNotification(String errorMsg) {
                      activeTasks.remove(id);
                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.stat_notify_error)
                              .setContentTitle("Download Failed: " + fileName)
                              .setContentText(errorMsg != null ? errorMsg : "Connection interrupted")
                              .setOngoing(false)
                              .setAutoCancel(true);
                      notificationManager.notify(id, builder.build());
                  }

                  void updateNotification(int progress, boolean paused) {
                      Intent pauseOrResumeIntent = new Intent(paused ? ACTION_RESUME : ACTION_PAUSE);
                      pauseOrResumeIntent.setPackage(getPackageName());
                      pauseOrResumeIntent.putExtra("taskId", id);
                      PendingIntent pauseOrResumePending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 1,
                              pauseOrResumeIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Intent cancelIntent = new Intent(ACTION_CANCEL);
                      cancelIntent.setPackage(getPackageName());
                      cancelIntent.putExtra("taskId", id);
                      PendingIntent cancelPending = PendingIntent.getBroadcast(
                              MainActivity.this,
                              id * 10 + 2,
                              cancelIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      String statusText;
                      if (paused) {
                          statusText = "Paused at " + progress + "%";
                      } else if (totalBytes > 0) {
                          statusText = "Downloading... " + progress + "% (" + formatSize(downloadedBytes) + " / " + formatSize(totalBytes) + ")";
                      } else {
                          statusText = "Downloading... " + formatSize(downloadedBytes);
                      }

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                              .setSmallIcon(paused ? android.R.drawable.ic_media_pause : android.R.drawable.stat_sys_download)
                              .setContentTitle(fileName)
                              .setContentText(statusText)
                              .setSubText(totalBytes > 0 ? progress + "%" : "")
                              .setProgress(100, Math.max(0, Math.min(100, progress)), totalBytes <= 0 && !paused)
                              .setOngoing(!paused)
                              .setOnlyAlertOnce(true)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .addAction(
                                      paused ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause,
                                      paused ? "Resume" : "Pause",
                                      pauseOrResumePending
                              )
                              .addAction(
                                      android.R.drawable.ic_menu_close_clear_cancel,
                                      "Cancel",
                                      cancelPending
                              );

                      notificationManager.notify(id, builder.build());
                  }
              }

              private String formatSize(long bytes) {
                  if (bytes < 1024) return bytes + " B";
                  int exp = (int) (Math.log(bytes) / Math.log(1024));
                  char pre = "KMGTPE".charAt(exp - 1);
                  return String.format("%.1f %sB", bytes / Math.pow(1024, exp), pre);
              }

              private final BroadcastReceiver downloadReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) return;
                      int taskId = intent.getIntExtra("taskId", -1);
                      DownloadTask task = activeTasks.get(taskId);
                      if (task == null) return;

                      String action = intent.getAction();
                      if (ACTION_PAUSE.equals(action)) {
                          task.isPaused = true;
                          task.updateNotification(task.currentProgress, true);
                      } else if (ACTION_RESUME.equals(action)) {
                          if (task.isPaused) {
                              task.isPaused = false;
                              task.updateNotification(task.currentProgress, false);
                              if (!task.isBlob) {
                                  task.startHttpDownload();
                              }
                          }
                      } else if (ACTION_CANCEL.equals(action)) {
                          task.isCancelled = true;
                          task.isPaused = false;
                          try { if (task.blobRaf != null) task.blobRaf.close(); } catch (Exception ignored) {}
                          if (task.targetFile != null && task.targetFile.exists()) {
                              task.targetFile.delete();
                          }
                          notificationManager.cancel(taskId);
                          activeTasks.remove(taskId);
                          Toast.makeText(MainActivity.this, "Cancelled: " + task.fileName, Toast.LENGTH_SHORT).show();
                      }
                  }
              };

              // ---------- Media notification buttons -> offline page ----------
              private final BroadcastReceiver mediaReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) return;
                      String a = intent.getAction();
                      if (ACT_M_PREV.equals(a)) sendMediaAction("prev", 0);
                      else if (ACT_M_NEXT.equals(a)) sendMediaAction("next", 0);
                      else if (ACT_M_TOGGLE.equals(a)) sendMediaAction("toggle", 0);
                  }
              };

              private void sendMediaAction(String action, double value) {
                  final WebView w = (this.bridge != null) ? this.bridge.getWebView() : null;
                  if (w == null) return;
                  final String js = "window.__nativeMediaAction&&window.__nativeMediaAction('" + action + "'," + value + ")";
                  w.post(() -> w.evaluateJavascript(js, null));
              }

              private PendingIntent mediaPi(String action, int req) {
                  Intent i = new Intent(action);
                  i.setPackage(getPackageName());
                  return PendingIntent.getBroadcast(this, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              @SuppressWarnings("deprecation")
              private void setupMediaSession() {
                  try {
                      mediaSession = new MediaSession(this, "Music8481Offline");
                      mediaSession.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                      mediaSession.setCallback(new MediaSession.Callback() {
                          @Override public void onPlay() { sendMediaAction("play", 0); }
                          @Override public void onPause() { sendMediaAction("pause", 0); }
                          @Override public void onSkipToNext() { sendMediaAction("next", 0); }
                          @Override public void onSkipToPrevious() { sendMediaAction("prev", 0); }
                          @Override public void onStop() { sendMediaAction("pause", 0); }
                          @Override public void onSeekTo(long pos) { sendMediaAction("seek", pos / 1000.0); }
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              // Builds the playback notification from the CURRENT track info (used by activity + foreground service)
              Notification buildNotification() {
                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, PB_CHANNEL)
                          : new Notification.Builder(this);

                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  final boolean playing = mPlaying;
                  final Bitmap art = mArt;
                  nb.setSmallIcon(playing ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause)
                          .setContentTitle(mTitle)
                          .setContentText(mArtist)
                          .setSubText(mAlbum != null && !mAlbum.isEmpty() ? mAlbum : "Music8481 Offline")
                          .setContentIntent(contentPi)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setCategory(Notification.CATEGORY_TRANSPORT)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setOngoing(playing);
                  if (art != null) nb.setLargeIcon(art);

                  nb.addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_previous), "Previous", mediaPi(ACT_M_PREV, 7101)).build());
                  nb.addAction(new Notification.Action.Builder(
                          Icon.createWithResource(this, playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play),
                          playing ? "Pause" : "Play", mediaPi(ACT_M_TOGGLE, 7102)).build());
                  nb.addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_next), "Next", mediaPi(ACT_M_NEXT, 7103)).build());

                  Notification.MediaStyle style = new Notification.MediaStyle().setShowActionsInCompactView(0, 1, 2);
                  if (mediaSession != null) style.setMediaSession(mediaSession.getSessionToken());
                  nb.setStyle(style);
                  return nb.build();
              }

              // Used by MusicService.startForeground()
              static Notification currentNotification(Context c) {
                  if (INSTANCE != null) {
                      try { return INSTANCE.buildNotification(); } catch (Exception ignored) {}
                  }
                  Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(c, PB_CHANNEL)
                          : new Notification.Builder(c);
                  return b.setSmallIcon(android.R.drawable.ic_media_play).setContentTitle("Music8481").build();
              }

              private void pushMedia() {
                  if (mediaSession == null || notificationManager == null) return;
                  try {
                      MediaMetadata.Builder mb = new MediaMetadata.Builder()
                              .putString(MediaMetadata.METADATA_KEY_MEDIA_ID, mRel)
                              .putString(MediaMetadata.METADATA_KEY_TITLE, mTitle)
                              .putString(MediaMetadata.METADATA_KEY_ARTIST, mArtist)
                              .putString(MediaMetadata.METADATA_KEY_ALBUM, mAlbum)
                              .putLong(MediaMetadata.METADATA_KEY_DURATION, mDur);
                      Bitmap art = mArt;
                      if (art != null) {
                          mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, art);
                          mb.putBitmap(MediaMetadata.METADATA_KEY_ART, art);
                      }
                      mediaSession.setMetadata(mb.build());

                      long actions = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                              | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                              | PlaybackState.ACTION_SEEK_TO | PlaybackState.ACTION_STOP;
                      PlaybackState ps = new PlaybackState.Builder()
                              .setActions(actions)
                              .setState(mPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, mPos, mPlaying ? 1.0f : 0f, SystemClock.elapsedRealtime())
                              .build();
                      mediaSession.setPlaybackState(ps);
                      mediaSession.setActive(true);

                      Notification n = buildNotification();
                      if (!serviceUp) {
                          // Foreground service keeps the process at media priority: reliable notification updates on Android 16 + no crackle in background
                          try {
                              ContextCompat.startForegroundService(this, new Intent(this, MusicService.class));
                              serviceUp = true;
                          } catch (Exception e) {
                              serviceUp = false;
                              notificationManager.notify(PB_NOTI_ID, n);
                          }
                      } else {
                          notificationManager.notify(PB_NOTI_ID, n);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private Bitmap decodeArt(byte[] bytes) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o);
                      int sample = 1;
                      int max = Math.max(o.outWidth, o.outHeight);
                      while (max / sample > 640) sample *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = sample;
                      return BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o2);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private File getMusic8481Directory() {
                  File rootDir = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  if (!rootDir.exists()) {
                      rootDir.mkdirs();
                  }
                  return rootDir;
              }

              private List<File> getAllDownloadDirectories() {
                  List<File> dirs = new ArrayList<>();
                  File d1 = new File(Environment.getExternalStorageDirectory(), "Music8481/Download");
                  File d2 = new File(Environment.getExternalStorageDirectory(), "Music8481/Downloads");
                  if (!d1.exists()) d1.mkdirs();
                  dirs.add(d1);
                  if (d2.exists()) dirs.add(d2);
                  return dirs;
              }

              // ---------- Device audio scanning (offline player) ----------
              private List<File> getScanRoots() {
                  List<File> roots = new ArrayList<>();
                  File ext = Environment.getExternalStorageDirectory();
                  String[] names = {"Music8481/Download", "Music8481/Downloads", "Music", "Download", "Downloads"};
                  for (String n : names) {
                      File f = new File(ext, n);
                      if (f.exists() && f.isDirectory()) roots.add(f);
                  }
                  return roots;
              }

              private boolean isAudioExt(String ext) {
                  return ext.equals("mp3") || ext.equals("m4a") || ext.equals("wav") || ext.equals("ogg")
                          || ext.equals("flac") || ext.equals("aac") || ext.equals("opus");
              }

              private void scanAudio(File dir, int depth, List<File> out, Set<String> seen) {
                  if (dir == null || depth < 0 || out.size() >= 4000) return;
                  File[] files = dir.listFiles();
                  if (files == null) return;
                  for (File f : files) {
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      if (f.isDirectory()) {
                          if (n.equalsIgnoreCase("Android")) continue;
                          scanAudio(f, depth - 1, out, seen);
                      } else if (f.isFile()) {
                          int d = n.lastIndexOf('.');
                          if (d <= 0) continue;
                          String ext = n.substring(d + 1).toLowerCase();
                          if (isAudioExt(ext) && f.length() >= 60 * 1024) {
                              String p = f.getAbsolutePath();
                              if (seen.add(p)) out.add(f);
                          }
                      }
                  }
              }

              private String relPath(File f) {
                  String ext = Environment.getExternalStorageDirectory().getAbsolutePath();
                  String abs = f.getAbsolutePath();
                  return abs.startsWith(ext + "/") ? abs.substring(ext.length() + 1) : abs;
              }

              private String encodePath(String rel) {
                  try {
                      String[] segs = rel.split("/");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < segs.length; i++) {
                          if (i > 0) sb.append("/");
                          sb.append(URLEncoder.encode(segs[i], "UTF-8").replace("+", "%20"));
                      }
                      return sb.toString();
                  } catch (Exception e) {
                      return rel;
                  }
              }

              // Path-traversal safe lookup (canonical path must stay inside storage / download dirs)
              private File findLocalMediaFile(String rel) {
                  if (rel == null || rel.isEmpty()) return null;
                  try {
                      File ext = Environment.getExternalStorageDirectory();
                      String ep = ext.getCanonicalPath();
                      File f = new File(ext, rel);
                      String cp = f.getCanonicalPath();
                      if (cp.startsWith(ep + File.separator) && f.isFile()) return f;
                      for (File dir : getAllDownloadDirectories()) {
                          File g = new File(dir, rel);
                          String gp = g.getCanonicalPath();
                          if (gp.startsWith(dir.getCanonicalPath() + File.separator) && g.isFile()) return g;
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private Set<String> lrcBases(File dir, Map<String, Set<String>> cache) {
                  String key = dir.getAbsolutePath();
                  Set<String> s = cache.get(key);
                  if (s != null) return s;
                  s = new HashSet<>();
                  File[] fs = dir.listFiles();
                  if (fs != null) {
                      for (File x : fs) {
                          String n = x.getName();
                          if (n.toLowerCase().endsWith(".lrc")) {
                              s.add(n.substring(0, n.length() - 4).trim().toLowerCase());
                          }
                      }
                  }
                  cache.put(key, s);
                  return s;
              }

              private File findLrcFor(File f) {
                  File dir = f.getParentFile();
                  if (dir == null) return null;
                  String n = f.getName();
                  int d = n.lastIndexOf('.');
                  String base = (d > 0 ? n.substring(0, d) : n).trim().toLowerCase();
                  File[] fs = dir.listFiles();
                  if (fs != null) {
                      for (File x : fs) {
                          String xn = x.getName();
                          if (xn.toLowerCase().endsWith(".lrc") && xn.substring(0, xn.length() - 4).trim().toLowerCase().equals(base)) {
                              return x;
                          }
                      }
                  }
                  return null;
              }

              private String readTextFile(File file) {
                  try (FileInputStream fis = new FileInputStream(file)) {
                      byte[] data = new byte[(int) file.length()];
                      int off = 0;
                      while (off < data.length) {
                          int r = fis.read(data, off, data.length - off);
                          if (r < 0) break;
                          off += r;
                      }
                      return new String(data, 0, off, StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              // Reads ID3 / container metadata. withLrc=true also embeds the .lrc content.
              private JSONObject buildMeta(File f, String rel, boolean withLrc) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("id", rel);
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      try {
                          mmr.setDataSource(f.getAbsolutePath());
                          String title = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_TITLE);
                          String artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ARTIST);
                          if (artist == null || artist.trim().isEmpty()) {
                              artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUMARTIST);
                          }
                          String album = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUM);
                          String year = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_YEAR);
                          String genre = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_GENRE);
                          String dur = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);
                          String br = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_BITRATE);
                          byte[] art = mmr.getEmbeddedPicture();

                          o.put("title", title != null ? title.trim() : "");
                          o.put("artist", artist != null ? artist.trim() : "");
                          o.put("album", album != null ? album.trim() : "");
                          o.put("year", year != null ? year.trim() : "");
                          o.put("genre", genre != null ? genre.trim() : "");
                          o.put("duration", dur != null ? Long.parseLong(dur.trim()) / 1000.0 : 0);
                          o.put("bitrate", br != null ? Long.parseLong(br.trim()) : 0);
                          o.put("hasArt", art != null && art.length > 0);
                      } catch (Exception ignored) {
                          if (!o.has("hasArt")) o.put("hasArt", false);
                      } finally {
                          try { mmr.release(); } catch (Exception ignored) {}
                      }
                      if (withLrc) {
                          File lrc = findLrcFor(f);
                          o.put("lrcContent", lrc != null ? readTextFile(lrc) : "");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return o;
              }

