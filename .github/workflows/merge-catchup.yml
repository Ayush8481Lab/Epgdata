              private boolean isNetworkOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Network n = cm.getActiveNetwork();
                      if (n == null) return false;
                      NetworkCapabilities cap = cm.getNetworkCapabilities(n);
                      return cap != null
                              && cap.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              && cap.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED);
                  }
                  return cm.getActiveNetworkInfo() != null && cm.getActiveNetworkInfo().isConnected();
              }

              private boolean isDownloadTrigger(String url) {
                  if (url == null) return false;
                  try {
                      Uri u = Uri.parse(url);
                      String host = u.getHost();
                      String path = u.getPath();
                      if (host == null || path == null) return false;
                      return host.equalsIgnoreCase(ONLINE_HOST) && (path.equals("/download") || path.startsWith("/download/"));
                  } catch (Exception e) {
                      return false;
                  }
              }

              private boolean isOnlineUrl(String url) {
                  return url != null && url.startsWith("https://" + ONLINE_HOST);
              }

