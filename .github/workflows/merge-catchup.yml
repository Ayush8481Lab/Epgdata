      - name: Add Native Android Platform
        run: npx cap add android

      - name: Inject Permissions & Root Folder Access Meta-Data
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_DATA_SYNC\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          \`;
          if (!xml.includes('android.permission.WAKE_LOCK')) {
              xml = xml.replace('<application', perms + '\n    <application');
              xml = xml.replace('<application', '<application android:hardwareAccelerated=\"true\" android:largeHeap=\"true\" android:usesCleartextTraffic=\"true\" android:requestLegacyExternalStorage=\"true\" android:preserveLegacyExternalStorage=\"true\"');
              xml = xml.replace('<activity', '<activity android:hardwareAccelerated=\"true\" android:supportsPictureInPicture=\"true\"');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Force Android App Theme to Edge-to-Edge
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              const edgeToEdge = \`
                  <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
                  <item name=\"android:windowTranslucentStatus\">true</item>
                  <item name=\"android:windowTranslucentNavigation\">true</item>
                  <item name=\"android:statusBarColor\">@android:color/transparent</item>
                  <item name=\"android:navigationBarColor\">@android:color/transparent</item>
                  <item name=\"android:windowDrawsSystemBarBackgrounds\">false</item>
                  <item name=\"android:windowFullscreen\">true</item>
                  <item name=\"android:windowContentOverlay\">@null</item>
              \`;
              xml = xml.replace(/<\/style>/g, edgeToEdge + '\n</style>');
              fs.writeFileSync(path, xml);
          }
          "

