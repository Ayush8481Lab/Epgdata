                  @JavascriptInterface
                  public String getDownloadedFiles() {
                      JSONArray result = new JSONArray();
                      try {
                          List<File> allFiles = new ArrayList<>();
                          for (File dir : getAllDownloadDirectories()) {
                              File[] files = dir.listFiles();
                              if (files != null) {
                                  allFiles.addAll(Arrays.asList(files));
                              }
                          }

                          Map<String, File> lrcMap = new HashMap<>();
                          for (File f : allFiles) {
                              if (f.isFile() && f.getName().toLowerCase().endsWith(".lrc")) {
                                  String name = f.getName();
                                  String base = name.substring(0, name.lastIndexOf('.')).trim().toLowerCase();
                                  lrcMap.put(base, f);
                              }
                          }

                          allFiles.sort((a, b) -> Long.compare(b.lastModified(), a.lastModified()));

                          for (File f : allFiles) {
                              if (!f.isFile()) continue;
                              String name = f.getName();
                              int dotIdx = name.lastIndexOf('.');
                              if (dotIdx <= 0) continue;

                              String baseName = name.substring(0, dotIdx).trim();
                              String ext = name.substring(dotIdx + 1).toLowerCase();

                              if (ext.equals("mp3") || ext.equals("mp4") || ext.equals("m4a") || ext.equals("wav") || ext.equals("webm") || ext.equals("ogg")) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", name);
                                  obj.put("baseName", baseName);
                                  obj.put("ext", ext);
                                  obj.put("size", f.length());
                                  obj.put("lastModified", f.lastModified());
                                  obj.put("isVideo", ext.equals("mp4") || ext.equals("webm"));

                                  String encoded = URLEncoder.encode(name, "UTF-8").replace("+", "%20");
                                  obj.put("url", "https://localmedia.music8481.app/" + encoded);

                                  String id3Title = null;
                                  String id3Artist = null;
                                  String id3Album = null;
                                  boolean hasArt = false;

                                  MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                                  try {
                                      mmr.setDataSource(f.getAbsolutePath());
                                      id3Title = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_TITLE);
                                      id3Artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ARTIST);
                                      if (id3Artist == null || id3Artist.trim().isEmpty()) {
                                          id3Artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUMARTIST);
                                      }
                                      id3Album = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUM);
                                      byte[] artBytes = mmr.getEmbeddedPicture();
                                      if (artBytes != null && artBytes.length > 0) {
                                          hasArt = true;
                                      }
                                  } catch (Exception ignored) {
                                  } finally {
                                      try { mmr.release(); } catch (Exception ignored) {}
                                  }

                                  obj.put("title", (id3Title != null && !id3Title.trim().isEmpty()) ? id3Title.trim() : baseName);
                                  obj.put("artist", (id3Artist != null && !id3Artist.trim().isEmpty()) ? id3Artist.trim() : "Unknown Artist");
                                  obj.put("album", (id3Album != null && !id3Album.trim().isEmpty()) ? id3Album.trim() : "");
                                  obj.put("hasArt", hasArt);
                                  obj.put("artUrl", hasArt ? ("https://localmedia.music8481.app/__art__/" + encoded) : "");

                                  File matchingLrc = lrcMap.get(baseName.toLowerCase());
                                  if (matchingLrc != null && matchingLrc.exists()) {
                                      obj.put("hasLyrics", true);
                                      obj.put("lrcName", matchingLrc.getName());
                                      obj.put("lrcContent", readTextFile(matchingLrc));
                                  } else {
                                      obj.put("hasLyrics", false);
                                      obj.put("lrcName", "");
                                      obj.put("lrcContent", "");
                                  }
                                  result.put(obj);
                              }
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return result.toString();
                  }

                  @JavascriptInterface
                  public boolean deleteDownloadedFile(String fileName) {
                      try {
                          File f = findLocalMediaFile(fileName);
                          if (f != null && f.exists()) {
                              int dot = fileName.lastIndexOf('.');
                              if (dot > 0) {
                                  String base = fileName.substring(0, dot);
                                  File lrc = findLocalMediaFile(base + ".lrc");
                                  if (lrc != null && lrc.exists()) lrc.delete();
                              }
                              return f.delete();
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public int initBlobDownload(String fileName, String mimeType, long totalSize) {
                      int id = notificationIdCounter.incrementAndGet();
                      String cleanName = sanitizeFilename(fileName, mimeType);
                      DownloadTask task = new DownloadTask(id, cleanName, mimeType, true);
                      task.totalBytes = totalSize;
                      try {
                          File parent = task.targetFile.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          task.blobRaf = new RandomAccessFile(task.targetFile, "rw");
                          task.blobRaf.setLength(0);
                          activeTasks.put(id, task);
                          task.updateNotification(0, false);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Downloading: " + cleanName, Toast.LENGTH_SHORT).show());
                      } catch (Exception e) {
                          e.printStackTrace();
                          return -1;
                      }
                      return id;
                  }

                  @JavascriptInterface
                  public String appendBlobChunk(int id, String base64Chunk) {
                      DownloadTask task = activeTasks.get(id);
                      if (task == null || task.isCancelled) return "CANCELLED";
                      if (task.isPaused) return "PAUSED";
                      try {
                          String cleanBase64 = base64Chunk.contains(",") ? base64Chunk.split(",")[1] : base64Chunk;
                          byte[] bytes = Base64.decode(cleanBase64, Base64.DEFAULT);
                          task.blobRaf.write(bytes);
                          task.downloadedBytes += bytes.length;
                          if (task.totalBytes > 0) {
                              task.currentProgress = (int) ((task.downloadedBytes * 100L) / task.totalBytes);
                          }
                          task.updateNotification(task.currentProgress, false);
                          return "OK";
                      } catch (Exception e) {
                          e.printStackTrace();
                          task.showFailedNotification(e.getMessage());
                          return "ERROR";
                      }
                  }

                  @JavascriptInterface
                  public void finishBlobDownload(int id) {
                      DownloadTask task = activeTasks.get(id);
                      if (task == null) return;
                      try {
                          if (task.blobRaf != null) task.blobRaf.close();
                          task.completeDownload();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  createNotificationChannel();

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(ACTION_PAUSE);
                  filter.addAction(ACTION_RESUME);
                  filter.addAction(ACTION_CANCEL);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(downloadReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(downloadReceiver, filter);
                  }

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams layoutParams = getWindow().getAttributes();
                      layoutParams.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(layoutParams);
                  }
                  
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().getDecorView().setOnApplyWindowInsetsListener((v, insets) -> insets);

                  requestAllPermissions();
                  getMusic8481Directory();

                  // Start background 3-hour & on-online sync for /down.txt
                  startDownTxtBackgroundSchedule();

                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      setVolumeControlStream(AudioManager.STREAM_MUSIC);
                      try {
                          audioManager.setMode(AudioManager.MODE_NORMAL);
                      } catch (Exception ignored) {}
                  }

                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      settings.setRenderPriority(WebSettings.RenderPriority.HIGH);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);
                      
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          settings.setOffscreenPreRaster(true);
                      }
                      
                      webView.setFitsSystemWindows(false);
                      webView.setPadding(0, 0, 0, 0);
                      
                      if (webView.getParent() instanceof ViewGroup) {
                          ((ViewGroup) webView.getParent()).setFitsSystemWindows(false);
                          ((ViewGroup) webView.getParent()).setClipToPadding(false);
                      }

                      webView.removeJavascriptInterface("AndroidApp");
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidApp");

                      webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              if (request != null && request.isForMainFrame() && !isNetworkOnline()) {
                                  view.loadUrl("file:///android_asset/public/error.html");
                                  return;
                              }
                              super.onReceivedError(view, request, error);
                          }

                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              Uri uri = request.getUrl();
                              if (uri != null && "localmedia.music8481.app".equalsIgnoreCase(uri.getHost())) {
                                  try {
                                      String rawPath = uri.getPath();
                                      if (rawPath != null && rawPath.startsWith("/")) rawPath = rawPath.substring(1);

                                      if (rawPath != null && rawPath.startsWith("__art__/")) {
                                          String artFileName = URLDecoder.decode(rawPath.substring(8), "UTF-8");
                                          File mediaFile = findLocalMediaFile(artFileName);
                                          if (mediaFile != null && mediaFile.exists()) {
                                              MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                                              try {
                                                  mmr.setDataSource(mediaFile.getAbsolutePath());
                                                  byte[] artBytes = mmr.getEmbeddedPicture();
                                                  if (artBytes != null && artBytes.length > 0) {
                                                      Map<String, String> headers = new HashMap<>();
                                                      headers.put("Access-Control-Allow-Origin", "*");
                                                      headers.put("Cache-Control", "max-age=86400");
                                                      return new WebResourceResponse(
                                                              "image/jpeg",
                                                              "UTF-8",
                                                              200,
                                                              "OK",
                                                              headers,
                                                              new ByteArrayInputStream(artBytes)
                                                      );
                                                  }
                                              } finally {
                                                  try { mmr.release(); } catch (Exception ignored) {}
                                              }
                                          }
                                          return new WebResourceResponse("image/png", "UTF-8", 404, "Not Found", null, null);
                                      }

                                      String fileName = URLDecoder.decode(rawPath, "UTF-8");
                                      File file = findLocalMediaFile(fileName);

                                      if (file != null && file.exists()) {
                                          String lower = fileName.toLowerCase();
                                          String mime = "audio/mpeg";
                                          if (lower.endsWith(".mp4")) mime = "video/mp4";
                                          else if (lower.endsWith(".webm")) mime = "video/webm";
                                          else if (lower.endsWith(".m4a")) mime = "audio/mp4";
                                          else if (lower.endsWith(".wav")) mime = "audio/wav";
                                          else if (lower.endsWith(".lrc")) mime = "text/plain";

                                          long fileLen = file.length();
                                          String rangeHeader = request.getRequestHeaders() != null ? request.getRequestHeaders().get("Range") : null;

                                          Map<String, String> headers = new HashMap<>();
                                          headers.put("Access-Control-Allow-Origin", "*");
                                          headers.put("Accept-Ranges", "bytes");

                                          if (rangeHeader != null && rangeHeader.startsWith("bytes=")) {
                                              String[] parts = rangeHeader.substring(6).split("-");
                                              long start = Long.parseLong(parts[0]);
                                              long end = (parts.length > 1 && !parts[1].isEmpty()) ? Long.parseLong(parts[1]) : fileLen - 1;
                                              if (end >= fileLen) end = fileLen - 1;
                                              long contentLen = end - start + 1;

                                              headers.put("Content-Range", "bytes " + start + "-" + end + "/" + fileLen);
                                              headers.put("Content-Length", String.valueOf(contentLen));

                                              return new WebResourceResponse(
                                                      mime,
                                                      "UTF-8",
                                                      206,
                                                      "Partial Content",
                                                      headers,
                                                      new RangeFileInputStream(file, start, contentLen)
                                              );
                                          } else {
                                              headers.put("Content-Length", String.valueOf(fileLen));
                                              return new WebResourceResponse(
                                                      mime,
                                                      "UTF-8",
                                                      200,
                                                      "OK",
                                                      headers,
                                                      new FileInputStream(file)
                                              );
                                          }
                                      }
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              }
                              return super.shouldInterceptRequest(view, request);
                          }
                      });

                      // Open app normally when online; serve local offline download vault when offline
                      if (!initialRouteHandled) {
                          initialRouteHandled = true;
                          if (!isNetworkOnline()) {
                              webView.loadUrl("file:///android_asset/public/error.html");
                          }
                      }

                      webView.setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                              String fileName = pendingDownloadFilename;
                              pendingDownloadFilename = null;

                              if (fileName == null || fileName.trim().isEmpty()) {
                                  fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              }
                              final String cleanFileName = sanitizeFilename(fileName, mimeType);

                              if (url.startsWith("blob:") || url.startsWith("data:")) {
                                  String escapedUrl = url.replace("'", "\\'");
                                  String escapedName = cleanFileName.replace("'", "\\'");
                                  String escapedMime = (mimeType != null ? mimeType : "").replace("'", "\\'");
                                  webView.evaluateJavascript("window.__streamBlobToNative && window.__streamBlobToNative('" + escapedUrl + "', '" + escapedName + "', '" + escapedMime + "');", null);
                              } else {
                                  int id = notificationIdCounter.incrementAndGet();
                                  DownloadTask task = new DownloadTask(id, cleanFileName, mimeType, false);
                                  task.url = url;
                                  task.userAgent = userAgent;
                                  task.cookies = CookieManager.getInstance().getCookie(url);
                                  task.totalBytes = contentLength > 0 ? contentLength : -1;
                                  activeTasks.put(id, task);
                                  Toast.makeText(getApplicationContext(), "Downloading: " + cleanFileName, Toast.LENGTH_SHORT).show();
                                  task.startHttpDownload();
                              }
                          }
                      });
                      
                      webView.postDelayed(() -> {
                          String boostScript =
                              "(function() {" +
                              "  if (window.__music8481Injected) return;" +
                              "  window.__music8481Injected = true;" +
                              "  " +
                              "  var OrigAudio = window.Audio;" +
                              "  window.Audio = function(src) {" +
                              "    var a = new OrigAudio(src);" +
                              "    a.preload = 'auto';" +
                              "    return a;" +
                              "  };" +
                              "  window.Audio.prototype = OrigAudio.prototype;" +
                              "  " +
                              "  window.__streamBlobToNative = function(blobUrl, fileName, fallbackMime) {" +
                              "    fetch(blobUrl).then(function(r) { return r.blob(); }).then(function(blob) {" +
                              "      var mime = blob.type || fallbackMime || 'audio/mpeg';" +
                              "      var taskId = window.AndroidApp.initBlobDownload(fileName, mime, blob.size);" +
                              "      if (taskId < 0) return;" +
                              "      var chunkSize = 256 * 1024;" +
                              "      var offset = 0;" +
                              "      function pushNextChunk() {" +
                              "        if (offset >= blob.size) {" +
                              "          window.AndroidApp.finishBlobDownload(taskId);" +
                              "          return;" +
                              "        }" +
                              "        var slice = blob.slice(offset, offset + chunkSize);" +
                              "        var reader = new FileReader();" +
                              "        reader.onloadend = function() {" +
                              "          var b64 = reader.result;" +
                              "          function tryWrite() {" +
                              "            var status = window.AndroidApp.appendBlobChunk(taskId, b64);" +
                              "            if (status === 'OK') {" +
                              "              offset += chunkSize;" +
                              "              setTimeout(pushNextChunk, 15);" +
                              "            } else if (status === 'PAUSED') {" +
                              "              setTimeout(tryWrite, 400);" +
                              "            }" +
                              "          }" +
                              "          tryWrite();" +
                              "        };" +
                              "        reader.readAsDataURL(slice);" +
                              "      }" +
                              "      pushNextChunk();" +
                              "    });" +
                              "  };" +
                              "  " +
                              "  function handleAnchorDownload(a) {" +
                              "    if (!a || !a.href) return false;" +
                              "    var dlAttr = a.getAttribute('download');" +
                              "    var href = a.href;" +
                              "    var isBlobOrData = href.indexOf('blob:') === 0 || href.indexOf('data:') === 0;" +
                              "    var isMediaExt = /\\.(mp3|mp4|lrc|m4a|wav)(\\?|$)/i.test(href);" +
                              "    if (dlAttr !== null || isBlobOrData || isMediaExt) {" +
                              "      var name = dlAttr || a.title || (a.innerText ? a.innerText.trim() : '') || document.title || 'Music8481_Track';" +
                              "      if (window.AndroidApp) window.AndroidApp.setPendingFilename(name);" +
                              "      if (isBlobOrData && window.AndroidApp) {" +
                              "        window.__streamBlobToNative(href, name, '');" +
                              "        return true;" +
                              "      }" +
                              "    }" +
                              "    return false;" +
                              "  }" +
                              "  " +
                              "  document.addEventListener('click', function(e) {" +
                              "    var a = e.target.closest ? e.target.closest('a') : null;" +
                              "    if (a && handleAnchorDownload(a)) {" +
                              "      e.preventDefault();" +
                              "      e.stopPropagation();" +
                              "    }" +
                              "  }, true);" +
                              "  " +
                              "  var origClick = HTMLAnchorElement.prototype.click;" +
                              "  HTMLAnchorElement.prototype.click = function() {" +
                              "    if (handleAnchorDownload(this)) return;" +
                              "    return origClick.apply(this, arguments);" +
                              "  };" +
                              "  " +
                              "  setInterval(function() {" +
                              "    var meta = document.querySelector('meta[name=\"viewport\"]');" +
                              "    var content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';" +
                              "    if (meta && meta.content !== content) meta.content = content;" +
                              "    document.documentElement.style.padding = '0';" +
                              "    document.documentElement.style.margin = '0';" +
                              "    document.body.style.padding = '0';" +
                              "    document.body.style.margin = '0';" +
                              "    " +
                              "    var medias = document.querySelectorAll('audio, video');" +
                              "    for (var i = 0; i < medias.length; i++) {" +
                              "      if (medias[i].preload !== 'auto') medias[i].preload = 'auto';" +
                              "      medias[i].style.transform = 'translateZ(0)';" +
                              "    }" +
                              "    " +
                              "    var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "    if (window.AndroidApp) window.AndroidApp.setVideoMode(iframe !== null);" +
                              "  }, 500);" +
                              "})();";
                          webView.evaluateJavascript(boostScript, null);
                      }, 1000);

                      final WebChromeClient originalClient = webView.getWebChromeClient();
                      webView.setWebChromeClient(new WebChromeClient() {
                          private View mCustomView;
                          private WebChromeClient.CustomViewCallback mCustomViewCallback;

                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) { onHideCustomView(); return; }
                              mCustomView = view;
                              isVideoFullscreen = true;
                              mCustomViewCallback = callback;
                              
                              runOnUiThread(() -> updatePiPParams(true));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.hide(WindowInsetsCompat.Type.systemBars());
                              windowInsetsController.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                              mCustomView.setFitsSystemWindows(false);
                              ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                              mCustomView = null;
                              isVideoFullscreen = false;
                              
                              runOnUiThread(() -> updatePiPParams(isVideoModeActive));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);
                              
                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.show(WindowInsetsCompat.Type.systemBars());
                              
                              if (mCustomViewCallback != null) { mCustomViewCallback.onCustomViewHidden(); mCustomViewCallback = null; }
                          }
                          @Override
                          public void onPermissionRequest(android.webkit.PermissionRequest request) { if (originalClient != null) originalClient.onPermissionRequest(request); }
                          @Override
                          public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) { return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams); }
                          @Override
                          public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) { return originalClient != null && originalClient.onConsoleMessage(consoleMessage); }
                      });
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      if (isInPictureInPictureMode) {
                          String js = 
                              "var style = document.getElementById('pip-style-fix');" +
                              "if (!style) {" +
                              "  style = document.createElement('style');" +
                              "  style.id = 'pip-style-fix';" +
                              "  style.innerHTML = '" +
                              "    body.pip-active { background: #000 !important; overflow: hidden !important; } " +
                              "    body.pip-active .pip-ancestor { position: static !important; transform: none !important; contain: none !important; perspective: none !important; filter: none !important; backdrop-filter: none !important; clip-path: none !important; mask: none !important; overflow: visible !important; margin: 0 !important; padding: 0 !important; background: transparent !important; width: 100% !important; height: 100% !important; } " +
                              "    body.pip-active .pip-target-iframe { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; min-width: 100% !important; min-height: 100% !important; z-index: 2147483647 !important; background: #000 !important; border: none !important; margin: 0 !important; padding: 0 !important; display: block !important; opacity: 1 !important; visibility: visible !important; object-fit: cover !important; } " +
                              "    body.pip-active .pip-hide-sibling { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; } " +
                              "  ';" +
                              "  document.head.appendChild(style);" +
                              "}" +
                              "var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "if (!iframe) iframe = document.querySelector('iframe');" +
                              "if (iframe) {" +
                              "  iframe.classList.add('pip-target-iframe');" +
                              "  var el = iframe;" +
                              "  while (el && el !== document.body && el !== document.documentElement) {" +
                              "    if (el !== iframe) el.classList.add('pip-ancestor');" +
                              "    if (el.parentElement) {" +
                              "      var siblings = el.parentElement.children;" +
                              "      for (var i = 0; i < siblings.length; i++) {" +
                              "        var sib = siblings[i];" +
                              "        if (sib !== el && sib.tagName !== 'SCRIPT' && sib.tagName !== 'STYLE' && sib.tagName !== 'LINK') {" +
                              "          sib.classList.add('pip-hide-sibling');" +
                              "        }" +
                              "      }" +
                              "    }" +
                              "    el = el.parentElement;" +
                              "  }" +
                              "  document.body.classList.add('pip-active');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      } else {
                          String js = 
                              "document.body.classList.remove('pip-active');" +
                              "var elements = document.querySelectorAll('.pip-target-iframe, .pip-ancestor, .pip-hide-sibling');" +
                              "for (var i = 0; i < elements.length; i++) {" +
                              "  elements[i].classList.remove('pip-target-iframe', 'pip-ancestor', 'pip-hide-sibling');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      }
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      try { enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build()); } catch (Exception e) {}
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().onResume(); 
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm != null && networkCallback != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          cm.unregisterNetworkCallback(networkCallback);
                      }
                  } catch (Exception ignored) {}
                  syncScheduler.shutdownNow();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }
          }
