                              "  setInterval(function() {" +
                              "    var meta = document.querySelector('meta[name=\"viewport\"]');" +
                              "    var content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';" +
                              "    if (meta && meta.content !== content) meta.content = content;" +
                              "    document.documentElement.style.padding = '0';" +
                              "    document.documentElement.style.margin = '0';" +
                              "    document.body.style.padding = '0';" +
                              "    document.body.style.margin = '0';" +
                              "    " +
                              "    var medias = document.querySelectorAll('audio, video');" +
                              "    for (var i = 0; i < medias.length; i++) {" +
                              "      if (medias[i].preload !== 'auto') medias[i].preload = 'auto';" +
                              "      medias[i].style.transform = 'translateZ(0)';" +
                              "    }" +
                              "    " +
                              "    var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "    if (window.AndroidApp) window.AndroidApp.setVideoMode(iframe !== null);" +
                              "  }, 500);" +
                              "})();";
                          webView.evaluateJavascript(boostScript, null);
                      }, 1000);

                      final WebChromeClient originalClient = webView.getWebChromeClient();
                      webView.setWebChromeClient(new WebChromeClient() {
                          private View mCustomView;
                          private WebChromeClient.CustomViewCallback mCustomViewCallback;

                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) { onHideCustomView(); return; }
                              mCustomView = view;
                              isVideoFullscreen = true;
                              mCustomViewCallback = callback;
                              
                              runOnUiThread(() -> updatePiPParams(true));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.hide(WindowInsetsCompat.Type.systemBars());
                              windowInsetsController.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                              mCustomView.setFitsSystemWindows(false);
                              ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                              mCustomView = null;
                              isVideoFullscreen = false;
                              
                              runOnUiThread(() -> updatePiPParams(isVideoModeActive));
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);
                              
                              WindowInsetsControllerCompat windowInsetsController = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              windowInsetsController.show(WindowInsetsCompat.Type.systemBars());
                              
                              if (mCustomViewCallback != null) { mCustomViewCallback.onCustomViewHidden(); mCustomViewCallback = null; }
                          }
                          @Override
                          public void onPermissionRequest(android.webkit.PermissionRequest request) { if (originalClient != null) originalClient.onPermissionRequest(request); }
                          @Override
                          public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) { return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams); }
                          @Override
                          public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) { return originalClient != null && originalClient.onConsoleMessage(consoleMessage); }
                      });
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      if (isInPictureInPictureMode) {
                          String js = 
                              "var style = document.getElementById('pip-style-fix');" +
                              "if (!style) {" +
                              "  style = document.createElement('style');" +
                              "  style.id = 'pip-style-fix';" +
                              "  style.innerHTML = '" +
                              "    body.pip-active { background: #000 !important; overflow: hidden !important; } " +
                              "    body.pip-active .pip-ancestor { position: static !important; transform: none !important; contain: none !important; perspective: none !important; filter: none !important; backdrop-filter: none !important; clip-path: none !important; mask: none !important; overflow: visible !important; margin: 0 !important; padding: 0 !important; background: transparent !important; width: 100% !important; height: 100% !important; } " +
                              "    body.pip-active .pip-target-iframe { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; min-width: 100% !important; min-height: 100% !important; z-index: 2147483647 !important; background: #000 !important; border: none !important; margin: 0 !important; padding: 0 !important; display: block !important; opacity: 1 !important; visibility: visible !important; object-fit: cover !important; } " +
                              "    body.pip-active .pip-hide-sibling { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; } " +
                              "  ';" +
                              "  document.head.appendChild(style);" +
                              "}" +
                              "var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "if (!iframe) iframe = document.querySelector('iframe');" +
                              "if (iframe) {" +
                              "  iframe.classList.add('pip-target-iframe');" +
                              "  var el = iframe;" +
                              "  while (el && el !== document.body && el !== document.documentElement) {" +
                              "    if (el !== iframe) el.classList.add('pip-ancestor');" +
                              "    if (el.parentElement) {" +
                              "      var siblings = el.parentElement.children;" +
                              "      for (var i = 0; i < siblings.length; i++) {" +
                              "        var sib = siblings[i];" +
                              "        if (sib !== el && sib.tagName !== 'SCRIPT' && sib.tagName !== 'STYLE' && sib.tagName !== 'LINK') {" +
                              "          sib.classList.add('pip-hide-sibling');" +
                              "        }" +
                              "      }" +
                              "    }" +
                              "    el = el.parentElement;" +
                              "  }" +
                              "  document.body.classList.add('pip-active');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      } else {
                          String js = 
                              "document.body.classList.remove('pip-active');" +
                              "var elements = document.querySelectorAll('.pip-target-iframe, .pip-ancestor, .pip-hide-sibling');" +
                              "for (var i = 0; i < elements.length; i++) {" +
                              "  elements[i].classList.remove('pip-target-iframe', 'pip-ancestor', 'pip-hide-sibling');" +
                              "}";
                          webView.evaluateJavascript(js, null);
                      }
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      try { enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build()); } catch (Exception e) {}
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().onResume(); 
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }
          }
