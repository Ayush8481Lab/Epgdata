                              onClick={() => playTrack(track, true)}
                              className={`group relative flex items-center justify-between p-3 rounded-2xl border backdrop-blur-md transition-all cursor-pointer overflow-hidden ${
                                isCurrent
                                  ? "bg-gradient-to-r from-emerald-500/25 via-teal-500/15 to-fuchsia-500/15 border-emerald-400/60 shadow-[0_10px_30px_-8px_rgba(16,185,129,0.55)]"
                                  : "bg-white/[0.045] border-white/10 hover:bg-white/[0.08] hover:border-white/20 hover:scale-[1.005]"
                              }`}
                            >
                              {isCurrent && (
                                <div className="absolute inset-0 -z-0 opacity-60 pointer-events-none" style={{ background: `radial-gradient(120% 80% at 0% 50%, ${palette.glow}, transparent 60%)` }} />
                              )}
                              <div className="relative flex items-center gap-3.5 min-w-0 flex-1 z-10">
                                <div className="relative w-14 h-14 flex-shrink-0">
