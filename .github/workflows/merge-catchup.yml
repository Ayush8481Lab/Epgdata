                                    <span className="font-mono">{formatBytes(track.size)}</span>
                                    <span className="opacity-50">•</span>
                                    <span className="uppercase font-bold text-zinc-300">{track.ext}</span>
                                    {track.hasLyrics && (
                                      <span className="px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 rounded font-extrabold">
                                        LRC
                                      </span>
                                    )}
                                    {track.isVideo && (
                                      <span className="px-1.5 py-0.5 bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-400/40 rounded font-extrabold">
                                        VIDEO
                                      </span>
                                    )}
                                  </div>
                                </div>
                              </div>
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  if (!confirm(`Delete "${track.title || track.baseName}"?`)) return;
                                  if (window.AndroidApp?.deleteDownloadedFile) {
                                    if (window.AndroidApp.deleteDownloadedFile(track.name)) {
                                      if (currentTrack?.name === track.name) {
                                        mediaEl()?.pause();
                                        setCurrentTrack(null);
                                        setIsPlaying(false);
                                        setIsExpanded(false);
                                      }
                                      loadFiles();
                                    }
                                  }
                                }}
                                className="relative z-10 p-2 rounded-xl text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10 transition ml-2"
