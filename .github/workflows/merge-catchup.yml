                    <main className="flex-1 px-4 pt-4 space-y-2.5 z-10">
                      {filteredTracks.length === 0 ? (
                        <div className="flex flex-col items-center justify-center text-center py-16 px-4 rounded-3xl bg-white/[0.03] border border-white/10 mt-2">
                          <Music size={40} className="text-emerald-400 mb-4" />
                          <h2 className="text-base font-bold">No Tracks Found</h2>
                          <p className="text-xs text-zinc-400 max-w-xs mt-1">Nothing matches your search or filter.</p>
