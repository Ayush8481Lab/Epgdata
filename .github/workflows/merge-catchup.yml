name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor, React, Lucide & Offline Bundler Tools
        run: |
          npm init -y
          npm install @capacitor/core react@18 react-dom@18 lucide-react
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets esbuild @babel/standalone tailwindcss@3 postcss autoprefixer

      - name: Build Standalone Offline React UI & Dynamic TSX Hot-Swap Engine
        run: |
          mkdir -p www src

          # 1. Save initial fallback TSX from down.txt (or embedded fallback)
          cat <<'EOF' > src/OfflinePlayer.tsx
          "use client";

          import React, { useEffect, useState, useRef, useMemo, useCallback } from "react";
          import { Loader2, Timer, Settings2, Check, X, Sparkles, Type, ListMusic, Trash2, Music, Search, RefreshCw } from "lucide-react";

          /* ===================== TYPES ===================== */
          interface DownloadedTrack {
            name: string;
            baseName: string;
            title?: string;
            artist?: string;
            album?: string;
            artUrl?: string;
            hasArt?: boolean;
            ext: string;
            size: number;
            lastModified: number;
            isVideo: boolean;
            url: string;
            hasLyrics: boolean;
            lrcName: string;
            lrcContent: string;
          }
          interface LyricLine { time: number; text: string; }

          declare global {
            interface Window {
              AndroidApp?: {
                getDownloadedFiles: () => string;
                deleteDownloadedFile: (fileName: string) => boolean;
                setVideoMode?: (isVideo: boolean) => void;
                getCachedDownTsx?: () => string;
                getCachedDownHash?: () => string;
                forceSyncDownTxt?: () => void;
              };
            }
          }

          /* ===================== SVG ICON SET ===================== */
          type IcProps = { size?: number; className?: string };
          const Svg = ({ size = 24, className, children, stroke = false, sw = 1.9 }: IcProps & { children: React.ReactNode; stroke?: boolean; sw?: number }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={stroke ? "none" : "currentColor"} stroke={stroke ? "currentColor" : "none"} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
              {children}
            </svg>
          );
          const IcPlay = (p: IcProps) => <Svg {...p}><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.2-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z" /></Svg>;
          const IcPause = (p: IcProps) => <Svg {...p}><rect x="5.8" y="4.5" width="4.4" height="15" rx="1.7" /><rect x="13.8" y="4.5" width="4.4" height="15" rx="1.7" /></Svg>;
          const IcNext = (p: IcProps) => <Svg {...p}><path d="M5 6.1v11.8a1 1 0 0 0 1.5.86l8.9-5.9a1 1 0 0 0 0-1.72l-8.9-5.9A1 1 0 0 0 5 6.1z" /><rect x="17.2" y="5" width="2.8" height="14" rx="1.4" /></Svg>;
          const IcPrev = (p: IcProps) => <Svg {...p}><g transform="translate(24 0) scale(-1 1)"><path d="M5 6.1v11.8a1 1 0 0 0 1.5.86l8.9-5.9a1 1 0 0 0 0-1.72l-8.9-5.9A1 1 0 0 0 5 6.1z" /><rect x="17.2" y="5" width="2.8" height="14" rx="1.4" /></g></Svg>;
          const IcShuffle = (p: IcProps) => <Svg {...p} stroke><path d="M3 7h3.2c1.6 0 3 .8 3.9 2.1l3.8 5.8c.9 1.3 2.3 2.1 3.9 2.1H21" /><path d="M3 17h3.2c1.2 0 2.3-.5 3.1-1.3" /><path d="M13.2 8.4c.8-.8 1.9-1.2 3-1.2H21" /><path d="M18.5 4.5 21 7l-2.5 2.5" /><path d="M18.5 14.5 21 17l-2.5 2.5" /></Svg>;
          const IcRepeat = (p: IcProps) => <Svg {...p} stroke><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20" /><path d="m17 3 3 3-3 3" /><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4" /><path d="m7 21-3-3 3-3" /></Svg>;
          const IcQueue = (p: IcProps) => <Svg {...p} stroke><path d="M4 6h12" /><path d="M4 11h12" /><path d="M4 16h6" /><path d="M15.5 14.2v5.6l4.8-2.8z" fill="currentColor" /></Svg>;
          const IcChevronDown = (p: IcProps) => <Svg {...p} stroke sw={2.2}><path d="m6 9.5 6 6 6-6" /></Svg>;
          const IcMore = (p: IcProps) => <Svg {...p}><circle cx="5.5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="18.5" cy="12" r="1.9" /></Svg>;
          const IcExpand = (p: IcProps) => <Svg {...p} stroke sw={2}><path d="M14 4h6v6" /><path d="M10 20H4v-6" /><path d="m20 4-7 7" /><path d="m4 20 7-7" /></Svg>;
          const IcScreen = (p: IcProps) => <Svg {...p} stroke><rect x="3" y="4.5" width="18" height="12.5" rx="3.2" /><path d="M10 8.4v5l4.1-2.5z" fill="currentColor" /><path d="M8.5 20.5h7" /></Svg>;

          const EqBars = React.memo(({ playing, color }: { playing: boolean; color: string }) => (
            <div className="flex items-end gap-[3px] h-[16px] w-[18px]" aria-hidden="true">
              {[0, 0.25, 0.5].map((d, i) => (
                <span key={i} className="eq-bar w-[3px] h-full rounded-full origin-bottom" style={{ backgroundColor: color, animationDelay: `${d}s`, animationPlayState: playing ? 'running' : 'paused' }} />
              ))}
            </div>
          ));
          EqBars.displayName = 'EqBars';

          /* ===================== MARQUEE ===================== */
          const MarqueeText = React.memo(({ text, className = "" }: { text: string; className?: string }) => {
            const containerRef = useRef<HTMLDivElement>(null);
            const textRef = useRef<HTMLSpanElement>(null);
            const [dist, setDist] = useState(0);
            useEffect(() => {
              const measure = () => {
                const c = containerRef.current, t = textRef.current;
                if (!c || !t) return;
                const d = t.scrollWidth - c.clientWidth;
                setDist(d > 4 ? Math.ceil(d) : 0);
              };
              measure();
              let ro: ResizeObserver | undefined;
              if (typeof ResizeObserver !== "undefined") {
                ro = new ResizeObserver(measure);
                if (containerRef.current) ro.observe(containerRef.current);
                if (textRef.current) ro.observe(textRef.current);
              } else window.addEventListener('resize', measure);
              return () => { ro?.disconnect(); window.removeEventListener('resize', measure); };
            }, [text]);
            return (
              <div ref={containerRef} className={`overflow-hidden whitespace-nowrap w-full block ${dist ? "mask-edges" : ""} ${className}`}>
                <span ref={textRef} className={`inline-block whitespace-nowrap ${dist ? "marquee-pp" : ""}`}
                  style={dist ? ({ ['--d' as any]: `-${dist}px`, ['--t' as any]: `${Math.max(5, dist / 16 + 3.5)}s` } as React.CSSProperties) : undefined}>
                  {text}
                </span>
              </div>
            );
          });
          MarqueeText.displayName = 'MarqueeText';

          /* ===================== PALETTE ===================== */
          type Palette = {
            name: string; base: string; deep: string; accent: string; light: string; glow: string;
            active: string; upcoming: string; past: string;
            cards: { lyrics: [string, string]; queue: [string, string]; about: [string, string]; stats: [string, string]; };
          };
          const hs = (h: number, s: number, l: number, a?: number) =>
            a === undefined ? `hsl(${Math.round(((h % 360) + 360) % 360)}, ${s}%, ${l}%)`
                            : `hsla(${Math.round(((h % 360) + 360) % 360)}, ${s}%, ${l}%, ${a})`;
          const buildPalette = (hue: number, name = "Palette"): Palette => ({
            name,
            base: hs(hue, 45, 24),
            deep: hs(hue, 45, 12),
            accent: hs(hue, 72, 62),
            light: hs(hue, 78, 90),
            glow: hs(hue, 70, 50, 0.45),
            active: hs(hue, 55, 97),
            past: hs(hue, 35, 90, 0.38),
            upcoming: hs(hue + 30, 85, 78),
            cards: {
              lyrics: [hs(hue, 45, 24), hs(hue, 45, 12)],
              queue:  [hs(hue, 45, 18), hs(hue, 40, 6)],
              about:  [hs(hue + 20, 40, 20), hs(hue + 20, 35, 10)],
              stats:  [hs(hue - 20, 42, 32), hs(hue - 20, 38, 18)],
            },
          });
          const DEFAULT_PALETTE = buildPalette(160, "Default");
          const hueFromName = (name: string) => {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return Math.abs(hash) % 360;
          };
          const extractHueFromImage = (src: string): Promise<number> => new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              try {
                const c = document.createElement("canvas"); c.width = 32; c.height = 32;
                const ctx = c.getContext("2d", { willReadFrequently: true });
                if (!ctx) return resolve(0);
                ctx.drawImage(img, 0, 0, 32, 32);
                const d = ctx.getImageData(0, 0, 32, 32).data;
                let r = 0, g = 0, b = 0, n = 0;
                for (let i = 0; i < d.length; i += 16) {
                  if (d[i + 3] < 128) continue;
                  r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
                }
                if (!n) return resolve(0);
                r /= n * 255; g /= n * 255; b /= n * 255;
                const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
                let h = 0;
                if (mx !== mn) {
                  const df = mx - mn;
                  if (mx === r) h = ((g - b) / df + (g < b ? 6 : 0)) / 6;
                  else if (mx === g) h = ((b - r) / df + 2) / 6;
                  else h = ((r - g) / df + 4) / 6;
                }
                resolve(Math.round(h * 360));
              } catch { resolve(0); }
            };
            img.onerror = () => resolve(0);
            img.src = src;
          });

          /* ===================== HELPERS ===================== */
          function parseLrc(lrcText: string): LyricLine[] {
            if (!lrcText) return [];
            const lines = lrcText.split(/\r?\n/);
            const result: LyricLine[] = [];
            const timeRegex = /\[(\d{1,3}):(\d{2})(?:\.(\d{1,3}))?\]/g;
            for (const line of lines) {
              const matches = [...line.matchAll(timeRegex)];
              if (matches.length > 0) {
                const text = line.replace(timeRegex, "").trim();
                for (const match of matches) {
                  const min = parseInt(match[1], 10);
                  const sec = parseInt(match[2], 10);
                  const msStr = match[3] || "0";
                  const ms = msStr.length === 1 ? parseInt(msStr, 10) * 100 : msStr.length === 2 ? parseInt(msStr, 10) * 10 : parseInt(msStr, 10);
                  if (text) result.push({ time: min * 60 + sec + ms / 1000, text });
                }
              }
            }
            return result.sort((a, b) => a.time - b.time);
          }
          const formatTime = (time: number) => {
            if (!time || isNaN(time) || time < 0) return "0:00";
            const m = Math.floor(time / 60), s = Math.floor(time % 60);
            return `${m}:${s < 10 ? "0" : ""}${s}`;
          };
          const formatBytes = (bytes: number) => {
            if (!bytes || bytes <= 0) return "0 B";
            const mb = bytes / (1024 * 1024);
            return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
          };
          const findActiveIdx = (lines: LyricLine[], t: number) => {
            let lo = 0, hi = lines.length - 1, ans = -1;
            while (lo <= hi) {
              const m = (lo + hi) >> 1;
              if (lines[m].time <= t) { ans = m; lo = m + 1; } else hi = m - 1;
            }
            return ans;
          };
          const customSmoothScroll = (container: HTMLElement, targetPos: number, duration: number) => {
            if ((container as any)._raf) cancelAnimationFrame((container as any)._raf);
            const startPos = container.scrollTop;
            const distance = targetPos - startPos;
            let startTime: number | null = null;
            const ease = (t: number) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const step = (now: number) => {
              if (startTime === null) startTime = now;
              const el = now - startTime, p = Math.min(el / duration, 1);
              container.scrollTop = startPos + distance * ease(p);
              if (el < duration) (container as any)._raf = requestAnimationFrame(step);
            };
            (container as any)._raf = requestAnimationFrame(step);
          };

          /* ===================== WORD SYNC ===================== */
          type WordGroup = { els: HTMLElement[]; s: number[]; e: number[] };
          const buildWordGroup = (container: HTMLElement | null, enabled: boolean): WordGroup | null => {
            if (!container || !enabled) return null;
            const els = Array.from(container.querySelectorAll('.lyric-word-sync')) as HTMLElement[];
            if (!els.length) return null;
            let total = 0;
            const lens = els.map(w => { const l = (w.textContent || '').length; total += l; return l; });
            if (!total) return null;
            const s: number[] = [], e: number[] = [];
            let acc = 0;
            lens.forEach(l => { s.push((acc / total) * 100); acc += l; e.push((acc / total) * 100); });
            els.forEach(w => { (w as any)._p = undefined; });
            return { els, s, e };
          };

          /* ===================== SMALL UI PRIMITIVES ===================== */
          const Toggle = React.memo(({ on, onClick, accent }: { on: boolean; onClick: () => void; accent: string }) => (
            <button role="switch" aria-checked={on} onClick={onClick} className="w-[48px] h-[29px] rounded-full relative transition-colors duration-300 flex-shrink-0" style={{ background: on ? accent : 'rgba(255,255,255,0.16)' }}>
              <span className="absolute top-[3px] left-0 w-[23px] h-[23px] bg-white rounded-full shadow-md transition-transform duration-300" style={{ transform: `translateX(${on ? 22 : 3}px)` }} />
            </button>
          ));
          Toggle.displayName = 'Toggle';
          const Segmented = React.memo(({ options, value, onChange, accent }: { options: { v: string; label: string }[]; value: string; onChange: (v: string) => void; accent: string }) => (
            <div className="flex p-1 rounded-2xl bg-black/30 border border-white/[0.06] gap-1">
              {options.map(o => (
                <button key={o.v} onClick={() => onChange(o.v)} className={`flex-1 py-2.5 rounded-xl text-[13px] font-bold transition-all duration-200 ${value === o.v ? 'text-black shadow-lg' : 'text-white/65 active:bg-white/10'}`} style={value === o.v ? { background: accent } : undefined}>{o.label}</button>
              ))}
            </div>
          ));
          Segmented.displayName = 'Segmented';
          const SettingRow = React.memo(({ icon, title, sub, accent, right, last = false }: { icon: React.ReactNode; title: string; sub?: string; accent: string; right: React.ReactNode; last?: boolean }) => (
            <div className={`flex items-center justify-between gap-3 px-4 py-3.5 ${last ? '' : 'border-b border-white/[0.06]'}`}>
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: `${accent}26`, color: accent }}>{icon}</div>
                <div className="flex flex-col min-w-0">
                  <span className="text-white font-bold text-[15px] leading-tight">{title}</span>
                  {sub && <span className="text-white/45 text-[11.5px] font-medium mt-0.5 leading-snug">{sub}</span>}
                </div>
              </div>
              {right}
            </div>
          ));
          SettingRow.displayName = 'SettingRow';
          const StatTile = React.memo(({ icon, label, value, accent, capitalize = false }: { icon: React.ReactNode; label: string; value: string; accent: string; capitalize?: boolean }) => (
            <div className="flex items-center gap-3 p-3 rounded-2xl bg-white/[0.06] border border-white/[0.07]">
              <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{ backgroundColor: `${accent}22`, color: accent }}>{icon}</div>
              <div className="flex flex-col min-w-0">
                <span className="text-white/45 text-[11px] font-semibold tracking-wide">{label}</span>
                <span className={`text-white font-extrabold text-[15px] tracking-tight truncate ${capitalize ? 'capitalize' : ''}`}>{value}</span>
              </div>
            </div>
          ));
          StatTile.displayName = 'StatTile';
          const SIZE_OPTIONS = [{ v: 'Small', label: 'S' }, { v: 'Medium', label: 'M' }, { v: 'Large', label: 'L' }];

          /* ===================== MAIN ===================== */
          export default function OfflinePlayer() {
            const [tracks, setTracks] = useState<DownloadedTrack[]>([]);
            const [isNativeApk, setIsNativeApk] = useState(false);
            const [artErrors, setArtErrors] = useState<Record<string, boolean>>({});

            const [currentTrack, setCurrentTrack] = useState<DownloadedTrack | null>(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [buffered, setBuffered] = useState(0);
            const [progress, setProgress] = useState(0);
            const [isBuffering, setIsBuffering] = useState(false);
            const [isShuffle, setIsShuffle] = useState(false);
            const [repeatMode, setRepeatMode] = useState(0);

            const [isExpanded, setIsExpanded] = useState(false);
            const [showQueue, setShowQueue] = useState(false);
            const [showSettingsMenu, setShowSettingsMenu] = useState(false);
            const [showTimerMenu, setShowTimerMenu] = useState(false);
            const [isLyricsFullScreen, setIsLyricsFullScreen] = useState(false);
            const [isUiHidden, setIsUiHidden] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [filterType, setFilterType] = useState<"all" | "audio" | "video" | "lrc">("all");

            const [isLyricsEnabled, setIsLyricsEnabled] = useState(true);
            const [isWordSyncEnabled, setIsWordSyncEnabled] = useState(true);
            const [isMiniWordSyncEnabled, setIsMiniWordSyncEnabled] = useState(true);
            const [lineFontSize, setLineFontSize] = useState("Medium");
            const [cardFontSize, setCardFontSize] = useState("Medium");

            const [sleepTimer, setSleepTimer] = useState<number | 'end' | null>(null);
            const [timerRemaining, setTimerRemaining] = useState<number | null>(null);

            const [palette, setPalette] = useState<Palette>(DEFAULT_PALETTE);

            const audioRef = useRef<HTMLAudioElement>(null);
            const videoRef = useRef<HTMLVideoElement>(null);
            const lyricsContainerRef = useRef<HTMLDivElement>(null);
            const fullLyricsContainerRef = useRef<HTMLDivElement>(null);
            const activeLyricRef = useRef<HTMLParagraphElement>(null);
            const fullActiveLyricRef = useRef<HTMLParagraphElement>(null);
            const miniActiveLyricRef = useRef<HTMLDivElement>(null);
            const queueContainerRef = useRef<HTMLDivElement>(null);
            const isSeekingRef = useRef(false);

            const parsedLyrics = useMemo(() => currentTrack?.hasLyrics ? parseLrc(currentTrack.lrcContent) : [], [currentTrack]);
            const [activeLyricIndex, setActiveLyricIndex] = useState(-1);
            const isVideo = !!currentTrack?.isVideo;

            const filteredTracks = useMemo(() => tracks.filter(t => {
              const title = (t.title || t.baseName).toLowerCase();
              const artist = (t.artist || "").toLowerCase();
              const q = searchQuery.toLowerCase();
              if (!title.includes(q) && !artist.includes(q)) return false;
              if (filterType === "audio") return !t.isVideo;
              if (filterType === "video") return t.isVideo;
              if (filterType === "lrc") return t.hasLyrics;
              return true;
            }), [tracks, searchQuery, filterType]);

            const loadFiles = useCallback(() => {
              if (typeof window !== "undefined" && window.AndroidApp?.getDownloadedFiles) {
                setIsNativeApk(true);
                try {
                  const raw = window.AndroidApp.getDownloadedFiles();
                  const parsed: DownloadedTrack[] = JSON.parse(raw || "[]");
                  setTracks(parsed);
                  try { localStorage.setItem("music8481_cached_downloads", raw); } catch {}
                } catch (e) { console.error("Native load failed", e); }
              } else if (typeof window !== "undefined") {
                try {
                  const cached = localStorage.getItem("music8481_cached_downloads");
                  if (cached) setTracks(JSON.parse(cached));
                } catch {}
              }
            }, []);

            useEffect(() => {
              loadFiles();
              const id = setInterval(loadFiles, 4000);
              const w = localStorage.getItem("off_word_sync"); if (w !== null) setIsWordSyncEnabled(w === 'true');
              const mw = localStorage.getItem("off_mini_word_sync"); if (mw !== null) setIsMiniWordSyncEnabled(mw === 'true');
              const ly = localStorage.getItem("off_lyrics_enabled"); if (ly !== null) setIsLyricsEnabled(ly === 'true');
              const lf = localStorage.getItem("off_line_fs"); if (lf) setLineFontSize(lf);
              const cf = localStorage.getItem("off_card_fs"); if (cf) setCardFontSize(cf);
              return () => clearInterval(id);
            }, [loadFiles]);

            useEffect(() => {
              let id: any;
              if (typeof sleepTimer === 'number' && sleepTimer > 0) {
                setTimerRemaining(sleepTimer * 60);
                id = setInterval(() => setTimerRemaining(prev => {
                  if (prev !== null && prev <= 1) { setIsPlaying(false); setSleepTimer(null); mediaEl()?.pause(); return null; }
                  return prev ? prev - 1 : null;
                }), 1000);
              } else setTimerRemaining(null);
              return () => clearInterval(id);
            }, [sleepTimer]);

            useEffect(() => {
              if (!currentTrack) { setPalette(DEFAULT_PALETTE); return; }
              let cancelled = false;
              if (currentTrack.hasArt && currentTrack.artUrl && !artErrors[currentTrack.name]) {
                extractHueFromImage(currentTrack.artUrl).then(hue => {
                  if (cancelled) return;
                  setPalette(buildPalette(hue, currentTrack.baseName));
                });
              } else {
                setPalette(buildPalette(hueFromName(currentTrack.name), currentTrack.baseName));
              }
              return () => { cancelled = true; };
            }, [currentTrack, artErrors]);

            const mediaEl = (): HTMLMediaElement | null => isVideo ? videoRef.current : audioRef.current;
            const durationSafe = duration > 0 ? duration : 0;

            useEffect(() => {
              if (!isLyricsEnabled || parsedLyrics.length === 0 || !isExpanded) return;
              let raf = 0;
              const tick = () => {
                const el = mediaEl();
                if (el && !isSeekingRef.current) {
                  const idx = findActiveIdx(parsedLyrics, el.currentTime + 0.3);
                  if (idx !== activeLyricIndex) setActiveLyricIndex(idx);
                }
                raf = requestAnimationFrame(tick);
              };
              raf = requestAnimationFrame(tick);
              return () => cancelAnimationFrame(raf);
            }, [parsedLyrics, isLyricsEnabled, isExpanded, isPlaying, activeLyricIndex]);

            useEffect(() => {
              if ((!isWordSyncEnabled && !isMiniWordSyncEnabled) || !isLyricsEnabled || activeLyricIndex < 0 || !parsedLyrics[activeLyricIndex] || !isExpanded) return;
              const groups = [
                buildWordGroup(fullActiveLyricRef.current, isWordSyncEnabled),
                buildWordGroup(activeLyricRef.current, isWordSyncEnabled),
                buildWordGroup(miniActiveLyricRef.current, isMiniWordSyncEnabled),
              ].filter(Boolean) as WordGroup[];
              if (!groups.length) return;
              const lt = parsedLyrics[activeLyricIndex].time;
              const nt = parsedLyrics[activeLyricIndex + 1]?.time ?? lt + 4;
              const span = Math.max(0.01, nt - lt);
              let raf = 0;
              const apply = () => {
                const el = mediaEl();
                if (!el) return;
                const raw = ((el.currentTime + 0.3 - lt) / span) * 100;
                const prog = Math.max(0, Math.min(100, raw));
                for (let g = 0; g < groups.length; g++) {
                  const { els, s, e } = groups[g];
                  for (let i = 0; i < els.length; i++) {
                    const node: any = els[i];
                    let v: number;
                    if (prog >= e[i]) v = 120;
                    else if (prog <= s[i]) v = -15;
                    else v = ((prog - s[i]) / Math.max(0.0001, e[i] - s[i])) * 120;
                    if (v === 120 || v === -15) { if (node._p !== v) { node._p = v; node.style.setProperty('--p', `${v}%`); } }
                    else if (node._p === undefined || Math.abs(node._p - v) > 1.0) { node._p = v; node.style.setProperty('--p', `${v.toFixed(1)}%`); }
                  }
                }
              };
              if (isPlaying) {
                const loop = () => { apply(); raf = requestAnimationFrame(loop); };
                raf = requestAnimationFrame(loop);
              } else apply();
              return () => { if (raf) cancelAnimationFrame(raf); };
            }, [isWordSyncEnabled, isMiniWordSyncEnabled, isLyricsEnabled, activeLyricIndex, parsedLyrics, isPlaying, isExpanded, isLyricsFullScreen]);

            useEffect(() => {
              if (isSeekingRef.current || !isExpanded) return;
              if (activeLyricRef.current && lyricsContainerRef.current)
                customSmoothScroll(lyricsContainerRef.current, activeLyricRef.current.offsetTop - lyricsContainerRef.current.offsetTop - 20, 800);
              if (fullActiveLyricRef.current && fullLyricsContainerRef.current)
                customSmoothScroll(fullLyricsContainerRef.current, fullActiveLyricRef.current.offsetTop - fullLyricsContainerRef.current.offsetTop - fullLyricsContainerRef.current.clientHeight / 2 + 60, 800);
            }, [activeLyricIndex, isLyricsFullScreen, isExpanded]);

            const playTrack = useCallback((track: DownloadedTrack, openExpanded = true) => {
              setCurrentTrack(track);
              setCurrentTime(0);
              setDuration(0);
              setProgress(0);
              setBuffered(0);
              setActiveLyricIndex(-1);
              setIsPlaying(true);
              if (openExpanded) setIsExpanded(true);
              if (window.AndroidApp?.setVideoMode) window.AndroidApp.setVideoMode(track.isVideo);
              setTimeout(() => {
                const el = track.isVideo ? videoRef.current : audioRef.current;
                const other = track.isVideo ? audioRef.current : videoRef.current;
                if (other) { other.pause(); other.removeAttribute("src"); }
                if (el) {
                  el.src = track.url;
                  el.load();
                  el.play().catch(() => setIsPlaying(false));
                }
              }, 40);
            }, []);

            const togglePlayPause = (e?: React.MouseEvent) => {
              if (e) e.stopPropagation();
              if (!currentTrack) { if (filteredTracks.length) playTrack(filteredTracks[0]); return; }
              const el = mediaEl();
              if (!el) return;
              if (el.paused) { el.play(); setIsPlaying(true); }
              else { el.pause(); setIsPlaying(false); }
            };

            const playNext = (e?: React.MouseEvent) => {
              if (e) e.stopPropagation();
              if (!currentTrack || filteredTracks.length === 0) return;
              if (repeatMode === 2) {
                const el = mediaEl(); if (el) { el.currentTime = 0; el.play(); }
                return;
              }
              if (isShuffle) {
                const i = Math.floor(Math.random() * filteredTracks.length);
                return playTrack(filteredTracks[i]);
              }
              const idx = filteredTracks.findIndex(t => t.name === currentTrack.name);
              const next = (idx + 1) % filteredTracks.length;
              playTrack(filteredTracks[next]);
            };

            const playPrev = (e?: React.MouseEvent) => {
              if (e) e.stopPropagation();
              if (!currentTrack || filteredTracks.length === 0) return;
              const el = mediaEl();
              if (el && el.currentTime > 3) { el.currentTime = 0; return; }
              const idx = filteredTracks.findIndex(t => t.name === currentTrack.name);
              playTrack(filteredTracks[(idx - 1 + filteredTracks.length) % filteredTracks.length]);
            };

            const handleSeekStart = () => { isSeekingRef.current = true; };
            const handleSeekChange = (e: React.ChangeEvent<HTMLInputElement>) => {
              const val = parseFloat(e.target.value);
              setProgress(val);
              const t = (val / 100) * durationSafe;
              setCurrentTime(t);
              if (parsedLyrics.length) setActiveLyricIndex(findActiveIdx(parsedLyrics, t + 0.3));
            };
            const handleSeekEnd = (e: React.SyntheticEvent<HTMLInputElement>) => {
              isSeekingRef.current = false;
              const val = parseFloat(e.currentTarget.value);
              const t = (val / 100) * durationSafe;
              const el = mediaEl();
              if (el) el.currentTime = t;
            };

            const renderArt = (track: DownloadedTrack, sizeClass = "w-full h-full", rounded = "rounded-lg") => {
              const showArt = track.hasArt && track.artUrl && !artErrors[track.name];
              const gradHue = hueFromName(track.name);
              return (
                <div className={`${sizeClass} ${rounded} relative overflow-hidden bg-[#282828] flex items-center justify-center`} style={!showArt ? { background: `linear-gradient(135deg, ${hs(gradHue, 40, 32)}, ${hs(gradHue + 30, 40, 18)})` } : undefined}>
                  {showArt ? (
                    <img src={track.artUrl} alt={track.title || track.baseName} draggable={false}
                      className="w-full h-full object-cover no-select pointer-events-none"
                      onError={() => setArtErrors(p => ({ ...p, [track.name]: true }))} />
                  ) : (
                    <Music size={sizeClass.includes("w-1") ? 20 : 40} className="text-white/70" />
                  )}
                </div>
              );
            };

            const getCardFontSizeClass = (isFS: boolean) => {
              const s = cardFontSize;
              if (isFS) return s === "Small" ? "text-[28px]" : s === "Large" ? "text-[40px]" : "text-[34px]";
              return s === "Small" ? "text-[20px]" : s === "Large" ? "text-[30px]" : "text-[24px]";
            };
            const getLineFontSize = () => lineFontSize === "Small" ? "text-[14px]" : lineFontSize === "Large" ? "text-[20px]" : "text-[16px]";
            const wordVars = { ['--lw-on' as any]: palette.active, ['--lw-off' as any]: palette.past } as React.CSSProperties;

            const RenderedLyrics = useMemo(() => {
              if (!isLyricsEnabled) return null;
              return parsedLyrics.map((line, idx) => {
                const isActive = idx === activeLyricIndex;
                const isPast = idx < activeLyricIndex;
                const fz = getCardFontSizeClass(isLyricsFullScreen);
                const stateClass = isActive ? "font-black leading-tight" : isPast ? "font-bold leading-tight -translate-y-2" : "font-extrabold leading-tight translate-y-3";
                const stateStyle: React.CSSProperties = isActive
                  ? { color: palette.active, opacity: 1, textShadow: `0 0 28px ${palette.glow}, 0 2px 18px rgba(0,0,0,0.35)`, ...wordVars }
                  : isPast ? { color: palette.past, opacity: 1 } : { color: palette.upcoming, opacity: 0.85, textShadow: '0 1px 10px rgba(0,0,0,0.25)' };
                return (
                  <p key={idx} ref={isActive ? (isLyricsFullScreen ? fullActiveLyricRef : activeLyricRef) : null}
                    onClick={() => { const el = mediaEl(); if (el) el.currentTime = line.time; }}
                    className={`cursor-pointer transition-all duration-[800ms] ease-out origin-left no-select-text transform ${fz} ${stateClass}`}
                    style={stateStyle}>
                    {isWordSyncEnabled ? line.text.split(' ').map((word, wIdx, arr) => (
                      <span key={wIdx} className={isActive ? "lyric-word-sync inline-block" : "inline-block"}>{word}{wIdx < arr.length - 1 ? '\u00A0' : ''}</span>
                    )) : line.text}
                  </p>
                );
              });
            }, [parsedLyrics, activeLyricIndex, isLyricsFullScreen, isLyricsEnabled, cardFontSize, isWordSyncEnabled, palette]);

            const RenderedMiniLyrics = useMemo(() => {
              if (!isLyricsEnabled || isLyricsFullScreen || parsedLyrics.length === 0) return null;
              return (
                <div className="relative w-full h-full flex justify-start items-center">
                  {parsedLyrics.map((line, idx) => {
                    const diff = idx - activeLyricIndex;
                    if (Math.abs(diff) > 1) return null;
                    let transform = '', op = 0;
                    if (diff === 0) { transform = 'translateY(0) scale(1)'; op = 1; }
                    else if (diff > 0) { transform = 'translateY(35px) scale(0.9)'; op = 0; }
                    else return null;
                    return (
                      <div key={idx} ref={diff === 0 ? miniActiveLyricRef : null}
                        className={`absolute left-0 w-full text-left pr-2 no-select-text font-extrabold drop-shadow-xl leading-snug transition-all duration-[1500ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${getLineFontSize()}`}
                        style={{ transform, opacity: op, color: palette.active, zIndex: diff === 0 ? 10 : 1, transformOrigin: 'left center', ...wordVars }}>
                        {isMiniWordSyncEnabled ? line.text.split(' ').map((w, i, a) => (
                          <span key={i} className="lyric-word-sync inline-block">{w}{i < a.length - 1 ? '\u00A0' : ''}</span>
                        )) : line.text}
                      </div>
                    );
                  })}
                </div>
              );
            }, [parsedLyrics, activeLyricIndex, isLyricsEnabled, isLyricsFullScreen, isMiniWordSyncEnabled, lineFontSize, palette]);

