          cat > $D/BootReceiver.java <<'EOF'
          package com.ayush.hostaradsguard;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  try {
                      if (!c.getSharedPreferences("s", 0).getBoolean("enabled", true)) return;
                      KeepAliveJob.ensure(c);
                      if (DnsVpnService.running) return;
                      KeepAliveJob.kick(c, 5000);   // backup route in case the direct start below is blocked
                      if (VpnService.prepare(c) != null) return;
                      Intent s = new Intent(c, DnsVpnService.class);
                      try {
                          if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s);
                          else c.startService(s);
                      } catch (Exception ignored) { }
                  } catch (Exception ignored) { }
              }
          }
