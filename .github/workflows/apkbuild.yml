      - name: Generate hashed blocklist
        env:
          BLOCK_DOMAINS_SECRET: ${{ secrets.BLOCK_DOMAINS }}
        run: |
          python3 - <<'PY'
          import os, sys, json, hashlib, secrets

          raw = (os.environ.get('BLOCK_DOMAINS_SECRET') or '').strip()
          source = 'secret'
          if not raw:
              raw = os.environ['BLOCK_DOMAINS_DEFAULT']
              source = 'workflow default'
          try:
              data = json.loads(raw)
          except Exception:
              print('ERROR: block list is not valid JSON (source: %s)' % source)
              sys.exit(1)
          if isinstance(data, dict):
              data = data.get('blockDomains', [])
          if not isinstance(data, list):
              print('ERROR: block list must be a JSON array of strings')
              sys.exit(1)

          SLD = {'co.in', 'net.in', 'org.in', 'gov.in', 'ac.in', 'co.uk', 'org.uk', 'ac.uk',
                 'gov.uk', 'com.au', 'net.au', 'org.au', 'co.jp', 'com.br', 'com.cn', 'com.mx',
                 'co.za', 'co.nz', 'com.sg', 'com.tr', 'co.kr', 'com.hk', 'com.tw'}

          exact, wide = set(), set()
          for item in data:
              h = str(item).strip().lower()
              wildcard = h.startswith('*.')
              if wildcard:
                  h = h[2:]
              h = h.rstrip('.')
              if not h or '/' in h or ' ' in h:
                  continue
              parts = h.split('.')
              apex = 3 if len(parts) >= 2 and '.'.join(parts[-2:]) in SLD else 2
              if wildcard or len(parts) <= apex:
                  wide.add(h)      # bare domain -> domain + all subdomains
              else:
                  exact.add(h)     # subdomain   -> only this host

          salt = secrets.token_hex(8)
          def digest(x):
              return hashlib.sha256((salt + ':' + x).encode()).hexdigest()

          def arr(name, items):
              body = ',\n'.join('        "%s"' % digest(x) for x in sorted(items))
              return '    static final String[] %s = {\n%s\n    };' % (name, body)

          java = ('package com.ayush.hostaradsguard;\n\n'
                  'final class BlockData {\n'
                  '    static final String SALT = "%s";\n%s\n%s\n}\n'
                  % (salt, arr('EXACT', exact), arr('WIDE', wide)))
          with open('app/src/main/java/com/ayush/hostaradsguard/BlockData.java', 'w') as f:
              f.write(java)
          print('Blocklist built from %s: %d exact-host rules, %d domain-wide rules (hashed)'
                % (source, len(exact), len(wide)))
          PY

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=hostaradsguard, O=Ayush, C=IN"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/hostaradsguard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hostaradsguard-apk
          path: out/hostaradsguard.apk
