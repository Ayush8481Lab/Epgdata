          cat > "DevBrowser/app/src/main/java/com/devbrowser/app/Utils.kt" <<'__EOF__'
          package com.devbrowser.app

          import android.content.Context
          import android.widget.Button

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun fmtSize(n: Long): String = when {
              n < 1024 -> "$n B"
              n < 1024 * 1024 -> String.format("%.1f KB", n / 1024.0)
              else -> String.format("%.2f MB", n / 1048576.0)
          }

          fun Context.smallBtn(label: String, onClick: () -> Unit): Button {
              val b = Button(this)
              b.text = label
              b.isAllCaps = false
              b.textSize = 13f
              b.minWidth = 0
              b.minimumWidth = 0
              b.minHeight = 0
              b.minimumHeight = 0
              b.setPadding(dp(10), dp(8), dp(10), dp(8))
              b.setOnClickListener { onClick() }
              return b
          }
