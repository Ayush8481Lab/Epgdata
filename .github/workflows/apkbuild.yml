          cat > $D/MainActivity.java <<'EOF'
          package com.ayush.hostaradsguard;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.net.Uri;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewOutlineProvider;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.NumberFormat;

          public class MainActivity extends Activity {
              private static final int BG = 0xFF0B1220;
              private static final int CARD = 0xFF16213A;
              private static final int MUTED = 0xFF8FA3C0;
              private static final int GREEN = 0xFF2ECC71;
              private static final int RED = 0xFFE74C3C;
              private static final int GRAY = 0xFF2A3550;

              private boolean compact;   // phones / small screens -> stacked layout
              private TextView state, nToday, n7, n30;
              private Button btnOn, btnOff, btnBatt;
              private int lastMode = -1;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override public void run() { render(); h.postDelayed(this, 1000); }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable round(int fill, int radius, int strokeW, int strokeColor) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(radius);
                  if (strokeW > 0) g.setStroke(strokeW, strokeColor);
                  return g;
              }

              private TextView tv(String t, int sp, int color) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(sp);
                  v.setTextColor(color);
                  return v;
              }

              private void spacer(LinearLayout root, float weight) {
                  View v = new View(this);
                  v.setMinimumHeight(dp(compact ? 14 : 12));
                  root.addView(v, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT, weight));
              }

              private void style(Button b, int fill) {
                  StateListDrawable sl = new StateListDrawable();
                  sl.addState(new int[]{android.R.attr.state_focused}, round(fill, dp(14), dp(4), Color.WHITE));
                  sl.addState(new int[]{android.R.attr.state_pressed}, round(fill, dp(14), dp(4), Color.WHITE));
                  sl.addState(new int[]{}, round(fill, dp(14), 0, 0));
                  b.setBackground(sl);
              }

              private Button makeButton(String text, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(compact ? 20 : 22);
                  b.setTextColor(Color.WHITE);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setAllCaps(false);
                  b.setStateListAnimator(null);
                  b.setMinHeight(dp(56));
                  b.setPadding(dp(compact ? 16 : 56), dp(16), dp(compact ? 16 : 56), dp(16));
                  b.setFocusable(true);
                  b.setOnClickListener(l);
                  return b;
              }

              private TextView addCard(LinearLayout row, String label) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER);
                  c.setPadding(dp(16), dp(compact ? 18 : 26), dp(16), dp(compact ? 18 : 26));
                  c.setBackground(round(CARD, dp(22), 0, 0));
                  TextView l = tv(label, 13, MUTED);
                  l.setLetterSpacing(0.12f);
                  TextView n = tv("0", compact ? 38 : 46, Color.WHITE);
                  n.setTypeface(Typeface.DEFAULT_BOLD);
                  TextView s = tv("ads blocked", 14, GREEN);
                  c.addView(l);
                  c.addView(n);
                  c.addView(s);
                  LinearLayout.LayoutParams lp;
                  if (compact) {
                      lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(6), 0, dp(6));
                  } else {
                      lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(10), 0, dp(10), 0);
                  }
                  row.addView(c, lp);
                  return n;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Stats.init(this);
                  compact = getResources().getConfiguration().screenWidthDp < 600;
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(BG);
                  if (compact) root.setPadding(dp(20), dp(24), dp(20), dp(20));
                  else root.setPadding(dp(56), dp(32), dp(56), dp(24));

                  // Header: 1:1 logo + title
                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.ic_launcher);
                  logo.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  logo.setBackground(round(CARD, dp(20), 0, 0));
                  logo.setOutlineProvider(ViewOutlineProvider.BACKGROUND);
                  logo.setClipToOutline(true);
                  int logoSize = compact ? 64 : 76;
                  head.addView(logo, new LinearLayout.LayoutParams(dp(logoSize), dp(logoSize)));
                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setPadding(dp(16), 0, 0, 0);
                  TextView title = tv("hostaradsguard", compact ? 26 : 32, Color.WHITE);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  titles.addView(title);
                  titles.addView(tv("Local DNS ad blocker", compact ? 14 : 16, MUTED));
                  head.addView(titles);
                  root.addView(head);

                  spacer(root, 1f);

                  // Status
                  state = tv("", compact ? 22 : 26, RED);
                  state.setTypeface(Typeface.DEFAULT_BOLD);
                  state.setGravity(Gravity.CENTER);
                  root.addView(state);

                  spacer(root, 0.5f);

                  // ON / OFF
                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  buttons.setGravity(Gravity.CENTER);
                  btnOn = makeButton("ON", v -> startVpn());
                  btnOff = makeButton("OFF", v -> {
                      Intent i = new Intent(this, DnsVpnService.class);
                      i.setAction(DnsVpnService.ACTION_STOP);
                      startService(i);
                  });
                  LinearLayout.LayoutParams bp = compact
                          ? new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          : new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);
                  bp.setMargins(dp(compact ? 6 : 16), 0, dp(compact ? 6 : 16), 0);
                  buttons.addView(btnOn, bp);
                  buttons.addView(btnOff, bp);
                  root.addView(buttons, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));

                  // Optional: ask Android not to put the blocker to sleep (shown only when useful)
                  btnBatt = makeButton("Keep running in background", v -> {
                      try { startActivity(battIntent()); } catch (Exception ignored) { }
                  });
                  btnBatt.setTextSize(15);
                  btnBatt.setMinHeight(dp(44));
                  btnBatt.setPadding(dp(20), dp(10), dp(20), dp(10));
                  style(btnBatt, GRAY);
                  LinearLayout.LayoutParams bb = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  bb.topMargin = dp(14);
                  root.addView(btnBatt, bb);

                  spacer(root, 1f);

                  // Stat cards
                  LinearLayout cards = new LinearLayout(this);
                  cards.setOrientation(compact ? LinearLayout.VERTICAL : LinearLayout.HORIZONTAL);
                  nToday = addCard(cards, "TODAY");
                  n7 = addCard(cards, "LAST 7 DAYS");
                  n30 = addCard(cards, "LAST 30 DAYS");
                  root.addView(cards, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));

                  spacer(root, 1f);

                  TextView footer = tv("Designed & developed by Ayush@8481", 13, MUTED);
                  footer.setGravity(Gravity.CENTER);
                  root.addView(footer);

                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  sv.setBackgroundColor(BG);
                  sv.addView(root);
                  setContentView(sv);
                  btnOn.requestFocus();

                  if (needNotifPermission()) {
                      getSharedPreferences("s", 0).edit().putBoolean("asked_notif", true).apply();
                      requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 2);
                  } else {
                      autoStart();
                  }
              }

              // Android 13+ phones: the "running" notification needs a one-time permission.
              private boolean needNotifPermission() {
                  return Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED
                          && !getSharedPreferences("s", 0).getBoolean("asked_notif", false);
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(req, perms, results);
                  if (req == 2) autoStart();
              }

              private void autoStart() {
                  if (getSharedPreferences("s", 0).getBoolean("enabled", true)) {
                      KeepAliveJob.ensure(this);
                      if (!DnsVpnService.running) startVpn();
                  }
              }

              private Intent battIntent() {
                  return new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                          Uri.parse("package:" + getPackageName()));
              }

              private void updateBattButton() {
                  boolean show = false;
                  if (Build.VERSION.SDK_INT >= 23) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      show = pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())
                              && battIntent().resolveActivity(getPackageManager()) != null;
                  }
                  btnBatt.setVisibility(show ? View.VISIBLE : View.GONE);
              }

              private void startVpn() {
                  Intent i = VpnService.prepare(this);
                  if (i != null) startActivityForResult(i, 1);
                  else launch();
              }

              private void launch() {
                  Intent s = new Intent(this, DnsVpnService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(s);
                  else startService(s);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent d) {
                  if (req == 1 && res == RESULT_OK) launch();
              }

              private void render() {
                  boolean on = DnsVpnService.running;
                  int mode = on ? 1 : 0;
                  if (mode != lastMode) {
                      lastMode = mode;
                      state.setText(on ? "\u25CF  PROTECTION ON" : "\u25CF  PROTECTION OFF");
                      state.setTextColor(on ? GREEN : RED);
                      style(btnOn, on ? GREEN : GRAY);
                      style(btnOff, on ? GRAY : RED);
                  }
                  NumberFormat nf = NumberFormat.getInstance();
                  nToday.setText(nf.format(Stats.sum(1)));
                  n7.setText(nf.format(Stats.sum(7)));
                  n30.setText(nf.format(Stats.sum(30)));
              }

              @Override protected void onResume() {
                  super.onResume();
                  updateBattButton();
                  h.post(tick);
              }

              @Override protected void onPause() {
                  super.onPause();
                  h.removeCallbacks(tick);
                  Stats.flush();
              }
          }
