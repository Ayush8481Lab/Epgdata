          cat > $D/KeepAliveJob.java <<'EOF'
          package com.ayush.hostaradsguard;

          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;

          // System-scheduled, reboot-persistent watchdog. Independent of the boot broadcast, so the
          // blocker comes back even if the device never delivers BOOT_COMPLETED to the app.
          public class KeepAliveJob extends JobService {
              private static final int ID_PERIODIC = 1001;
              private static final int ID_ONCE = 1002;

              static void ensure(Context c) {
                  try {
                      JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null) return;
                      for (JobInfo j : js.getAllPendingJobs()) if (j.getId() == ID_PERIODIC) return;
                      js.schedule(new JobInfo.Builder(ID_PERIODIC, new ComponentName(c, KeepAliveJob.class))
                              .setPeriodic(15 * 60 * 1000L)
                              .setPersisted(true)
                              .build());
                  } catch (Exception ignored) { }
              }

              static void kick(Context c, long delayMs) {
                  try {
                      JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null) return;
                      js.schedule(new JobInfo.Builder(ID_ONCE, new ComponentName(c, KeepAliveJob.class))
                              .setMinimumLatency(delayMs)
                              .setOverrideDeadline(delayMs + 60000)
                              .setPersisted(true)
                              .build());
                  } catch (Exception ignored) { }
              }

              static void cancel(Context c) {
                  try {
                      JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null) return;
                      js.cancel(ID_PERIODIC);
                      js.cancel(ID_ONCE);
                  } catch (Exception ignored) { }
              }

              @Override
              public boolean onStartJob(JobParameters p) {
                  try {
                      if (getSharedPreferences("s", 0).getBoolean("enabled", true)
                              && !DnsVpnService.running
                              && VpnService.prepare(this) == null) {
                          Intent s = new Intent(this, DnsVpnService.class);
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(s);
                          else startService(s);
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              @Override
              public boolean onStopJob(JobParameters p) {
                  return false;
              }
          }
