      - name: Build debug APK
        working-directory: DevBrowser
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp DevBrowser/app/build/outputs/apk/debug/app-debug.apk DevBrowser.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevBrowser-apk
          path: DevBrowser.apk

      - name: Publish GitHub Release (easy download on phone)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: DevBrowser build ${{ github.run_number }}
          files: DevBrowser.apk
