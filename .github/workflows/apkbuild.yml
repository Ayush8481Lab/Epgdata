name: Build DevBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apkbuild.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          mkdir -p "DevBrowser/app"
          cat > "DevBrowser/app/build.gradle" <<'__EOF__'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.devbrowser.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.devbrowser.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          __EOF__
          mkdir -p "DevBrowser/app/src/main"
          cat > "DevBrowser/app/src/main/AndroidManifest.xml" <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="DevBrowser"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".NetworkActivity" android:windowSoftInputMode="adjustResize" />
                  <activity android:name=".DetailActivity" />
              </application>
          </manifest>
          __EOF__
          mkdir -p "DevBrowser/app/src/main/assets"
          cat > "DevBrowser/app/src/main/assets/hook.js" <<'__EOF__'
          (function () {
            if (window.__devHook) return;
            window.__devHook = true;
            var B = window.DevBridge;
            if (!B || !B.log) return;

            function abs(u) { try { return new URL(u, location.href).href; } catch (e) { return String(u); } }
            function send(o) { try { B.log(JSON.stringify(o)); } catch (e) {} }
            function toObj(h) {
              var o = {};
              try {
                if (!h) return o;
                if (Array.isArray(h)) { h.forEach(function (p) { o[p[0]] = p[1]; }); }
                else if (typeof h.forEach === 'function') { h.forEach(function (v, k) { o[k] = v; }); }
                else { for (var k in h) o[k] = h[k]; }
              } catch (e) {}
              return o;
            }
            function bodyStr(b) {
              try {
                if (b == null) return '';
                if (typeof b === 'string') return b;
                if (typeof URLSearchParams !== 'undefined' && b instanceof URLSearchParams) return b.toString();
                if (typeof FormData !== 'undefined' && b instanceof FormData) {
                  var a = [];
                  b.forEach(function (v, k) { a.push(k + '=' + (typeof v === 'string' ? v : '[file]')); });
                  return a.join('&');
                }
                if (typeof Blob !== 'undefined' && b instanceof Blob) return '[Blob ' + b.size + ' bytes]';
                if (b instanceof ArrayBuffer || ArrayBuffer.isView(b)) return '[binary ' + b.byteLength + ' bytes]';
                return String(b);
              } catch (e) { return ''; }
            }
            function cap(s) { s = s == null ? '' : String(s); return s.length > 500000 ? s.slice(0, 500000) + '\n...[truncated]' : s; }
            var TEXTUAL = /text|json|xml|javascript|html|urlencoded|graphql|^$/;

            // fetch (non GET/HEAD only; GET/HEAD are captured natively)
            var origFetch = window.fetch;
            if (origFetch) {
              window.fetch = function (input, init) {
                var method = 'GET', url = '', h = {}, body = '';
                try {
                  if (typeof Request !== 'undefined' && input instanceof Request) {
                    method = input.method; url = input.url; h = toObj(input.headers);
                  } else { url = abs(input); }
                  if (init) {
                    if (init.method) method = init.method;
                    if (init.headers) { var ih = toObj(init.headers); for (var k in ih) h[k] = ih[k]; }
                    if (init.body != null) body = bodyStr(init.body);
                  }
                } catch (e) {}
                method = String(method).toUpperCase();
                if (method === 'GET' || method === 'HEAD') return origFetch.apply(this, arguments);
                var t0 = Date.now();
                return origFetch.apply(this, arguments).then(function (res) {
                  var base = {
                    method: method, url: url, reqHeaders: h, reqBody: cap(body),
                    status: res.status, statusText: res.statusText, resHeaders: toObj(res.headers),
                    mime: res.headers.get('content-type') || '', duration: Date.now() - t0, source: 'JS fetch'
                  };
                  try {
                    var c = res.clone();
                    var ct = (base.mime || '').toLowerCase();
                    (TEXTUAL.test(ct) ? c.text() : Promise.resolve('[binary ' + ct + ']'))
                      .then(function (t) { base.resBody = cap(t); send(base); })
                      .catch(function () { base.resBody = '[unreadable]'; send(base); });
                  } catch (e) { base.resBody = '[unreadable]'; send(base); }
                  return res;
                }, function (err) {
                  send({ method: method, url: url, reqHeaders: h, reqBody: cap(body), status: 0, error: String(err),
                         duration: Date.now() - t0, source: 'JS fetch' });
                  throw err;
                });
              };
            }

            // XMLHttpRequest
            var xo = XMLHttpRequest.prototype.open;
            var xs = XMLHttpRequest.prototype.send;
            var xh = XMLHttpRequest.prototype.setRequestHeader;
            XMLHttpRequest.prototype.open = function (m, u) {
              this.__d = { method: String(m).toUpperCase(), url: abs(u), h: {} };
              return xo.apply(this, arguments);
            };
            XMLHttpRequest.prototype.setRequestHeader = function (k, v) {
              if (this.__d) this.__d.h[k] = v;
              return xh.apply(this, arguments);
            };
            XMLHttpRequest.prototype.send = function (b) {
              var d = this.__d, x = this;
              if (d && d.method !== 'GET' && d.method !== 'HEAD') {
                var body = bodyStr(b), t0 = Date.now();
                x.addEventListener('loadend', function () {
                  var rh = {};
                  try {
                    (x.getAllResponseHeaders() || '').trim().split(/\r?\n/).forEach(function (l) {
                      var i = l.indexOf(':');
                      if (i > 0) rh[l.slice(0, i).trim()] = l.slice(i + 1).trim();
                    });
                  } catch (e) {}
                  var rt = '';
                  try {
                    if (x.responseType === '' || x.responseType === 'text') rt = x.responseText;
                    else if (x.responseType === 'json') rt = JSON.stringify(x.response);
                    else rt = '[' + x.responseType + ']';
                  } catch (e) {}
                  send({
                    method: d.method, url: d.url, reqHeaders: d.h, reqBody: cap(body),
                    status: x.status, statusText: x.statusText, resHeaders: rh, resBody: cap(rt),
                    mime: x.getResponseHeader('content-type') || '', duration: Date.now() - t0,
                    error: x.status === 0 ? 'Network error / blocked / aborted' : '', source: 'JS XHR'
                  });
                });
              }
              return xs.apply(this, arguments);
            };
          })();
          __EOF__
          mkdir -p "DevBrowser/app/src/main/java/com/devbrowser/app"
          cat > "DevBrowser/app/src/main/java/com/devbrowser/app/DetailActivity.kt" <<'__EOF__'
          package com.devbrowser.app

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class DetailActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val l = NetStore.find(intent.getIntExtra("id", -1))
                  if (l == null) {
                      finish()
                      return
                  }
                  val match = LinearLayout.LayoutParams.MATCH_PARENT
                  val wrap = LinearLayout.LayoutParams.WRAP_CONTENT

                  val parts = ArrayList<Pair<String, String>>()

                  val general = StringBuilder()
                  general.append("URL: ").append(l.url).append('\n')
                  general.append("Method: ").append(l.method).append('\n')
                  general.append("Status: ").append(if (l.status == 0) "ERROR" else l.status.toString() + " " + l.statusText).append('\n')
                  general.append("Content-Type: ").append(l.mime.ifEmpty { "-" }).append('\n')
                  general.append("Size: ").append(fmtSize(l.size)).append('\n')
                  general.append("Time taken: ").append(l.durationMs).append(" ms\n")
                  general.append("Captured via: ").append(l.source).append('\n')
                  general.append("At: ").append(SimpleDateFormat("HH:mm:ss.SSS, dd MMM yyyy", Locale.US).format(Date(l.time)))
                  if (l.error != null) general.append("\nError: ").append(l.error)
                  parts.add("General" to general.toString())

                  parts.add("Request Headers (${l.reqHeaders.size})" to headersText(l.reqHeaders))

                  val rc = l.reqCookies.split(";").map { it.trim() }.filter { it.isNotEmpty() }
                  val rcText = if (rc.isEmpty()) "(none)" else rc.joinToString("\n") {
                      it.substringBefore("=") + " = " + it.substringAfter("=", "")
                  }
                  parts.add("Request Cookies (${rc.size})" to rcText)

                  parts.add("Response Headers (${l.resHeaders.size})" to headersText(l.resHeaders))

                  val sc = l.resHeaders.filter { it.first.equals("set-cookie", true) }
                  val scText = if (sc.isEmpty()) "(none)" else sc.joinToString("\n\n") {
                      val p = it.second.split(";").map { x -> x.trim() }
                      p[0] + "\n    " + p.drop(1).joinToString("; ")
                  }
                  parts.add("Response Cookies / Set-Cookie (${sc.size})" to scText)

                  parts.add("Request Body" to (if (l.reqBody.isEmpty()) "(empty)" else pretty(l.reqBody)))
                  parts.add("Response Body" to (if (l.resBody.isEmpty()) "(empty)" else pretty(l.resBody)))

                  val all = parts.joinToString("\n\n") { "===== " + it.first + " =====\n" + it.second }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setBackgroundColor(Color.WHITE)

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(dp(4), dp(4), dp(4), dp(4))
                  top.addView(smallBtn("Back") { finish() })
                  val title = TextView(this)
                  title.text = l.method + " " + l.url
                  title.textSize = 12f
                  title.maxLines = 2
                  title.ellipsize = TextUtils.TruncateAt.MIDDLE
                  title.setPadding(dp(8), 0, dp(8), 0)
                  top.addView(title, LinearLayout.LayoutParams(0, wrap, 1f))
                  top.addView(smallBtn("cURL") { copy(curl(l), "cURL copied") })
                  top.addView(smallBtn("Copy all") { copy(all, "Copied") })
                  root.addView(top, LinearLayout.LayoutParams(match, wrap))

                  val scroll = ScrollView(this)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(6), dp(6), dp(6), dp(24))
                  for ((t, b) in parts) addSection(box, t, b)
                  scroll.addView(box)
                  root.addView(scroll, LinearLayout.LayoutParams(match, 0, 1f))

                  setContentView(root)
              }

              private fun addSection(box: LinearLayout, title: String, body: String) {
                  val header = TextView(this)
                  header.setBackgroundColor(0xFFE3F2FD.toInt())
                  header.setTextColor(0xFF0D47A1.toInt())
                  header.setTypeface(null, Typeface.BOLD)
                  header.textSize = 14f
                  header.setPadding(dp(10), dp(10), dp(10), dp(10))

                  val content = TextView(this)
                  content.typeface = Typeface.MONOSPACE
                  content.textSize = 12f
                  content.setTextIsSelectable(true)
                  content.setPadding(dp(8), dp(8), dp(8), dp(8))
                  content.text = if (body.length > 150000)
                      body.take(150000) + "\n...[truncated in view, use Copy all]" else body

                  fun update() {
                      header.text = (if (content.visibility == View.VISIBLE) "\u25BC " else "\u25B6 ") + title
                  }
                  update()
                  header.setOnClickListener {
                      content.visibility = if (content.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      update()
                  }

                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.topMargin = dp(8)
                  box.addView(header, lp)
                  box.addView(content)
              }

              private fun headersText(h: List<Pair<String, String>>): String =
                  if (h.isEmpty()) "(none)" else h.joinToString("\n") { it.first + ": " + it.second }

              private fun pretty(s: String): String {
                  val t = s.trim()
                  if (t.length > 300000) return s
                  return try {
                      when {
                          t.startsWith("{") -> JSONObject(t).toString(2).replace("\\/", "/")
                          t.startsWith("[") -> JSONArray(t).toString(2).replace("\\/", "/")
                          else -> s
                      }
                  } catch (e: Exception) {
                      s
                  }
              }

              private fun q(s: String): String = "'" + s.replace("'", "'\\''") + "'"

              private fun curl(l: NetLog): String {
                  val sb = StringBuilder("curl -X ").append(l.method).append(' ').append(q(l.url))
                  for ((k, v) in l.reqHeaders) sb.append(" \\\n  -H ").append(q("$k: $v"))
                  if (l.reqBody.isNotEmpty()) sb.append(" \\\n  --data-raw ").append(q(l.reqBody))
                  return sb.toString()
              }

              private fun copy(text: String, msg: String) {
                  val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("devbrowser", text))
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }
          }
          __EOF__
          mkdir -p "DevBrowser/app/src/main/java/com/devbrowser/app"
          cat > "DevBrowser/app/src/main/java/com/devbrowser/app/MainActivity.kt" <<'__EOF__'
          package com.devbrowser.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.os.Bundle
          import android.os.SystemClock
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebStorage
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.Toast
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.net.URLEncoder
          import java.nio.charset.Charset
          import java.util.concurrent.TimeUnit

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var urlBox: EditText
              private lateinit var progress: ProgressBar
              private lateinit var netBtn: Button
              private var hookJs: String = ""
              private var docStart = false

              private val http: OkHttpClient = OkHttpClient.Builder()
                  .followRedirects(false)
                  .followSslRedirects(false)
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hookJs = try {
                      assets.open("hook.js").bufferedReader().use { it.readText() }
                  } catch (e: Exception) {
                      ""
                  }
                  buildUi()
                  setupWebView()
                  load(intent?.dataString ?: "https://www.google.com")
              }

              private fun buildUi() {
                  val match = LinearLayout.LayoutParams.MATCH_PARENT
                  val wrap = LinearLayout.LayoutParams.WRAP_CONTENT

                  web = WebView(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setBackgroundColor(Color.WHITE)

                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setPadding(dp(4), dp(4), dp(4), dp(4))
                  bar.addView(smallBtn("<") { if (web.canGoBack()) web.goBack() })
                  bar.addView(smallBtn(">") { if (web.canGoForward()) web.goForward() })
                  bar.addView(smallBtn("\u21BB") { web.reload() })

                  urlBox = EditText(this)
                  urlBox.setSingleLine(true)
                  urlBox.textSize = 14f
                  urlBox.hint = "Search or enter URL"
                  urlBox.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  urlBox.imeOptions = EditorInfo.IME_ACTION_GO
                  urlBox.setSelectAllOnFocus(true)
                  urlBox.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_GO) {
                          load(urlBox.text.toString())
                          hideKeyboard()
                          true
                      } else {
                          false
                      }
                  }
                  bar.addView(urlBox, LinearLayout.LayoutParams(0, wrap, 1f))
                  bar.addView(smallBtn("Go") {
                      load(urlBox.text.toString())
                      hideKeyboard()
                  })
                  root.addView(bar, LinearLayout.LayoutParams(match, wrap))

                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  progress.max = 100
                  root.addView(progress, LinearLayout.LayoutParams(match, dp(3)))

                  root.addView(web, LinearLayout.LayoutParams(match, 0, 1f))

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.HORIZONTAL
                  bottom.setPadding(dp(4), dp(4), dp(4), dp(4))
                  netBtn = smallBtn("Network (0)") {
                      startActivity(Intent(this, NetworkActivity::class.java))
                  }
                  netBtn.textSize = 15f
                  bottom.addView(netBtn, LinearLayout.LayoutParams(0, wrap, 1f))
                  bottom.addView(smallBtn("Clear site data") {
                      CookieManager.getInstance().removeAllCookies(null)
                      CookieManager.getInstance().flush()
                      WebStorage.getInstance().deleteAllData()
                      web.clearCache(true)
                      Toast.makeText(this, "Cookies, storage and cache cleared", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(bottom, LinearLayout.LayoutParams(match, wrap))

                  setContentView(root)
              }

              @SuppressLint("SetJavaScriptEnabled", "JavascriptInterface")
              private fun setupWebView() {
                  WebView.setWebContentsDebuggingEnabled(true)
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.loadWithOverviewMode = true
                  s.useWideViewPort = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                  val cm = CookieManager.getInstance()
                  cm.setAcceptCookie(true)
                  cm.setAcceptThirdPartyCookies(web, true)

                  web.addJavascriptInterface(Bridge(), "DevBridge")

                  if (hookJs.isNotEmpty() && WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      try {
                          WebViewCompat.addDocumentStartJavaScript(web, hookJs, setOf("*"))
                          docStart = true
                      } catch (e: Exception) {
                          docStart = false
                      }
                  }

                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val sch = request?.url?.scheme ?: return false
                          return sch != "http" && sch != "https" && sch != "about" &&
                              sch != "file" && sch != "data" && sch != "blob"
                      }

                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          if (request == null) return null
                          return try {
                              proxy(request)
                          } catch (e: Exception) {
                              null
                          }
                      }

                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          if (url != null && !urlBox.hasFocus()) urlBox.setText(url)
                          if (!docStart && hookJs.isNotEmpty()) view?.evaluateJavascript(hookJs, null)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (!docStart && hookJs.isNotEmpty()) view?.evaluateJavascript(hookJs, null)
                          CookieManager.getInstance().flush()
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          progress.progress = newProgress
                          progress.visibility = if (newProgress >= 100) View.GONE else View.VISIBLE
                      }
                  }
              }

              // Proxy GET/HEAD requests through OkHttp so we can capture full request/response data.
              private fun proxy(req: WebResourceRequest): WebResourceResponse? {
                  val scheme = req.url.scheme ?: return null
                  if (scheme != "http" && scheme != "https") return null
                  val method = req.method.uppercase()
                  if (method != "GET" && method != "HEAD") return null
                  if (req.requestHeaders.keys.any { it.equals("Range", true) }) return null

                  val url = req.url.toString()
                  val cm = CookieManager.getInstance()
                  val sent = ArrayList<Pair<String, String>>()

                  val rb = try {
                      Request.Builder().url(url).method(method, null)
                  } catch (e: Exception) {
                      return null
                  }
                  for ((k, v) in req.requestHeaders) {
                      if (k.equals("Accept-Encoding", true) || k.equals("Cookie", true)) continue
                      rb.header(k, v)
                      sent.add(k to v)
                  }
                  val cookie = cm.getCookie(url) ?: ""
                  if (cookie.isNotEmpty()) {
                      rb.header("Cookie", cookie)
                      sent.add("Cookie" to cookie)
                  }
                  sent.add("Accept-Encoding" to "gzip")

                  val t0 = SystemClock.elapsedRealtime()
                  val resp = try {
                      http.newCall(rb.build()).execute()
                  } catch (e: Exception) {
                      NetStore.add(
                          NetLog(
                              id = NetStore.nextId(), time = System.currentTimeMillis(), method = method, url = url,
                              status = 0, statusText = "", reqHeaders = sent, reqCookies = cookie, reqBody = "",
                              resHeaders = emptyList(), resBody = "", mime = "", size = 0,
                              durationMs = SystemClock.elapsedRealtime() - t0, source = SRC_NATIVE,
                              error = e.toString()
                          )
                      )
                      return null
                  }

                  val resHeaders = ArrayList<Pair<String, String>>()
                  for (i in 0 until resp.headers.size) resHeaders.add(resp.headers.name(i) to resp.headers.value(i))
                  for (c in resp.headers("Set-Cookie")) cm.setCookie(url, c)

                  // Redirects / 304: log, then let WebView perform the follow-up request itself.
                  if (resp.code in 300..399) {
                      NetStore.add(
                          NetLog(
                              id = NetStore.nextId(), time = System.currentTimeMillis(), method = method, url = url,
                              status = resp.code, statusText = resp.message, reqHeaders = sent, reqCookies = cookie,
                              reqBody = "", resHeaders = resHeaders, resBody = "", mime = "", size = 0,
                              durationMs = SystemClock.elapsedRealtime() - t0, source = SRC_NATIVE, error = null
                          )
                      )
                      resp.close()
                      return null
                  }

                  val body = resp.body
                  val len = body?.contentLength() ?: -1L
                  if (len > 25L * 1024 * 1024) {
                      resp.close()
                      return null
                  }
                  val ct = body?.contentType()
                  val mime = if (ct != null) ct.type + "/" + ct.subtype else "application/octet-stream"
                  val csName = ct?.charset()?.name()
                  val bytes = body?.bytes() ?: ByteArray(0)
                  val cset: Charset = try {
                      Charset.forName(csName ?: "UTF-8")
                  } catch (e: Exception) {
                      Charsets.UTF_8
                  }

                  val shown: String = if (isText(mime)) {
                      val max = 512 * 1024
                      val str = String(bytes, 0, minOf(bytes.size, max), cset)
                      if (bytes.size > max) str + "\n...[truncated]" else str
                  } else if (mime.startsWith("image/")) {
                      "[image, ${bytes.size} bytes]"
                  } else {
                      "[binary, ${bytes.size} bytes]"
                  }

                  NetStore.add(
                      NetLog(
                          id = NetStore.nextId(), time = System.currentTimeMillis(), method = method, url = url,
                          status = resp.code, statusText = resp.message, reqHeaders = sent, reqCookies = cookie,
                          reqBody = "", resHeaders = resHeaders, resBody = shown, mime = mime,
                          size = bytes.size.toLong(), durationMs = SystemClock.elapsedRealtime() - t0,
                          source = SRC_NATIVE, error = null
                      )
                  )

                  val skip = setOf(
                      "content-type", "content-length", "content-encoding",
                      "transfer-encoding", "set-cookie", "connection", "keep-alive"
                  )
                  val hm = HashMap<String, String>()
                  for ((k, v) in resHeaders) {
                      if (k.lowercase() in skip) continue
                      val prev = hm[k]
                      hm[k] = if (prev == null) v else "$prev, $v"
                  }
                  return WebResourceResponse(
                      mime, csName, resp.code,
                      if (resp.message.isEmpty()) "OK" else resp.message,
                      hm, ByteArrayInputStream(bytes)
                  )
              }

              private fun isText(m: String): Boolean {
                  val l = m.lowercase()
                  return l.startsWith("text/") || l.contains("json") || l.contains("xml") ||
                      l.contains("javascript") || l.contains("ecmascript") || l.contains("html") ||
                      l.contains("urlencoded") || l.contains("graphql")
              }

              private fun readHeaders(o: JSONObject?): List<Pair<String, String>> {
                  if (o == null) return emptyList()
                  val r = ArrayList<Pair<String, String>>()
                  val it = o.keys()
                  while (it.hasNext()) {
                      val k = it.next()
                      r.add(k to o.optString(k))
                  }
                  return r
              }

              // Receives fetch()/XHR non-GET calls from the injected hook.js
              inner class Bridge {
                  @JavascriptInterface
                  fun log(json: String) {
                      try {
                          val o = JSONObject(json)
                          val url = o.optString("url")
                          val cookie = CookieManager.getInstance().getCookie(url) ?: ""
                          val reqH = ArrayList(readHeaders(o.optJSONObject("reqHeaders")))
                          if (cookie.isNotEmpty() && reqH.none { it.first.equals("cookie", true) }) {
                              reqH.add("Cookie" to cookie)
                          }
                          val resBody = o.optString("resBody")
                          val err = o.optString("error")
                          NetStore.add(
                              NetLog(
                                  id = NetStore.nextId(), time = System.currentTimeMillis(),
                                  method = o.optString("method", "POST"), url = url,
                                  status = o.optInt("status", 0), statusText = o.optString("statusText"),
                                  reqHeaders = reqH, reqCookies = cookie, reqBody = o.optString("reqBody"),
                                  resHeaders = readHeaders(o.optJSONObject("resHeaders")),
                                  resBody = resBody, mime = o.optString("mime"),
                                  size = resBody.length.toLong(), durationMs = o.optLong("duration", 0),
                                  source = o.optString("source", "JS"),
                                  error = if (err.isEmpty()) null else err
                              )
                          )
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun load(input: String) {
                  val t = input.trim()
                  if (t.isEmpty()) return
                  val ip = Regex("""^\d{1,3}(\.\d{1,3}){3}(:\d+)?(/.*)?$""")
                  val u = when {
                      t.startsWith("http://") || t.startsWith("https://") ||
                          t.startsWith("file://") || t.startsWith("about:") -> t
                      t.startsWith("localhost") || ip.matches(t) -> "http://$t"
                      !t.contains(" ") && t.contains(".") -> "https://$t"
                      else -> "https://www.google.com/search?q=" + URLEncoder.encode(t, "UTF-8")
                  }
                  web.loadUrl(u)
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(urlBox.windowToken, 0)
                  urlBox.clearFocus()
              }

              private fun refreshBadge() {
                  runOnUiThread { netBtn.text = "Network (" + NetStore.count() + ")" }
              }

              override fun onResume() {
                  super.onResume()
                  NetStore.listener = { refreshBadge() }
                  refreshBadge()
              }

              override fun onPause() {
                  super.onPause()
                  NetStore.listener = null
                  CookieManager.getInstance().flush()
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              companion object {
                  const val SRC_NATIVE = "WebView (proxied)"
              }
          }
          __EOF__
          mkdir -p "DevBrowser/app/src/main/java/com/devbrowser/app"
          cat > "DevBrowser/app/src/main/java/com/devbrowser/app/NetStore.kt" <<'__EOF__'
          package com.devbrowser.app

          data class NetLog(
              val id: Int,
              val time: Long,
              val method: String,
              val url: String,
              val status: Int,
              val statusText: String,
              val reqHeaders: List<Pair<String, String>>,
              val reqCookies: String,
              val reqBody: String,
              val resHeaders: List<Pair<String, String>>,
              val resBody: String,
              val mime: String,
              val size: Long,
              val durationMs: Long,
              val source: String,
              val error: String?
          )

          object NetStore {
              private val logs = ArrayList<NetLog>()
              private var counter = 0

              @Volatile
              var listener: (() -> Unit)? = null

              @Synchronized
              fun nextId(): Int {
                  counter += 1
                  return counter
              }

              fun add(l: NetLog) {
                  synchronized(this) {
                      logs.add(l)
                      if (logs.size > 2000) logs.removeAt(0)
                  }
                  listener?.invoke()
              }

              @Synchronized
              fun snapshot(): List<NetLog> = ArrayList(logs)

              @Synchronized
              fun find(id: Int): NetLog? = logs.firstOrNull { it.id == id }

              @Synchronized
              fun clear() {
                  logs.clear()
              }

              @Synchronized
              fun count(): Int = logs.size
          }
          __EOF__
          mkdir -p "DevBrowser/app/src/main/java/com/devbrowser/app"
          cat > "DevBrowser/app/src/main/java/com/devbrowser/app/NetworkActivity.kt" <<'__EOF__'
          package com.devbrowser.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          class NetworkActivity : Activity() {

              private lateinit var listView: ListView
              private lateinit var countTxt: TextView
              private var filterText = ""
              private var typeFilter = "All"
              private var items: List<NetLog> = emptyList()

              private val adapter = object : BaseAdapter() {
                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = items[position].id.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View =
                      buildRow(items[position])
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val match = LinearLayout.LayoutParams.MATCH_PARENT
                  val wrap = LinearLayout.LayoutParams.WRAP_CONTENT

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setBackgroundColor(Color.WHITE)

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(dp(4), dp(4), dp(4), dp(4))
                  top.addView(smallBtn("Back") { finish() })
                  countTxt = TextView(this)
                  countTxt.textSize = 15f
                  countTxt.setTypeface(null, Typeface.BOLD)
                  countTxt.setPadding(dp(10), 0, dp(10), 0)
                  top.addView(countTxt, LinearLayout.LayoutParams(0, wrap, 1f))
                  top.addView(smallBtn("Clear") {
                      NetStore.clear()
                      refresh()
                  })
                  root.addView(top, LinearLayout.LayoutParams(match, wrap))

                  val filter = EditText(this)
                  filter.hint = "Filter by URL / method / status"
                  filter.setSingleLine(true)
                  filter.textSize = 14f
                  filter.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {
                          filterText = s?.toString() ?: ""
                          refresh()
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })
                  root.addView(filter, LinearLayout.LayoutParams(match, wrap))

                  val hs = HorizontalScrollView(this)
                  val chips = LinearLayout(this)
                  chips.orientation = LinearLayout.HORIZONTAL
                  chips.setPadding(dp(4), 0, dp(4), 0)
                  for (t in listOf("All", "API", "JS", "CSS", "Img", "Doc", "Err")) {
                      chips.addView(smallBtn(t) {
                          typeFilter = t
                          refresh()
                      })
                  }
                  hs.addView(chips)
                  root.addView(hs, LinearLayout.LayoutParams(match, wrap))

                  listView = ListView(this)
                  listView.adapter = adapter
                  listView.divider = ColorDrawable(0xFFDDDDDD.toInt())
                  listView.dividerHeight = 1
                  root.addView(listView, LinearLayout.LayoutParams(match, 0, 1f))

                  setContentView(root)
              }

              private fun matchesType(l: NetLog): Boolean {
                  val m = l.mime.lowercase()
                  return when (typeFilter) {
                      "API" -> m.contains("json") || m.contains("xml") || l.source.startsWith("JS")
                      "JS" -> m.contains("javascript") || m.contains("ecmascript")
                      "CSS" -> m.contains("css")
                      "Img" -> m.startsWith("image/")
                      "Doc" -> m.contains("html")
                      "Err" -> l.status == 0 || l.status >= 400 || l.error != null
                      else -> true
                  }
              }

              private fun refresh() {
                  val q = filterText.trim().lowercase()
                  items = NetStore.snapshot().asReversed().filter {
                      matchesType(it) && (q.isEmpty() || it.url.lowercase().contains(q) ||
                          it.method.lowercase().contains(q) || it.status.toString().contains(q))
                  }
                  adapter.notifyDataSetChanged()
                  countTxt.text = "Logs: " + items.size + " / " + NetStore.count()
              }

              private fun openDetail(id: Int) {
                  startActivity(Intent(this, DetailActivity::class.java).putExtra("id", id))
              }

              private fun buildRow(l: NetLog): View {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(dp(10), dp(8), dp(6), dp(8))
                  row.setOnClickListener { openDetail(l.id) }

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL

                  val st = if (l.status == 0) "ERR" else l.status.toString()
                  val color = when {
                      l.status == 0 || l.status >= 400 -> 0xFFC62828.toInt()
                      l.status >= 300 -> 0xFFEF6C00.toInt()
                      else -> 0xFF2E7D32.toInt()
                  }
                  val mimeShort = l.mime.substringBefore(";").substringAfter("/").ifEmpty { "-" }
                  val head = TextView(this)
                  head.text = l.method + "  " + st + "  \u00B7  " + mimeShort + "  \u00B7  " +
                      fmtSize(l.size) + "  \u00B7  " + l.durationMs + " ms"
                  head.textSize = 12f
                  head.setTypeface(null, Typeface.BOLD)
                  head.setTextColor(color)

                  val urlTv = TextView(this)
                  urlTv.text = l.url
                  urlTv.textSize = 12f
                  urlTv.maxLines = 2
                  urlTv.ellipsize = TextUtils.TruncateAt.MIDDLE
                  urlTv.setTextColor(Color.DKGRAY)

                  col.addView(head)
                  col.addView(urlTv)
                  row.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val btn = smallBtn("View detail") { openDetail(l.id) }
                  row.addView(btn, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  return row
              }

              override fun onResume() {
                  super.onResume()
                  NetStore.listener = { runOnUiThread { refresh() } }
                  refresh()
              }

              override fun onPause() {
                  super.onPause()
                  NetStore.listener = null
              }
          }
          __EOF__
