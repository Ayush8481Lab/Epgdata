name: Build hostaradsguard APK

# Put this file at: .github/workflows/Apk.yml
# Run it from the Actions tab (Run workflow) or by pushing to main.
# The APK appears under "Artifacts" at the bottom of the run page.
#
# ---------------------------------------------------------------------------
# WHERE TO EDIT
#   1) Block list  -> BLOCK_DOMAINS_DEFAULT below (JSON array, one domain per line)
#      PRIVATE option (recommended if the repo is public): add a repository secret
#      named BLOCK_DOMAINS (Settings > Secrets and variables > Actions) with the
#      same JSON array. If the secret exists it overrides the list below.
#   2) Logos       -> LOGO_SQUARE_URL (1:1 app icon) and LOGO_WIDE_URL (16:9 TV banner)
#
# RULES
#   hspx.hell.com  (subdomain)  -> blocks ONLY that exact host
#   hell.com       (bare domain)-> blocks the domain AND all its subdomains
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LOGO_SQUARE_URL: https://i.ibb.co/zHNTqsC9/1794896661680.jpg
  LOGO_WIDE_URL: https://i.ibb.co/C3j7WLcW/1794896559976.jpg
  BLOCK_DOMAINS_DEFAULT: |
    [
    "bifrost-api.hotstar.com",
    "hesads.akamaized.net",
    "service.hotstar.com",
    "hspx.hotstar.com",
    "usersvc.hotstar.com"
    ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Gradle project files
        run: |
          mkdir -p app/src/main/java/com/ayush/hostaradsguard
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "hostaradsguard"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ayush.hostaradsguard'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ayush.hostaradsguard'
                  minSdk 22
                  targetSdk 33
                  versionCode 4
                  versionName '2.2'
              }
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'android'
                      keyAlias 'key'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      debuggable false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
              dependenciesInfo {
                  includeInApk = false
                  includeInBundle = false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          # R8 hardening: rename/flatten everything, drop debug info
          cat > app/proguard-rules.pro <<'EOF'
          -repackageclasses ''
          -allowaccessmodification
          -overloadaggressively
          -renamesourcefileattribute ''
          -dontnote **
          -dontwarn **
          EOF

      - name: Fetch and prepare logos
        run: |
          mkdir -p dl
          dl() {
            curl -fsSL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$2" "$1" \
              || echo "WARN: could not download $1"
          }
          dl "$LOGO_SQUARE_URL" dl/square.jpg
          dl "$LOGO_WIDE_URL" dl/wide.jpg

          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow

          .venv/bin/python - <<'PY'
          from PIL import Image

          RES = 'app/src/main/res/drawable-nodpi/'

          def load(path):
              try:
                  im = Image.open(path)
                  im.load()
                  return im.convert('RGB')
              except Exception:
                  print('WARN: using placeholder for', path)
                  return None

          def crop_to(im, ratio):
              w, h = im.size
              if w / h > ratio:
                  nw = int(h * ratio)
                  l = (w - nw) // 2
                  return im.crop((l, 0, l + nw, h))
              nh = int(w / ratio)
              t = (h - nh) // 2
              return im.crop((0, t, w, t + nh))

          sq = load('dl/square.jpg')
          wd = load('dl/wide.jpg')
          sq = (crop_to(sq, 1.0).resize((512, 512), Image.LANCZOS)
                if sq else Image.new('RGB', (512, 512), (0x1B, 0x2A, 0x41)))
          wd = (crop_to(wd, 16 / 9).resize((640, 360), Image.LANCZOS)
                if wd else Image.new('RGB', (640, 360), (0x1B, 0x2A, 0x41)))
          sq.save(RES + 'ic_launcher.png', optimize=True)   # 1:1  -> app icon / lists / settings
          wd.save(RES + 'banner.png', optimize=True)        # 16:9 -> Android TV launcher banner
          import os
          os.makedirs('app/src/main/res/mipmap-xxhdpi', exist_ok=True)
          os.makedirs('app/src/main/res/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          sq.save('app/src/main/res/mipmap-xxhdpi/ic_launcher.png', optimize=True)  # phones / legacy
          cols = [sq.getpixel(p) for p in [(4, 4), (507, 4), (4, 507), (507, 507)]]
          r, g, b = [sum(c[i] for c in cols) // 4 for i in range(3)]
          open('app/src/main/res/values/colors.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="icon_bg">#%02X%02X%02X</color>\n</resources>\n' % (r, g, b))
          open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/icon_bg"/>\n'
              '    <foreground>\n'
              '        <inset android:drawable="@drawable/ic_launcher" android:inset="14%"/>\n'
              '    </foreground>\n'
              '</adaptive-icon>\n')
          print('logos ready')
          PY

      - name: Create manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:label="hostaradsguard"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DnsVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".KeepAliveJob"
                      android:exported="false"
                      android:permission="android.permission.BIND_JOB_SERVICE" />

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.net.conn.CONNECTIVITY_CHANGE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Write Java source
        run: |
          D=app/src/main/java/com/ayush/hostaradsguard

          # ---------------------------------------------------------------
          cat > $D/Blocklist.java <<'EOF'
          package com.ayush.hostaradsguard;

          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          // Matches against salted SHA-256 hashes only. No domain name exists in the APK.
          final class Blocklist {
              private static final Set<String> EX = new HashSet<>(Arrays.asList(BlockData.EXACT));
              private static final Set<String> WD = new HashSet<>(Arrays.asList(BlockData.WIDE));
              private static final char[] HEX = "0123456789abcdef".toCharArray();

              // Small in-memory LRU so repeated lookups cost almost nothing (never written to disk).
              private static final Map<String, Boolean> CACHE = Collections.synchronizedMap(
                      new LinkedHashMap<String, Boolean>(256, 0.75f, true) {
                          @Override
                          protected boolean removeEldestEntry(Map.Entry<String, Boolean> e) {
                              return size() > 512;
                          }
                      });

              private static String hash(String h) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] d = md.digest((BlockData.SALT + ":" + h).getBytes("UTF-8"));
                      char[] c = new char[d.length * 2];
                      for (int i = 0; i < d.length; i++) {
                          c[i * 2] = HEX[(d[i] >> 4) & 0x0F];
                          c[i * 2 + 1] = HEX[d[i] & 0x0F];
                      }
                      return new String(c);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static boolean compute(String h) {
                  if (EX.contains(hash(h))) return true;          // exact host rule
                  while (true) {                                  // domain + subdomains rule
                      if (WD.contains(hash(h))) return true;
                      int i = h.indexOf('.');
                      if (i < 0) return false;
                      h = h.substring(i + 1);
                  }
              }

              static boolean isBlocked(String host) {
                  if (host == null) return false;
                  String h = host.toLowerCase(Locale.ROOT);
                  while (h.endsWith(".")) h = h.substring(0, h.length() - 1);
                  if (h.isEmpty()) return false;
                  Boolean c = CACHE.get(h);
                  if (c != null) return c;
                  boolean r = compute(h);
                  CACHE.put(h, r);
                  return r;
              }
          }
          EOF

          # ---------------------------------------------------------------
          cat > $D/Stats.java <<'EOF'
          package com.ayush.hostaradsguard;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.SystemClock;
          import java.util.Calendar;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Locale;
          import java.util.Map;

          // Per-day counters of blocked (ad) requests. Only numbers are stored, never domains.
          final class Stats {
              private static final Map<String, Integer> MAP = new HashMap<>();
              private static SharedPreferences sp;
              private static boolean loaded = false;
              private static boolean dirty = false;
              private static long lastFlush = 0;

              static synchronized void init(Context c) {
                  if (loaded) return;
                  sp = c.getApplicationContext().getSharedPreferences("st", 0);
                  for (Map.Entry<String, ?> e : sp.getAll().entrySet()) {
                      if (e.getValue() instanceof Integer) MAP.put(e.getKey(), (Integer) e.getValue());
                  }
                  loaded = true;
              }

              private static String key(Calendar c) {
                  return String.format(Locale.US, "%04d%02d%02d",
                          c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH));
              }

              static synchronized void hit() {
                  if (!loaded) return;
                  String k = key(Calendar.getInstance());
                  Integer v = MAP.get(k);
                  MAP.put(k, v == null ? 1 : v + 1);
                  dirty = true;
                  // Save at most every 30 s, driven by traffic itself: no timer thread needed.
                  if (SystemClock.elapsedRealtime() - lastFlush > 30000) flush();
              }

              static synchronized int sum(int days) {
                  Calendar c = Calendar.getInstance();
                  int total = 0;
                  for (int i = 0; i < days; i++) {
                      Integer v = MAP.get(key(c));
                      if (v != null) total += v;
                      c.add(Calendar.DAY_OF_MONTH, -1);
                  }
                  return total;
              }

              static synchronized void flush() {
                  if (!loaded || !dirty) return;
                  Calendar old = Calendar.getInstance();
                  old.add(Calendar.DAY_OF_MONTH, -40);
                  String cutoff = key(old);
                  SharedPreferences.Editor ed = sp.edit();
                  ed.clear();
                  Iterator<Map.Entry<String, Integer>> it = MAP.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<String, Integer> e = it.next();
                      if (e.getKey().compareTo(cutoff) < 0) it.remove();
                      else ed.putInt(e.getKey(), e.getValue());
                  }
                  ed.apply();
                  dirty = false;
                  lastFlush = SystemClock.elapsedRealtime();
              }
          }
          EOF

          # ---------------------------------------------------------------
          cat > $D/DnsVpnService.java <<'EOF'
          package com.ayush.hostaradsguard;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.os.SystemClock;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.ThreadPoolExecutor;
          import java.util.concurrent.TimeUnit;

          public class DnsVpnService extends VpnService {
              public static final String ACTION_STOP = "com.ayush.hostaradsguard.STOP";
              public static volatile boolean running = false;

              private static final String[] UPSTREAM = {"1.1.1.1", "8.8.8.8",
            "2606:4700:4700::1111", "2001:4860:4860::8888"};
              private static final int UPSTREAM_TIMEOUT_MS = 1500;
              private static final int MAX_IDLE_SOCKETS = 6;

              private final ConcurrentLinkedQueue<DatagramSocket> socks = new ConcurrentLinkedQueue<>();
              private ParcelFileDescriptor tun;
              private FileOutputStream out;
              private Thread reader;
              private ThreadPoolExecutor pool;

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  if (i != null && ACTION_STOP.equals(i.getAction())) {
                      getSharedPreferences("s", 0).edit().putBoolean("enabled", false).apply();
                      KeepAliveJob.cancel(this);
                      stopVpn();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  getSharedPreferences("s", 0).edit().putBoolean("enabled", true).apply();
                  startForeground(1, buildNotification());
                  if (!running) startVpn();
                  KeepAliveJob.ensure(this);   // system-level watchdog that survives reboot
                  return START_STICKY;
              }

              private Notification buildNotification() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("dns", "Ad blocker",
                              NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, "dns") : new Notification.Builder(this);
                  return nb.setContentTitle("hostaradsguard is running")
                          .setContentText("Ad blocking is active")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .build();
              }

              private synchronized void startVpn() {
                  Stats.init(this);
                  try {
                      tun = new Builder()
                              .setSession("hostaradsguard")
                              .addAddress("198.18.0.2", 32)
                              .addDnsServer("198.18.0.1")
                              .addRoute("198.18.0.1", 32)   // only DNS traffic enters the tunnel
                              .setMtu(1500)
                              .setBlocking(true)
                              .establish();
                  } catch (Exception e) {
                      tun = null;
                  }
                  if (tun == null) {
                      KeepAliveJob.kick(this, 30000);   // try again shortly
                      stopSelf();
                      return;
                  }

                  running = true;
                  out = new FileOutputStream(tun.getFileDescriptor());
                  // Small bounded pool; idle threads exit after 20 s so nothing sits around using memory.
                  pool = new ThreadPoolExecutor(6, 6, 20, TimeUnit.SECONDS,
                          new LinkedBlockingQueue<Runnable>(512),
                          new ThreadPoolExecutor.DiscardPolicy());
                  pool.allowCoreThreadTimeOut(true);
                  reader = new Thread(this::loop, "dns-reader");
                  reader.start();
              }

              private synchronized void stopVpn() {
                  running = false;
                  try { if (tun != null) tun.close(); } catch (Exception ignored) { }
                  tun = null;
                  if (pool != null) pool.shutdownNow();
                  DatagramSocket s;
                  while ((s = socks.poll()) != null) s.close();
                  Stats.flush();
                  stopForeground(true);
              }

              @Override public void onRevoke() { stopVpn(); stopSelf(); }
              @Override public void onDestroy() { stopVpn(); super.onDestroy(); }

              private void loop() {
                  try {
                      FileInputStream in = new FileInputStream(tun.getFileDescriptor());
                      byte[] buf = new byte[32767];
                      while (running) {
                          int n = in.read(buf);   // blocks, zero CPU while idle
                          if (n < 0) break;
                          if (n == 0) continue;
                          final byte[] pkt = Arrays.copyOf(buf, n);
                          try { pool.execute(() -> handlePacket(pkt)); } catch (Exception ignored) { }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (running) stopVpn();
                  }
              }

              private static int u16(byte[] b, int o) {
                  return ((b[o] & 0xFF) << 8) | (b[o + 1] & 0xFF);
              }

              private void handlePacket(byte[] p) {
                  try {
                      if (p.length < 28 || (p[0] >> 4) != 4 || (p[9] & 0xFF) != 17) return;
                      int ihl = (p[0] & 0x0F) * 4;
                      if (p.length < ihl + 8) return;
                      int srcPort = u16(p, ihl);
                      int dstPort = u16(p, ihl + 2);
                      if (dstPort != 53) return;
                      int off = ihl + 8;
                      int len = Math.min(u16(p, ihl + 4) - 8, p.length - off);
                      if (len < 17) return;
                      byte[] q = Arrays.copyOfRange(p, off, off + len);

                      int pos = 12;
                      StringBuilder sb = new StringBuilder();
                      boolean ok = u16(q, 4) == 1 && (q[2] & 0x80) == 0 && ((q[2] >> 3) & 0x0F) == 0;
                      while (ok && pos < q.length) {
                          int l = q[pos] & 0xFF;
                          if (l == 0) break;
                          if ((l & 0xC0) != 0 || pos + 1 + l > q.length) { ok = false; break; }
                          if (sb.length() > 0) sb.append('.');
                          sb.append(new String(q, pos + 1, l, StandardCharsets.US_ASCII));
                          pos += l + 1;
                      }
                      int qEnd = pos + 5;
                      if (ok && qEnd > q.length) ok = false;

                      byte[] resp;
                      if (ok && Blocklist.isBlocked(sb.toString())) {
                          int qtype = u16(q, pos + 1);
                          if (qtype == 1) Stats.hit();   // count once per lookup (A record), not A + AAAA
                          resp = blockedResponse(q, qEnd, qtype);
                      } else {
                          resp = forward(q);
                          if (resp == null && ok) resp = servfail(q, qEnd);   // fail fast, no long hangs
                      }
                      if (resp == null) return;

                      byte[] reply = buildUdp(Arrays.copyOfRange(p, 16, 20),
                              Arrays.copyOfRange(p, 12, 16), 53, srcPort, resp);
                      synchronized (this) { out.write(reply); }
                  } catch (Exception ignored) { }
              }

              // A -> 0.0.0.0, AAAA -> ::, anything else -> empty NOERROR
              private static byte[] blockedResponse(byte[] req, int qEnd, int qtype) {
                  boolean a = qtype == 1, aaaa = qtype == 28;
                  int ans = (a || aaaa) ? 1 : 0;
                  int rdlen = a ? 4 : 16;
                  byte[] r = new byte[qEnd + (ans == 1 ? 12 + rdlen : 0)];
                  System.arraycopy(req, 0, r, 0, qEnd);
                  r[2] = (byte) (0x80 | (req[2] & 0x01));
                  r[3] = (byte) 0x80;
                  r[4] = 0; r[5] = 1;
                  r[6] = 0; r[7] = (byte) ans;
                  r[8] = 0; r[9] = 0; r[10] = 0; r[11] = 0;
                  if (ans == 1) {
                      int o = qEnd;
                      r[o++] = (byte) 0xC0; r[o++] = 0x0C;
                      r[o++] = (byte) (qtype >> 8); r[o++] = (byte) qtype;
                      r[o++] = 0; r[o++] = 1;
                      r[o++] = 0; r[o++] = 0; r[o++] = 0; r[o++] = 60;
                      r[o++] = 0; r[o++] = (byte) rdlen;
                  }
                  return r;
              }

              private static byte[] servfail(byte[] q, int qEnd) {
                  byte[] r = Arrays.copyOf(q, qEnd);
                  r[2] = (byte) (0x80 | (q[2] & 0x01));
                  r[3] = (byte) 0x82;   // RA=1, RCODE=2 (SERVFAIL)
                  r[4] = 0; r[5] = 1;
                  r[6] = 0; r[7] = 0; r[8] = 0; r[9] = 0; r[10] = 0; r[11] = 0;
                  return r;
              }

              private DatagramSocket borrow() throws Exception {
                  DatagramSocket s = socks.poll();
                  if (s == null) {
                      s = new DatagramSocket();
                      protect(s);   // keep upstream traffic outside the VPN
                  }
                  return s;
              }

              private void giveBack(DatagramSocket s, boolean healthy) {
                  if (healthy && running && socks.size() < MAX_IDLE_SOCKETS) socks.offer(s);
                  else s.close();
              }

              // Reuses sockets (no new socket per query) and ignores late/mismatched replies.
              private byte[] forward(byte[] q) {
                  for (String up : UPSTREAM) {
                      DatagramSocket s = null;
                      boolean healthy = false;
                      try {
                          s = borrow();
                          InetAddress addr = InetAddress.getByName(up);
                          s.send(new DatagramPacket(q, q.length, addr, 53));
                          byte[] b = new byte[4096];
                          DatagramPacket dp = new DatagramPacket(b, b.length);
                          long deadline = SystemClock.elapsedRealtime() + UPSTREAM_TIMEOUT_MS;
                          while (true) {
                              long left = deadline - SystemClock.elapsedRealtime();
                              if (left <= 0) break;
                              s.setSoTimeout((int) left);
                              dp.setLength(b.length);
                              s.receive(dp);
                              if (dp.getLength() >= 12 && b[0] == q[0] && b[1] == q[1]
                                      && addr.equals(dp.getAddress())) {
                                  healthy = true;
                                  return Arrays.copyOf(b, dp.getLength());
                              }
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (s != null) giveBack(s, healthy);
                      }
                  }
                  return null;
              }

              private static byte[] buildUdp(byte[] src, byte[] dst, int sp, int dp, byte[] data) {
                  int tot = 28 + data.length;
                  byte[] r = new byte[tot];
                  r[0] = 0x45;
                  r[2] = (byte) (tot >> 8); r[3] = (byte) tot;
                  r[6] = 0x40;
                  r[8] = 64; r[9] = 17;
                  System.arraycopy(src, 0, r, 12, 4);
                  System.arraycopy(dst, 0, r, 16, 4);
                  int sum = 0;
                  for (int i = 0; i < 20; i += 2) sum += ((r[i] & 0xFF) << 8) | (r[i + 1] & 0xFF);
                  while ((sum >> 16) != 0) sum = (sum & 0xFFFF) + (sum >> 16);
                  sum = ~sum & 0xFFFF;
                  r[10] = (byte) (sum >> 8); r[11] = (byte) sum;
                  r[20] = (byte) (sp >> 8); r[21] = (byte) sp;
                  r[22] = (byte) (dp >> 8); r[23] = (byte) dp;
                  int ul = 8 + data.length;
                  r[24] = (byte) (ul >> 8); r[25] = (byte) ul;
                  System.arraycopy(data, 0, r, 28, data.length);
                  return r;
              }
          }
