name: Build FireDNS APK

# Put this file at: .github/workflows/Apk.yml
# Run it from the Actions tab (Run workflow) or by pushing to main.
# The APK appears under "Artifacts" at the bottom of the run page.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Gradle project files
        run: |
          mkdir -p app/src/main/java/com/ayush/firedns
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FireDNS"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ayush.firedns'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ayush.firedns'
                  minSdk 22
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'android'
                      keyAlias 'key'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

      - name: Create manifest and icons
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:label="FireDNS"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DnsVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          python3 - <<'PY'
          import zlib, struct

          def png(path, w, h, fn):
              raw = b''.join(
                  b'\x00' + b''.join(bytes(fn(x, y)) for x in range(w))
                  for y in range(h))
              def chunk(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              data = (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw))
                      + chunk(b'IEND', b''))
              open(path, 'wb').write(data)

          def design(w, h):
              def f(x, y):
                  cx, cy = abs(x - w / 2), abs(y - h / 2)
                  if cx < h * 0.22 and cy < h * 0.30:
                      return (0x2E, 0xCC, 0x71)
                  return (0x1B, 0x2A, 0x41)
              return f

          base = 'app/src/main/res/drawable-nodpi/'
          png(base + 'banner.png', 320, 180, design(320, 180))
          png(base + 'ic_launcher.png', 192, 192, design(192, 192))
          PY

      - name: Write Java source
        run: |
          D=app/src/main/java/com/ayush/firedns

          # ---------------------------------------------------------------
          cat > $D/Blocklist.java <<'EOF'
          package com.ayush.firedns;

          import android.content.Context;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URI;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          public class Blocklist {
              public static final String URL =
                  "https://raw.githubusercontent.com/Ayush8481-dev/Ayush/refs/heads/main/Block.json";
              private static final String CACHE = "block.json";

              // Common 2-level public suffixes, so "foo.co.in" counts as an apex domain.
              private static final Set<String> SLD = new HashSet<>(Arrays.asList(
                  "co.in", "net.in", "org.in", "gov.in", "ac.in", "co.uk", "org.uk", "ac.uk",
                  "gov.uk", "com.au", "net.au", "org.au", "co.jp", "com.br", "com.cn", "com.mx",
                  "co.za", "co.nz", "com.sg", "com.tr", "co.kr", "com.hk", "com.tw"));

              private static volatile Set<String> exact = new HashSet<>();  // block this host only
              private static volatile Set<String> wide = new HashSet<>();   // block domain + all subdomains

              public static volatile int ruleCount = 0;
              public static volatile int urlRulesIgnored = 0;
              public static volatile long lastUpdate = 0;
              public static volatile String lastStatus = "not loaded yet";

              private static void addDomain(String raw, Set<String> ex, Set<String> wd) {
                  if (raw == null) return;
                  String h = raw.trim().toLowerCase(Locale.ROOT);
                  boolean wildcard = false;
                  if (h.startsWith("*.")) { h = h.substring(2); wildcard = true; }
                  while (h.endsWith(".")) h = h.substring(0, h.length() - 1);
                  if (h.isEmpty() || h.contains("/") || h.contains(" ")) return;
                  String[] p = h.split("\\.");
                  int apexLen = 2;
                  if (p.length >= 2 && SLD.contains(p[p.length - 2] + "." + p[p.length - 1])) apexLen = 3;
                  if (wildcard || p.length <= apexLen) wd.add(h);   // temp.com  -> domain + subdomains
                  else ex.add(h);                                   // hspx.temp.com -> only this host
              }

              private static void apply(String json) throws Exception {
                  JSONObject o = new JSONObject(json);
                  Set<String> ex = new HashSet<>();
                  Set<String> wd = new HashSet<>();
                  JSONArray d = o.optJSONArray("blockDomains");
                  if (d != null) for (int i = 0; i < d.length(); i++) addDomain(d.optString(i), ex, wd);

                  int ignored = 0;
                  JSONArray u = o.optJSONArray("blockUrls");
                  if (u != null) {
                      for (int i = 0; i < u.length(); i++) {
                          try {
                              URI uri = new URI(u.optString(i).trim());
                              String path = uri.getPath();
                              boolean bare = (path == null || path.isEmpty() || path.equals("/"))
                                      && uri.getQuery() == null;
                              if (bare && uri.getHost() != null) addDomain(uri.getHost(), ex, wd);
                              else ignored++;   // path-level rules cannot be enforced via DNS
                          } catch (Exception e) { ignored++; }
                      }
                  }
                  exact = ex;
                  wide = wd;
                  ruleCount = ex.size() + wd.size();
                  urlRulesIgnored = ignored;
              }

              public static boolean isBlocked(String host) {
                  if (host == null) return false;
                  String h = host.toLowerCase(Locale.ROOT);
                  while (h.endsWith(".")) h = h.substring(0, h.length() - 1);
                  if (exact.contains(h)) return true;
                  Set<String> w = wide;
                  while (true) {
                      if (w.contains(h)) return true;
                      int i = h.indexOf('.');
                      if (i < 0) return false;
                      h = h.substring(i + 1);
                  }
              }

              public static void loadCache(Context c) {
                  try {
                      File f = new File(c.getFilesDir(), CACHE);
                      if (!f.exists()) return;
                      apply(read(new FileInputStream(f)));
                      lastStatus = "loaded from cache";
                  } catch (Exception e) {
                      lastStatus = "cache error: " + e.getMessage();
                  }
              }

              public static boolean fetch(Context c) {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new java.net.URL(URL).openConnection();
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(15000);
                      conn.setUseCaches(false);
                      if (conn.getResponseCode() != 200) throw new IOException("HTTP " + conn.getResponseCode());
                      String body = read(conn.getInputStream());
                      apply(body);
                      try (FileOutputStream fo = new FileOutputStream(new File(c.getFilesDir(), CACHE))) {
                          fo.write(body.getBytes("UTF-8"));
                      }
                      lastUpdate = System.currentTimeMillis();
                      lastStatus = "updated OK";
                      return true;
                  } catch (Exception e) {
                      lastStatus = "update failed: " + e.getMessage();
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private static String read(InputStream in) throws IOException {
                  try (InputStream i = in) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] b = new byte[4096];
                      int n;
                      while ((n = i.read(b)) > 0) bo.write(b, 0, n);
                      return bo.toString("UTF-8");
                  }
              }
          }
          EOF

          # ---------------------------------------------------------------
          cat > $D/DnsVpnService.java <<'EOF'
          package com.ayush.firedns;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.LinkedList;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicLong;

          public class DnsVpnService extends VpnService {
              public static final String ACTION_STOP = "com.ayush.firedns.STOP";
              public static volatile boolean running = false;
              public static final AtomicLong total = new AtomicLong();
              public static final AtomicLong blocked = new AtomicLong();
              public static final LinkedList<String> recent = new LinkedList<>();

              private static final String[] UPSTREAM = {"1.1.1.1", "8.8.8.8"};

              private ParcelFileDescriptor tun;
              private FileOutputStream out;
              private Thread reader;
              private ExecutorService pool;
              private ScheduledExecutorService sched;

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  if (i != null && ACTION_STOP.equals(i.getAction())) {
                      getSharedPreferences("s", 0).edit().putBoolean("enabled", false).apply();
                      stopVpn();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  getSharedPreferences("s", 0).edit().putBoolean("enabled", true).apply();
                  startForeground(1, buildNotification());
                  if (!running) startVpn();
                  return START_STICKY;
              }

              private Notification buildNotification() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("dns", "DNS blocker",
                              NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, "dns") : new Notification.Builder(this);
                  return nb.setContentTitle("FireDNS is running")
                          .setContentText("Local DNS blocker active")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .build();
              }

              private synchronized void startVpn() {
                  Blocklist.loadCache(this);
                  try {
                      tun = new Builder()
                              .setSession("FireDNS")
                              .addAddress("10.0.0.2", 32)
                              .addDnsServer("10.0.0.1")
                              .addRoute("10.0.0.1", 32)   // only DNS traffic enters the tunnel
                              .setMtu(1500)
                              .setBlocking(true)
                              .establish();
                  } catch (Exception e) {
                      tun = null;
                  }
                  if (tun == null) { stopSelf(); return; }

                  running = true;
                  out = new FileOutputStream(tun.getFileDescriptor());
                  pool = Executors.newFixedThreadPool(16);
                  sched = Executors.newSingleThreadScheduledExecutor();
                  sched.schedule(this::refreshLoop, 1, TimeUnit.SECONDS);
                  reader = new Thread(this::loop, "dns-reader");
                  reader.start();
              }

              private void refreshLoop() {
                  boolean ok = Blocklist.fetch(this);
                  try {
                      if (running && sched != null && !sched.isShutdown())
                          sched.schedule(this::refreshLoop, ok ? 1800 : 60, TimeUnit.SECONDS);
                  } catch (Exception ignored) { }
              }

              private synchronized void stopVpn() {
                  running = false;
                  try { if (tun != null) tun.close(); } catch (Exception ignored) { }
                  tun = null;
                  if (pool != null) pool.shutdownNow();
                  if (sched != null) sched.shutdownNow();
                  stopForeground(true);
              }

              @Override public void onRevoke() { stopVpn(); stopSelf(); }
              @Override public void onDestroy() { stopVpn(); super.onDestroy(); }

              private void loop() {
                  try {
                      FileInputStream in = new FileInputStream(tun.getFileDescriptor());
                      byte[] buf = new byte[32767];
                      while (running) {
                          int n = in.read(buf);
                          if (n < 0) break;
                          if (n == 0) continue;
                          final byte[] pkt = Arrays.copyOf(buf, n);
                          try { pool.execute(() -> handlePacket(pkt)); } catch (Exception e) { break; }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (running) stopVpn();
                  }
              }

              private static int u16(byte[] b, int o) {
                  return ((b[o] & 0xFF) << 8) | (b[o + 1] & 0xFF);
              }

              private void handlePacket(byte[] p) {
                  try {
                      if (p.length < 28 || (p[0] >> 4) != 4 || (p[9] & 0xFF) != 17) return;
                      int ihl = (p[0] & 0x0F) * 4;
                      if (p.length < ihl + 8) return;
                      int srcPort = u16(p, ihl);
                      int dstPort = u16(p, ihl + 2);
                      if (dstPort != 53) return;
                      int off = ihl + 8;
                      int len = Math.min(u16(p, ihl + 4) - 8, p.length - off);
                      if (len < 17) return;
                      byte[] q = Arrays.copyOfRange(p, off, off + len);

                      // Parse the question name
                      int pos = 12;
                      StringBuilder sb = new StringBuilder();
                      boolean ok = u16(q, 4) == 1 && (q[2] & 0x80) == 0 && ((q[2] >> 3) & 0x0F) == 0;
                      while (ok && pos < q.length) {
                          int l = q[pos] & 0xFF;
                          if (l == 0) break;
                          if ((l & 0xC0) != 0 || pos + 1 + l > q.length) { ok = false; break; }
                          if (sb.length() > 0) sb.append('.');
                          sb.append(new String(q, pos + 1, l, StandardCharsets.US_ASCII));
                          pos += l + 1;
                      }
                      int qEnd = pos + 5;
                      if (ok && qEnd > q.length) ok = false;

                      total.incrementAndGet();
                      byte[] resp;
                      String name = sb.toString();
                      if (ok && Blocklist.isBlocked(name)) {
                          blocked.incrementAndGet();
                          synchronized (recent) {
                              recent.addFirst(name);
                              while (recent.size() > 30) recent.removeLast();
                          }
                          resp = blockedResponse(q, qEnd, u16(q, pos + 1));
                      } else {
                          resp = forward(q);
                      }
                      if (resp == null) return;

                      byte[] reply = buildUdp(Arrays.copyOfRange(p, 16, 20),
                              Arrays.copyOfRange(p, 12, 16), 53, srcPort, resp);
                      synchronized (this) { out.write(reply); }
                  } catch (Exception ignored) { }
              }

              // A -> 0.0.0.0, AAAA -> ::, anything else -> empty NOERROR
              private static byte[] blockedResponse(byte[] req, int qEnd, int qtype) {
                  boolean a = qtype == 1, aaaa = qtype == 28;
                  int ans = (a || aaaa) ? 1 : 0;
                  int rdlen = a ? 4 : 16;
                  byte[] r = new byte[qEnd + (ans == 1 ? 12 + rdlen : 0)];
                  System.arraycopy(req, 0, r, 0, qEnd);
                  r[2] = (byte) (0x80 | (req[2] & 0x01));   // QR=1, keep RD
                  r[3] = (byte) 0x80;                       // RA=1, RCODE=0
                  r[4] = 0; r[5] = 1;
                  r[6] = 0; r[7] = (byte) ans;
                  r[8] = 0; r[9] = 0; r[10] = 0; r[11] = 0;
                  if (ans == 1) {
                      int o = qEnd;
                      r[o++] = (byte) 0xC0; r[o++] = 0x0C;          // name pointer
                      r[o++] = (byte) (qtype >> 8); r[o++] = (byte) qtype;
                      r[o++] = 0; r[o++] = 1;                       // class IN
                      r[o++] = 0; r[o++] = 0; r[o++] = 0; r[o++] = 60;  // TTL
                      r[o++] = 0; r[o++] = (byte) rdlen;
                  }
                  return r;
              }

              private byte[] forward(byte[] q) {
                  for (String up : UPSTREAM) {
                      try (DatagramSocket s = new DatagramSocket()) {
                          protect(s);   // keep this socket outside the VPN
                          s.setSoTimeout(3000);
                          s.send(new DatagramPacket(q, q.length, InetAddress.getByName(up), 53));
                          byte[] b = new byte[4096];
                          DatagramPacket dp = new DatagramPacket(b, b.length);
                          s.receive(dp);
                          return Arrays.copyOf(b, dp.getLength());
                      } catch (Exception ignored) { }
                  }
                  return null;
              }

              private static byte[] buildUdp(byte[] src, byte[] dst, int sp, int dp, byte[] data) {
                  int tot = 28 + data.length;
                  byte[] r = new byte[tot];
                  r[0] = 0x45;
                  r[2] = (byte) (tot >> 8); r[3] = (byte) tot;
                  r[6] = 0x40;
                  r[8] = 64; r[9] = 17;
                  System.arraycopy(src, 0, r, 12, 4);
                  System.arraycopy(dst, 0, r, 16, 4);
                  int sum = 0;
                  for (int i = 0; i < 20; i += 2) sum += ((r[i] & 0xFF) << 8) | (r[i + 1] & 0xFF);
                  while ((sum >> 16) != 0) sum = (sum & 0xFFFF) + (sum >> 16);
                  sum = ~sum & 0xFFFF;
                  r[10] = (byte) (sum >> 8); r[11] = (byte) sum;
                  r[20] = (byte) (sp >> 8); r[21] = (byte) sp;
                  r[22] = (byte) (dp >> 8); r[23] = (byte) dp;
                  int ul = 8 + data.length;
                  r[24] = (byte) (ul >> 8); r[25] = (byte) ul;
                  System.arraycopy(data, 0, r, 28, data.length);
                  return r;
              }
          }
          EOF

          # ---------------------------------------------------------------
          cat > $D/BootReceiver.java <<'EOF'
          package com.ayush.firedns;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  if (!c.getSharedPreferences("s", 0).getBoolean("enabled", true)) return;
                  if (VpnService.prepare(c) != null) return;   // VPN permission not granted yet
                  Intent s = new Intent(c, DnsVpnService.class);
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s);
                  else c.startService(s);
              }
          }
          EOF

          # ---------------------------------------------------------------
          cat > $D/MainActivity.java <<'EOF'
          package com.ayush.firedns;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.DateFormat;
          import java.util.Date;

          public class MainActivity extends Activity {
              private TextView status;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override public void run() { render(); h.postDelayed(this, 1000); }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(60, 40, 60, 40);
                  root.setBackgroundColor(0xFF101820);

                  TextView title = new TextView(this);
                  title.setText("FireDNS - local DNS blocker");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  root.addView(title);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  Button start = new Button(this);
                  start.setText("Start");
                  start.setOnClickListener(v -> startVpn());
                  Button stop = new Button(this);
                  stop.setText("Stop");
                  stop.setOnClickListener(v -> {
                      Intent i = new Intent(this, DnsVpnService.class);
                      i.setAction(DnsVpnService.ACTION_STOP);
                      startService(i);
                  });
                  Button refresh = new Button(this);
                  refresh.setText("Refresh list");
                  refresh.setOnClickListener(v -> {
                      final android.content.Context c = getApplicationContext();
                      new Thread(() -> Blocklist.fetch(c)).start();
                  });
                  row.addView(start);
                  row.addView(stop);
                  row.addView(refresh);
                  root.addView(row);

                  status = new TextView(this);
                  status.setTextColor(Color.WHITE);
                  status.setTextSize(16);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(status);
                  root.addView(sv);

                  setContentView(root);
                  start.requestFocus();

                  if (!DnsVpnService.running
                          && getSharedPreferences("s", 0).getBoolean("enabled", true)) {
                      startVpn();
                  }
              }

              private void startVpn() {
                  Intent i = VpnService.prepare(this);
                  if (i != null) startActivityForResult(i, 1);
                  else launch();
              }

              private void launch() {
                  Intent s = new Intent(this, DnsVpnService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(s);
                  else startService(s);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent d) {
                  if (req == 1 && res == RESULT_OK) launch();
              }

              private void render() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("\nService: ").append(DnsVpnService.running ? "RUNNING" : "stopped");
                  sb.append("\nRules loaded: ").append(Blocklist.ruleCount);
                  sb.append("\nList status: ").append(Blocklist.lastStatus);
                  if (Blocklist.lastUpdate > 0)
                      sb.append("\nLast update: ")
                        .append(DateFormat.getDateTimeInstance().format(new Date(Blocklist.lastUpdate)));
                  sb.append("\nURL rules with a path (not enforceable via DNS): ")
                    .append(Blocklist.urlRulesIgnored);
                  sb.append("\n\nDNS queries: ").append(DnsVpnService.total.get());
                  sb.append("\nBlocked: ").append(DnsVpnService.blocked.get());
                  sb.append("\n\nRecently blocked:\n");
                  synchronized (DnsVpnService.recent) {
                      int n = 0;
                      for (String s : DnsVpnService.recent) {
                          sb.append("  ").append(s).append('\n');
                          if (++n >= 12) break;
                      }
                  }
                  status.setText(sb.toString());
              }

              @Override protected void onResume() { super.onResume(); h.post(tick); }
              @Override protected void onPause() { super.onPause(); h.removeCallbacks(tick); }
          }
          EOF

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FireDNS, O=Ayush, C=IN"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/FireDNS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireDNS-apk
          path: out/FireDNS.apk
