          pip install pillow --break-system-packages -q || pip install pillow -q
          python3 - <<'PYEOF'
          from PIL import Image
          logo = Image.open('/tmp/logo.png').convert('RGBA')
          bb = logo.getchannel('A').point(lambda a: 255 if a > 20 else 0).getbbox()
          if bb:
              logo = logo.crop(bb)
          px = [p for p in logo.resize((64, 64)).getdata() if p[3] > 200]
          lum = (sum(0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2] for p in px) / len(px)) if px else 255
          bgc = (255, 255, 255, 255) if lum < 110 else (5, 6, 12, 255)

          def make(w, h, pad, out):
              bg = Image.new('RGBA', (w, h), bgc)
              s = min(w * (1 - 2 * pad) / logo.width, h * (1 - 2 * pad) / logo.height)
              l = logo.resize((max(1, int(logo.width * s)), max(1, int(logo.height * s))), Image.LANCZOS)
              bg.alpha_composite(l, ((w - l.width) // 2, (h - l.height) // 2))
              bg.convert('RGB').save(out)

          make(512, 512, 0.10, 'app/src/main/res/drawable-nodpi/ic_launcher.png')
          make(640, 360, 0.15, 'app/src/main/res/drawable-nodpi/ic_banner.png')
          print('logo + banner written')
