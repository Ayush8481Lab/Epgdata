              private fun iconBtn(res: Int, onClick: () -> Unit): ImageView {
                  val v = ImageView(this).apply {
                      setImageResource(res)
                      setPadding(u(9), u(9), u(9), u(9))
                      setColorFilter(Color.WHITE)
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  fun st() {
                      val f = v.isFocused
                      v.setColorFilter(if (f) Color.BLACK else Color.WHITE)
                      v.background = if (f) GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.WHITE) } else null
                  }
                  v.setOnFocusChangeListener { _, _ -> st() }
                  v.setOnClickListener { onClick() }
                  return v
              }

              private fun pill(label: String, icon: Int, onClick: () -> Unit): LinearLayout {
                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(u(18), u(10), u(22), u(10))
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  val iv = ImageView(this).apply { setImageResource(icon) }
                  val tv = TextView(this).apply { text = label; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.WHITE) }
                  tx(tv, 16f)
                  ll.addView(iv, LinearLayout.LayoutParams(u(22), u(22)).apply { rightMargin = u(10) })
                  ll.addView(tv, LinearLayout.LayoutParams(-2, -2))
                  fun st() {
                      val f = ll.isFocused
                      tv.setTextColor(if (f) Color.BLACK else Color.WHITE)
                      iv.setColorFilter(if (f) Color.BLACK else Color.WHITE)
                      ll.background = GradientDrawable().apply {
                          cornerRadius = u(28).toFloat()
                          setColor(if (f) Color.WHITE else Color.TRANSPARENT)
                      }
                  }
                  st()
                  ll.setOnFocusChangeListener { _, _ -> st() }
                  ll.setOnClickListener { onClick() }
                  return ll
              }

