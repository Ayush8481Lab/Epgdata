              private fun updatePlus() {
                  val d = detailItem
                  val on = d != null && Store.inList(d.cid)
                  (dPlus.getChildAt(0) as ImageView).setImageResource(if (on) R.drawable.ic_check else R.drawable.ic_add)
                  (dPlus.getChildAt(1) as TextView).text = if (on) "In My List" else "My List"
              }

              // "Resume S1 E5" + bar + "23m left" when this show / movie was left before RESUME_MAX of its length
              private fun updateResume() {
                  val d = detailItem
                  val r = if (d == null) null else Store.getResume(d.cid)
                  if (r == null || r.dur <= 0) {
                      dResumeBox.visibility = View.GONE
                      if (lastBtn === dResumeBtn) lastBtn = null
                      return
                  }
                  val durMs = r.dur * 1000L
                  val pre = if (detailMovie) "Resume Movie"
                      else ("Resume " + (if (r.season > 0) "S${r.season} " else "") + (if (r.num > 0) "E${r.num}" else "")).trim()
                  dResumeBtn.text = "▶  $pre"
                  dResumeBar.frac = (r.pos.toFloat() / durMs).coerceIn(0f, 1f)
                  dResumeBar.invalidate()
                  dResumeTime.text = fmtMinLeft(r.pos, durMs)
                  dResumeBox.visibility = View.VISIBLE
              }

              private fun resumeNow() {
                  val d = detailItem ?: return
                  val r = Store.getResume(d.cid) ?: return
                  val ep = Ep(r.epId, r.title, r.num, "", r.thumb, r.dur, 0L)
                  openPlayer(ep, r.season, false, detailMovie, null, r.pos)
              }

              // saves where the user is in the running episode / movie (called every ~5s, on leaving the player, on stop)
              private fun saveProgress() {
                  if (!playTrack || playShowCid.isBlank()) return
                  val p = mainPlayer ?: return
                  val ep = curPlayEp ?: return
                  val dur = if (p.duration > 0) p.duration else ep.dur * 1000L
                  if (dur <= 0L) return
                  val pos = p.currentPosition
                  if (pos >= (dur * RESUME_MAX).toLong()) Store.clearResume(playShowCid)
                  else if (pos >= 5000L) Store.putResume(Resume(playShowCid, playShowSub, ep.id, ep.title, ep.num, curPlaySeason,
                      ep.thumb, (dur / 1000L).toInt(), pos, System.currentTimeMillis()))
              }

