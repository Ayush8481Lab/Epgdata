              @Synchronized fun token(): String? {
                  val now = System.currentTimeMillis()
                  if (tok.isNotEmpty() && now < max(expMs - 600000L, at + 60000L)) return tok
                  val s = fetchStream(LIVE_AUTH_ID)
                  val raw = s?.url
                  if (raw == null) return if (tok.isNotEmpty() && now < expMs) tok else null
                  val m = Regex("hdnea=([^&\\s]+)").find(raw) ?: return null
                  tok = "hdnea=" + m.groupValues[1]
