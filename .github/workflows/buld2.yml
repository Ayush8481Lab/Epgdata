              (col.getChildAt(0) as ImageView).setImageResource(if (offline) R.drawable.ic_wifi_off else R.drawable.ic_error)
              (col.getChildAt(1) as TextView).text = if (offline) "No internet connection" else "Something went wrong"
              (col.getChildAt(2) as TextView).text = if (offline) "Check your Wi-Fi or mobile data and try again."
                  else if (msg.isNotEmpty()) msg else "Please try again in a moment."
              col.visibility = View.VISIBLE
          }

