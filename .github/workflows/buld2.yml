          // =====================================================================================
          // Detail page (show / movie)
          // =====================================================================================
          class MobileDetailActivity : Activity() {
              private lateinit var item: Item
              private var movie = false
              private var tok = 0
              private lateinit var bgIv: ImageView
              private lateinit var logoIv: ImageView
              private lateinit var titleTv: TextView
              private lateinit var tagTv: TextView
              private lateinit var metaTv: TextView
