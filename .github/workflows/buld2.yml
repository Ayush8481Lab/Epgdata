          // Gap on the right side of the banner (units). 0 = banner runs to the right screen edge.
          const val CARD_RIGHT_GAP = 40
          // Trending rank numbers (1 2 3 ... 10 ...):
          //   RANK_TIGHT   = letter spacing of 2 digit numbers (negative = the digits of 10, 11 ... move closer together)
          //   RANK_OVERLAP = how far the number hides under its poster (share of the number size) => number touches the poster, no gap
          //   RANK_GAP     = gap between a poster and the NEXT number (units)
          const val RANK_TIGHT = -0.10f
          const val RANK_OVERLAP = 0.03f
          const val RANK_GAP = 8
          // resume watching: a program stopped before this share of its length shows "Resume" on its detail page
          const val RESUME_MAX = 0.95f

          // ---- IMAGE WIDTHS (CDN params: ?h=auto&w=<n>&q=eco). Smaller = much faster download + decode. ----
          const val W_LOGO = 700               // title image (masthead_logo_rectangualar -> masthead_logo -> launcher_logo), ?h=auto&w=700&q=eco
          const val W_BG = 1200                // all background banners
          const val W_PORTRAIT = 500           // portrait cards (shown ~170-260px wide, 500 is already 2x sharp)
          const val W_SPOT = 600               // spotlight strips
          const val W_EP = 480                 // episode thumbnails (shown ~310-460px wide)
          const val W_THUMB = 1000             // episode / movie thumbnail shown full screen while the player is loading / buffering
          const val W_CARD = 1280              // full width card / promo banners

          data class Item(
              val id: String, val title: String, val portrait: String?, val landscape: String?,
              val bg: String?, val logo: String?, val meta: String, val desc: String, val trailer: String?, val spot: String?,
              val cid: String, val sub: String,
              val obj: String, val season: Int, val epNum: Int, val epTitle: String, val dur: Int, val air: Long,
              val cta: String = "",                 // sony://asset/<id> | sony://page/<slug>-<id>  (promo / card / square tiles)
              val subtitle: String = "",
              val cardImg: String? = null,          // image of a card / square / promo tile
              val launcher: Boolean = false,        // LAUNCHER_ITEM style tile WITHOUT a background image: no hero (banner / title) on focus
              val aspect: Float = 0f                // width / height of a card image (probed), 0 = unknown
          )

          // kind: spot | portrait | trending | square | landscape | card
          class Row(val title: String, val spotlight: Boolean, val items: List<Item>, val kind: String = if (spotlight) "spot" else "portrait") {
              var dw = 0      // card / promo rows: banner width (from the CONTENT_LEFT line to the right gap)
              var dh = 0      // card / promo rows: height that fits the real image aspect ratio (capped)
              var ad: Any? = null   // cached horizontal adapter of this row (reused when the row scrolls back into view => no re-creation lag)
          }
          class Season(val id: String, val title: String, val count: Int, val num: Int, val air: Long)
          class Ep(val id: String, val title: String, val num: Int, val desc: String, val thumb: String?, val dur: Int, val air: Long)
          class DetailData(val seasons: List<Season>, val embedded: Map<String, List<Ep>>, val latest: Ep?)
          class SubInfo(val url: String, val lang: String, val label: String)
          class StreamInfo(val url: String, val enc: Boolean, val laUrl: String, val drm: String, val subs: List<SubInfo>)
          // extra data from the episode DETAIL-V2 response: subtitles (platformVariants[].subtitlesLanguages[]), seek-preview sprite, exact titles
          class EpExtra(val subs: List<SubInfo>, val sprite: String?, val sn: Int, val en: Int, val et: String?)
          // title image + background that were fetched from the show / movie DETAIL-V2 api for a listing item that came without them
          class Enr(val logo: String?, val bg: String?)
          // one home-style page (Home = 1, My List = 2, Originals = 3, TV Shows = 4, Sports = 5, Movies = 6): own rows, own load state
          class PageState(val td: TabData, val row: Int, val pos: Int)   // back stack entry when a landing page is opened from a tile
          class TabData(val idx: Int, val url: String) {
              val rows = ArrayList<Row>()
              var loaded = false
              var loading = false
          }
          // resume watching data of one show / movie (key = content id of the show / movie bundle)
          class Resume(val showCid: String, val sub: String, val epId: String, val title: String, val num: Int, val season: Int,
                       val thumb: String?, val dur: Int, val pos: Long, val ts: Long)

          // Saved data: "My List" + "resume watching" (SharedPreferences)
          object Store {
              private fun sp() = Prefetch.app.getSharedPreferences("liv", Context.MODE_PRIVATE)

              fun myList(): ArrayList<Item> {
                  val out = ArrayList<Item>()
                  try {
                      val a = JSONArray(sp().getString("list", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.optJSONObject(i) ?: continue
                          val cid = o.str("cid") ?: continue
                          out.add(Item(cid, o.optString("title"), o.str("portrait"), o.str("landscape"), o.str("bg"), o.str("logo"),
                              o.optString("meta"), o.optString("desc"), null, null, cid, o.optString("sub"), OBJ_VOD, 0, 0, "", 0, 0L))
                      }
                  } catch (e: Exception) { }
                  return out
              }

              fun inList(cid: String): Boolean = myList().any { it.cid == cid }

              // returns true when the item is IN the list afterwards
              fun toggle(i: Item): Boolean {
                  val l = myList()
                  val had = l.removeAll { it.cid == i.cid }
                  if (!had) l.add(0, i)
                  val a = JSONArray()
                  for (x in l) a.put(JSONObject().apply {
                      put("cid", x.cid); put("title", x.title); put("sub", x.sub)
                      put("portrait", x.portrait ?: JSONObject.NULL)
                      put("landscape", x.landscape ?: JSONObject.NULL)
                      put("bg", x.bg ?: JSONObject.NULL)
                      put("logo", x.logo ?: JSONObject.NULL)
                      put("meta", x.meta); put("desc", x.desc)
                  })
                  sp().edit().putString("list", a.toString()).apply()
                  return !had
              }

              fun getResume(k: String): Resume? = try {
                  val o = JSONObject(sp().getString("resume", "{}")).optJSONObject(k)
                  if (o == null) null else Resume(k, o.optString("sub"), o.optString("epId"), o.optString("title"), o.optInt("num"),
                      o.optInt("season"), o.str("thumb"), o.optInt("dur"), o.optLong("pos"), o.optLong("ts"))
              } catch (e: Exception) { null }

              fun putResume(r: Resume) {
                  try {
                      val all = JSONObject(sp().getString("resume", "{}"))
                      all.put(r.showCid, JSONObject().apply {
                          put("sub", r.sub); put("epId", r.epId); put("title", r.title); put("num", r.num); put("season", r.season)
                          put("thumb", r.thumb ?: JSONObject.NULL); put("dur", r.dur); put("pos", r.pos); put("ts", r.ts)
                      })
                      sp().edit().putString("resume", all.toString()).apply()
                  } catch (e: Exception) { }
              }

              fun clearResume(k: String) {
                  try {
                      val all = JSONObject(sp().getString("resume", "{}"))
                      if (all.has(k)) { all.remove(k); sp().edit().putString("resume", all.toString()).apply() }
                  } catch (e: Exception) { }
              }
          }

          // thin progress bar of the resume block (white track, yellow fill)
          class BarView(c: Context) : View(c) {
              var frac = 0f
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  pt.color = Color.argb(90, 255, 255, 255)
                  cv.drawRoundRect(0f, 0f, w, h, h, h, pt)
                  pt.color = Color.parseColor("#FFC107")
                  cv.drawRoundRect(0f, 0f, w * frac.coerceIn(0f, 1f), h, h, h, pt)
              }
          }

          // Modern skeleton block: dark rounded rect with a soft light band sweeping across it (all blocks sweep in sync).
          // Stops drawing (and animating) automatically when the view is hidden.
          class ShimmerView(c: Context, private val rad: Float) : View(c) {
              private val base = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(30, 32, 46) }
              private val sheen = Paint(Paint.ANTI_ALIAS_FLAG)
              private val mtx = Matrix()
              private val box = RectF()
              private var grad: LinearGradient? = null
              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val g = LinearGradient(0f, 0f, max(1f, w * 0.6f), 0f,
                      intArrayOf(0x00FFFFFF, 0x2EFFFFFF, 0x00FFFFFF), floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP)
                  grad = g
                  sheen.shader = g
              }
              override fun onDraw(cv: Canvas) {
                  box.set(0f, 0f, width.toFloat(), height.toFloat())
                  cv.drawRoundRect(box, rad, rad, base)
                  val g = grad ?: return
                  val t = (SystemClock.uptimeMillis() % 1400L) / 1400f
                  val bw = width * 0.6f
                  mtx.setTranslate(-bw + t * (width + bw), 0f)
                  g.setLocalMatrix(mtx)
                  cv.drawRoundRect(box, rad, rad, sheen)
                  postInvalidateOnAnimation()
              }
          }

          // Player buffering animation (Hotstar style): faint ring + an arc that spins and grows / shrinks,
          // painted with a pink -> blue gradient (pink tail, blue head).
          class BufferView(c: Context) : View(c) {
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; color = Color.argb(60, 255, 255, 255) }
              private val arc = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val box = RectF()
              private val pink = Color.parseColor("#FF3D9A")
              private val blue = Color.parseColor("#3D8BFF")
              private var rot = 0f
              private var sweep = 40f
              private val spin = ValueAnimator.ofFloat(0f, 360f).apply {
                  duration = 1200L; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { rot = it.animatedValue as Float; invalidate() }
              }
              private val grow = ValueAnimator.ofFloat(35f, 250f).apply {
                  duration = 800L; repeatCount = ValueAnimator.INFINITE; repeatMode = ValueAnimator.REVERSE
                  interpolator = AccelerateDecelerateInterpolator()
                  addUpdateListener { sweep = it.animatedValue as Float }
              }
              private fun go() { if (!spin.isStarted) { spin.start(); grow.start() } }
              private fun halt() { spin.cancel(); grow.cancel() }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); if (isShown) go() }
              override fun onDetachedFromWindow() { halt(); super.onDetachedFromWindow() }
              override fun onVisibilityChanged(changedView: View, visibility: Int) {
                  super.onVisibilityChanged(changedView, visibility)
                  if (isShown) go() else halt()
              }
              override fun onDraw(c: Canvas) {
                  val s = min(width, height).toFloat()
                  val sw = s * 0.085f
                  ring.strokeWidth = sw
                  arc.strokeWidth = sw
                  val ox = (width - s) / 2f
                  val oy = (height - s) / 2f
                  box.set(ox + sw, oy + sw, ox + s - sw, oy + s - sw)
                  c.drawOval(box, ring)
                  val cx = width / 2f
                  val cy = height / 2f
                  val f = (sweep / 360f).coerceIn(0.1f, 0.95f)
                  arc.shader = SweepGradient(cx, cy, intArrayOf(pink, blue, blue), floatArrayOf(0f, f, 1f))
                  c.save()
                  c.rotate(rot, cx, cy)                         // gradient rotates together with the arc
                  c.drawArc(box, 0f, sweep, false, arc)
                  c.restore()
              }
          }

          // Player seek bar: white progress, yellow thumb (no ad-break markers)
          class SeekView(c: Context) : View(c) {
              var dur = 0L
              var pos = 0L
              var buf = 0L
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              init { isFocusable = true; isFocusableInTouchMode = true; isClickable = true }
              override fun onFocusChanged(gainFocus: Boolean, direction: Int, previouslyFocusedRect: Rect?) {
                  super.onFocusChanged(gainFocus, direction, previouslyFocusedRect)
                  invalidate()
              }
              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  val w = width.toFloat()
                  val cy = height / 2f
                  val th = (if (isFocused) 5f else 3f) * d
                  val l = 10f * d
                  val r = w - 10f * d
                  val len = r - l
                  pt.style = Paint.Style.FILL
                  pt.color = Color.argb(80, 255, 255, 255)
                  c.drawRoundRect(l, cy - th / 2, r, cy + th / 2, th, th, pt)
                  if (dur > 0) {
                      val bx = l + len * (buf.toFloat() / dur).coerceIn(0f, 1f)
                      pt.color = Color.argb(130, 255, 255, 255)
                      c.drawRoundRect(l, cy - th / 2, bx, cy + th / 2, th, th, pt)
                      val px = l + len * (pos.toFloat() / dur).coerceIn(0f, 1f)
                      pt.color = Color.WHITE
                      c.drawRoundRect(l, cy - th / 2, px, cy + th / 2, th, th, pt)
                      pt.color = Color.parseColor("#FFC107")
                      c.drawCircle(px, cy, (if (isFocused) 9f else 7f) * d, pt)
                  } else {
                      pt.color = Color.parseColor("#FFC107")
                      c.drawCircle(l, cy, 7f * d, pt)
                  }
              }
          }

          // Cuts the transparent border off a title PNG so the visible artwork starts exactly at the left edge of the text under it
          // (and the view then hugs the artwork, so there is no empty frame around it).
          // Faint glow / compression noise is ignored (alpha > 24 and at least 2 pixels per column / row).
          // Scans ONE row at a time (no giant pixel array).
          class TrimTransform : BitmapTransformation() {
              override fun updateDiskCacheKey(messageDigest: MessageDigest) {
                  messageDigest.update("trim_alpha_v3".toByteArray())
              }
              override fun equals(other: Any?) = other is TrimTransform
              override fun hashCode() = 987656
              override fun transform(pool: BitmapPool, toTransform: Bitmap, outWidth: Int, outHeight: Int): Bitmap {
                  if (toTransform.config != Bitmap.Config.ARGB_8888) return toTransform
                  val w = toTransform.width
                  val h = toTransform.height
                  val line = IntArray(w)
                  val cols = IntArray(w)
                  val rws = IntArray(h)
                  for (y in 0 until h) {
                      toTransform.getPixels(line, 0, w, 0, y, w, 1)
                      var c = 0
                      for (x in 0 until w) {
                          if ((line[x] ushr 24) > 24) { cols[x]++; c++ }
                      }
                      rws[y] = c
                  }
                  var minX = 0; while (minX < w && cols[minX] < 2) minX++
                  var maxX = w - 1; while (maxX >= 0 && cols[maxX] < 2) maxX--
                  var minY = 0; while (minY < h && rws[minY] < 2) minY++
                  var maxY = h - 1; while (maxY >= 0 && rws[maxY] < 2) maxY--
                  if (maxX < minX || maxY < minY) return toTransform
                  if (minX == 0 && minY == 0 && maxX == w - 1 && maxY == h - 1) return toTransform
                  return Bitmap.createBitmap(toTransform, minX, minY, maxX - minX + 1, maxY - minY + 1)
              }
          }

          object Net {
              val client: OkHttpClient = OkHttpClient.Builder()
                  .dispatcher(Dispatcher().apply { maxRequests = 96; maxRequestsPerHost = 32 })
                  .connectionPool(ConnectionPool(16, 5, TimeUnit.MINUTES))
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(20, TimeUnit.SECONDS)
                  .build()
          }

          object Api {
              val pool = Executors.newFixedThreadPool(6)
              @Volatile var lastError = ""

              // Edit headers here if the API asks for more (token, device id, etc.)
              fun get(url: String): JSONObject? {
                  return try {
                      val req = Request.Builder().url(url)
                          .header("User-Agent", "Mozilla/5.0 (Linux; Android 12; TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36")
                          .header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://www.sonyliv.com")
                          .header("Referer", "https://www.sonyliv.com/")
                          .header("x-via-device", "true")
                          .build()
                      Net.client.newCall(req).execute().use { r ->
                          if (r.isSuccessful) JSONObject(r.body!!.string())
                          else { lastError = "HTTP " + r.code + " for " + url.take(90); null }
                      }
                  } catch (e: Exception) {
                      lastError = e.toString()
                      null
                  }
              }

              // stream url request (POST json) - same headers as the web version, direct to sonyliv (no gateway)
              fun post(url: String, json: String): JSONObject? {
                  return try {
                      val req = Request.Builder().url(url)
                          .post(json.toRequestBody("application/json".toMediaType()))
                          .header("User-Agent", STREAM_UA)
                          .header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://www.sonyliv.com")
                          .header("Referer", "https://www.sonyliv.com/")
                          .header("x-via-device", "true")
                          .header("td_client_hints", TD_CLIENT_HINTS)
                          .build()
                      Net.client.newCall(req).execute().use { r ->
                          val body = r.body?.string().orEmpty()
                          if (r.isSuccessful && body.isNotBlank()) JSONObject(body)
                          else { lastError = "HTTP " + r.code + " " + body.take(140); null }
                      }
                  } catch (e: Exception) {
                      lastError = e.toString()
                      null
                  }
              }
          }

          fun randomHex(n: Int): String {
              val b = ByteArray(n)
              SecureRandom().nextBytes(b)
              return b.joinToString("") { "%02x".format(it) }
          }

          // POST stream url (with /freepreview fallback) => videoURL + DRM license info
          fun fetchStream(contentId: String): StreamInfo? {
              val payload = JSONObject().apply {
                  put("actionType", "play")
                  put("browser", "chrome")
                  put("deviceId", randomHex(16) + "-" + System.currentTimeMillis())
                  put("os", "Android")
                  put("platform", "mweb")
                  put("hasLAURLEnabled", true)
                  put("adsParams", JSONObject().apply {
                      put("Idtype", "uuid")
                      put("Is_lat", "0")
                      put("ppid", randomHex(16))
                      put("preroll", true)
                  })
              }.toString()
              val base = STREAM_API + contentId
              for (u in listOf(base, "$base/freepreview")) {
                  val j = Api.post(u, payload) ?: continue
                  val ro = (j.optJSONObject("data") ?: j).optJSONObject("resultObj") ?: continue
                  val v = ro.str("videoURL") ?: continue
                  val la = ro.optJSONObject("LA_Details")
                  val subs = ArrayList<SubInfo>()
                  val sa = ro.optJSONArray("subtitle")
                  if (sa != null) for (k in 0 until sa.length()) {
                      val o = sa.optJSONObject(k) ?: continue
                      val su = o.str("subtitleUrl") ?: o.str("url") ?: o.str("subtitle_url") ?: o.str("file") ?: continue
                      val lang = o.str("languageCode") ?: o.str("language") ?: o.str("subtitleLanguageName") ?: "und"
                      val label = o.str("subtitleLanguageName") ?: o.str("label") ?: lang
                      subs.add(SubInfo(su, lang, label))
                  }
                  return StreamInfo(v, ro.optBoolean("isEncrypted"), la?.str("laURL") ?: "", (la?.optString("drm") ?: "").uppercase(), subs)
              }
              return null
          }

          // removes tracking_params and adServer from the url
          fun stripAdParams(raw: String): String {
              if (raw.isEmpty()) return raw
              var frag = ""
              var work = raw
              val h = raw.indexOf('#')
              if (h != -1) { frag = raw.substring(h); work = raw.substring(0, h) }
              val q = work.indexOf('?')
              if (q == -1) return work + frag
              val base = work.substring(0, q)
              val query = work.substring(q + 1)
              val kept = query.split("&").filter { it.isNotEmpty() }.filter {
                  val k = it.substringBefore("=")
                  k != "tracking_params" && k != "adServer"
              }
              return if (kept.isEmpty()) base + frag else base + "?" + kept.joinToString("&") + frag
          }

          // url actually given to the player (live DAI urls: ad params stripped; VOD: host rewrites like the web version)
          fun playableUrl(raw: String): String {
              if (raw.isEmpty()) return raw
              if (Regex("^https?://(sonymtmnew|sonydaimenew)\\.akamaized\\.net", RegexOption.IGNORE_CASE).containsMatchIn(raw)) {
                  return stripAdParams(raw)
              }
              if (!REWRITE_HOSTS) return raw
              var r = raw
              for ((a, b) in HOST_MAP) {
                  r = r.replace(Regex("^https?://" + Regex.escape(a), RegexOption.IGNORE_CASE), "https://" + b)
              }
              return r
          }

          fun fmtClock(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0L)
              return "%02d:%02d:%02d".format(s / 3600, (s % 3600) / 60, s % 60)
          }

          // Netflix style: ONLY the time that is left until the end of the program ("1:14:12" / "43:21")
          fun fmtLeft(pos: Long, dur: Long): String {
              if (dur <= 0L) return ""
              val s = ((dur - pos) / 1000).coerceAtLeast(0L)
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) "%d:%02d:%02d".format(h, m, sec) else "%02d:%02d".format(m, sec)
          }

          // "1h 12m left" / "23m left" (resume block)
          fun fmtMinLeft(posMs: Long, durMs: Long): String {
              val mins = ((durMs - posMs) / 60000L).coerceAtLeast(1L)
              return if (mins >= 60) "${mins / 60}h ${mins % 60}m left" else "${mins}m left"
          }

          // old image host -> new image host (png / jpg / everything), path + params untouched
          fun cdn(u: String): String = if (u.startsWith(IMG_OLD)) IMG_NEW + u.substring(IMG_OLD.length) else u

          // CDN resizing: small + eco quality = much faster  ->  url?h=auto&w=<w>&q=eco   (host already switched to the new CDN)
          fun img(u: String?, w: Int): String? {
              if (u.isNullOrBlank()) return null
              val b = cdn(u)
              return b + (if (b.contains("?")) "&" else "?") + "h=auto&w=" + w + "&q=eco"
          }

          // safe string getter: null when missing / JSON null / blank
          fun JSONObject.str(k: String): String? {
              if (!has(k) || isNull(k)) return null
              val v = optString(k, "")
              return if (v.isBlank() || v == "null") null else v
          }

          // Launcher items, ad containers and ad slides (LAUNCHER_ITEM "TEST ... AD Spotlight ...", ad_template, ad_unit ...) never show up as rows or cards.
          fun isAd(o: JSONObject, allowLauncher: Boolean = false): Boolean {
              val layout = o.optString("layout").lowercase()
              if ((!allowLauncher && layout == "launcher_item") || layout == "ad_template" || layout.startsWith("ad_")) return true
              val mo = o.optJSONObject("metadata")
              if (!allowLauncher && mo != null && mo.optString("objectType").equals("LAUNCHER", true)) return true
              val ed = o.optJSONObject("editorialMetadata")
              if (ed != null && (ed.str("ad_unit") != null || ed.str("ad_unit_v1") != null || ed.str("ad_type") != null)) return true
              val m = mo ?: return false
              if (m.str("ad_unit") != null || m.str("ad_unit_mweb") != null) return true
              val t = m.str("title") ?: m.str("label") ?: o.optString("title")
              return t.startsWith("AD ") || t.startsWith("Ad ") || t.contains("Above Spotlight", true) || t.contains("AD Spotlight", true)
          }

          fun fmtDur(sec: Int): String {
              if (sec <= 0) return ""
              val h = sec / 3600
              val m = (sec % 3600) / 60
              return if (h > 0) "${h}h ${m}m" else "$m mins"
          }

          fun fmtDate(ms: Long, withYear: Boolean): String {
              if (ms <= 0L) return ""
              return SimpleDateFormat(if (withYear) "dd MMM yyyy" else "dd MMM", Locale.ENGLISH).format(Date(ms))
          }

          // "DOLBY_VISION" -> "Dolby Vision", "UHD" -> "4K" ...
          fun qLabel(s: String): String = when (s.uppercase()) {
              "UHD" -> "4K"
              "FULL_HD" -> "Full HD"
              "HD" -> "HD"
              "SDR" -> "SDR"
              "HDR", "HDR10" -> "HDR"
              "DOLBY_VISION" -> "Dolby Vision"
              "DOLBY_ATMOS" -> "Dolby Atmos"
              "STEREO" -> "Stereo"
              else -> s.replace('_', ' ')
          }

          // 3 background threads, download to disk only (no bitmaps in RAM), wait only briefly while the visible images load.
          // Glide has 8 source threads (see App.kt) so these 3 can never starve the images on screen.
          // While the player is open (paused = true) prefetch stops completely so the video gets all the bandwidth.
          object Prefetch {
              lateinit var app: Context
              @Volatile var gate = true
              @Volatile var paused = false
              private val queue = LinkedBlockingDeque<String>()
              private val seen = java.util.Collections.synchronizedSet(HashSet<String>())

              private fun loop() {
                  while (true) {
                      try {
                          val u = queue.takeFirst()
                          while (paused) Thread.sleep(250)
                          var w = 0
                          while (!gate && w < 12) { Thread.sleep(100); w++ }
                          Glide.with(app).downloadOnly().load(u).diskCacheStrategy(DiskCacheStrategy.DATA)
                              .submit().get(20, TimeUnit.SECONDS)
                      } catch (e: Exception) { }
                  }
              }

              private val workers = List(3) { Thread { loop() }.apply { isDaemon = true; start() } }

              fun add(url: String?, first: Boolean = false) {
                  if (url == null || !seen.add(url)) return
                  if (first) queue.addFirst(url) else queue.addLast(url)
                  while (queue.size > 300) queue.pollLast()?.let { seen.remove(it) }
              }
          }

          // trailer url from any platformVariant (only the auto-play eligible ones: used for the hero autoplay)
          fun trailerFrom(o: JSONObject): String? {
              val arr = o.optJSONArray("platformVariants")
              if (arr != null) for (i in 0 until arr.length()) {
                  val pv = arr.optJSONObject(i) ?: continue
                  val u = pv.optString("trailerUrl")
                  if (u.startsWith("http") && pv.optBoolean("trailerAutoPlayEligibility", true)) return u
              }
              val e = o.optJSONObject("metadata")?.optJSONObject("emfAttributes")
              val u2 = e?.optString("trailer_url").orEmpty()
              return if (u2.startsWith("http")) u2 else null
          }

          // trailer url for the "Watch Trailer" button (ignores the autoplay eligibility flag)
          fun trailerUrlAny(o: JSONObject): String? {
              val arr = o.optJSONArray("platformVariants")
              if (arr != null) for (i in 0 until arr.length()) {
                  val pv = arr.optJSONObject(i) ?: continue
                  val u = pv.optString("trailerUrl")
                  if (u.startsWith("http")) return u
              }
              return trailerFrom(o)
          }

          // content id of the trailer asset (platformVariants[].trailerContentId)
          fun trailerIdFrom(o: JSONObject): String? {
              val arr = o.optJSONArray("platformVariants") ?: return null
              for (i in 0 until arr.length()) {
                  val pv = arr.optJSONObject(i) ?: continue
                  val id = pv.str("trailerContentId")
                  if (id != null) return id
              }
              return null
          }

          // child asset of a bundle by objectSubtype (MOVIE / MOVIE_TRAILER ...)
          fun childBySubtype(show: JSONObject, st: String): JSONObject? {
              val arr = show.optJSONArray("containers") ?: return null
              for (i in 0 until arr.length()) {
                  val c = arr.optJSONObject(i) ?: continue
                  val sub = c.optJSONObject("metadata")?.optString("objectSubtype").orEmpty()
                  if (sub.equals(st, true)) return c
              }
              return null
          }

          // editorialMetadata.poster_background is a JSON string: {"FIRE_TV":"url","SONY_ANDROID_TV":"url", ...}
          // poster image of ANY tv, FIRE_TV preferred, then the other android tv keys, then whatever key exists.
          fun bgFromJson(js: String?): String? {
              if (js.isNullOrBlank()) return null
              return try {
                  val j = JSONObject(js)
                  var u = ""
                  for (k in listOf("FIRE_TV", "SONY_ANDROID_TV", "JIO_ANDROID_TV", "XIAOMI_ANDROID_TV")) {
                      u = j.optString(k)
                      if (u.startsWith("http")) break
                      u = ""
                  }
                  if (u.isBlank()) {
                      val k = j.keys()
                      while (k.hasNext()) {
                          val v = j.optString(k.next())
                          if (v.startsWith("http")) { u = v; break }
                      }
                  }
                  if (u.isBlank()) null else u
              } catch (e: Exception) { null }
          }

          // Lenient parser: CONTENT_ITEM and any other slide type that has an image.
          // Launchers / ads (LAUNCHER_ITEM) and image-less (text-only) slides are dropped.
          // Title image: masthead_logo_rectangualar (?h=auto&w=700&q=eco), fallback masthead_logo of the listing.
          //   If both are missing the hero asks the show / movie api for it (see enrichNow in MainActivity).
          // Description priority: shortDescription -> launcher_short_description -> longDescription
          fun parseItem(o: JSONObject): Item? {
              val low = o.optString("layout").lowercase()
              if (isAd(o) || low.contains("template") || low.contains("promotion")) return null
              val m = o.optJSONObject("metadata") ?: JSONObject()
              val ed = o.optJSONObject("editorialMetadata") ?: JSONObject()
              val am = o.optJSONObject("assetMetadata") ?: JSONObject()
              val e = m.optJSONObject("emfAttributes") ?: JSONObject()
              val ae = am.optJSONObject("emfAttributes") ?: JSONObject()
              fun s(k: String): String? = e.str(k) ?: ae.str(k)
              fun ev(k: String): String? = ed.str(k)

              val title = m.str("title") ?: am.str("title") ?: ev("card_name") ?: ""
              val landscape = s("thumbnail") ?: s("landscape_thumb") ?: ev("landscape_image")
              val portrait = s("portrait_thumb") ?: ev("poster") ?: ev("mweb_poster")
              val bgU = s("tv_background_image") ?: bgFromJson(ev("poster_background")) ?: s("detail_cover_bg_V2")
              val spotU = s("mweb_spotlight")
              if (landscape == null && portrait == null && bgU == null && spotU == null) return null   // no text-only slides

              val cid = am.str("contentId") ?: m.str("contentId") ?: o.optString("id")
              val id = m.str("contentId") ?: o.optString("id")
              val sub = (m.str("objectSubtype") ?: am.str("objectSubtype") ?: "").uppercase()
              val obj = (m.str("objectType") ?: am.str("objectType") ?: "").uppercase()

              val parts = ArrayList<String>()
              s("IMDB")?.let { parts.add("IMDb $it") }
              (s("region_of_origin") ?: m.str("language"))?.let { parts.add(it) }
              m.optJSONArray("genres")?.optString(0)?.takeIf { it.isNotBlank() }?.let { parts.add(it) }

              val desc = m.str("shortDescription") ?: ev("launcher_short_description") ?: m.str("longDescription") ?: ""
              val logoU = img(s("masthead_logo_rectangualar") ?: s("masthead_logo") ?: ev("launcher_logo"), W_LOGO)
              return Item(id, title, portrait, landscape, bgU, logoU, parts.joinToString(" • "), desc, trailerFrom(o), spotU, cid, sub,
                  obj, m.optInt("season"), m.optInt("episodeNumber"), m.str("episodeTitle") ?: "", m.optInt("duration"), m.optLong("originalAirDate"),
                  "", "", s("square_thumb"), false)
          }

          // LAUNCHER_ITEM / card / promo / square tile. Image + cta come from editorialMetadata (item) or metadata (page container itself).
          //   cta: sony://asset/<id> (movie / show / trailer ...)  |  sony://page/<slug>-<id> (landing page)
          // Hero data of a launcher item:
          //   background   = editorialMetadata.poster_background (json of tv images, FIRE_TV preferred, any tv otherwise)
          //   title image  = editorialMetadata.launcher_logo
          //   description  = editorialMetadata.launcher_short_description
          // Tiles without a poster_background (pure promo cards) get launcher = true => no hero on focus.
          fun parseLauncher(o: JSONObject): Item? {
              val ed = o.optJSONObject("editorialMetadata") ?: JSONObject()
              val m = o.optJSONObject("metadata") ?: JSONObject()
              val am = o.optJSONObject("assetMetadata") ?: JSONObject()
              val ae = am.optJSONObject("emfAttributes") ?: JSONObject()
              fun pick(vararg keys: String): String? {
                  for (src in listOf(ed, m)) for (k in keys) { val v = src.str(k); if (v != null) return v }
                  return null
              }
              val imgKeys = arrayOf("square_image", "square_thumb", "promocard_background_tv", "poster", "image", "image_url",
                  "mweb_poster", "landscape_image", "thumbnail", "promocard_background_mobile", "bg_image")
              var image: String? = null
              for (src in listOf(ed, m)) {
                  if (image != null) break
                  for (k in imgKeys) { val v = src.str(k); if (v != null && v.startsWith("http")) { image = v; break } }
              }
              if (image == null) {                                   // any other image url in the metadata (logos excluded)
                  val rx = Regex("\\.(jpg|jpeg|png|webp)(\\?|$)", RegexOption.IGNORE_CASE)
                  for (src in listOf(ed, m)) {
                      if (image != null) break
                      val ks = src.keys()
                      while (ks.hasNext()) {
                          val k = ks.next()
                          if (k.contains("logo", true) || k.contains("background", true)) continue
                          val v = src.str(k) ?: continue
                          if (v.startsWith("http") && rx.containsMatchIn(v)) { image = v; break }
                      }
                  }
              }
              if (image == null) return null
              val cta = pick("cta") ?: ""
              val aid = am.str("contentId") ?: ""
              val aSub = (am.str("objectSubtype") ?: "").uppercase()
              val title = am.str("title") ?: ed.str("card_name") ?: pick("title", "label") ?: ""
              val subtitle = pick("sub_title", "subtitle", "sub_title_txt", "short_description", "description") ?: ""
              val poster = pick("poster", "mweb_poster")
              val land = pick("landscape_image", "thumbnail")
              val bgU = bgFromJson(ed.str("poster_background")) ?: bgFromJson(m.str("poster_background"))
              val logoU = img(pick("launcher_logo") ?: ae.str("masthead_logo_rectangualar") ?: ae.str("masthead_logo"), W_LOGO)
              val desc = ed.str("launcher_short_description") ?: ""
              return Item(o.optString("id"), title, poster ?: image, land ?: image, bgU, logoU, "", desc, null, null, aid, aSub, "LAUNCHER",
                  0, 0, am.str("episodeTitle") ?: "", 0, 0L, cta, subtitle, image, bgU == null)
          }

          // reads only the image header => width / height of a card image (any aspect ratio is fitted)
          fun probeAspect(url: String?): Float {
              if (url == null) return 0f
              return try {
                  val req = Request.Builder().url(url).header("User-Agent", STREAM_UA).build()
                  Net.client.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) 0f
                      else {
                          val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeStream(r.body?.byteStream(), null, o)
                          if (o.outWidth > 0 && o.outHeight > 0) o.outWidth.toFloat() / o.outHeight else 0f
                      }
                  }
              } catch (e: Exception) { 0f }
          }

          fun parseEp(o: JSONObject?): Ep? {
              if (o == null) return null
              val m = o.optJSONObject("metadata") ?: return null
              val e = m.optJSONObject("emfAttributes") ?: JSONObject()
              val thumb = e.str("thumbnail") ?: e.str("landscape_thumb")
              val title = m.str("episodeTitle") ?: m.str("title") ?: ""
              val desc = m.str("shortDescription") ?: m.str("longDescription") ?: ""
              return Ep(m.optString("contentId"), title, m.optInt("episodeNumber"), desc, thumb, m.optInt("duration"), m.optLong("originalAirDate"))
          }

          // Episode / movie DETAIL-V2 response:
          //   containers[0].platformVariants[].subtitlesLanguages[] = { subtitleUrl, subtitleLanguageName }
          //   containers[0].metadata.emfAttributes.tv_sprite_image_url = seek preview sprite (..._640_360_<frames>.jpg)
          fun parseEpExtra(j: JSONObject?): EpExtra? {
              val c = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0) ?: return null
              val m = c.optJSONObject("metadata")
              val e = m?.optJSONObject("emfAttributes")
              val labels = HashMap<String, String>()
              val sl = e?.optJSONArray("subtitle_language_list")
              if (sl != null) for (k in 0 until sl.length()) {
                  val o = sl.optJSONObject(k) ?: continue
                  val n = o.str("subtitleLanguageName") ?: continue
                  labels[n.uppercase()] = o.str("subtitleDisplayName") ?: n
              }
              val subs = ArrayList<SubInfo>()
              val seen = HashSet<String>()
              val used = HashMap<String, Int>()
              val ccRx = Regex("(^|[_\\-])CC(\\.|_)", RegexOption.IGNORE_CASE)
              fun scan(arr: JSONArray?) {
                  if (arr == null) return
                  for (i in 0 until arr.length()) {
                      val pv = arr.optJSONObject(i) ?: continue
                      val sa = pv.optJSONArray("subtitlesLanguages") ?: continue
                      for (k in 0 until sa.length()) {
                          val o = sa.optJSONObject(k) ?: continue
                          val su = o.str("subtitleUrl") ?: continue
                          if (!su.startsWith("http") || !seen.add(su)) continue
                          val name = o.str("subtitleLanguageName") ?: "und"
                          var lbl = labels[name.uppercase()] ?: name
                          val fn = su.substringBefore("?").substringAfterLast('/')
                          if (ccRx.containsMatchIn(fn)) lbl += " CC"          // closed captions file
                          val cnt = (used[lbl] ?: 0) + 1
                          used[lbl] = cnt
                          if (cnt > 1) lbl += " $cnt"                          // two files with the same name stay distinguishable
                          subs.add(SubInfo(su, name.lowercase(), lbl))
                      }
                  }
              }
              scan(c.optJSONArray("platformVariants"))
              val sprite = e?.str("tv_sprite_image_url") ?: e?.str("sprite_image_url")
              return EpExtra(subs, sprite, m?.optInt("season") ?: 0, m?.optInt("episodeNumber") ?: 0, m?.str("episodeTitle"))
          }

          // seasons / bundles (newest first) + the episodes already embedded in the show response
          fun parseSeasons(show: JSONObject): DetailData {
              val tmp = ArrayList<Season>()
              val emb = HashMap<String, List<Ep>>()
              var latest: Ep? = null
              val sc = show.optJSONArray("containers")
              if (sc != null) for (k in 0 until sc.length()) {
                  val c = sc.optJSONObject(k) ?: continue
                  if (c.optString("layout") != "BUNDLE_ITEM") continue
                  val sid = c.optString("id")
                  if (sid.isBlank()) continue
                  val cm = c.optJSONObject("metadata")
                  val st = cm?.str("title") ?: ("Season " + (tmp.size + 1))
                  tmp.add(Season(sid, st, c.optInt("episodeCount"), cm?.optInt("season") ?: 0, cm?.optLong("originalAirDate") ?: 0L))
                  val inner = c.optJSONArray("containers")
                  val list = ArrayList<Ep>()
                  if (inner != null) for (q in 0 until inner.length()) parseEp(inner.optJSONObject(q))?.let { list.add(it) }
                  emb[sid] = list
                  val ep = list.firstOrNull()
                  val cur = latest
                  if (ep != null && (cur == null || ep.air > cur.air)) latest = ep
              }
              val sorted = tmp.sortedWith(compareByDescending<Season> { it.num }.thenByDescending { it.air })
              return DetailData(sorted, emb, latest)
          }

          // detail page image urls: title = masthead_logo_rectangualar (fallback masthead_logo) w=700, background w=1200
          // On a show / movie detail response the title image is always available.
          fun detLogoUrl(show: JSONObject): String? {
              val e = show.optJSONObject("metadata")?.optJSONObject("emfAttributes") ?: return null
              return img(e.str("masthead_logo_rectangualar") ?: e.str("masthead_logo"), W_LOGO)
          }

          // raw (not resized) background url of a detail container
          fun rawBgOf(show: JSONObject): String? {
              val e = show.optJSONObject("metadata")?.optJSONObject("emfAttributes") ?: return null
              return e.str("tv_background_image") ?: e.str("detail_cover_bg_V2") ?: e.str("thumbnail")
          }

          fun detBgUrl(show: JSONObject): String? = img(rawBgOf(show), W_BG)

