              val b = TextView(c).apply { setTextColor(Color.parseColor("#B4B8C8")); textSize = 14f; gravity = Gravity.CENTER }
              col.addView(b, LinearLayout.LayoutParams(-2, -2).apply { topMargin = dpx(6) })
