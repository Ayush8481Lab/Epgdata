              // focused tab = white pill with dark icon / name, selected tab = faint pill, others = dim
              private fun styleTab(i: Int) {
                  val v = tabViews[i]
                  val f = v.isFocused
                  val s = i == tab
                  tabIcons[i].setColorFilter(if (f) Color.BLACK else if (s) Color.WHITE else Color.argb(150, 255, 255, 255))
                  tabLabels[i].setTextColor(if (f) Color.BLACK else if (s) Color.WHITE else Color.argb(190, 255, 255, 255))
                  v.background = if (f) GradientDrawable().apply {
                      cornerRadius = u(12).toFloat(); setColor(Color.WHITE)
                  } else if (s) GradientDrawable().apply {
                      cornerRadius = u(12).toFloat(); setColor(Color.argb(35, 255, 255, 255))
                  } else null
              }

              private fun selectTab(i: Int) {
                  if (inDetail) closeDetail(false)
                  tab = i
                  for (k in tabViews.indices) styleTab(k)
                  val td = homeTabs[i]
                  if (td != null) {
                      content.visibility = View.VISIBLE
                      if (pageStack.isNotEmpty() || shownTd !== td || i == 2) {
                          pageStack.clear()
                          if (i == 2) refreshMyList(td)                                 // My List is rebuilt from the saved list every time
                          switchHome(td)
                      }
                      else if (!td.loaded) startLoad(td)                              // retry after an error
                      else {
                          status.visibility = if (rows.isEmpty() && skelHome.visibility != View.VISIBLE) View.VISIBLE else View.GONE
                          hero?.let { scheduleTrailer(it) }
                      }
                  } else {
                      stopTrailer()
                      content.visibility = View.GONE
                      status.visibility = View.VISIBLE
                      status.text = tabNames[i] + " — not wired yet"
                  }
              }

              // My List tab: one portrait row with the saved shows / movies (newest first)
              private fun refreshMyList(td: TabData) {
                  td.rows.clear()
                  td.loaded = true; td.loading = false
                  val l = Store.myList()
                  if (l.isNotEmpty()) td.rows.add(Row("My List", false, l, "portrait"))
              }

              // puts a page (home tab or landing page) into the list. Rows of every page are kept, so coming back is instant.
              private fun switchHome(td: TabData, restoreRow: Int = -1, restorePos: Int = 0) {
                  heroRun?.let { ui.removeCallbacks(it) }
                  heroToken++
                  stopTrailer(false)
                  shownTd = td
                  rows = td.rows
                  curRow = -1; curPos = 0; lastSnap = -1
                  hero = null; revealed = false
                  setCardMode(false)
                  modeChanged = false
                  Prefetch.gate = true
                  info.animate().cancel(); info.alpha = 0f
                  bg.animate().cancel(); bg.alpha = 0f
                  Glide.with(this).clear(bg)
                  Glide.with(this).clear(logo)
                  metaTv.text = ""; descTv.text = ""
                  rowAdapter.notifyDataSetChanged()
                  rowRv.scrollToPosition(0)
                  status.visibility = View.GONE
                  if (!td.loaded) startLoad(td)
                  else {
                      skelHome.visibility = if (td.loading && td.rows.isEmpty()) View.VISIBLE else View.GONE
                      if (td.rows.isNotEmpty()) { if (restoreRow >= 0) focusAt(restoreRow, restorePos, 12) else focusFirst(12) }
                      else if (!td.loading) {
                          status.text = if (td.idx == 2) "Your list is empty\n\nOpen a show or movie and press the + button" else "No rows"
                          status.visibility = View.VISIBLE
                      }
                  }
              }

              private fun startLoad(td: TabData) {
                  td.loaded = true; td.loading = true
                  if (shownTd === td) { status.visibility = View.GONE; skelHome.visibility = View.VISIBLE }
                  loadHome(td)
              }

              // landing page (sony://page/<slug>-<id>): same UI, own rows, back returns to the tile it was opened from
              private fun openPage(id: String) {
                  val cur = shownTd ?: return
                  pageStack.add(PageState(cur, curRow, curPos))
                  switchHome(TabData(nextPageIdx++, pageUrl(id)))
              }

              private fun popPage() {
                  if (pageStack.isEmpty()) return
                  val st = pageStack.removeAt(pageStack.size - 1)
                  switchHome(st.td, st.row, st.pos)
              }

              private fun focusAt(r: Int, p: Int, tries: Int) {
                  ui.postDelayed({
                      val rvh = rowRv.findViewHolderForAdapterPosition(r) as? RowVH
                      if (rvh == null) { rowRv.scrollToPosition(r); if (tries > 0) focusAt(r, p, tries - 1); return@postDelayed }
                      val v = rvh.rv.findViewHolderForAdapterPosition(p)?.itemView
                      if (v != null) v.requestFocus() else { rvh.rv.scrollToPosition(p); if (tries > 0) focusAt(r, p, tries - 1) }
                  }, 120)
              }

              // ---------------------------------------------------------------- Remote overlay
              private fun rbtn(label: String, w: Int = 52, h: Int = 46, action: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label; t.setTextColor(Color.WHITE); t.gravity = Gravity.CENTER; t.typeface = Typeface.DEFAULT_BOLD
                  tx(t, 16f)
                  t.background = GradientDrawable().apply { cornerRadius = u(12).toFloat(); setColor(Color.argb(255, 52, 56, 72)) }
                  t.isFocusable = false
                  t.setOnClickListener { action() }
                  t.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.86f).scaleY(0.86f).setDuration(60).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                      }
                      false
                  }
                  t.layoutParams = LinearLayout.LayoutParams(u(w), u(h)).apply { setMargins(u(3), u(3), u(3), u(3)) }
                  return t
              }

