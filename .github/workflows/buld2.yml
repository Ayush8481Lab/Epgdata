                  info.addView(epSkel, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(6) })
                  epCol = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  info.addView(epCol, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(6) })
                  moreBtn = mBigBtn(this, "Load more episodes", false) { loadEpisodes() }
                  moreBtn.visibility = View.GONE
                  info.addView(moreBtn, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(10) })

                  col.addView(info, LinearLayout.LayoutParams(-1, -2))
                  scroll.addView(col, FrameLayout.LayoutParams(-1, -2))
                  root.addView(scroll, FrameLayout.LayoutParams(-1, -1))

                  err = mErrorView(this) { load() }
                  err.setBackgroundColor(M_BG)
                  root.addView(err, FrameLayout.LayoutParams(-1, -1))

                  val back = ImageView(this).apply {
                      setImageResource(R.drawable.ic_back); setColorFilter(Color.WHITE); setPadding(dpx(9), dpx(9), dpx(9), dpx(9)); isClickable = true
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.argb(150, 0, 0, 0)) }
                      setOnClickListener { finish() }
                  }
                  root.addView(back, FrameLayout.LayoutParams(dpx(42), dpx(42), Gravity.TOP or Gravity.START).apply { setMargins(dpx(10), dpx(10), 0, 0) })
                  setContentView(root)

                  // instant preview from the listing item
                  shownBg = img(item.bg ?: item.landscape, W_BG)
                  loadBg(shownBg)
