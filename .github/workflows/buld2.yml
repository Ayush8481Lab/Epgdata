          // =====================================================================================
          // Navigation (cta, detail, player, landing pages)
          // =====================================================================================
          object MNav {
              fun putItem(i: Intent, x: Item) {
                  i.putExtra("cid", x.cid); i.putExtra("sub", x.sub); i.putExtra("title", x.title)
                  i.putExtra("desc", x.desc); i.putExtra("meta", x.meta)
                  i.putExtra("portrait", x.portrait ?: ""); i.putExtra("landscape", x.landscape ?: "")
                  i.putExtra("bg", x.bg ?: ""); i.putExtra("logo", x.logo ?: "")
              }

              fun getItem(i: Intent): Item {
                  fun s(k: String): String? = i.getStringExtra(k)?.takeIf { v -> v.isNotBlank() }
                  val cid = s("cid") ?: ""
                  return Item(cid, s("title") ?: "", s("portrait"), s("landscape"), s("bg"), s("logo"), s("meta") ?: "", s("desc") ?: "",
                      null, null, cid, s("sub") ?: "", OBJ_VOD, 0, 0, "", 0, 0L)
              }

              fun open(a: Activity, item: Item) {
                  if (item.launcher || item.cta.isNotBlank()) { cta(a, item); return }
                  if (item.sub == SUB_SHOW || item.sub == SUB_MOVIE_BUNDLE) detail(a, item)
                  else if (item.obj == OBJ_VOD) play(a, item)
              }

              fun detail(a: Activity, item: Item) {
                  if (item.cid.isBlank()) return
                  val i = Intent(a, MobileDetailActivity::class.java)
                  putItem(i, item)
                  a.startActivity(i)
              }

              // episode / movie / clip straight from a listing tile
              fun play(a: Activity, item: Item) {
                  if (item.cid.isBlank()) return
                  val i = Intent(a, MobilePlayerActivity::class.java)
                  i.putExtra("cid", item.cid)
                  i.putExtra("ep_title", item.epTitle)
                  i.putExtra("show_title", item.title)
                  i.putExtra("ep_num", item.epNum)
                  i.putExtra("season", item.season)
                  i.putExtra("thumb", item.landscape ?: item.portrait ?: item.bg ?: "")
                  i.putExtra("dur", item.dur)
                  i.putExtra("noeps", true)
                  a.startActivity(i)
              }

              fun page(a: Activity, id: String, title: String) {
                  val i = Intent(a, MobilePageActivity::class.java)
                  i.putExtra("id", id); i.putExtra("title", title)
                  a.startActivity(i)
              }

              private fun cta(a: Activity, item: Item) {
                  val rest = item.cta.substringAfter("sony://", "")
                  val type = rest.substringBefore("/")
                  val tail = rest.substringAfter("/", "").substringBefore("?").trim('/')
                  when (type) {
                      "page" -> {
                          val id = tail.substringAfterLast('-')
                          if (id.isNotEmpty() && id.all { ch -> ch.isDigit() }) page(a, id, item.title) else mToast(a, "Page not supported")
                      }
                      "asset" -> asset(a, tail, item)
                      else -> if (item.cid.isNotBlank()) asset(a, item.cid, item) else mToast(a, "Not supported")
                  }
              }

              private fun route(a: Activity, x: Item) {
                  if (x.sub == SUB_SHOW || x.sub == SUB_MOVIE_BUNDLE) detail(a, x) else play(a, x)
              }

              private fun asset(a: Activity, id: String, item: Item) {
                  if (id.isBlank()) return
                  val known = item.sub
                  if (known.isNotEmpty() && known != "LAUNCHER") {
                      route(a, item.copy(id = id, cid = id, obj = OBJ_VOD, sub = known))
                      return
                  }
                  Thread {
                      val j = Api.get(DETAIL_URL + id)
                      val c = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                      a.runOnUiThread {
                          if (c == null) { mToast(a, "Could not open"); return@runOnUiThread }
                          val m = c.optJSONObject("metadata")
                          val st = (m?.optString("objectSubtype") ?: "").uppercase()
                          val ot = (m?.optString("objectType") ?: "").uppercase()
                          val sub = when {
                              st == SUB_MOVIE_BUNDLE -> SUB_MOVIE_BUNDLE
                              st == SUB_SHOW || ot == "SHOW" || ot == "GROUP_OF_BUNDLES" || (m?.has("seasonCount") == true) -> SUB_SHOW
                              else -> st
                          }
                          val base = parseItem(c) ?: item.copy()
                          route(a, base.copy(id = id, cid = id, sub = sub, obj = OBJ_VOD))
                      }
                  }.start()
              }
          }

          // =====================================================================================
          // MRows: a vertically scrolling list of rows (banner carousel + poster / trending / square / landscape rows)
          // =====================================================================================
          class MRows(private val act: Activity) : FrameLayout(act) {
              private val ui = Handler(Looper.getMainLooper())
              private val sw = act.resources.displayMetrics.widthPixels
              private val portW = (sw * 0.30f).toInt()
              private val portH = portW * 3 / 2
              private val sqS = (sw * 0.38f).toInt()
              private val lsW = (sw * 0.58f).toInt()
              private val lsH = lsW * 9 / 16
              private val bannerW = sw - dpx(44)
              private val bannerH = bannerW * 9 / 16
              private val rv = RecyclerView(act)
              private val adapter = RowsAdapter()
              private val skel: LinearLayout
              private val err: LinearLayout
              private var cur: MTab? = null

              init {
                  rv.layoutManager = LinearLayoutManager(act)
                  rv.adapter = adapter
                  rv.overScrollMode = View.OVER_SCROLL_NEVER
                  rv.setItemViewCacheSize(6)
                  addView(rv, FrameLayout.LayoutParams(-1, -1))
                  skel = buildSkel()
                  skel.visibility = View.GONE
                  addView(skel, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))
                  err = mErrorView(act) { retry() }
                  addView(err, FrameLayout.LayoutParams(-1, -1))
              }

              private fun retry() {
                  val t = cur ?: return
                  err.visibility = View.GONE
                  load(t)
              }

              private fun buildSkel(): LinearLayout {
                  val c = LinearLayout(act).apply { orientation = LinearLayout.VERTICAL; setPadding(dpx(16), dpx(8), dpx(16), 0) }
                  c.addView(ShimmerView(act, dpx(14).toFloat()), LinearLayout.LayoutParams(-1, bannerH))
                  for (n in 0 until 3) {
                      c.addView(ShimmerView(act, dpx(6).toFloat()), LinearLayout.LayoutParams(dpx(160), dpx(18)).apply { topMargin = dpx(22) })
                      val row = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL }
                      for (k in 0 until 4) row.addView(ShimmerView(act, dpx(8).toFloat()), LinearLayout.LayoutParams(portW, portH).apply { rightMargin = dpx(10) })
                      c.addView(row, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(10) })
                  }
                  return c
              }

              fun show(t: MTab) {
                  cur = t
                  adapter.notifyDataSetChanged()
                  rv.scrollToPosition(0)
                  err.visibility = View.GONE
                  if (!t.loaded && !t.loading) load(t)
                  else {
                      skel.visibility = if (t.loading && t.rows.isEmpty()) View.VISIBLE else View.GONE
                      if (t.rows.isEmpty() && !t.loading) mShowError(err, mOffline(act))
                  }
              }

              private fun kindOf(layout: String): String? {
                  val l = layout.lowercase()
                  return when {
                      l == "spotlight_layout" -> "spot"
                      l.contains("subscription") -> null
                      l.contains("trending") -> "trending"
                      l.contains("square") -> "square"
                      l.contains("landscape") -> "landscape"
                      l.contains("card") || l.contains("promo") -> null
                      l.contains("portrait") -> "portrait"
                      else -> null
                  }
              }

              private fun fail(t: MTab) {
                  t.loading = false; t.loaded = false
                  if (cur === t) {
                      skel.visibility = View.GONE
                      if (t.rows.isEmpty()) mShowError(err, mOffline(act))
                  }
              }

              private fun load(t: MTab) {
                  t.loaded = true; t.loading = true
                  if (cur === t) { err.visibility = View.GONE; skel.visibility = View.VISIBLE }
                  Thread {
                      val page = Api.get(t.url)
                      val cs = page?.optJSONObject("resultObj")?.optJSONArray("containers")
                      if (cs == null) {
                          ui.post { fail(t) }
                          return@Thread
                      }
                      class Job(val title: String, val kind: String, val f: Future<JSONObject?>)
                      val jobs = ArrayList<Job>()
                      var gotSpot = false
                      for (i in 0 until cs.length()) {
                          val c = cs.optJSONObject(i) ?: continue
                          if (isAd(c, true)) continue
                          val kind = kindOf(c.optString("layout")) ?: continue
                          if (kind == "spot") { if (gotSpot) continue; gotSpot = true }
                          val uri = c.optJSONObject("retrieveItems")?.optString("uri").orEmpty()
                          if (uri.isEmpty()) continue
                          val cm = c.optJSONObject("metadata")
                          val title = cm?.str("title") ?: cm?.str("label") ?: c.str("title")
                              ?: c.optJSONObject("editorialMetadata")?.str("title") ?: ""
                          val url = BASE + uri + (if (kind == "spot") "" else "&from=0&to=15")
                          jobs.add(Job(title, kind, Api.pool.submit(Callable<JSONObject?> { Api.get(url) })))
                      }
                      for (j in jobs) {
                          val items = ArrayList<Item>()
                          val res = try { j.f.get() } catch (e: Exception) { null }
                          val ro = res?.optJSONObject("resultObj")
                          val arr = ro?.optJSONArray("containers")
                          if (arr != null) for (k in 0 until arr.length()) {
                              val c = arr.optJSONObject(k) ?: continue
                              val isL = c.optString("layout").equals("LAUNCHER_ITEM", true)
                              val parsed = when {
                                  isL -> if (isAd(c, true)) null else parseLauncher(c)
                                  isAd(c) -> null
                                  else -> parseItem(c)
                              }
                              if (parsed != null) items.add(parsed)
                              if (j.kind == "spot") {
                                  val dual = c.optJSONObject("editorialMetadata")?.optJSONArray("dual_spotlight_items")
                                  if (dual != null) for (d in 0 until dual.length()) {
                                      dual.optJSONObject(d)?.let { parseItem(it) }?.let { items.add(it) }
                                  }
                              }
                          }
                          if (items.isEmpty()) continue
                          val title = if (j.title.isNotBlank()) j.title else (ro?.str("trayTitle") ?: "")
                          val row = Row(title, j.kind == "spot", items, j.kind)
                          ui.post {
                              t.rows.add(row)
                              if (cur === t) { adapter.notifyItemInserted(t.rows.size - 1); skel.visibility = View.GONE; err.visibility = View.GONE }
                          }
                      }
                      ui.post {
                          t.loading = false
                          if (t.rows.isEmpty()) fail(t)
                      }
                  }.start()
              }

              private fun rowImg(kind: String, i: Item): String? = when (kind) {
                  "square" -> img(i.cardImg ?: i.portrait ?: i.landscape ?: i.bg, 450)
                  "landscape" -> img(i.landscape ?: i.cardImg ?: i.portrait ?: i.bg, W_EP)
                  else -> img(i.portrait ?: i.landscape ?: i.cardImg ?: i.bg, W_PORTRAIT)
              }

              private inner class SpotVH(val list: RecyclerView, val snap: PagerSnapHelper) : RecyclerView.ViewHolder(list) {
                  var tick: Runnable? = null
              }

              private inner class RowVH(val box: LinearLayout, val title: TextView, val list: RecyclerView) : RecyclerView.ViewHolder(box)

              private inner class RowsAdapter : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                  override fun getItemCount(): Int = cur?.rows?.size ?: 0
                  override fun getItemViewType(position: Int): Int = if (cur?.rows?.getOrNull(position)?.kind == "spot") 0 else 1

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): RecyclerView.ViewHolder {
                      if (t == 0) {
                          val r = RecyclerView(act).apply {
                              layoutManager = LinearLayoutManager(act, LinearLayoutManager.HORIZONTAL, false)
                              clipToPadding = false
                              overScrollMode = View.OVER_SCROLL_NEVER
                              setPadding(dpx(14), dpx(8), dpx(14), dpx(8))
                              layoutParams = RecyclerView.LayoutParams(-1, bannerH + dpx(16))
                          }
                          val snap = PagerSnapHelper()
                          snap.attachToRecyclerView(r)
                          return SpotVH(r, snap)
                      }
                      val box = LinearLayout(act).apply { orientation = LinearLayout.VERTICAL; layoutParams = RecyclerView.LayoutParams(-1, -2) }
                      val tv = TextView(act).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 18f
                          maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                          setPadding(dpx(16), dpx(18), dpx(16), dpx(8))
                      }
                      val list = RecyclerView(act).apply {
                          layoutManager = LinearLayoutManager(act, LinearLayoutManager.HORIZONTAL, false)
                          clipToPadding = false
                          overScrollMode = View.OVER_SCROLL_NEVER
                          setPadding(dpx(16), 0, dpx(6), 0)
                      }
                      box.addView(tv, LinearLayout.LayoutParams(-1, -2))
                      box.addView(list, LinearLayout.LayoutParams(-1, -2))
                      return RowVH(box, tv, list)
                  }

                  override fun onBindViewHolder(h: RecyclerView.ViewHolder, pos: Int) {
                      val r = cur?.rows?.getOrNull(pos) ?: return
                      if (h is SpotVH) {
                          h.list.adapter = BannerAdapter(r)
                      } else if (h is RowVH) {
                          h.title.text = r.title
                          h.title.visibility = if (r.title.isBlank()) View.GONE else View.VISIBLE
                          val ad = (r.ad as? MCardAdapter) ?: MCardAdapter(r).also { r.ad = it }
                          if (h.list.adapter !== ad) h.list.adapter = ad
                      }
                  }

                  override fun onViewAttachedToWindow(h: RecyclerView.ViewHolder) {
                      if (h is SpotVH) autoScroll(h)
                  }

                  override fun onViewDetachedFromWindow(h: RecyclerView.ViewHolder) {
                      if (h is SpotVH) { h.tick?.let { ui.removeCallbacks(it) }; h.tick = null }
                  }

                  private fun autoScroll(h: SpotVH) {
                      h.tick?.let { ui.removeCallbacks(it) }
                      val r = object : Runnable {
                          override fun run() {
                              val lm = h.list.layoutManager as? LinearLayoutManager ?: return
                              val n = h.list.adapter?.itemCount ?: 0
                              if (n > 1 && h.list.isAttachedToWindow) {
                                  val v = h.snap.findSnapView(lm)
                                  val p = if (v == null) 0 else lm.getPosition(v)
                                  h.list.smoothScrollToPosition((p + 1) % n)
                              }
                              ui.postDelayed(this, 5000)
                          }
                      }
                      h.tick = r
                      ui.postDelayed(r, 5000)
                  }
              }

              private inner class BannerVH(val box: FrameLayout, val iv: ImageView, val logo: ImageView, val title: TextView, val meta: TextView) : RecyclerView.ViewHolder(box)

              private inner class BannerAdapter(val row: Row) : RecyclerView.Adapter<BannerVH>() {
                  override fun getItemCount() = row.items.size

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): BannerVH {
                      val fl = FrameLayout(act).apply {
                          layoutParams = RecyclerView.LayoutParams(bannerW, bannerH).apply { setMargins(dpx(4), 0, dpx(4), 0) }
                          isClickable = true
                      }
                      val iv = ImageView(act).apply { scaleType = ImageView.ScaleType.CENTER_CROP; setBackgroundColor(M_CARD); mRound(this, dpx(14)) }
                      fl.addView(iv, FrameLayout.LayoutParams(-1, -1))
                      val sh = View(act).apply {
                          background = GradientDrawable(GradientDrawable.Orientation.BOTTOM_TOP, intArrayOf(Color.argb(235, 5, 6, 12), Color.argb(0, 5, 6, 12)))
                          mRound(this, dpx(14))
                      }
                      fl.addView(sh, FrameLayout.LayoutParams(-1, (bannerH * 0.6f).toInt(), Gravity.BOTTOM))
                      val logo = ImageView(act).apply { adjustViewBounds = true; maxWidth = dpx(190); maxHeight = dpx(58); scaleType = ImageView.ScaleType.FIT_START }
                      fl.addView(logo, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = dpx(16); bottomMargin = dpx(36) })
                      val title = TextView(act).apply { setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 22f; maxLines = 2; visibility = View.GONE }
                      fl.addView(title, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = dpx(16); rightMargin = dpx(16); bottomMargin = dpx(34) })
                      val meta = TextView(act).apply { setTextColor(Color.parseColor("#E8E8E8")); textSize = 12f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                      fl.addView(meta, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = dpx(16); rightMargin = dpx(16); bottomMargin = dpx(12) })
                      return BannerVH(fl, iv, logo, title, meta)
                  }

                  override fun onBindViewHolder(h: BannerVH, pos: Int) {
                      val item = row.items[pos]
                      Glide.with(h.iv).load(img(item.spot ?: item.bg ?: item.landscape, W_BG)).override(bannerW, bannerH).centerCrop()
                          .diskCacheStrategy(DiskCacheStrategy.ALL).into(h.iv)
                      if (item.logo != null) {
                          h.logo.visibility = View.VISIBLE; h.title.visibility = View.GONE
                          Glide.with(h.logo).load(item.logo).override(dpx(380), dpx(116)).format(DecodeFormat.PREFER_ARGB_8888)
                              .transform(TrimTransform(), FitCenter()).into(h.logo)
                      } else {
                          h.logo.setImageDrawable(null); h.logo.visibility = View.GONE
                          h.title.text = item.title; h.title.visibility = View.VISIBLE
                      }
                      h.meta.text = item.meta
                      h.box.setOnClickListener { MNav.open(act, item) }
                  }
              }

              private inner class CVH(val box: LinearLayout, val iv: ImageView, val rank: TextView?, val t1: TextView?, val t2: TextView?) : RecyclerView.ViewHolder(box)

              private inner class MCardAdapter(val row: Row) : RecyclerView.Adapter<CVH>() {
                  private val k = row.kind
                  private val w = when (k) { "square" -> sqS; "landscape" -> lsW; else -> portW }
                  private val ht = when (k) { "square" -> sqS; "landscape" -> lsH; else -> portH }
                  override fun getItemCount() = row.items.size

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): CVH {
                      val box = LinearLayout(act).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = RecyclerView.LayoutParams(w, -2).apply { rightMargin = dpx(10) }
                          isClickable = true
                      }
                      val fl = FrameLayout(act)
                      val iv = ImageView(act).apply { scaleType = ImageView.ScaleType.CENTER_CROP; setBackgroundColor(M_CARD); mRound(this, dpx(8)) }
                      fl.addView(iv, FrameLayout.LayoutParams(w, ht))
                      var rank: TextView? = null
                      if (k == "trending") {
                          val rt = TextView(act).apply {
                              setTextColor(Color.WHITE); typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC)
                              setTextSize(TypedValue.COMPLEX_UNIT_PX, portH * 0.30f)
                              includeFontPadding = false
                              setShadowLayer(12f, 0f, 0f, Color.BLACK)
                          }
                          fl.addView(rt, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = dpx(8); bottomMargin = dpx(4) })
                          rank = rt
                      }
                      box.addView(fl, LinearLayout.LayoutParams(w, ht))
                      var t1: TextView? = null
                      var t2: TextView? = null
                      if (k == "square" || k == "landscape") {
                          val a = TextView(act).apply { setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 13f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                          val b = TextView(act).apply { setTextColor(Color.parseColor("#B4B8C8")); textSize = 11f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                          box.addView(a, LinearLayout.LayoutParams(w, -2).apply { topMargin = dpx(6) })
                          box.addView(b, LinearLayout.LayoutParams(w, -2))
                          t1 = a; t2 = b
                      }
                      return CVH(box, iv, rank, t1, t2)
                  }

                  override fun onBindViewHolder(h: CVH, pos: Int) {
                      val item = row.items[pos]
                      Glide.with(h.iv).load(rowImg(k, item)).override(w, ht).centerCrop().diskCacheStrategy(DiskCacheStrategy.ALL).into(h.iv)
                      h.rank?.text = (pos + 1).toString()
                      val a = h.t1
                      val b = h.t2
                      if (a != null && b != null) {
                          val ept = item.epTitle
                          if (k == "landscape") {
                              a.text = if (ept.isNotBlank()) ept else item.title
                              b.text = if (ept.isNotBlank()) item.title else ""
                          } else {
                              a.text = item.title
                              b.text = item.subtitle
                          }
                          a.visibility = if (a.text.isNullOrBlank()) View.GONE else View.VISIBLE
                          b.visibility = if (b.text.isNullOrBlank()) View.GONE else View.VISIBLE
                      }
                      h.box.setOnClickListener { MNav.open(act, item) }
                  }
              }
          }

          // =====================================================================================
          // MGrid: 3 column poster grid (search results, My List)
          // =====================================================================================
          class MGrid(private val act: Activity) : FrameLayout(act) {
              private val rv = RecyclerView(act)
              private val msg = TextView(act)
              private val items = ArrayList<Item>()
              private val sw = act.resources.displayMetrics.widthPixels
              private val cw = (sw - dpx(22)) / 3 - dpx(10)
              private val ch = cw * 3 / 2

              init {
                  rv.layoutManager = GridLayoutManager(act, 3)
                  rv.clipToPadding = false
                  rv.setPadding(dpx(11), dpx(6), dpx(11), dpx(16))
                  rv.overScrollMode = View.OVER_SCROLL_NEVER
                  rv.adapter = GA()
                  addView(rv, FrameLayout.LayoutParams(-1, -1))
                  msg.setTextColor(Color.parseColor("#B4B8C8")); msg.textSize = 15f; msg.gravity = Gravity.CENTER
                  msg.visibility = View.GONE
                  addView(msg, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER))
              }

              fun setItems(list: List<Item>, empty: String) {
                  items.clear(); items.addAll(list)
                  rv.adapter?.notifyDataSetChanged()
                  rv.scrollToPosition(0)
                  if (list.isEmpty() && empty.isNotEmpty()) showMsg(empty) else msg.visibility = View.GONE
              }

              fun showMsg(t: String) { msg.text = t; msg.visibility = View.VISIBLE }

              private inner class GVH(val iv: ImageView) : RecyclerView.ViewHolder(iv)

              private inner class GA : RecyclerView.Adapter<GVH>() {
                  override fun getItemCount() = items.size
                  override fun onCreateViewHolder(p: ViewGroup, t: Int): GVH {
                      val iv = ImageView(act).apply {
                          layoutParams = RecyclerView.LayoutParams(cw, ch).apply { setMargins(dpx(5), dpx(5), dpx(5), dpx(5)) }
                          scaleType = ImageView.ScaleType.CENTER_CROP; setBackgroundColor(M_CARD); mRound(this, dpx(8)); isClickable = true
                      }
                      return GVH(iv)
                  }
                  override fun onBindViewHolder(h: GVH, pos: Int) {
                      val item = items[pos]
                      Glide.with(h.iv).load(img(item.portrait ?: item.landscape ?: item.bg, W_PORTRAIT)).override(cw, ch).centerCrop()
                          .diskCacheStrategy(DiskCacheStrategy.ALL).into(h.iv)
                      h.iv.setOnClickListener { MNav.open(act, item) }
                  }
              }
          }

          class MLiveVH(val box: FrameLayout, val iv: ImageView, val tv: TextView) : RecyclerView.ViewHolder(box)

          // =====================================================================================
          // Main phone shell: Home (tabs) / Search / Live TV / My List / Settings
          // =====================================================================================
          class MobileActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private lateinit var pages: FrameLayout
              private val pageViews = ArrayList<View>()
              private val navIcons = ArrayList<ImageView>()
              private val navLabels = ArrayList<TextView>()
              private var page = 0
              private val tabs = listOf(MTab("Home", HOME_URL), MTab("TV Shows", SHOWS_URL), MTab("Sports", SPORTS_URL), MTab("Movies", MOVIES_URL))
              private val chips = ArrayList<TextView>()
              private var tabIdx = 0
              private lateinit var rows: MRows
              private lateinit var sInput: EditText
              private lateinit var sGrid: MGrid
              private lateinit var sHead: TextView
              private var sTok = 0
              private var sRun: Runnable? = null
              private var trend: List<Item> = emptyList()
              private var trendLoading = false
              private var trendAsked = false
              private lateinit var listGrid: MGrid
              private lateinit var setQual: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  AppSettings.load()
                  mStyle(this)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(M_BG) }
                  pages = FrameLayout(this)
                  root.addView(pages, LinearLayout.LayoutParams(-1, 0, 1f))
                  pageViews.add(buildHome()); pageViews.add(buildSearch()); pageViews.add(buildLive()); pageViews.add(buildList()); pageViews.add(buildSettings())
                  for (v in pageViews) pages.addView(v, FrameLayout.LayoutParams(-1, -1))
                  root.addView(buildNav(), LinearLayout.LayoutParams(-1, dpx(58)))
                  setContentView(root)
                  showPage(0)
                  rows.show(tabs[0])
              }

              override fun onResume() {
                  super.onResume()
                  if (page == 3) refreshList()
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (page != 0) { showPage(0); return }
                  if (tabIdx != 0) { selectTab(0); return }
                  super.onBackPressed()
              }

              private fun header(t: String): TextView = TextView(this).apply {
                  text = t; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 22f
                  setPadding(dpx(16), dpx(14), dpx(16), dpx(8))
              }

              // ---------------- navigation
              private fun buildNav(): View {
                  val nav = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setBackgroundColor(Color.rgb(11, 13, 22)) }
                  val icons = intArrayOf(R.drawable.ic_home, R.drawable.ic_search, R.drawable.ic_livetv, R.drawable.ic_add, R.drawable.ic_settings)
                  val names = listOf("Home", "Search", "Live TV", "My List", "Settings")
                  for (i in 0 until 5) {
                      val cell = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; isClickable = true; setOnClickListener { showPage(i) } }
                      val iv = ImageView(this).apply { setImageResource(icons[i]) }
                      val tv = TextView(this).apply { text = names[i]; textSize = 10f; typeface = Typeface.DEFAULT_BOLD }
                      cell.addView(iv, LinearLayout.LayoutParams(dpx(24), dpx(24)))
                      cell.addView(tv, LinearLayout.LayoutParams(-2, -2).apply { topMargin = dpx(2) })
                      nav.addView(cell, LinearLayout.LayoutParams(0, -1, 1f))
                      navIcons.add(iv); navLabels.add(tv)
                  }
                  return nav
              }

              private fun showPage(i: Int) {
                  page = i
                  for (k in pageViews.indices) pageViews[k].visibility = if (k == i) View.VISIBLE else View.GONE
                  for (k in navIcons.indices) {
                      val c = if (k == i) M_YELLOW else Color.parseColor("#8A90A6")
                      navIcons[k].setColorFilter(c); navLabels[k].setTextColor(c)
                  }
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  if (i == 1) {
                      if (!trendAsked) { trendAsked = true; loadTrending() }
                      ui.postDelayed({ sInput.requestFocus(); imm.showSoftInput(sInput, InputMethodManager.SHOW_IMPLICIT) }, 150)
                  } else imm.hideSoftInputFromWindow(sInput.windowToken, 0)
                  if (i == 3) refreshList()
              }

              // ---------------- home
              private fun buildHome(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(dpx(14), dpx(8), 0, dpx(4)) }
                  val brand = TextView(this).apply {
                      text = "liv"; setTextColor(M_YELLOW); typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC); textSize = 28f
                  }
                  bar.addView(brand, LinearLayout.LayoutParams(-2, -2).apply { rightMargin = dpx(14) })
                  val hs = HorizontalScrollView(this).apply { isHorizontalScrollBarEnabled = false; overScrollMode = View.OVER_SCROLL_NEVER }
                  val chipRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 0, dpx(14), 0) }
                  for (i in tabs.indices) {
                      val c = TextView(this).apply {
                          text = tabs[i].title; typeface = Typeface.DEFAULT_BOLD; textSize = 14f
                          setPadding(dpx(16), dpx(8), dpx(16), dpx(8)); isClickable = true
                          setOnClickListener { selectTab(i) }
                      }
                      chips.add(c)
                      chipRow.addView(c, LinearLayout.LayoutParams(-2, -2).apply { rightMargin = dpx(8) })
                  }
                  hs.addView(chipRow)
                  bar.addView(hs, LinearLayout.LayoutParams(0, -2, 1f))
                  rows = MRows(this)
                  col.addView(bar, LinearLayout.LayoutParams(-1, -2))
                  col.addView(rows, LinearLayout.LayoutParams(-1, 0, 1f))
                  styleChips()
                  return col
              }

              private fun styleChips() {
                  for (i in chips.indices) {
                      val sel = i == tabIdx
                      chips[i].setTextColor(if (sel) Color.BLACK else Color.WHITE)
                      chips[i].background = mBg(if (sel) Color.WHITE else Color.argb(255, 30, 34, 50), dpx(18))
                  }
              }

              private fun selectTab(i: Int) {
                  tabIdx = i
                  styleChips()
                  rows.show(tabs[i])
              }

              // ---------------- search
              private fun buildSearch(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val box = FrameLayout(this)
                  sInput = EditText(this).apply {
                      hint = "Search shows & movies"; setHintTextColor(Color.parseColor("#7A8099")); setTextColor(Color.WHITE)
                      textSize = 16f; setSingleLine(true)
                      inputType = InputType.TYPE_CLASS_TEXT
                      imeOptions = EditorInfo.IME_ACTION_SEARCH
                      background = mBg(Color.argb(255, 28, 31, 46), dpx(24))
                      setPadding(dpx(48), 0, dpx(16), 0)
                  }
                  sInput.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) { onQuery(s?.toString() ?: "") }
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                  })
                  box.addView(sInput, FrameLayout.LayoutParams(-1, dpx(46)))
                  val ic = ImageView(this).apply { setImageResource(R.drawable.ic_search); setColorFilter(Color.parseColor("#9AA0B4")) }
                  box.addView(ic, FrameLayout.LayoutParams(dpx(22), dpx(22), Gravity.CENTER_VERTICAL or Gravity.START).apply { leftMargin = dpx(14) })
                  col.addView(box, LinearLayout.LayoutParams(-1, -2).apply { setMargins(dpx(16), dpx(12), dpx(16), dpx(4)) })
                  sHead = TextView(this).apply {
                      text = "Trending in India"; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 18f
                      setPadding(dpx(16), dpx(10), dpx(16), dpx(2))
                  }
                  col.addView(sHead, LinearLayout.LayoutParams(-1, -2))
                  sGrid = MGrid(this)
                  col.addView(sGrid, LinearLayout.LayoutParams(-1, 0, 1f))
                  return col
              }

              private fun onQuery(raw: String) {
                  sRun?.let { ui.removeCallbacks(it) }
                  sTok++
                  val q = raw.trim()
                  if (q.length < 2) {
                      sHead.text = "Trending in India"
                      if (trend.isNotEmpty()) sGrid.setItems(trend, "") else { trendAsked = true; loadTrending() }
                      return
                  }
                  val tok = sTok
                  val r = Runnable { doSearch(q, tok) }
                  sRun = r
                  ui.postDelayed(r, 450)
              }

              private fun loadTrending() {
                  if (trendLoading) return
                  trendLoading = true
                  sGrid.showMsg("Loading...")
                  Thread {
                      val j = Api.get(TRENDING_URL)
                      val list = ArrayList<Item>()
                      mCollectSearch(j?.optJSONObject("resultObj")?.optJSONArray("containers"), list, HashSet(), 0)
                      runOnUiThread {
                          trendLoading = false
                          trend = list
                          if (sInput.text.toString().trim().length < 2) sGrid.setItems(list, "Something went wrong. Check your internet connection.")
                      }
                  }.start()
              }

              private fun doSearch(q: String, tok: Int) {
                  sGrid.showMsg("Searching...")
                  Thread {
                      val url = SEARCH_URL + java.net.URLEncoder.encode(q, "UTF-8") + "&from=0&to=15"
                      val j = Api.get(url)
                      val list = ArrayList<Item>()
                      mCollectSearch(j?.optJSONObject("resultObj")?.optJSONArray("containers"), list, HashSet(), 0)
                      runOnUiThread {
                          if (tok != sTok) return@runOnUiThread
                          sHead.text = "Search results"
                          if (j == null) sGrid.setItems(emptyList(), "Something went wrong. Check your internet connection.")
                          else sGrid.setItems(list, "No results found")
                      }
                  }.start()
              }

              // ---------------- live tv
              private fun buildLive(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(header("Live TV"))
                  val cw = (resources.displayMetrics.widthPixels - dpx(22)) / 3 - dpx(10)
                  val chh = (cw * 0.95f).toInt()
                  val rv = RecyclerView(this).apply {
                      layoutManager = GridLayoutManager(this@MobileActivity, 3)
                      clipToPadding = false; overScrollMode = View.OVER_SCROLL_NEVER
                      setPadding(dpx(11), dpx(6), dpx(11), dpx(16))
                  }
                  rv.adapter = object : RecyclerView.Adapter<MLiveVH>() {
                      override fun getItemCount() = CHANNELS.size
                      override fun onCreateViewHolder(p: ViewGroup, t: Int): MLiveVH {
                          val box = FrameLayout(this@MobileActivity).apply {
                              layoutParams = RecyclerView.LayoutParams(cw, chh).apply { setMargins(dpx(5), dpx(5), dpx(5), dpx(5)) }
                              background = mBg(M_PANEL, dpx(12)); isClickable = true
                          }
                          val iv = ImageView(this@MobileActivity).apply { scaleType = ImageView.ScaleType.FIT_CENTER; setPadding(dpx(14), dpx(12), dpx(14), dpx(6)) }
                          val tv = TextView(this@MobileActivity).apply {
                              setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 11f; gravity = Gravity.CENTER
                              maxLines = 1; ellipsize = TextUtils.TruncateAt.END; setPadding(dpx(4), 0, dpx(4), dpx(8))
                          }
                          box.addView(iv, FrameLayout.LayoutParams(-1, chh - dpx(28), Gravity.TOP))
                          box.addView(tv, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                          return MLiveVH(box, iv, tv)
                      }
                      override fun onBindViewHolder(h: MLiveVH, pos: Int) {
                          val c = CHANNELS[pos]
                          Glide.with(h.iv).load(c.logo).diskCacheStrategy(DiskCacheStrategy.ALL).fitCenter().into(h.iv)
                          h.tv.text = c.name
                          h.box.setOnClickListener {
                              val i = Intent(this@MobileActivity, MobilePlayerActivity::class.java)
                              i.putExtra("live_idx", pos)
                              startActivity(i)
                          }
                      }
                  }
                  col.addView(rv, LinearLayout.LayoutParams(-1, 0, 1f))
                  return col
              }

              // ---------------- my list
              private fun buildList(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(header("My List"))
                  listGrid = MGrid(this)
                  col.addView(listGrid, LinearLayout.LayoutParams(-1, 0, 1f))
                  return col
              }

              private fun refreshList() {
                  listGrid.setItems(Store.myList(), "Your list is empty\nOpen a show or movie and tap + My List")
              }

              // ---------------- settings
              private fun buildSettings(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(header("Settings"))
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(dpx(16), dpx(14), dpx(16), dpx(14)); background = mBg(M_PANEL, dpx(12)); isClickable = true
                  }
                  val tc = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  tc.addView(TextView(this).apply { text = "Image quality"; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 16f })
                  tc.addView(TextView(this).apply { text = "Optimized loads faster. High loads the original images."; setTextColor(Color.parseColor("#9AA0B4")); textSize = 12f })
                  setQual = TextView(this).apply {
                      typeface = Typeface.DEFAULT_BOLD; textSize = 14f; setTextColor(Color.BLACK)
                      setPadding(dpx(18), dpx(7), dpx(18), dpx(7)); background = mBg(M_YELLOW, dpx(18))
                  }
                  row.addView(tc, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(setQual, LinearLayout.LayoutParams(-2, -2))
                  row.setOnClickListener { AppSettings.highQuality = !AppSettings.highQuality; AppSettings.save(); renderSettings() }
                  col.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(dpx(16), dpx(8), dpx(16), 0) })
                  col.addView(TextView(this).apply {
                      text = "Phone and TV share one app. On a TV the TV interface opens automatically."
                      setTextColor(Color.parseColor("#7A8099")); textSize = 12f; setPadding(dpx(20), dpx(16), dpx(20), 0)
                  })
                  renderSettings()
                  return col
              }

              private fun renderSettings() { setQual.text = if (AppSettings.highQuality) "High" else "Optimized" }
          }

