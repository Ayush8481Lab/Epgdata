                      t.addView(ShimmerView(this, dpx(6).toFloat()), LinearLayout.LayoutParams(dpx(150), dpx(14)))
                      t.addView(ShimmerView(this, dpx(6).toFloat()), LinearLayout.LayoutParams(dpx(100), dpx(10)).apply { topMargin = dpx(10) })
                      r.addView(t, LinearLayout.LayoutParams(-2, -2).apply { leftMargin = dpx(12) })
