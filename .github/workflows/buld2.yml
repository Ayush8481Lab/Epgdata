              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  if (Build.VERSION.SDK_INT >= 28) {
                      val a = window.attributes
                      a.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = a
                  }
                  val dm = resources.displayMetrics
                  scrW = max(dm.widthPixels, dm.heightPixels)
                  scrH = min(dm.widthPixels, dm.heightPixels)
                  panelW = (scrW * 0.46f).toInt()
                  val x = intent
                  cid = x.getStringExtra("cid") ?: ""
                  epTitle = x.getStringExtra("ep_title") ?: ""
                  showTitle = x.getStringExtra("show_title") ?: ""
                  epNum = x.getIntExtra("ep_num", 0)
                  season = x.getIntExtra("season", 0)
                  thumbUrl = x.getStringExtra("thumb")?.takeIf { v -> v.isNotBlank() }
                  durSec = x.getIntExtra("dur", 0)
                  direct = x.getStringExtra("direct")
                  showCid = x.getStringExtra("show_cid") ?: ""
                  showSub = x.getStringExtra("show_sub") ?: ""
                  track = x.getBooleanExtra("track", false)
                  resumeAt = x.getLongExtra("start", 0L)
                  seasonId = x.getStringExtra("season_id") ?: ""
                  noEps = x.getBooleanExtra("noeps", false)
                  liveIdx = x.getIntExtra("live_idx", -1)
                  buildUi()
                  setContentView(root)
                  hideBars()
                  applyModeUi()
                  if (liveIdx < 0 && seasonId.isNotBlank() && !noEps) loadEps()
                  ui.removeCallbacks(tickRun); ui.postDelayed(tickRun, 500)
                  begin()
