              private fun applyModeUi() {
                  val live = liveIdx >= 0 && liveStartS == 0L
                  seek.visibility = if (live) View.GONE else View.VISIBLE
                  tPos.visibility = if (live) View.GONE else View.VISIBLE
                  tDur.visibility = if (live) View.GONE else View.VISIBLE
                  tLive.visibility = if (live) View.VISIBLE else View.GONE
                  btnRew.visibility = if (live) View.INVISIBLE else View.VISIBLE
                  btnFf.visibility = if (live) View.INVISIBLE else View.VISIBLE
                  (pillEps.getChildAt(1) as TextView).text = if (liveIdx >= 0) "Catchup" else "Episodes"
                  pillEps.visibility = if (liveIdx >= 0 || (!noEps && direct == null && seasonId.isNotBlank())) View.VISIBLE else View.GONE
              }

              private fun setTitles() {
                  if (liveIdx >= 0) {
                      tTitle.text = CHANNELS.getOrNull(liveIdx)?.name ?: "Live"
                      tSub.text = if (liveStartS > 0L) epTitle else "Live"
                      return
                  }
                  val pre = ((if (season > 0) "S$season " else "") + (if (epNum > 0) "E$epNum" else "")).trim()
                  val name = if (epTitle.isNotBlank()) epTitle else showTitle
                  tTitle.text = if (pre.isNotEmpty()) "$pre • $name" else name
                  tSub.text = if (epTitle.isNotBlank()) showTitle else ""
              }

              private fun flashText(t: String) {
                  flash.animate().cancel()
                  flash.text = t; flash.alpha = 1f; flash.visibility = View.VISIBLE
                  flash.animate().alpha(0f).setStartDelay(450).setDuration(300).withEndAction { flash.visibility = View.GONE }.start()
              }

              // ---------------------------------------------------------------- controls
              private fun showControls() {
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = true
                  ctrl.animate().cancel()
                  ctrl.visibility = View.VISIBLE
                  ctrl.animate().alpha(1f).setDuration(150).start()
                  cue.animate().translationY(-dpx(70).toFloat()).setDuration(150).start()
                  schedHide()
              }

              private fun schedHide() {
                  ui.removeCallbacks(hideRun)
                  if (panelMode == 0 && player?.playWhenReady == true) ui.postDelayed(hideRun, 4000)
              }

              private fun hideControls() {
                  ctrlVisible = false
                  ctrl.animate().cancel()
                  ctrl.animate().alpha(0f).setDuration(200).withEndAction { if (!ctrlVisible) ctrl.visibility = View.INVISIBLE }.start()
                  cue.animate().translationY(0f).setDuration(150).start()
              }

              private fun totalMs(): Long {
                  val p = player
                  return if (p != null && p.duration > 0) p.duration else durSec * 1000L
              }

              private fun updateProgress() {
                  val p = player
                  if (liveIdx >= 0 && liveStartS == 0L) return
                  val dur = totalMs()
                  if (!scrubbing) {
                      val pos = p?.currentPosition ?: 0L
                      seek.progress = if (dur > 0) (pos * 1000L / dur).toInt().coerceIn(0, 1000) else 0
                      seek.secondaryProgress = if (dur > 0 && p != null) (p.bufferedPosition * 1000L / dur).toInt().coerceIn(0, 1000) else 0
                      tPos.text = fmtClock(pos)
                  }
                  tDur.text = fmtClock(dur)
              }

              private fun seekRel(d: Long) {
                  val p = player ?: return
                  val t = (p.currentPosition + d).coerceIn(0L, max(0L, totalMs() - 1000L))
                  p.seekTo(t)
                  flashText(if (d < 0) "-10s" else "+10s")
                  if (ctrlVisible) schedHide()
              }

              private fun togglePause() {
                  val p = player ?: return
                  if (p.playbackState == Player.STATE_ENDED) { p.seekTo(0); p.play(); return }
                  if (p.playWhenReady) p.pause() else p.play()
              }

              private fun refreshUi() {
                  val p = player ?: return
                  btnPlay.setImageResource(if (p.playWhenReady) R.drawable.ic_pause else R.drawable.ic_play)
                  val st = p.playbackState
                  val failed = errBox?.visibility == View.VISIBLE
                  val buffering = !failed && ((st == Player.STATE_BUFFERING && p.playWhenReady) || (!firstFrame && st != Player.STATE_ENDED))
                  spin.visibility = if (buffering) View.VISIBLE else View.GONE
                  btnPlay.visibility = if (buffering) View.INVISIBLE else View.VISIBLE
                  if (!p.playWhenReady) { ui.removeCallbacks(hideRun); if (panelMode == 0) showControls() } else schedHide()
              }

              // ---------------------------------------------------------------- stream + playback
              private fun mergeSubs(s: StreamInfo, ex: EpExtra?): StreamInfo {
                  if (ex == null || ex.subs.isEmpty()) return s
                  val have = HashSet<String>()
                  s.subs.forEach { have.add(it.url) }
                  val all = ArrayList<SubInfo>(s.subs)
                  for (x in ex.subs) if (have.add(x.url)) all.add(x)
                  return StreamInfo(s.url, s.enc, s.laUrl, s.drm, all, s.audios, s.selAudio)
              }

              private fun fetchStreamPref(id: String): StreamInfo? {
                  val s = fetchStream(id) ?: return null
                  val pa = MPref.audio
                  if (pa.isNotEmpty() && s.audios.isNotEmpty() && !pa.equals(s.selAudio, true) && s.audios.any { it.code.equals(pa, true) }) {
                      return fetchStream(id, pa) ?: s
                  }
                  return s
              }

              private fun liveStream(): StreamInfo? {
                  val ch = CHANNELS.getOrNull(liveIdx) ?: return null
                  val tk = LiveAuth.token() ?: return null
                  val url = if (liveStartS > 0L)
                      ch.base.replace("master.m3u8", "master-archive.m3u8") + "?startTime=" + liveStartS + "&endTime=" + liveEndS + "&" + tk
                  else ch.base + "?" + tk
                  return StreamInfo(url, false, "", "", emptyList())
              }

                           private fun begin() {
                  if (cid.isBlank() && direct == null && liveIdx < 0) { finish(); return }
                  val tk = ++token
                  hideError()
                  firstFrame = false
                  closePanelNow()
                  applyModeUi()
                  setTitles()
                  spin.visibility = View.VISIBLE
                  thumb.animate().cancel(); thumb.alpha = 1f
                  Glide.with(this).clear(thumb)
                  val tu = if (liveIdx >= 0) null else img(thumbUrl, W_THUMB)
                  thumb.visibility = View.VISIBLE
                  if (tu != null) Glide.with(this).load(tu).centerCrop().diskCacheStrategy(DiskCacheStrategy.ALL).into(thumb)
                  btnPlay.setImageResource(R.drawable.ic_pause)
                  seek.progress = 0; seek.secondaryProgress = 0
                  tPos.text = fmtClock(resumeAt); tDur.text = fmtClock(durSec * 1000L)
                  showControls()
                  val d = direct
                  val id = cid
                  Thread {
                      val df = if (liveIdx >= 0 || d != null || id.isBlank()) null else Api.pool.submit(Callable<JSONObject?> { Api.get(DETAIL_URL + id) })
                      val s: StreamInfo? = if (liveIdx >= 0) liveStream() else if (d != null) StreamInfo(d, false, "", "", emptyList()) else fetchStreamPref(id)
                      val ex = parseEpExtra(try { df?.get(4, TimeUnit.SECONDS) } catch (e: Exception) { null })
                      lastEx = ex
                      runOnUiThread {
                          if (tk != token || isFinishing) return@runOnUiThread
                          if (ex != null && ex.en > 0) {
                              epNum = ex.en
                              if (ex.sn > 0) season = ex.sn
                              ex.et?.let { epTitle = it }
                              setTitles()
                          }
                          if (s == null) showError() else startPlayback(mergeSubs(s, ex))
                      }
                  }.start()
              }

              private val listener = object : Player.Listener {
                  override fun onPlaybackStateChanged(playbackState: Int) {
                      refreshUi()
                      if (playbackState == Player.STATE_ENDED) playNext()
                  }
                  override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) { refreshUi() }
                  override fun onVideoSizeChanged(videoSize: VideoSize) {
                      if (videoSize.width == 0 || videoSize.height == 0) return
                      val ar = videoSize.width * videoSize.pixelWidthHeightRatio / videoSize.height
                      var w = scrW
                      var h = (w / ar).toInt()
                      if (h > scrH) { h = scrH; w = (h * ar).toInt() }
                      surface.layoutParams = FrameLayout.LayoutParams(w, h, Gravity.CENTER)
                  }
                  override fun onRenderedFirstFrame() {
                      firstFrame = true
                      thumb.animate().cancel()
                      thumb.animate().alpha(0f).setDuration(250).withEndAction { if (firstFrame) thumb.visibility = View.GONE }.start()
                      refreshUi()
                  }
                  override fun onCues(cueGroup: CueGroup) {
                      val t = cueGroup.cues.mapNotNull { it.text?.toString() }.filter { it.isNotBlank() }.joinToString("\n")
                      cue.text = t
                      cue.visibility = if (t.isEmpty()) View.GONE else View.VISIBLE
                  }
                  override fun onPlayerError(error: PlaybackException) { showError() }
              }

              private fun ensurePlayer(): ExoPlayer {
                  player?.let { return it }
                  val dsf = DefaultHttpDataSource.Factory()
                      .setUserAgent(STREAM_UA)
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(20000)
                      .setDefaultRequestProperties(STREAM_HEADERS)
                  dsfRef = dsf
                  val p = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(this).setDataSourceFactory(dsf))
                      .build()
                  p.setAudioAttributes(AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true)
                  p.addListener(listener)
                  player = p
                  return p
              }

              private fun startPlayback(s: StreamInfo) {
                  audioOpts = s.audios; curAudio = s.selAudio
                  val p = ensurePlayer()
                  p.setVideoSurfaceView(surface)
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .clearOverrides().setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true).build()
                  qualitySel = 0
                  val url = playableUrl(s.url)
                  val lower = url.lowercase()
                  val mime = when {
                      lower.contains(".m3u8") -> MimeTypes.APPLICATION_M3U8
                      lower.contains(".mpd") -> MimeTypes.APPLICATION_MPD
                      else -> null
                  }
                  val mb = MediaItem.Builder().setUri(url)
                  if (mime != null) mb.setMimeType(mime)
                  if (s.enc && s.laUrl.isNotBlank() && s.drm == "WIDEVINE") {
                      mb.setDrmConfiguration(
                          MediaItem.DrmConfiguration.Builder(C.WIDEVINE_UUID)
                              .setLicenseUri(s.laUrl)
                              .setLicenseRequestHeaders(STREAM_HEADERS)
                              .build()
                      )
                  }
                  val subs = ArrayList<MediaItem.SubtitleConfiguration>()
                  for (si in s.subs) {
                      val ul = si.url.lowercase().substringBefore("?")
                      val sm = when {
                          ul.endsWith(".vtt") -> MimeTypes.TEXT_VTT
                          ul.endsWith(".srt") -> MimeTypes.APPLICATION_SUBRIP
                          ul.endsWith(".ttml") || ul.endsWith(".xml") || ul.endsWith(".dfxp") -> MimeTypes.APPLICATION_TTML
                          else -> null
                      } ?: continue
                      subs.add(MediaItem.SubtitleConfiguration.Builder(Uri.parse(si.url))
                          .setMimeType(sm).setLanguage(si.lang).setLabel(si.label).setSelectionFlags(0).build())
                  }
                  if (subs.isNotEmpty()) mb.setSubtitleConfigurations(subs)
                  val st = resumeAt
                  resumeAt = 0L
                  val mi = mb.build()
                  val d0 = dsfRef
                  if (mime == MimeTypes.APPLICATION_M3U8 && d0 != null) {
                      mb.setSubtitleConfigurations(emptyList())
                      val hls: MediaSource = HlsMediaSource.Factory(d0).setAllowChunklessPreparation(false).createMediaSource(mb.build())
                      val all = ArrayList<MediaSource>()
                      all.add(hls)
                      for (sc in subs) all.add(SingleSampleMediaSource.Factory(d0).createMediaSource(sc, C.TIME_UNSET))
                      p.setMediaSource(if (all.size == 1) hls else MergingMediaSource(*all.toTypedArray()), st)
                  } else p.setMediaItem(mi, st)
                  p.prepare()
                  p.playWhenReady = true
                  refreshUi()
              }

              private fun showError() {
                  spin.visibility = View.GONE
                  val e = errBox ?: mErrorView(this) { retryPlay() }.also { root.addView(it, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER)); errBox = it }
                  mShowError(e, mOffline(this), "We couldn't play this video. Please try again.")
                  btnPlay.visibility = View.INVISIBLE
                  showControls()
              }

              private fun hideError() { errBox?.visibility = View.GONE }

              private fun retryPlay() {
                  resumeAt = player?.currentPosition ?: resumeAt
                  begin()
              }

              private fun playNext() {
                  if (liveIdx >= 0) return
                  val i = epsList.indexOfFirst { it.id == cid }
                  if (i > 0) playEpisode(epsList[i - 1]) else finish()
              }

              private fun playEpisode(ep: Ep) {
                  saveProgress()
                  cid = ep.id; epTitle = ep.title; epNum = ep.num; thumbUrl = ep.thumb; durSec = ep.dur
                  resumeAt = 0L; direct = null
                  begin()
              }

              private fun switchAudio(code: String) {
                  if (liveIdx >= 0 || code.equals(curAudio, true) || cid.isBlank()) return
                  val pos = player?.currentPosition ?: 0L
                  val tk = ++token
                  spin.visibility = View.VISIBLE
                  val id = cid
                  Thread {
                      val s = fetchStream(id, code)
                      runOnUiThread {
                          if (tk != token || isFinishing) return@runOnUiThread
                          if (s == null) { spin.visibility = View.GONE; mToast(this, "This audio is not available"); return@runOnUiThread }
                          MPref.audio = code
                          resumeAt = pos
                          startPlayback(mergeSubs(s, lastEx))
                      }
                  }.start()
              }

              private fun saveProgress() {
                  if (!track || showCid.isBlank() || liveIdx >= 0) return
                  val p = player ?: return
                  val dur = if (p.duration > 0) p.duration else durSec * 1000L
                  if (dur <= 0L) return
                  val pos = p.currentPosition
                  if (pos >= (dur * RESUME_MAX).toLong()) Store.clearResume(showCid)
                  else if (pos >= 5000L) Store.putResume(Resume(showCid, showSub, cid, epTitle, epNum, season, thumbUrl,
                      (dur / 1000L).toInt(), pos, System.currentTimeMillis()))
              }

              // ---------------------------------------------------------------- side panel
              private fun pHead(t: String): TextView = TextView(this).apply {
                  text = t; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 17f
                  setPadding(dpx(6), dpx(12), dpx(6), dpx(8))
              }

              private fun loadingTv(t: String): TextView = TextView(this).apply {
                  text = t; setTextColor(Color.parseColor("#B4B8C8")); setPadding(dpx(6), dpx(10), dpx(6), dpx(10))
              }

              private fun pRow(label: String, selected: Boolean, onClick: () -> Unit): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(dpx(10), dpx(12), dpx(10), dpx(12)); isClickable = true
                      if (selected) background = mBg(Color.argb(60, 255, 255, 255), dpx(8))
                      setOnClickListener { onClick() }
                  }
                  val ck = ImageView(this).apply {
                      setImageResource(R.drawable.ic_check); setColorFilter(M_YELLOW)
                      visibility = if (selected) View.VISIBLE else View.INVISIBLE
                  }
                  val tv = TextView(this).apply {
                      text = label; setTextColor(Color.WHITE); textSize = 15f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                      typeface = if (selected) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                  }
                  row.addView(ck, LinearLayout.LayoutParams(dpx(22), dpx(22)).apply { rightMargin = dpx(12) })
                  row.addView(tv, LinearLayout.LayoutParams(0, -2, 1f))
                  return row
              }

              private fun showPanel(mode: Int) {
                  panelMode = mode
                  ui.removeCallbacks(hideRun)
                  hideControls()
                  scrim.visibility = View.VISIBLE
                  panel.visibility = View.VISIBLE
                  panel.animate().cancel()
                  panel.animate().translationX(0f).setDuration(220).start()
              }

              private fun closePanel() {
                  if (panelMode == 0) return
                  panelMode = 0
                  scrim.visibility = View.GONE
                  panel.animate().cancel()
                  panel.animate().translationX(panelW.toFloat()).setDuration(200).withEndAction { if (panelMode == 0) panel.visibility = View.GONE }.start()
                  showControls()
              }

              private fun closePanelNow() {
                  panelMode = 0
                  scrim.visibility = View.GONE
                  panel.animate().cancel()
                  panel.visibility = View.GONE
                  panel.translationX = panelW.toFloat()
              }

              private fun trackLabel(f: Format, i: Int): String {
                  f.label?.takeIf { it.isNotBlank() }?.let { return it }
                  val lang = f.language
                  if (!lang.isNullOrBlank() && lang != "und") {
                      val n = Locale.forLanguageTag(lang).getDisplayLanguage(Locale.ENGLISH)
                      return if (n.isNotBlank()) n else lang
                  }
                  return "Track " + (i + 1)
              }

              private fun selectText(g: Tracks.Group?, idx: Int) {
                  val p = player ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (g == null) b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                  else {
                      b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                      b.setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx))
                  }
                  p.trackSelectionParameters = b.build()
                  if (g == null) { cue.text = ""; cue.visibility = View.GONE }
              }

              private fun selectAudio(g: Tracks.Group, idx: Int) {
                  val p = player ?: return
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx)).build()
              }

              private fun qualityOptions(): List<QOpt> {
                  val p = player ?: return emptyList()
                  val best = HashMap<Int, QOpt>()
                  for (g in p.currentTracks.groups) {
                      if (g.type != C.TRACK_TYPE_VIDEO) continue
                      for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          val f = g.getTrackFormat(i)
                          if (f.height <= 0) continue
                          val cur = best[f.height]
                          if (cur == null || f.bitrate > cur.br) best[f.height] = QOpt(f.height, g, i, f.bitrate)
                      }
                  }
                  return best.values.sortedByDescending { it.h }
              }

              private fun selectQuality(o: QOpt?) {
                  val p = player ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (o == null) { b.clearOverridesOfType(C.TRACK_TYPE_VIDEO); qualitySel = 0 }
                  else { b.setOverrideForType(TrackSelectionOverride(o.g.mediaTrackGroup, o.idx)); qualitySel = o.h }
                  p.trackSelectionParameters = b.build()
              }

              private fun openSubs() {
                  val p = player ?: return
                  panelCol.removeAllViews()
                  val tracks = p.currentTracks
                  panelCol.addView(pHead("Subtitles"))
                  val off = p.trackSelectionParameters.disabledTrackTypes.contains(C.TRACK_TYPE_TEXT)
                  class TR(val g: Tracks.Group, val i: Int, val label: String, val sel: Boolean)
                  val tl = ArrayList<TR>()
                  for (g in tracks.groups) if (g.type == C.TRACK_TYPE_TEXT) for (i in 0 until g.length) {
                      if (g.isTrackSupported(i)) tl.add(TR(g, i, trackLabel(g.getTrackFormat(i), tl.size), !off && g.isTrackSelected(i)))
                  }
                  panelCol.addView(pRow("OFF", off || tl.none { it.sel }) { selectText(null, 0); closePanel() })
                  for (t in tl) panelCol.addView(pRow(t.label, t.sel) { selectText(t.g, t.i); closePanel() })
                  panelCol.addView(pHead("Audio"))
                  var any = false
                  for (ao in audioOpts) {
                      any = true
                      val sel = ao.code.equals(curAudio, true)
                      panelCol.addView(pRow(ao.label, sel) { switchAudio(ao.code); closePanel() })
                  }
                  if (audioOpts.isEmpty()) for (g in tracks.groups) if (g.type == C.TRACK_TYPE_AUDIO) for (i in 0 until g.length) {
                      if (!g.isTrackSupported(i)) continue
                      any = true
                      val sel = g.isTrackSelected(i)
                      panelCol.addView(pRow(trackLabel(g.getTrackFormat(i), i), sel) { selectAudio(g, i); closePanel() })
                  }
                  if (!any) panelCol.addView(pRow("Default", true) { closePanel() })
                  showPanel(1)
              }

              private fun openQuality() {
                  if (player == null) return
                  panelCol.removeAllViews()
                  panelCol.addView(pHead("Video Quality"))
                  panelCol.addView(pRow("Auto", qualitySel == 0) { selectQuality(null); closePanel() })
                  for (o in qualityOptions()) panelCol.addView(pRow(o.h.toString() + "p", qualitySel == o.h) { selectQuality(o); closePanel() })
                  showPanel(2)
              }

              // ---------------------------------------------------------------- episodes panel
              private fun loadEps() {
                  if (epLoading || !epHasMore || seasonId.isBlank()) return
                  epLoading = true
                  val from = epFrom
                  val url = EP_URL + seasonId + "?from=" + from + "&to=" + (from + EP_PAGE - 1) + "&orderBy=episodeNumber&sortOrder=desc&kids_safe=false"
                  Thread {
                      val j = Api.get(url)
                      val arr = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.optJSONArray("containers")
                      val list = ArrayList<Ep>()
                      if (arr != null) for (k in 0 until arr.length()) parseEp(arr.optJSONObject(k))?.let { list.add(it) }
                      runOnUiThread {
                          epLoading = false
                          if (j != null) {
                              epFrom = from + EP_PAGE
                              if (list.size < EP_PAGE) epHasMore = false
                              epsList.addAll(list)
                          }
                          if (panelMode == 3) renderEpisodes()
                      }
                  }.start()
              }

              private fun openEpisodes() {
                  if (epsList.isEmpty()) loadEps()
                  renderEpisodes()
                  showPanel(3)
              }

              private fun renderEpisodes() {
                  panelCol.removeAllViews()
                  panelCol.addView(pHead("Episodes"))
                  if (epsList.isEmpty()) { panelCol.addView(loadingTv(if (epLoading) "Loading..." else "No episodes")); return }
                  for (ep in epsList) panelCol.addView(epRow(ep))
                  if (epHasMore) panelCol.addView(pRow("Load more", false) { loadEps() })
              }

              private fun epRow(ep: Ep): LinearLayout {
                  val playing = ep.id == cid
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(dpx(6), dpx(8), dpx(6), dpx(8)); isClickable = true
                      if (playing) background = mBg(Color.argb(60, 255, 255, 255), dpx(8))
                      setOnClickListener { if (!playing) playEpisode(ep) else closePanel() }
                  }
                  val tw = dpx(110)
                  val th = tw * 9 / 16
                  val iv = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP; setBackgroundColor(M_CARD); mRound(this, dpx(6)) }
                  Glide.with(iv).load(img(ep.thumb, W_EP)).override(tw, th).centerCrop().into(iv)
                  row.addView(iv, LinearLayout.LayoutParams(tw, th))
                  val tc = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  tc.addView(TextView(this).apply {
                      text = (if (ep.num > 0) "${ep.num}. " else "") + ep.title
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 13f; maxLines = 2; ellipsize = TextUtils.TruncateAt.END
                  })
                  val bits = ArrayList<String>()
                  if (playing) bits.add("Now Playing")
                  fmtDur(ep.dur).takeIf { s -> s.isNotEmpty() }?.let { bits.add(it) }
                  tc.addView(TextView(this).apply {
                      text = bits.joinToString(" • "); textSize = 11f
                      setTextColor(if (playing) M_YELLOW else Color.parseColor("#B4B8C8"))
                  })
                  row.addView(tc, LinearLayout.LayoutParams(0, -2, 1f).apply { leftMargin = dpx(10) })
                  return row
              }

              // ---------------------------------------------------------------- live catchup panel
              private fun openCatchup() {
                  cuDays = mLiveDays(); cuDay = 0; cuList = null
                  renderCatchup()
                  showPanel(4)
                  loadCatchupDay()
              }

              private fun loadCatchupDay() {
                  val ch = CHANNELS.getOrNull(liveIdx) ?: return
                  val off = cuDays.getOrNull(cuDay)?.id?.toIntOrNull() ?: 0
                  val day = cuDay
                  cuList = null
                  Thread {
                      val l = fetchEpg(ch.jio, off)
                      runOnUiThread {
                          if (day == cuDay && panelMode == 4) { cuList = l ?: emptyList(); renderCatchup() }
                      }
                  }.start()
              }

              private fun renderCatchup() {
                  panelCol.removeAllViews()
                  panelCol.addView(pHead("Catchup"))
                  val hs = HorizontalScrollView(this).apply { isHorizontalScrollBarEnabled = false }
                  val chipRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  for (i in cuDays.indices) {
                      val sel = i == cuDay
                      val c = TextView(this).apply {
                          text = cuDays[i].title; typeface = Typeface.DEFAULT_BOLD; textSize = 13f
                          setTextColor(if (sel) Color.BLACK else Color.WHITE)
                          setPadding(dpx(14), dpx(7), dpx(14), dpx(7))
                          background = mBg(if (sel) Color.WHITE else Color.argb(255, 44, 48, 66), dpx(16)); isClickable = true
                          setOnClickListener { cuDay = i; renderCatchup(); loadCatchupDay() }
                      }
                      chipRow.addView(c, LinearLayout.LayoutParams(-2, -2).apply { rightMargin = dpx(8) })
                  }
                  hs.addView(chipRow)
                  panelCol.addView(hs, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dpx(6) })
                  val l = cuList
                  if (l == null) { panelCol.addView(loadingTv("Loading...")); return }
                  if (l.isEmpty()) { panelCol.addView(loadingTv("No programs")); return }
                  val now = System.currentTimeMillis()
                  for (p in l) {
                      val live = p.start <= now && now < p.end
                      val label = fmtTimeIst(p.start) + "   " + p.name + (if (live) "   • LIVE" else "")
                      panelCol.addView(pRow(label, live) { playCatchup(p) })
                  }
              }

              private fun playCatchup(p: Prog) {
                  val now = System.currentTimeMillis()
                  if (p.start > now) { mToast(this, "This program has not aired yet"); return }
                  if (now < p.end) {
                      liveStartS = 0L; liveEndS = 0L; epTitle = ""; resumeAt = 0L
                      begin(); return
                  }
                  if (p.start < now - 7 * 86400000L) { mToast(this, "Catchup is available for the last 7 days only"); return }
                  val endCap = min(p.end, now - 30000L)
                  if (endCap <= p.start) { mToast(this, "Not available yet"); return }
                  liveStartS = p.start / 1000L; liveEndS = endCap / 1000L
                  epTitle = p.name; durSec = ((endCap - p.start) / 1000L).toInt(); resumeAt = 0L
                  begin()
              }
          }

