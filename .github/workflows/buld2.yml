          // Search / trending tiles -> Item (shows + movie bundles only; MOVIE assets are mapped to their bundle)
          fun mParseSearch(o: JSONObject): Item? {
              val it0 = parseItem(o) ?: return null
              if (it0.cid.isBlank()) return null
              if (it0.sub == SUB_SHOW || it0.sub == SUB_MOVIE_BUNDLE) return it0
              if (it0.sub == "MOVIE") {
                  val ps = o.optJSONArray("parents")
                  if (ps != null) for (i in 0 until ps.length()) {
                      val p = ps.optJSONObject(i) ?: continue
                      val pid = p.optString("parentId")
                      if (p.optString("parentSubType").equals(SUB_MOVIE_BUNDLE, true) && pid.isNotBlank() && pid != "0")
                          return it0.copy(id = pid, cid = pid, sub = SUB_MOVIE_BUNDLE)
                  }
              }
              return null
          }

          fun mCollectSearch(arr: JSONArray?, out: ArrayList<Item>, seen: HashSet<String>, depth: Int) {
              if (arr == null || depth > 3) return
              for (i in 0 until arr.length()) {
                  val c = arr.optJSONObject(i) ?: continue
                  val p = mParseSearch(c)
                  if (p != null) { if (seen.add(p.cid)) out.add(p); continue }
                  mCollectSearch(c.optJSONArray("containers"), out, seen, depth + 1)
                  mCollectSearch(c.optJSONArray("assets"), out, seen, depth + 1)
              }
          }

          // date column of the catchup panel (IST): Today, Yesterday, 10 Nov ...
          fun mLiveDays(): List<Season> {
              val ist = java.util.TimeZone.getTimeZone("Asia/Kolkata")
              val c = java.util.Calendar.getInstance(ist)
              val mins = c.get(java.util.Calendar.HOUR_OF_DAY) * 60 + c.get(java.util.Calendar.MINUTE)
              val base = if (mins < 330) 1 else 0
              val f = SimpleDateFormat("dd MMM", Locale.ENGLISH).apply { timeZone = ist }
              val out = ArrayList<Season>()
              for (d in 0..7) {
                  val off = base - d
                  if (off < -7) break
                  val label = when (d) { 0 -> "Today"; 1 -> "Yesterday"; else -> f.format(Date(System.currentTimeMillis() - d * 86400000L)) }
                  out.add(Season(off.toString(), label, 0, 0, 0L))
              }
              return out
          }

