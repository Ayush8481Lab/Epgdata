                  metaTv = TextView(this).apply { setTextColor(Color.parseColor("#E8E8E8")); typeface = Typeface.DEFAULT_BOLD; textSize = 13f }
                  tagTv = TextView(this).apply { setTextColor(Color.parseColor("#4FC3F7")); typeface = Typeface.DEFAULT_BOLD; textSize = 13f; visibility = View.GONE }
                  info.addView(metaTv, LinearLayout.LayoutParams(-1, -2))
                  info.addView(tagTv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(4) })

                  skel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  skel.addView(ShimmerView(this, dpx(6).toFloat()), LinearLayout.LayoutParams(dpx(200), dpx(14)).apply { topMargin = dpx(6) })
                  skel.addView(ShimmerView(this, dpx(6).toFloat()), LinearLayout.LayoutParams(-1, dpx(12)).apply { topMargin = dpx(14) })
                  skel.addView(ShimmerView(this, dpx(6).toFloat()), LinearLayout.LayoutParams(dpx(260), dpx(12)).apply { topMargin = dpx(8) })
                  info.addView(skel, LinearLayout.LayoutParams(-1, -2))

                  // resume block
                  resumeBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE }
                  resumeBtn = mBigBtn(this, "▶  Resume", true) { resumeNow() }
                  resumeBar = BarView(this)
                  resumeTime = TextView(this).apply { setTextColor(Color.parseColor("#C8C8D0")); textSize = 12f }
                  resumeBox.addView(resumeBtn, LinearLayout.LayoutParams(-1, -2))
                  resumeBox.addView(resumeBar, LinearLayout.LayoutParams(-1, max(3, dpx(4))).apply { topMargin = dpx(8) })
                  resumeBox.addView(resumeTime, LinearLayout.LayoutParams(-2, -2).apply { topMargin = dpx(4) })
                  info.addView(resumeBox, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(14) })

                  watchBtn = mBigBtn(this, if (movie) "▶  Watch Movie" else "▶  Watch Latest Episode", !(resumeBox.visibility == View.VISIBLE)) { onWatch() }
                  info.addView(watchBtn, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(12) })

                  val sec = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  listBtn = mBigBtn(this, "+  My List", false) { toggleList() }
                  trailerBtn = mBigBtn(this, "▶  Trailer", false) { playTrailer() }
                  trailerBtn.visibility = View.GONE
                  sec.addView(listBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { rightMargin = dpx(6) })
                  sec.addView(trailerBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { leftMargin = dpx(6) })
                  info.addView(sec, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(10) })

                  descTv = TextView(this).apply { setTextColor(Color.parseColor("#DADAE2")); textSize = 14f; maxLines = 3; ellipsize = TextUtils.TruncateAt.END }
                  descTv.setOnClickListener { descTv.maxLines = if (descTv.maxLines == 3) 50 else 3 }
                  info.addView(descTv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(14) })

                  extra = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  info.addView(extra, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(8) })

                  epHead = TextView(this).apply { text = "Episodes"; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 18f; visibility = View.GONE }
                  info.addView(epHead, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(22) })
                  seasonScroll = HorizontalScrollView(this).apply { isHorizontalScrollBarEnabled = false; visibility = View.GONE }
                  seasonRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  seasonScroll.addView(seasonRow)
                  info.addView(seasonScroll, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(10) })
                  epSkel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE }
