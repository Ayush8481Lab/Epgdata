                  titleTv = TextView(this).apply { setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 26f; maxLines = 2; visibility = View.GONE }
                  head.addView(titleTv, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = dpx(16); rightMargin = dpx(16); bottomMargin = dpx(12) })
                  col.addView(head, LinearLayout.LayoutParams(-1, hh))

