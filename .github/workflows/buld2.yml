          fun dpx(v: Int): Int = (v * Resources.getSystem().displayMetrics.density).toInt()
          fun mToast(c: Context, t: String) { Toast.makeText(c, t, Toast.LENGTH_SHORT).show() }

          fun isTvDevice(c: Context): Boolean {
              return try {
                  val um = c.getSystemService(Context.UI_MODE_SERVICE) as UiModeManager
                  um.currentModeType == Configuration.UI_MODE_TYPE_TELEVISION ||
                      c.packageManager.hasSystemFeature("android.software.leanback") ||
                      !c.packageManager.hasSystemFeature("android.hardware.touchscreen")
              } catch (e: Exception) { false }
          }

          fun mRound(v: View, r: Int) {
              v.outlineProvider = object : ViewOutlineProvider() {
                  override fun getOutline(view: View, outline: Outline) {
                      outline.setRoundRect(0, 0, view.width, view.height, r.toFloat())
                  }
              }
              v.clipToOutline = true
          }

          fun mBg(color: Int, radius: Int): GradientDrawable = GradientDrawable().apply {
              cornerRadius = radius.toFloat(); setColor(color)
          }

          fun mStyle(a: Activity) {
              a.window.statusBarColor = M_BG
              a.window.navigationBarColor = M_BG
          }

          fun mOnline(c: Context): Boolean = try {
              val cm = c.getSystemService(Context.CONNECTIVITY_SERVICE) as android.net.ConnectivityManager
              val n = cm.activeNetwork
              val cap = if (n == null) null else cm.getNetworkCapabilities(n)
              cap != null && cap.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)
          } catch (e: Exception) { true }

          fun mOffline(c: Context): Boolean {
              val e = Api.lastError
              return !mOnline(c) || e.contains("UnknownHost") || e.contains("Unable to resolve") || e.contains("Failed to connect") ||
                  e.contains("ConnectException") || e.contains("timeout", true) || e.contains("unreachable", true)
          }

