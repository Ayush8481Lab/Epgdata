              }

              private fun hrow(vararg v: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                  v.forEach { addView(it) }
              }

              private fun buildRemote() {
                  val tv = (getSystemService(UI_MODE_SERVICE) as UiModeManager).currentModeType == Configuration.UI_MODE_TYPE_TELEVISION
                  remote = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(u(10), u(6), u(10), u(10))
                      background = GradientDrawable().apply { cornerRadius = u(22).toFloat(); setColor(Color.argb(215, 22, 24, 34)) }
                      elevation = u(10).toFloat()
                  }
                  val handle = TextView(this).apply {
                      text = "⋮⋮  drag  ⋮⋮"; setTextColor(Color.argb(170, 255, 255, 255)); gravity = Gravity.CENTER
                      setPadding(0, u(4), 0, u(6))
                  }
                  tx(handle, 11f)
                  handle.setOnTouchListener(object : View.OnTouchListener {
                      var ox = 0f; var oy = 0f; var tx0 = 0f; var ty0 = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { ox = e.rawX; oy = e.rawY; tx0 = remote.translationX; ty0 = remote.translationY }
                              MotionEvent.ACTION_MOVE -> { remote.translationX = tx0 + e.rawX - ox; remote.translationY = ty0 + e.rawY - oy }
                          }
                          return true
                      }
                  })
                  remote.addView(handle)
                  remote.addView(hrow(spacer(), rbtn("▲") { move(View.FOCUS_UP) }, spacer()))
                  remote.addView(hrow(rbtn("◀") { move(View.FOCUS_LEFT) }, rbtn("OK") { okPress(false) }, rbtn("▶") { move(View.FOCUS_RIGHT) }))
                  remote.addView(hrow(spacer(), rbtn("▼") { move(View.FOCUS_DOWN) }, spacer()))
                  remote.addView(hrow(rbtn("BACK", 80) { onBackPressed() }, rbtn("HIDE", 80) { remote.visibility = View.GONE }))
                  root.addView(remote, lp(-2, -2, Gravity.BOTTOM or Gravity.END).apply { setMargins(0, 0, u(24), u(24)) })

                  chip = TextView(this).apply {
                      text = "REMOTE"; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(u(12), u(6), u(12), u(6))
                      background = GradientDrawable().apply { cornerRadius = u(14).toFloat(); setColor(Color.argb(200, 52, 56, 72)) }
                      setOnClickListener { remote.visibility = if (remote.visibility == View.VISIBLE) View.GONE else View.VISIBLE }
                  }
                  tx(chip, 11f)
                  root.addView(chip, lp(-2, -2, Gravity.TOP or Gravity.END).apply { setMargins(0, u(12), u(16), 0) })
                  if (tv) { remote.visibility = View.GONE; chip.visibility = View.GONE }
              }

              // ---------------------------------------------------------------- Navigation
              private fun rowNavActive(): Boolean {
                  if (inDetail || inPlayer || !isHomeTab() || content.visibility != View.VISIBLE || curRow < 0) return false
                  val f = currentFocus ?: return false
                  return tabViews.none { it === f }
              }

              // listing pages: up/down always lands on the FIRST card of the next / previous row
              private fun moveRow(delta: Int) {
                  val target = curRow + delta
                  if (target < 0 || target >= rows.size) return
                  setCardMode(rows[target].kind == "card")           // list size is ready BEFORE the scroll starts
                  focusRowFirst(target, 14)
              }

              private fun focusRowFirst(target: Int, tries: Int) {
                  val rvh = rowRv.findViewHolderForAdapterPosition(target) as? RowVH
                  if (rvh == null) {
                      if (tries == 14) smoothVertical(target)       // row not laid out yet: glide there, then focus
                      if (tries > 0) ui.postDelayed({ focusRowFirst(target, tries - 1) }, 60)
                      return
                  }
                  val first = rvh.rv.findViewHolderForAdapterPosition(0)?.itemView
                  if (first != null) first.requestFocus()
                  else {
                      rvh.rv.scrollToPosition(0)
                      if (tries > 0) ui.postDelayed({ focusRowFirst(target, tries - 1) }, 40)
                  }
              }

              // detail page: down = open episodes (shows only), up (from the Episodes tab) = back to the trailer view
              private fun handleVertical(dir: Int): Boolean {
                  if (inDetail) {
                      if (!epMode && dir == View.FOCUS_DOWN) { if (!detailMovie) showEpisodes(); return true }
                      if (epMode && dir == View.FOCUS_UP && currentFocus === epTab) { hideEpisodes(); return true }
                      return false
                  }
                  if (rowNavActive()) { moveRow(if (dir == View.FOCUS_UP) -1 else 1); return true }
                  return false
              }

              // is the focus currently on an episode row?
              private fun inEpList(): Boolean {
                  val f = currentFocus ?: return false
                  return f.parent === dEpRv
              }

              // jump back to the SELECTED season in the left column (not the first one)
              private fun focusSeasonChip(): Boolean {
                  if (chips.size <= 1 || curSeason !in chips.indices) return false
                  chips[curSeason].requestFocus()
                  return true
              }

              // episodes list: LEFT goes back to the selected season (when there is a season column)
              private fun handleHorizontal(dir: Int): Boolean {
                  if (dir == View.FOCUS_LEFT && inDetail && epMode && inEpList()) return focusSeasonChip()
                  return false
              }

              private fun move(dir: Int) {
                  if (inPlayer) {
                      val code = when (dir) {
                          View.FOCUS_UP -> KeyEvent.KEYCODE_DPAD_UP
                          View.FOCUS_DOWN -> KeyEvent.KEYCODE_DPAD_DOWN
                          View.FOCUS_LEFT -> KeyEvent.KEYCODE_DPAD_LEFT
                          else -> KeyEvent.KEYCODE_DPAD_RIGHT
                      }
                      if (playerKey(code, 0)) return
                      currentFocus?.focusSearch(dir)?.requestFocus(dir)
                      return
                  }
                  if ((dir == View.FOCUS_UP || dir == View.FOCUS_DOWN) && handleVertical(dir)) return
                  if (dir == View.FOCUS_LEFT && handleHorizontal(dir)) return
                  val f = currentFocus
                  if (f == null) {
                      if (inDetail) {
                          val t: View? = if (epMode) dEpRv.getChildAt(0) else if (dResumeBox.visibility == View.VISIBLE) dResumeBtn else dWatch
                          t?.requestFocus()
                      } else rowRv.getChildAt(0)?.requestFocus()
                      return
                  }
                  f.focusSearch(dir)?.requestFocus(dir)
              }

              // OK button / tap. In the player with hidden controls: key OK = pause/play, touch tap = just show the controls.
              private fun okPress(touch: Boolean) {
                  if (inPlayer && panel == 0 && !ctrlVisible) {
                      if (!touch) togglePause()
                      showControls()
                      return
                  }
                  currentFocus?.performClick()
              }

              override fun dispatchKeyEvent(ev: KeyEvent): Boolean {
                  if (inPlayer) {
                      if (ev.action == KeyEvent.ACTION_DOWN && playerKey(ev.keyCode, ev.repeatCount)) return true
                      return super.dispatchKeyEvent(ev)
                  }
                  if (ev.action == KeyEvent.ACTION_DOWN) {
                      when (ev.keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> if (handleVertical(View.FOCUS_UP)) return true
                          KeyEvent.KEYCODE_DPAD_DOWN -> if (handleVertical(View.FOCUS_DOWN)) return true
                          KeyEvent.KEYCODE_DPAD_LEFT -> if (handleHorizontal(View.FOCUS_LEFT)) return true
                      }
                  }
                  return super.dispatchKeyEvent(ev)
              }

              private fun hit(v: View, ev: MotionEvent): Boolean {
                  if (!v.isShown) return false
                  val r = Rect()
                  return v.getGlobalVisibleRect(r) && r.contains(ev.rawX.toInt(), ev.rawY.toInt())
              }

              // swipe up/down/left/right = D-pad, tap = OK
              private var sx = 0f
              private var sy = 0f
              private var swiped = false
              private var forward = false

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.actionMasked == MotionEvent.ACTION_DOWN) forward = hit(remote, ev) || hit(chip, ev)
                  if (forward) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { sx = ev.rawX; sy = ev.rawY; swiped = false }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = ev.rawX - sx
                          val dy = ev.rawY - sy
                          if (max(abs(dx), abs(dy)) > u(55)) {
                              val d = if (abs(dy) > abs(dx)) { if (dy < 0) View.FOCUS_UP else View.FOCUS_DOWN }
                              else { if (dx < 0) View.FOCUS_LEFT else View.FOCUS_RIGHT }
                              move(d); swiped = true; sx = ev.rawX; sy = ev.rawY
                          }
                      }
                      MotionEvent.ACTION_UP -> if (!swiped) okPress(true)
                  }
                  return true
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (inPlayer) {
                      when (panel) {
                          2 -> {
                              // from the episode list: first go back to the selected season, next back closes the panel
                              if (inEpList() && focusSeasonChip()) return
                              closePlayerEps(true)
                          }
                          1 -> closeDrawer(true)
                          else -> closePlayer()
                      }
                      return
                  }
                  if (inDetail) {
                      if (epMode) {
                          // from the episode list: first go back to the selected season, next back closes the panel
                          if (inEpList() && focusSeasonChip()) return
                          hideEpisodes()
                      } else closeDetail(true)
                      return
                  }
                  if (pageStack.isNotEmpty() && isHomeTab()) { popPage(); return }       // landing page -> back to the page / tile it came from
                  val f = currentFocus
                  if (isHomeTab() && f != null && tabViews.none { it === f }) tabViews[tab].requestFocus()
                  else super.onBackPressed()
              }

              // ---------------------------------------------------------------- Data
              // tray layout -> row kind. Anything unknown (tabs, ads, subscription promo ...) is skipped.
              private fun kindOf(layout: String): String? {
                  val l = layout.lowercase()
                  return when {
                      l == "spotlight_layout" -> "spot"
                      l.contains("subscription") -> null
                      l.contains("trending") -> "trending"
                      l.contains("square") -> "square"
                      l.contains("landscape") -> "landscape"
                      l.contains("card") || l.contains("promo") -> "card"
                      l.contains("portrait") -> "portrait"
                      else -> null
                  }
              }

              // loads one page (Home / Originals / Shows / Sports / Movies / landing page): spotlight, portrait, trending, square, landscape, card / promo rows
              private fun loadHome(td: TabData) {
                  Thread {
                      val page = Api.get(td.url)
                      val cs = page?.optJSONObject("resultObj")?.optJSONArray("containers")
                      if (cs == null) {
                          ui.post {
                              td.loading = false; td.loaded = false
                              if (shownTd === td) {
                                  skelHome.visibility = View.GONE
                                  val nm = if (td.idx < tabNames.size) tabNames[td.idx] else "page"
                                  status.text = "Could not load $nm\n" + Api.lastError + (if (td.idx < tabNames.size) "\n\nSelect $nm again to retry" else "\n\nPress back")
                                  status.visibility = View.VISIBLE
                              }
                          }
                          return@Thread
                      }
                      class Job(val title: String, val kind: String, val f: Future<JSONObject?>?, val direct: Item?)
                      val jobs = ArrayList<Job>()
                      var gotSpot = false
                      for (i in 0 until cs.length()) {
                          val c = cs.optJSONObject(i) ?: continue
                          if (isAd(c, true)) continue                           // never load ad templates / ad spotlight
                          val kind = kindOf(c.optString("layout")) ?: continue
                          if (kind == "spot") { if (gotSpot) continue; gotSpot = true }
                          val uri = c.optJSONObject("retrieveItems")?.optString("uri").orEmpty()
                          val cm = c.optJSONObject("metadata")
                          val title = cm?.str("title") ?: cm?.str("label") ?: c.str("title")
                              ?: c.optJSONObject("editorialMetadata")?.str("title") ?: ""
                          if (kind == "card") {                                 // card / promo data is already inside the page container (no header, no api call)
                              val d = parseLauncher(c)
                              if (d != null) { jobs.add(Job(title, kind, null, d)); continue }
                          }
                          if (uri.isEmpty()) continue
                          val url = BASE + uri + (if (kind == "spot") "" else "&from=0&to=15")
                          jobs.add(Job(title, kind, Api.pool.submit(Callable<JSONObject?> { Api.get(url) }), null))
                      }
                      for (j in jobs) {
                          val items = ArrayList<Item>()
                          var ro: JSONObject? = null
                          val dd = j.direct
                          if (dd != null) items.add(dd)
                          else {
                              val res = try { j.f?.get() } catch (e: Exception) { null }
                              ro = res?.optJSONObject("resultObj")
                              val arr = ro?.optJSONArray("containers")
                              if (arr != null) for (k in 0 until arr.length()) {
                                  val c = arr.optJSONObject(k) ?: continue
                                  val isL = c.optString("layout").equals("LAUNCHER_ITEM", true)
                                  val parsed = when {
                                      isL -> if (isAd(c, true)) null else parseLauncher(c)
                                      isAd(c) -> null
                                      else -> parseItem(c)
                                  }
                                  if (parsed != null) items.add(parsed)
                                  if (j.kind == "spot") {
                                      val dual = c.optJSONObject("editorialMetadata")?.optJSONArray("dual_spotlight_items")
                                      if (dual != null) for (d in 0 until dual.length()) {
                                          dual.optJSONObject(d)?.let { parseItem(it) }?.let { items.add(it) }
                                      }
                                  }
                              }
                          }
                          if (items.isEmpty()) continue
                          if (j.kind == "card") {                               // any aspect ratio: read the image size first
                              for (ix in 0 until min(items.size, 3)) {
                                  val c0 = items[ix]
                                  if (c0.aspect <= 0f) items[ix] = c0.copy(aspect = probeAspect(img(c0.cardImg ?: c0.landscape, 300)))
                              }
                          }
                          val title = if (j.title.isNotBlank()) j.title else (ro?.str("trayTitle") ?: "")
                          val row = Row(title, j.kind == "spot", items, j.kind)
                          ui.post { addRow(td, row) }
                      }
                      ui.post {
                          td.loading = false
                          if (td.rows.isEmpty() && shownTd === td) {
                              skelHome.visibility = View.GONE
                              status.text = "No rows returned\n" + Api.lastError
                              status.visibility = View.VISIBLE
                          }
                      }
                  }.start()
              }

              // card / promo row: starts at the CONTENT_LEFT line (same as the row titles / first portrait card),
              // runs to the right edge (minus CARD_RIGHT_GAP). Height follows the image aspect ratio (capped).
              private fun cardDims(r: Row) {
                  val a = r.items.firstOrNull()?.aspect?.takeIf { it > 0.2f } ?: 5.4f
                  r.dw = max(u(200), W - u(CONTENT_LEFT) - u(CARD_RIGHT_GAP))
                  r.dh = min((r.dw / a).toInt(), (H * CARD_MAX_H).toInt())
              }

              private fun addRow(td: TabData, r: Row) {
                  if (r.kind == "card") cardDims(r)
                  td.rows.add(r)
                  if (td.rows === rows && shownTd === td) {
                      rowAdapter.notifyItemInserted(rows.size - 1)
                      skelHome.visibility = View.GONE
                      if (isHomeTab() && !inDetail) status.visibility = View.GONE
                      if (rows.size == 1) focusFirst(12)
                  }
                  if (r.spotlight) {
                      r.items.forEach { prefetchHero(it) }
                      r.items.take(6).forEach { enrichAsync(it) }
                  }
                  else if (td.rows.size <= 6) { prefetchRow(r, 12); warmRow(r) }
              }

              private fun focusFirst(tries: Int) {
                  ui.postDelayed({
                      val ok = rowRv.getChildAt(0)?.requestFocus() ?: false
                      if (!ok && tries > 0) focusFirst(tries - 1)
                  }, 300)
              }

              // detail json: memory cache first, then network (call from a background thread)
              // movie = true => the movie flavour of the request (key m<id>), else show / episode / trailer (key s<id>)
              private fun fetchDetail(cid: String, movie: Boolean = false): JSONObject? {
                  val key = dkey(cid, movie)
                  synchronized(detailCache) { detailCache[key] }?.let { return it }
                  val j = Api.get(DETAIL_URL + cid + (if (movie) MOVIE_DETAIL_Q else ""))
                  if (j != null) synchronized(detailCache) { detailCache[key] = j }
                  return j
              }

              // ---------------------------------------------------------------- Missing title image / banner => ask the show / movie api
              // Listing items (home / sports / launcher tiles ...) may come without a title image or banner.
              // Title image chain: masthead_logo_rectangualar -> masthead_logo (listing, see parseItem) -> DETAIL-V2 of the show / movie
              // (the detail page always has it). SHOW items use the show api, MOVIE_BUNDLE items use the movie api.
              private fun needsEnrich(i: Item) = i.cid.isNotBlank() && (i.logo == null || (i.bg == null && i.spot == null))

              private fun mergeEnr(i: Item): Item {
                  val e = enrichCache[i.cid] ?: return i
                  return i.copy(logo = i.logo ?: e.logo, bg = i.bg ?: e.bg)
              }

              // BLOCKING (background thread only). A failed request is not cached, so it is tried again next time.
              private fun enrichNow(i: Item) {
                  if (!needsEnrich(i) || enrichCache.containsKey(i.cid)) return
                  val j = fetchDetail(i.cid, i.sub == SUB_MOVIE_BUNDLE) ?: return
                  val c = j.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                  val lg = if (c != null) detLogoUrl(c) else null
                  val bgRaw = if (c != null) rawBgOf(c) else null
                  enrichCache[i.cid] = Enr(lg, bgRaw)
                  Prefetch.add(img(bgRaw, W_BG), true)
                  Prefetch.add(lg, true)
              }

              // same thing in the background (neighbour cards / first items of a row), so the hero swap is instant later
              private fun enrichAsync(i: Item) {
                  if (!needsEnrich(i) || enrichCache.containsKey(i.cid) || !enrichBusy.add(i.cid)) return
                  Api.pool.execute { try { enrichNow(i) } finally { enrichBusy.remove(i.cid) } }
              }

              // focused SHOW / MOVIE_BUNDLE: warm everything the detail page needs, ahead of time.
              //  1) (main thread, instant) decode the DETAIL-size title image + banner into Glide's memory cache,
              //     so opening the item draws them with zero wait
              //  2) (background) fetch the detail json + download its banner / title / first episode thumbnails
              // (episodes / trailers / MOVIE VOD have no detail page, they play directly, so nothing to prefetch)
              private fun prefetchDetail(item: Item) {
                  if ((item.sub != SUB_SHOW && item.sub != SUB_MOVIE_BUNDLE) || item.cid.isBlank()) return
                  val mv = item.sub == SUB_MOVIE_BUNDLE
                  if (item.logo != null) logoReq(item.logo, detLogoW, detLogoH).priority(Priority.NORMAL).preload()
                  img(item.bg ?: item.landscape, W_BG)?.let { bgBigReq(it).priority(Priority.LOW).preload() }
                  Api.pool.execute {
                      val j = fetchDetail(item.cid, mv) ?: return@execute
                      val show = j.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0) ?: return@execute
                      Prefetch.add(detBgUrl(show), true)
                      Prefetch.add(detLogoUrl(show), true)
                      if (!mv) {
                          val data = parseSeasons(show)
                          data.seasons.firstOrNull()?.let { s ->
                              data.embedded[s.id].orEmpty().take(6).forEach { Prefetch.add(img(it.thumb, W_EP), true) }
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- Hero + trailer (home)
              private fun heroUrl(i: Item) = img(i.bg ?: i.spot ?: i.landscape, W_BG)
              private fun cardUrl(spot: Boolean, i: Item) =
                  if (spot) img(i.spot ?: i.landscape ?: i.portrait ?: i.bg, W_SPOT) else img(i.portrait ?: i.landscape ?: i.bg, W_PORTRAIT)
              private fun prefetchHero(i: Item, first: Boolean = false) {
                  val m = mergeEnr(i)
                  Prefetch.add(heroUrl(m), first); Prefetch.add(m.logo, first)
              }
              // decode banner + title image of a card into memory BEFORE it gets focus => hero swap is instant
              private fun warmHero(i0: Item) {
                  val i = mergeEnr(i0)
                  heroUrl(i)?.let { bgReq(it).priority(Priority.NORMAL).preload() }
                  if (i.logo != null) logoReq(i.logo, homeLogoW, homeLogoH).priority(Priority.NORMAL).preload()
              }
              private fun prefetchRow(r: Row, n: Int) {
                  r.items.take(n).forEach {
                      Prefetch.add(rowImg(r.kind, it))
                      if (!r.spotlight) Prefetch.add(it.logo)          // title images: ready before the card is focused
                  }
                  r.items.take(3).filter { !it.launcher }.forEach { prefetchHero(it); enrichAsync(it) }
              }

              // decode the first cards of a row into Glide's MEMORY cache (same size / options as the real bind) =>
              // when the row scrolls in, its images are already there: no decode work, no blank cards, no stutter during the scroll animation
              private fun warmRow(r: Row) {
                  val w = imgW(r)
                  val h = imgH(r)
                  r.items.take(6).forEach { cardReq(rowImg(r.kind, it), w, h).priority(Priority.LOW).preload() }
              }

              private fun isSpotRow() = rows.getOrNull(curRow)?.spotlight == true

              // Card / promo row focused: the list becomes FULL SCREEN high, the banner row sits at the very top of the screen
              // (where the header / title area normally is) and the rows after it fill the space that is left below.
              // Any other row: back to the normal "one row at the bottom" list under the hero.
              // When the size changes, a running scroll is stopped and the next scroll is an INSTANT jump
              // (no half-finished glide through a list that just changed size = no ghost / doubled card under the header).
              private fun setCardMode(on: Boolean) {
                  if (on == cardMode) return
                  cardMode = on
                  modeChanged = true
                  rowRv.stopScroll()
                  val l = rowRv.layoutParams as FrameLayout.LayoutParams
                  l.height = if (on) FrameLayout.LayoutParams.MATCH_PARENT else rvH
                  l.bottomMargin = if (on) 0 else (H * 0.008f).toInt()
                  rowRv.layoutParams = l
              }

              // no banner / title / trailer (card rows have no header)
              private fun hideHero() {
                  heroRun?.let { ui.removeCallbacks(it) }
                  heroToken++
                  stopTrailer(false)
                  hero = null; revealed = false
                  Prefetch.gate = true
                  info.animate().cancel(); info.alpha = 0f
                  bg.animate().cancel(); bg.alpha = 0f
              }

              private fun onCardFocus(item: Item, row: Row, pos: Int, rowPos: Int) {
                  if (inDetail || inPlayer) return
                  curRow = rowPos; curPos = pos
                  val cm = row.kind == "card"
                  setCardMode(cm)
                  snapTo(rowPos)
                  heroRun?.let { ui.removeCallbacks(it) }
                  if (cm) { hideHero(); return }
                  if (item.launcher) return                    // tiles without a poster background have no hero
                  val r = Runnable {
                      showHero(item)
                      // aggressive look-ahead: banners + titles of the next cards (downloaded AND decoded), detail data of the neighbours
                      row.items.getOrNull(pos + 1)?.takeIf { !it.launcher }?.let { enrichAsync(it); prefetchHero(it, true); warmHero(it) }
                      row.items.getOrNull(pos + 2)?.takeIf { !it.launcher }?.let { enrichAsync(it); prefetchHero(it, true); warmHero(it) }
                      row.items.getOrNull(pos - 1)?.takeIf { !it.launcher }?.let { enrichAsync(it); prefetchHero(it); warmHero(it) }
                      if (!row.spotlight) row.items.getOrNull(pos + 1)?.let { prefetchDetail(it) }
                  }
                  heroRun = r
                  ui.postDelayed(r, 90)
              }

              private fun snapTo(pos: Int) {
                  if (pos == lastSnap && !modeChanged) return
                  lastSnap = pos
                  for (d in 1..3) rows.getOrNull(pos + d)?.let { prefetchRow(it, 12); warmRow(it) }   // next rows: download + decode into memory
                  rows.getOrNull(pos - 1)?.let { warmRow(it) }
                  smoothVertical(pos)
              }

              // vertical row scroll: fixed decelerate glide (posted, so a list resize from setCardMode is laid out first).
              // Right after a list size change (card mode on / off) the jump is instant instead.
              private fun smoothVertical(pos: Int) {
                  rowRv.post {
                      if (modeChanged) {
                          modeChanged = false
                          rowRv.stopScroll()
                          (rowRv.layoutManager as? LinearLayoutManager)?.scrollToPositionWithOffset(pos, 0)
                      } else {
                          val s = object : LinearSmoothScroller(this) {
                              override fun getVerticalSnapPreference() = SNAP_TO_START
                              override fun calculateTimeForDeceleration(dx: Int): Int = 260
                          }
                          s.targetPosition = pos
                          rowRv.layoutManager?.startSmoothScroll(s)
                      }
                  }
              }

              private fun showHero(item: Item) {
                  if (hero?.id == item.id && hero?.title == item.title) return
                  hero = item
                  stopTrailer(false)
                  val token = ++heroToken
                  revealed = false
                  Prefetch.gate = false                      // banner + title of this screen first; prefetch waits
                  // hide old banner + text immediately => banner and text never mismatch
                  info.animate().cancel(); info.alpha = 0f
                  bg.animate().cancel(); bg.animate().alpha(0f).setDuration(100).start()
                  metaTv.text = item.meta
                  descTv.text = item.desc
                  if (needsEnrich(mergeEnr(item)) && !enrichCache.containsKey(item.cid)) {
                      // title image / banner missing in the listing => take them from the show / movie api (1.5s safety)
                      Glide.with(this).clear(bg)
                      Glide.with(this).clear(logo)
                      var done = false
                      val go: () -> Unit = {
                          if (!done && token == heroToken) { done = true; renderHero(mergeEnr(item), token) }
                      }
                      Thread { enrichNow(item); ui.post { go() } }.start()
                      ui.postDelayed({ go() }, 1500)
                  } else renderHero(mergeEnr(item), token)
              }

              private fun renderHero(item: Item, token: Int) {
                  var pending = 1 + (if (item.logo != null) 1 else 0)
                  val listener = doneListener {
                      if (token == heroToken) { pending--; if (pending <= 0) reveal(item, token) }
                  }
                  Glide.with(this).clear(bg)
                  bgReq(heroUrl(item)).priority(Priority.IMMEDIATE).listener(listener).into(bg)
                  if (item.logo != null) {
                      logo.visibility = View.VISIBLE; titleTv.visibility = View.GONE
                      Glide.with(this).clear(logo)
                      logoReq(item.logo, homeLogoW, homeLogoH).priority(Priority.IMMEDIATE).listener(listener).into(logo)
                  } else {
                      logo.setImageDrawable(null); logo.visibility = View.GONE
                      titleTv.text = item.title; titleTv.visibility = View.VISIBLE
                  }
                  ui.postDelayed({ reveal(item, token) }, 1800)   // safety if network is slow
              }

              private fun reveal(item: Item, token: Int) {
                  if (token != heroToken || revealed) return
                  revealed = true
                  Prefetch.gate = true
                  bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start()
                  info.animate().cancel(); info.animate().alpha(1f).setDuration(250).start()
                  scheduleTrailer(item)      // trailer only after banner + title are on screen
                  prefetchDetail(item)       // then get the detail page data/images ready in the background (SHOW / MOVIE_BUNDLE only)
              }

              // trailer for a home item. If the list item has no trailer url, look it up from DETAIL-V2 (cached).
              private fun scheduleTrailer(item: Item) {
                  stopTrailer(false)
                  val spot = isSpotRow()
                  val t = item.trailer
                  if (t != null) { schedulePlay(t, spot); return }
                  val cached = trailerCache[item.cid]
                  if (cached != null) {
                      if (cached.isNotEmpty()) schedulePlay(cached, spot) else spotAdvanceLater()
                      return
                  }
                  if (item.cid.isBlank()) { spotAdvanceLater(); return }
                  val token = heroToken
                  Thread {
                      val j = fetchDetail(item.cid, item.sub == SUB_MOVIE_BUNDLE)
                      val tu = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.let { trailerFrom(it) } ?: ""
                      if (j != null) trailerCache[item.cid] = tu
                      ui.post {
                          if (token == heroToken && !inDetail && hero?.id == item.id) {
                              if (tu.isNotEmpty()) schedulePlay(tu, spot) else spotAdvanceLater()
                          }
                      }
                  }.start()
              }

              private fun schedulePlay(url: String, spotLoop: Boolean) {
                  if (inPlayer) return                         // the real player is open: no trailers
                  stopTrailer(false)
                  val r = Runnable { playTrailer(url, spotLoop) }
                  trailerRun = r
                  ui.postDelayed(r, 700)
              }

              // spotlight card without any trailer: stay 6s then go to next card
              private fun spotAdvanceLater() {
                  if (!isSpotRow()) return
                  val r = Runnable { advanceSpot() }
                  advanceRun = r
                  ui.postDelayed(r, 6000)
              }

              // loop inside spotlight row: next card, wraps to first
              private fun advanceSpot() {
                  if (inDetail || inPlayer || !isHomeTab() || !isSpotRow()) return
                  val row = rows[curRow]
                  if (row.items.size <= 1) { player?.seekTo(0); player?.playWhenReady = true; return }
                  focusSpot((curPos + 1) % row.items.size, 10)
              }

              private fun focusSpot(pos: Int, tries: Int) {
                  val rv = (rowRv.findViewHolderForAdapterPosition(curRow) as? RowVH)?.rv ?: return
                  rv.scrollToPosition(pos)
                  ui.postDelayed({
                      if (inDetail || inPlayer || !isSpotRow()) return@postDelayed
                      val v = rv.findViewHolderForAdapterPosition(pos)?.itemView
                      if (v != null) v.requestFocus() else if (tries > 0) focusSpot(pos, tries - 1)
                  }, 80)
              }

              private fun playTrailer(url: String, spotLoop: Boolean) {
                  try {
                      spotLoopOn = spotLoop
                      curBox.animate().cancel(); curBox.alpha = 0f; curBox.visibility = View.VISIBLE
                      val p = player ?: ExoPlayer.Builder(this).build().also { pl ->
                          player = pl
                          pl.setAudioAttributes(AudioAttributes.DEFAULT, true)
                          // cap decode size => stable on weak TV boxes
                          pl.trackSelectionParameters = pl.trackSelectionParameters.buildUpon().setMaxVideoSize(1280, 720).build()
                          pl.addListener(object : Player.Listener {
                              override fun onVideoSizeChanged(videoSize: VideoSize) {
                                  if (videoSize.width == 0 || videoSize.height == 0) return
                                  val ar = videoSize.width * videoSize.pixelWidthHeightRatio / videoSize.height
                                  var w = curBoxW
                                  var h = (w / ar).toInt()
                                  if (h < curBoxH) { h = curBoxH; w = (h * ar).toInt() }       // cover the marked area
                                  curVideo.layoutParams = FrameLayout.LayoutParams(w, h, Gravity.CENTER)
                              }
                              override fun onRenderedFirstFrame() {
                                  curBox.animate().cancel(); curBox.animate().alpha(1f).setDuration(450).start()
                                  curBg.animate().cancel(); curBg.animate().alpha(0f).setDuration(450).start()   // no thumbnail behind video
                              }
                              override fun onPlaybackStateChanged(playbackState: Int) {
                                  if (playbackState == Player.STATE_ENDED && spotLoopOn && !inDetail) advanceSpot()
                              }
                              override fun onPlayerError(error: PlaybackException) {
                                  curBox.alpha = 0f; curBox.visibility = View.GONE
                                  curBg.animate().cancel(); curBg.animate().alpha(1f).setDuration(250).start()
                                  if (spotLoopOn && !inDetail) ui.postDelayed({ advanceSpot() }, 1500)
                              }
                          })
                      }
                      p.repeatMode = if (spotLoop) Player.REPEAT_MODE_OFF else Player.REPEAT_MODE_ONE
                      p.volume = if (TRAILER_MUTED) 0f else 1f
                      p.setVideoTextureView(curVideo)
                      p.setMediaItem(MediaItem.fromUri(url))
                      p.prepare()
                      p.playWhenReady = true
                  } catch (e: Exception) {
                      curBox.visibility = View.GONE
                  }
              }

              private fun stopTrailer(restoreBg: Boolean = true) {
                  trailerRun?.let { ui.removeCallbacks(it) }
                  advanceRun?.let { ui.removeCallbacks(it) }
                  spotLoopOn = false
                  videoBox.animate().cancel(); videoBox.alpha = 0f; videoBox.visibility = View.GONE
                  dBox.animate().cancel(); dBox.alpha = 0f; dBox.visibility = View.GONE
                  if (restoreBg) {
                      if (inDetail) { dBg.animate().cancel(); dBg.animate().alpha(1f).setDuration(250).start() }
                      else if (revealed) { bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start() }
                  }
                  player?.let { it.stop(); it.clearMediaItems() }
              }

              override fun onStop() { super.onStop(); saveProgress(); stopTrailer(); mainPlayer?.pause() }
              override fun onRestart() {
                  super.onRestart()
                  if (inPlayer) return
                  if (inDetail) { if (!epMode) detailTrailerUrl?.let { schedulePlay(it, false) } }
                  else if (isHomeTab()) hero?.let { scheduleTrailer(it) }
              }
              override fun onDestroy() {
                  super.onDestroy()
                  player?.release(); player = null
                  mainPlayer?.release(); mainPlayer = null
                  resetSprite()
              }

              // ---------------------------------------------------------------- Row kinds (sizes / images) + tile clicks
              private fun rowImg(kind: String, i: Item): String? = when (kind) {
                  "spot" -> img(i.spot ?: i.landscape ?: i.portrait ?: i.bg, W_SPOT)
                  "card" -> img(i.cardImg ?: i.landscape ?: i.bg, W_CARD)
                  "square" -> img(i.cardImg ?: i.portrait ?: i.landscape ?: i.bg, 450)
                  "landscape" -> img(i.landscape ?: i.cardImg ?: i.portrait ?: i.bg, W_EP)
                  else -> img(i.portrait ?: i.landscape ?: i.cardImg ?: i.bg, W_PORTRAIT)
              }
              // size of the big rank number of a trending row (the number box itself is measured per number in CardAdapter)
              private fun rankSize() = cardH * 0.42f
              private fun kh(r: Row) = when (r.kind) { "spot" -> stripH; "card" -> r.dh; else -> cardH }
              private fun imgW(r: Row) = when (r.kind) { "spot" -> stripW; "card" -> r.dw; "square" -> sqS; "landscape" -> lsW; else -> cardW }
              private fun imgH(r: Row) = when (r.kind) { "spot" -> stripH; "card" -> r.dh; "square" -> sqS; "landscape" -> lsH; else -> cardH }
              // tile (focus frame) size and image size per row. Rows without header (card / promo / spotlight / blank title) only take their own height.
              private fun hasTitle(r: Row) = !(r.spotlight || r.kind == "card" || r.title.isBlank())
              private fun padOf(r: Row) = if (r.kind == "card") 0 else padV            // card rows: no vertical padding, glued to the top / next row
              private fun rowHeight(r: Row) = (if (hasTitle(r)) titleH else 0) + kh(r) + 2 * padOf(r)

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()

              private fun onItemClick(item: Item, card: View) {
                  if (item.launcher || item.cta.isNotBlank()) { handleCta(item, card); return }
                  if (item.sub == SUB_SHOW || item.sub == SUB_MOVIE_BUNDLE) openDetail(item, card)
                  else if (item.obj == OBJ_VOD) playItem(item, card)
              }

              // cta: sony://asset/<id>  |  sony://page/<slug>-<id>
              private fun handleCta(item: Item, card: View) {
                  val rest = item.cta.substringAfter("sony://", "")
                  val type = rest.substringBefore("/")
                  val tail = rest.substringAfter("/", "").substringBefore("?").trim('/')
                  when (type) {
                      "page" -> {
                          val id = tail.substringAfterLast('-')
                          if (id.isNotEmpty() && id.all { it.isDigit() }) { lastCard = card; openPage(id) } else toast("Page not supported")
                      }
                      "asset" -> openAsset(tail, item, card)
                      else -> if (item.cid.isNotBlank()) openAsset(item.cid, item, card) else toast("Not supported")
                  }
              }

              private fun routeAsset(it2: Item, card: View) {
                  if (it2.sub == SUB_SHOW || it2.sub == SUB_MOVIE_BUNDLE) openDetail(it2, card) else playItem(it2, card)
              }

              // asset id from a cta: show / movie bundle -> detail page, everything else (movie, trailer, episode) -> player.
              // When the tile does not say what the asset is, DETAIL-V2 of the id is asked first.
              private fun openAsset(id: String, item: Item, card: View) {
                  if (id.isBlank()) return
                  lastCard = card
                  val known = item.sub
                  if (known.isNotEmpty() && known != "LAUNCHER") {
                      routeAsset(item.copy(id = id, cid = id, obj = OBJ_VOD, sub = known), card)
                      return
                  }
                  Thread {
                      val j = fetchDetail(id)
                      val c = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                      ui.post {
                          if (c == null) { toast("Could not open"); return@post }
                          val m = c.optJSONObject("metadata")
                          val st = (m?.optString("objectSubtype") ?: "").uppercase()
                          val ot = (m?.optString("objectType") ?: "").uppercase()
                          val sub = when {
                              st == SUB_MOVIE_BUNDLE -> SUB_MOVIE_BUNDLE
                              st == SUB_SHOW || ot == "SHOW" || ot == "GROUP_OF_BUNDLES" || (m?.has("seasonCount") == true) -> SUB_SHOW
                              else -> st
                          }
                          val base = parseItem(c) ?: item.copy()
                          routeAsset(base.copy(id = id, cid = id, sub = sub, obj = OBJ_VOD), card)
                      }
                  }.start()
              }

              // ---------------------------------------------------------------- Direct play from a listing page
              // objectType == VOD that is not a SHOW / MOVIE_BUNDLE (EPISODE, TRAILER, MOVIE ...) goes straight to the player, no detail page.
              private fun playItem(item: Item, card: View) {
                  if (item.cid.isBlank()) return
                  lastCard = card
                  showTitle = item.title
                  val ep = Ep(item.cid, item.epTitle, item.epNum, item.desc, item.landscape ?: item.portrait ?: item.bg, item.dur, item.air)
                  openPlayer(ep, item.season, true)
              }

              // coming back from a player that was opened from a listing page
              private fun restoreHome() {
                  side.visibility = View.VISIBLE; brand.visibility = View.VISIBLE
                  content.visibility = View.VISIBLE
                  curBox = videoBox; curVideo = videoView; curBg = bg; curBoxW = homeBoxW; curBoxH = homeBoxH
                  val hv = if (hero != null) 1f else 0f                 // card rows have no hero
                  bg.animate().cancel(); bg.alpha = hv
                  info.animate().cancel(); info.alpha = hv
                  val c = lastCard
                  ui.postDelayed({
                      if (inDetail || inPlayer) return@postDelayed
                      if (c != null && c.isAttachedToWindow) c.requestFocus() else focusFirst(12)
                      hero?.let { scheduleTrailer(it) }
                  }, 100)
              }

              // ---------------------------------------------------------------- Detail page
              // SHOW -> show detail (seasons + episodes). MOVIE_BUNDLE -> movie detail (Watch Movie / Watch Trailer, audio / cast ... details, NO episodes).
              // Episodes / trailers / MOVIE VOD play directly (see playItem).
              private fun openDetail(item: Item, card: View) {
                  if ((item.sub != SUB_SHOW && item.sub != SUB_MOVIE_BUNDLE) || item.cid.isBlank()) return
                  val mv = item.sub == SUB_MOVIE_BUNDLE
                  lastCard = card
                  heroRun?.let { ui.removeCallbacks(it) }
                  heroToken++
                  stopTrailer(false)
                  inDetail = true; epMode = false
                  detailMovie = mv
                  detailItem = item
                  movieEp = null; trailerEp = null; trailerPlayUrl = null; lastBtn = null
                  val tok = ++detailToken
                  epToken++
                  detGateRun?.let { ui.removeCallbacks(it) }
                  Prefetch.gate = false                       // this item's images first, everything else waits
                  curBox = dBox; curVideo = dVideo; curBg = dBg; curBoxW = detBoxW; curBoxH = detBoxH
                  content.visibility = View.GONE
                  status.visibility = View.GONE
                  side.visibility = View.GONE; brand.visibility = View.GONE
                  detail.visibility = View.VISIBLE
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.animate().cancel(); epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()

                  // instant preview from the list item (title image / banner of the listing, or the ones fetched from the show / movie api)
                  val pv = mergeEnr(item)
                  showTitle = item.title
                  seasons.clear(); eps.clear(); epAdapter.notifyDataSetChanged()
                  sCol.removeAllViews(); chips.clear(); sScroll.visibility = View.GONE
                  epStatus.visibility = View.GONE
                  showEpSkel(false)
                  dHint.visibility = View.GONE
                  dTrailer.visibility = View.GONE
                  dResumeBox.visibility = View.GONE
                  dExtra.removeAllViews()
                  updatePlus()
                  curSeason = -1; epFrom = 0; epHasMore = true; epLoading = false
                  detailTrailerUrl = null; latestEp = null
                  dBg.animate().cancel(); dBg.alpha = 1f
                  dBox.animate().cancel(); dBox.alpha = 0f; dBox.visibility = View.GONE
                  Glide.with(this).clear(dBg)
                  val previewBg = img(pv.bg ?: pv.landscape, W_BG)
                  shownBg = previewBg
                  bgBigReq(previewBg).priority(Priority.IMMEDIATE).into(dBg)
                  shownLogo = pv.logo
                  showDetailLogo(pv.logo, item.title)
                  dTag.visibility = View.GONE
                  dMeta.text = item.meta
                  dDesc.text = item.desc
                  dWatch.text = if (mv) "▶  Watch Movie" else "▶  Watch Latest Episode"
                  dWatch.minWidth = if (mv) u(330) else u(430)    // long enough: text + date / name never cut
                  dStatus.visibility = View.GONE
                  dWatch.requestFocus()
                  ui.postDelayed({ if (inDetail && !epMode && !inPlayer && currentFocus !== dResumeBtn) dWatch.requestFocus() }, 200)

                  val cachedJ = synchronized(detailCache) { detailCache[dkey(item.cid, mv)] }
                  if (cachedJ != null) bindDetail(cachedJ, item)
                  else {
                      setDetailSkel(true)                      // skeleton lines until the detail json arrives
                      Thread {
                          val j = fetchDetail(item.cid, mv)
                          ui.post { if (inDetail && tok == detailToken) bindDetail(j, item) }
                      }.start()
                  }
              }

              private fun showDetailLogo(url: String?, title: String, l: RequestListener<Drawable>? = null) {
                  Glide.with(this).clear(dLogo)
                  if (url != null) {
                      dLogo.visibility = View.VISIBLE; dTitle.visibility = View.GONE
                      var r = logoReq(url, detLogoW, detLogoH).priority(Priority.IMMEDIATE)
                      if (l != null) r = r.listener(l)
                      r.into(dLogo)
                  } else {
                      dLogo.setImageDrawable(null); dLogo.visibility = View.GONE
                      dTitle.text = title; dTitle.visibility = View.VISIBLE
                  }
              }

              // The trailer starts ONLY after the title image, the background and the first episode thumbnails are loaded
              // (3s safety timeout). While they load, background prefetch is paused so they get all the bandwidth.
              // Title image / banner that are ALREADY on screen (same url as the instant preview) are not reloaded.
              private fun loadDetailAssets(tok: Int, title: String, logoUrl: String?, bgUrl: String?, thumbs: List<String>, trailer: String?) {
                  detGateRun?.let { ui.removeCallbacks(it) }
                  val needLogo = logoUrl != null && logoUrl != shownLogo
                  val needBg = bgUrl != null && bgUrl != shownBg
                  var pending = (if (needLogo) 1 else 0) + (if (needBg) 1 else 0) + thumbs.size
                  var fired = false
                  val fire: () -> Unit = {
                      if (!fired) {
                          fired = true
                          detGateRun?.let { ui.removeCallbacks(it) }
                          Prefetch.gate = true
                          if (tok == detailToken && inDetail && trailer != null && !epMode && !inPlayer) schedulePlay(trailer, false)
                      }
                  }
                  val l = doneListener {
                      if (tok == detailToken) { pending--; if (pending <= 0) fire() }
                  }
                  Prefetch.gate = false
                  if (needLogo) {                                            // 1) title image (masthead logo)
                      shownLogo = logoUrl
                      showDetailLogo(logoUrl, title, l)
                  } else if (logoUrl == null && shownLogo == null) {
                      showDetailLogo(null, title)                            // no logo at all => plain title text
                  }
                  if (needBg) {                                              // 2) background
                      shownBg = bgUrl
                      Glide.with(this).clear(dBg)
                      bgBigReq(bgUrl).priority(Priority.IMMEDIATE).listener(l).into(dBg)
                  }
                  thumbs.forEach {                                           // 3) first episode thumbnails (same options as the list => cache hit)
                      cardReq(it, epImgW, epImgH).priority(Priority.HIGH).listener(l).preload()
                  }
                  if (pending <= 0) { fire(); return }
                  if (!fired) {
                      val r = Runnable { fire() }
                      detGateRun = r
                      ui.postDelayed(r, 3000)
                  }
              }

              private fun setWatchLabel(ep: Ep) {
                  latestEp = ep
                  val d = fmtDate(ep.air, false)
                  dWatch.text = "▶  Watch Latest Episode" + (if (d.isEmpty()) "" else "   $d")
              }

              // "Label  value" rows under the buttons (label grey + bold, value light), centered. Cast may use 2 lines, the rest 1.
              private fun setExtra(list: List<Pair<String, String>>) {
                  dExtra.removeAllViews()
                  for ((k, v) in list) {
                      if (v.isBlank()) continue
                      val sb = SpannableStringBuilder()
                      sb.append(k).append("   ")
                      sb.setSpan(ForegroundColorSpan(Color.parseColor("#9AA0B4")), 0, k.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.setSpan(StyleSpan(Typeface.BOLD), 0, k.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.append(v)
                      val t = TextView(this).apply {
                          setTextColor(Color.parseColor("#E4E4EA"))
                          maxLines = if (k == "Cast") 2 else 1
                          ellipsize = TextUtils.TruncateAt.END
                          gravity = Gravity.CENTER_HORIZONTAL
                          maxWidth = (W * 0.7f).toInt()
                          text = sb
                      }
                      tx(t, 14f)
                      dExtra.addView(t, LinearLayout.LayoutParams(-2, -2).apply { topMargin = u(5) })
                  }
              }

              // Audio / Subtitles / Cast / Director / Advisory / Quality from the movie bundle (e) and its MOVIE child (me)
              private fun movieExtraRows(e: JSONObject, me: JSONObject?): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()

                  val al = e.optJSONArray("audio_language_list") ?: me?.optJSONArray("audio_language_list")
                  val audio = LinkedHashSet<String>()
                  if (al != null) for (k in 0 until al.length()) al.optJSONObject(k)?.str("lang_label")?.let { audio.add(it) }
                  out.add("Audio" to audio.joinToString(", "))

                  val sl = e.optJSONArray("subtitle_language_list") ?: me?.optJSONArray("subtitle_language_list")
                  val subs = LinkedHashSet<String>()
                  if (sl != null) for (k in 0 until sl.length()) {
                      val o = sl.optJSONObject(k) ?: continue
                      val n = o.str("subtitleDisplayName") ?: o.str("subtitleLanguageName") ?: continue
                      subs.add(if (o.optString("subtitleType").equals("CC", true)) "$n (CC)" else n)
                  }
                  out.add("Subtitles" to subs.joinToString(", "))

                  // "Cast: A, B | Director: X | Producer: Y"
                  val crew = e.str("cast_and_crew") ?: me?.str("cast_and_crew") ?: ""
                  var cast = ""; var dir = ""
                  for (seg in crew.split("|")) {
                      val key = seg.substringBefore(":").trim().lowercase()
                      val value = seg.substringAfter(":", "").trim()
                      if (key == "cast") cast = value.split(",").map { it.trim() }.filter { it.isNotEmpty() }.take(8).joinToString(", ")
                      else if (key == "director") dir = value
                  }
                  out.add("Cast" to cast)
                  out.add("Director" to dir)

                  e.str("snp_tags")?.let { t ->
                      out.add("Advisory" to t.split(",").map { it.trim() }.filter { it.isNotEmpty() }.joinToString(", "))
                  }

                  val q = LinkedHashSet<String>()
                  for (src in listOf(me, e)) {
                      if (src == null) continue
                      for (k in listOf("Maximum_Resolution", "Maximum_Video_Quality", "Maximum_Audio_Quality")) src.str(k)?.let { q.add(qLabel(it)) }
                  }
                  out.add("Quality" to q.joinToString("  •  "))
                  return out
              }

              private fun bindDetail(j: JSONObject?, item: Item) {
                  setDetailSkel(false)
                  val show = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                  if (show == null) {
                      Prefetch.gate = true
                      dStatus.text = "Could not load details\n" + Api.lastError + "\n\nPress back"
                      dStatus.visibility = View.VISIBLE
                      return
                  }
                  val tok = detailToken
                  val movie = detailMovie
                  val m = show.optJSONObject("metadata") ?: JSONObject()
                  val e = m.optJSONObject("emfAttributes") ?: JSONObject()

                  val title = m.str("title") ?: item.title
                  showTitle = title
                  val desc = m.str("shortDescription") ?: m.str("longDescription") ?: item.desc

                  // movie: children of the bundle = MOVIE (the real film, this id goes to the player) + MOVIE_TRAILER
                  val movieChild = if (movie) childBySubtype(show, "MOVIE") else null
                  val trailerChild = if (movie) childBySubtype(show, "MOVIE_TRAILER") else null
                  val mm = movieChild?.optJSONObject("metadata")
                  val me = mm?.optJSONObject("emfAttributes")

                  // show : "Hindi • 2026 • U/A 7+ • 16 Episodes • Comedy, Game show"
                  // movie: "Tamil • 2026 • U/A 13+ • 2h 18m • Comedy, Drama, Musical"
                  val parts = ArrayList<String>()
                  (m.str("languageLabel") ?: e.str("region_of_origin"))?.let { parts.add(it) }
                  m.str("year")?.let { parts.add(it) }
                  m.str("pcVodLabel")?.let { parts.add(it) }
                  if (movie) {
                      val d = fmtDur(mm?.optInt("duration") ?: 0)
                      if (d.isNotEmpty()) parts.add(d)
                  } else {
                      val sn = m.optInt("seasonCount")
                      if (sn > 1) parts.add("$sn Seasons")
                      val ec = m.optInt("episodeCount")
                      if (ec > 0) parts.add("$ec Episodes")
                  }
                  m.optJSONArray("genres")?.let { g ->
                      val l = (0 until g.length()).map { k -> g.optString(k) }.filter { it.isNotBlank() }
                      if (l.isNotEmpty()) parts.add(l.joinToString(", "))
                  }
                  dMeta.text = parts.joinToString(" • ")
                  dDesc.text = desc
                  val tag = e.str("highlight_text") ?: (if (movie) m.optJSONObject("badges")?.str("primary_tag") else null)
                  if (tag != null) { dTag.text = tag; dTag.visibility = View.VISIBLE } else dTag.visibility = View.GONE

                  // what My List stores for this show / movie (images + texts of the detail response)
                  detailItem = item.copy(
                      title = title, desc = desc, meta = parts.joinToString(" • "),
                      bg = rawBgOf(show) ?: item.bg, logo = detLogoUrl(show) ?: item.logo,
                      portrait = e.str("portrait_thumb") ?: item.portrait, landscape = e.str("thumbnail") ?: item.landscape)
                  updatePlus()
                  updateResume()
                  if (dResumeBox.visibility == View.VISIBLE && !epMode && !inPlayer && (currentFocus === dWatch || currentFocus == null)) dResumeBtn.requestFocus()

                  // seasons / bundles, newest first (shows only)
                  val data: DetailData? = if (movie) null else parseSeasons(show)
                  if (data != null) {
                      seasons.clear()
                      seasons.addAll(data.seasons)
                      data.latest?.let { setWatchLabel(it) }
                  }
                  dStatus.visibility = View.GONE

                  val trailer = trailerFrom(show)
                  detailTrailerUrl = trailer

                  // "Watch Trailer" button: plays the trailer inside the real player UI (direct trailer url, no stream api needed)
                  val tUrl = trailerUrlAny(show)
                  if (tUrl != null) {
                      val tm = trailerChild?.optJSONObject("metadata")
                      val tid = trailerIdFrom(show) ?: (tm?.optString("contentId") ?: "")
                      trailerPlayUrl = tUrl
                      trailerEp = Ep(tid, "Trailer", 0, desc, e.str("thumbnail") ?: item.landscape, tm?.optInt("duration") ?: 0, 0L)
                      dTrailer.visibility = View.VISIBLE
                  } else {
                      trailerPlayUrl = null; trailerEp = null
                      dTrailer.visibility = View.GONE
                  }

                  if (movie) {
                      val mid = mm?.optString("contentId").orEmpty()
                      movieEp = if (movieChild != null && mid.isNotBlank())
                          Ep(mid, "", 0, desc, me?.str("thumbnail") ?: e.str("thumbnail") ?: item.landscape, mm?.optInt("duration") ?: 0, mm?.optLong("originalAirDate") ?: 0L)
                      else null
                      dWatch.text = "▶  Watch Movie"
                      setExtra(movieExtraRows(e, me))
                  }

                  // title image (masthead logo, w=700) + background (w=1200) + first episode thumbnails => then the trailer
                  val logoUrl = detLogoUrl(show) ?: item.logo
                  val bgUrl = detBgUrl(show) ?: img(item.bg ?: item.landscape, W_BG)
                  val thumbs: List<String> = if (data == null) emptyList() else
                      (data.seasons.firstOrNull()?.let { s -> data.embedded[s.id].orEmpty().take(4).mapNotNull { img(it.thumb, W_EP) } }.orEmpty())
                  loadDetailAssets(tok, title, logoUrl, bgUrl, thumbs, trailer)

                  if (movie || seasons.isEmpty()) return
                  dHint.visibility = View.VISIBLE
                  buildSeasonCol()
                  selectSeason(0, false)      // newest bundle first; list loads in the background
              }

              // left column of bundles (only when there is more than one bundle)
              private fun buildSeasonCol() {
                  chips.clear(); sCol.removeAllViews()
                  if (seasons.size <= 1) { sScroll.visibility = View.GONE; return }
                  sScroll.visibility = View.VISIBLE
                  for (i in seasons.indices) {
                      val c = TextView(this).apply {
                          text = seasons[i].title
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(Color.WHITE)
                          setPadding(u(18), u(12), u(18), u(12))
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      tx(c, 18f)
                      c.setOnFocusChangeListener { _, has -> styleChip(i); if (has) scheduleSelect(i) }
                      c.setOnClickListener {
                          selRun?.let { ui.removeCallbacks(it) }
                          selectSeason(i, true)
                      }
                      chips.add(c)
                      sCol.addView(c, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = u(8) })
                  }
                  for (i in chips.indices) styleChip(i)
              }

              private fun styleChip(i: Int) {
                  val v = chips.getOrNull(i) ?: return
                  val f = v.isFocused
                  val sel = i == curSeason
                  v.setTextColor(if (f) Color.BLACK else Color.WHITE)
                  v.background = GradientDrawable().apply {
                      cornerRadius = u(10).toFloat()
                      setColor(if (f) Color.WHITE else if (sel) Color.argb(120, 200, 200, 210) else Color.TRANSPARENT)
                  }
              }

              // focusing a bundle selects it after a short pause (so fast scrolling doesn't spam the API)
              private fun scheduleSelect(i: Int) {
                  selRun?.let { ui.removeCallbacks(it) }
                  if (i == curSeason) return
                  val r = Runnable { selectSeason(i, false) }
                  selRun = r
                  ui.postDelayed(r, 350)
              }

              private fun selectSeason(i: Int, grab: Boolean) {
                  if (i !in seasons.indices) return
                  curSeason = i
                  epToken++
                  eps.clear(); epAdapter.notifyDataSetChanged()
                  epFrom = 0; epHasMore = true; epLoading = false
                  wantEpFocus = grab
                  for (k in chips.indices) styleChip(k)
                  showEpSkel(true)                      // skeleton rows while the episodes load
                  loadEpisodes()
              }

              // is the episode list on screen right now (detail episodes page OR the player's episodes panel)?
              private fun epActive(): Boolean = if (inPlayer) panel == 2 else (inDetail && epMode)

              // bundle api: from=0&to=29, then from=30&to=59 ... while scrolling
              private fun loadEpisodes() {
                  if (epLoading || !epHasMore || curSeason !in seasons.indices) return
                  epLoading = true
                  val tok = epToken
                  val s = seasons[curSeason]
                  val from = epFrom
                  val url = EP_URL + s.id + "?from=" + from + "&to=" + (from + EP_PAGE - 1) +
                          "&orderBy=episodeNumber&sortOrder=desc&kids_safe=false"
                  Thread {
                      val j = Api.get(url)
                      val arr = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.optJSONArray("containers")
                      val list = ArrayList<Ep>()
                      if (arr != null) for (k in 0 until arr.length()) parseEp(arr.optJSONObject(k))?.let { list.add(it) }
                      ui.post {
                          if (tok != epToken) return@post
                          epLoading = false
                          showEpSkel(false)
                          if (j == null) {
                              if (eps.isEmpty()) { epStatus.text = "Could not load episodes\n" + Api.lastError; epStatus.visibility = View.VISIBLE }
                              return@post
                          }
                          epFrom = from + EP_PAGE
                          if (list.size < EP_PAGE || (s.count > 0 && epFrom >= s.count)) epHasMore = false
                          val start = eps.size
                          eps.addAll(list)
                          epAdapter.notifyItemRangeInserted(start, list.size)
                          // thumbnails of this whole page: queue front (first 4 decoded into memory right away)
                          list.take(14).forEach { Prefetch.add(img(it.thumb, W_EP), true) }
                          list.take(4).forEach { cardReq(img(it.thumb, W_EP), epImgW, epImgH).priority(Priority.HIGH).preload() }
                          if (eps.isEmpty()) { epStatus.text = "No episodes"; epStatus.visibility = View.VISIBLE }
                          else epStatus.visibility = View.GONE
                          if (start == 0 && list.isNotEmpty()) {
                              if (curSeason == 0) setWatchLabel(list[0])
                              if (epActive() && wantEpFocus) { wantEpFocus = false; focusFirstEp(12) }
                          }
                      }
                  }.start()
              }

              private fun focusFirstEp(tries: Int) {
                  ui.postDelayed({
                      if (!epActive()) return@postDelayed
                      val v = dEpRv.findViewHolderForAdapterPosition(0)?.itemView ?: dEpRv.getChildAt(0)
                      val ok = v?.requestFocus() ?: false
                      if (!ok && tries > 0) focusFirstEp(tries - 1)
                  }, 200)
              }

              private fun focusEpDefault() {
                  wantEpFocus = false
                  val first = dEpRv.findViewHolderForAdapterPosition(0)?.itemView ?: dEpRv.getChildAt(0)
                  if (first != null) first.requestFocus()
                  else if (eps.isEmpty()) { wantEpFocus = true; epTab.requestFocus() }
                  else focusFirstEp(10)
              }

              // focus the episode that is playing (falls back to the first row)
              private fun focusPlayingEp() {
                  val id = curPlayEp?.id
                  val pos = if (id == null) -1 else eps.indexOfFirst { it.id == id }
                  if (pos < 0) { focusEpDefault(); return }
                  dEpRv.scrollToPosition(pos)
                  ui.postDelayed({
                      val v = dEpRv.findViewHolderForAdapterPosition(pos)?.itemView
                      if (v != null) v.requestFocus() else focusEpDefault()
                  }, 120)
              }

              // slide the episodes panel up (trailer view stays underneath, paused)
              private fun showEpisodes() {
                  if (epMode || seasons.isEmpty()) return
                  epMode = true
                  wantEpFocus = true
                  stopTrailer(true)
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.visibility = View.VISIBLE
                  epLayer.animate().cancel()
                  epLayer.translationY = H.toFloat()
                  epLayer.animate().translationY(0f).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
                  if (eps.isEmpty()) loadEpisodes()
                  ui.postDelayed({ if (inDetail && epMode && !inPlayer) focusEpDefault() }, 200)
              }

              private fun hideEpisodes() {
                  if (!epMode) return
                  epMode = false
                  selRun?.let { ui.removeCallbacks(it) }
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.animate().cancel()
                  epLayer.animate().translationY(H.toFloat()).setDuration(260).setInterpolator(DecelerateInterpolator())
                      .withEndAction { if (!epMode) epLayer.visibility = View.GONE }.start()
                  (if (dResumeBox.visibility == View.VISIBLE) dResumeBtn else dWatch).requestFocus()
                  detailTrailerUrl?.let { schedulePlay(it, false) }
              }

              private fun closeDetail(refocus: Boolean) {
                  inDetail = false; epMode = false
                  detailToken++; epToken++
                  selRun?.let { ui.removeCallbacks(it) }
                  detGateRun?.let { ui.removeCallbacks(it) }
                  Prefetch.gate = true
                  stopTrailer(false)
                  setDetailSkel(false)
                  showEpSkel(false)
                  detail.visibility = View.GONE
                  epLayer.animate().cancel(); epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  side.visibility = View.VISIBLE; brand.visibility = View.VISIBLE
                  content.visibility = View.VISIBLE
                  curBox = videoBox; curVideo = videoView; curBg = bg; curBoxW = homeBoxW; curBoxH = homeBoxH
                  val hv = if (hero != null) 1f else 0f                 // card rows have no hero
                  bg.animate().cancel(); bg.alpha = hv
                  info.animate().cancel(); info.alpha = hv
                  if (!refocus) return
                  val c = lastCard
                  ui.postDelayed({
                      if (inDetail) return@postDelayed
                      if (c != null && c.isAttachedToWindow) c.requestFocus() else focusFirst(12)
                      hero?.let { scheduleTrailer(it) }
                  }, 100)
              }

              // ---------------------------------------------------------------- Player logic
              private fun playEpisode(ep: Ep) {
                  val sn = if (curSeason in seasons.indices) seasons[curSeason].num else 0
                  openPlayer(ep, sn)
              }

              private fun setPlayerTitles() {
                  val ep = curPlayEp ?: return
                  val pre = ((if (curPlaySeason > 0) "S$curPlaySeason " else "") + (if (ep.num > 0) "E${ep.num}" else "")).trim()
                  val name = if (ep.title.isNotBlank()) ep.title else showTitle
                  pTitle.text = if (pre.isNotEmpty()) "$pre • $name" else name
                  pSub.text = if (ep.title.isNotBlank()) showTitle else ""
              }

              // stream subtitles + subtitles from the episode detail response (deduplicated by url)
              private fun mergeSubs(s: StreamInfo, ex: EpExtra?): StreamInfo {
                  if (ex == null || ex.subs.isEmpty()) return s
                  val have = HashSet<String>()
                  s.subs.forEach { have.add(it.url) }
                  val all = ArrayList<SubInfo>(s.subs)
                  for (x in ex.subs) if (have.add(x.url)) all.add(x)
                  return StreamInfo(s.url, s.enc, s.laUrl, s.drm, all)
              }

              // opens the player for an episode / movie / trailer.
              //  fromHome  : opened straight from a listing card (no detail page behind it)
              //  noEps     : movie or trailer => the "Episodes" button is hidden
              //  directUrl : play this url directly (trailers) instead of asking the stream api
              //  startMs   : start position (resume watching)
              private fun openPlayer(ep: Ep, seasonNum: Int, fromHome: Boolean = false, noEps: Boolean = false, directUrl: String? = null, startMs: Long = 0L) {
                  if (ep.id.isBlank() && directUrl == null) return
                  if (inPlayer) saveProgress()               // switching episode inside the player: keep where the old one stopped
                  val tok = ++playToken
                  curPlayEp = ep; curPlaySeason = seasonNum
                  // episodes / movies opened from a detail page are saved for "Resume" (trailers and direct listing plays are not)
                  playTrack = directUrl == null && !fromHome && detailItem != null
                  playShowCid = detailItem?.cid ?: ""
                  playShowSub = detailItem?.sub ?: ""
                  pendingStart = startMs
                  if (!inPlayer) {
                      inPlayer = true
                      playFromHome = fromHome
                      heroRun?.let { ui.removeCallbacks(it) }
                      detGateRun?.let { ui.removeCallbacks(it) }
                      stopTrailer(false)
                      Prefetch.paused = true                 // all bandwidth for the video
                      detail.visibility = View.GONE
                      if (fromHome) {
                          // no detail page / season list behind this player: hide the home screen
                          content.visibility = View.GONE
                          side.visibility = View.GONE; brand.visibility = View.GONE
                          status.visibility = View.GONE
                      }
                      pillEps.visibility = if (fromHome || noEps) View.GONE else View.VISIBLE
                      playerLayer.visibility = View.VISIBLE
                  } else {
                      mainPlayer?.let { it.stop(); it.clearMediaItems() }
                      if (panel == 1) closeDrawer(false)
                      if (panel == 2) closePlayerEps(false)
                  }
                  cancelScrub()
                  resetSprite()
                  firstFrame = false
                  panel = 0
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  pStatus.visibility = View.GONE
                  pCue.text = ""; pCue.visibility = View.GONE
                  pSpin.visibility = View.VISIBLE
                  // episode / movie thumbnail (w=1000) behind the buffering animation until the first video frame is drawn
                  pThumb.animate().cancel(); pThumb.alpha = 1f; pThumb.visibility = View.VISIBLE
                  Glide.with(this).clear(pThumb)
                  Glide.with(this).load(img(ep.thumb, W_THUMB)).centerCrop().diskCacheStrategy(DiskCacheStrategy.ALL).into(pThumb)
                  pPause.setImageResource(R.drawable.ic_pause)
                  pSeek.pos = startMs; pSeek.buf = 0L; pSeek.dur = ep.dur * 1000L; pSeek.invalidate()
                  pTime.text = fmtLeft(startMs, ep.dur * 1000L)
                  setPlayerTitles()
                  epAdapter.notifyDataSetChanged()           // "Now Playing" badge
                  showControls()
                  ui.removeCallbacks(tickRun); ui.postDelayed(tickRun, 500)

                  // stream url + license, plus the content DETAIL-V2 (subtitles, seek-preview sprite, exact titles) fetched in parallel
                  Thread {
                      val df = if (ep.id.isBlank()) null else Api.pool.submit(Callable<JSONObject?> { fetchDetail(ep.id) })
                      val s = if (directUrl != null) StreamInfo(directUrl, false, "", "", emptyList()) else fetchStream(ep.id)
                      val ex = parseEpExtra(try { df?.get(4, TimeUnit.SECONDS) } catch (e: Exception) { null })
                      ui.post {
                          if (tok != playToken || !inPlayer) return@post
                          if (ex != null && ex.en > 0) {
                              curPlayEp = Ep(ep.id, ex.et ?: ep.title, ex.en, ep.desc, ep.thumb, ep.dur, ep.air)
                              if (ex.sn > 0) curPlaySeason = ex.sn
                              setPlayerTitles()
                          }
                          if (s == null) {
                              pSpin.visibility = View.GONE
                              pStatus.text = "Stream unavailable for this content.\n" + Api.lastError
                              pStatus.visibility = View.VISIBLE
                          } else {
                              startPlayback(mergeSubs(s, ex))
                              loadSprite(ex?.sprite, spriteTok)
                          }
                      }
                  }.start()
              }

              private val mainListener = object : Player.Listener {
                  override fun onPlaybackStateChanged(playbackState: Int) {
                      refreshPlayUi()
                      if (playbackState == Player.STATE_ENDED) playNextOrExit()
                  }
                  override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) { refreshPlayUi() }
                  override fun onIsPlayingChanged(isPlaying: Boolean) { if (isPlaying) pStatus.visibility = View.GONE }
                  override fun onRenderedFirstFrame() {
                      firstFrame = true
                      pThumb.animate().cancel()
                      pThumb.animate().alpha(0f).setDuration(250).withEndAction { if (firstFrame) pThumb.visibility = View.GONE }.start()
                      refreshPlayUi()
                  }
                  override fun onCues(cueGroup: CueGroup) {
                      val t = cueGroup.cues.mapNotNull { it.text?.toString() }.filter { it.isNotBlank() }.joinToString("\n")
                      pCue.text = t
                      pCue.visibility = if (t.isEmpty()) View.GONE else View.VISIBLE
                  }
                  override fun onPlayerError(error: PlaybackException) {
                      pSpin.visibility = View.GONE
                      pStatus.text = "Playback error\n" + error.errorCodeName + (error.cause?.message?.let { "\n" + it } ?: "")
                      pStatus.visibility = View.VISIBLE
                      showControls()
                  }
              }

              private fun ensureMainPlayer(): ExoPlayer {
                  mainPlayer?.let { return it }
                  // every manifest / segment request carries the same headers as the web player (Origin + Referer sonyliv.com)
                  val dsf = DefaultHttpDataSource.Factory()
                      .setUserAgent(STREAM_UA)
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(20000)
                      .setDefaultRequestProperties(STREAM_HEADERS)
                  val p = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(this).setDataSourceFactory(dsf))
                      .build()
                  p.setAudioAttributes(AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true)
                  p.addListener(mainListener)
                  mainPlayer = p
                  return p
              }

              private fun startPlayback(s: StreamInfo) {
                  val p = ensureMainPlayer()
                  p.setVideoSurfaceView(pSurface)
                  // subtitles OFF by default, quality AUTO
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .clearOverrides().setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true).build()
                  qualitySel = 0

                  val url = playableUrl(s.url)
                  val lower = url.lowercase()
                  val mime = when {
                      lower.contains(".m3u8") -> MimeTypes.APPLICATION_M3U8
                      lower.contains(".mpd") -> MimeTypes.APPLICATION_MPD
                      else -> null
                  }
                  val mb = MediaItem.Builder().setUri(url)
                  if (mime != null) mb.setMimeType(mime)
                  if (s.enc && s.laUrl.isNotBlank() && s.drm == "WIDEVINE") {
                      mb.setDrmConfiguration(
                          MediaItem.DrmConfiguration.Builder(C.WIDEVINE_UUID)
                              .setLicenseUri(s.laUrl)
                              .setLicenseRequestHeaders(STREAM_HEADERS)
                              .build()
                      )
                  }
                  // external subtitle files (only well known text formats) - from the stream api AND the episode detail response
                  val subs = ArrayList<MediaItem.SubtitleConfiguration>()
                  for (si in s.subs) {
                      val ul = si.url.lowercase().substringBefore("?")
                      val sm = when {
                          ul.endsWith(".vtt") -> MimeTypes.TEXT_VTT
                          ul.endsWith(".srt") -> MimeTypes.APPLICATION_SUBRIP
                          ul.endsWith(".ttml") || ul.endsWith(".xml") || ul.endsWith(".dfxp") -> MimeTypes.APPLICATION_TTML
                          else -> null
                      } ?: continue
                      subs.add(MediaItem.SubtitleConfiguration.Builder(Uri.parse(si.url))
                          .setMimeType(sm).setLanguage(si.lang).setLabel(si.label).setSelectionFlags(0).build())
                  }
                  if (subs.isNotEmpty()) mb.setSubtitleConfigurations(subs)

                  val st = pendingStart                          // resume watching: start where the user stopped
                  pendingStart = 0L
                  p.setMediaItem(mb.build(), st)
                  p.prepare()
                  p.playWhenReady = true
                  pStatus.visibility = View.GONE
                  refreshPlayUi()
              }

              private fun refreshPlayUi() {
                  val p = mainPlayer ?: return
                  pPause.setImageResource(if (p.playWhenReady) R.drawable.ic_pause else R.drawable.ic_play)
                  val st = p.playbackState
                  // one buffering animation in the middle: first load (on top of the thumbnail) and any later buffering
                  val loading = !firstFrame && st != Player.STATE_ENDED && pStatus.visibility != View.VISIBLE
                  pSpin.visibility = if ((st == Player.STATE_BUFFERING && p.playWhenReady) || loading) View.VISIBLE else View.GONE
                  if (!p.playWhenReady) {
                      ui.removeCallbacks(hideRun)
                      if (panel == 0 && inPlayer) showControls()
                  } else schedHide()
              }

              private fun playNextOrExit() {
                  val cur = curPlayEp ?: run { closePlayer(); return }
                  if (playFromHome) { closePlayer(); return }
                  val i = eps.indexOfFirst { it.id == cur.id }
                  if (i > 0) openPlayer(eps[i - 1], curPlaySeason) else closePlayer()      // movie / trailer: not in the list => back to the detail page
              }

              private fun updateProgress() {
                  val p = mainPlayer
                  val dur = if (p != null && p.duration > 0) p.duration else (curPlayEp?.dur ?: 0) * 1000L
                  pSeek.dur = dur
                  pSeek.buf = p?.bufferedPosition ?: 0L
                  if (scrubPos < 0) {                              // while scrubbing the bar shows the target position
                      val pos = p?.currentPosition ?: 0L
                      pSeek.pos = pos
                      pTime.text = fmtLeft(pos, dur)               // Netflix style: only the time left
                  }
                  pSeek.invalidate()
              }

              private fun togglePause() {
                  val p = mainPlayer ?: return
                  if (p.playbackState == Player.STATE_ENDED) { p.seekTo(0); p.play(); return }
                  if (p.playWhenReady) p.pause() else p.play()
              }

              // Scrubbing: left/right moves a target position and shows the sprite preview; the real seek happens
              // ~0.8s after the last key press (or immediately on OK) so fast scrubbing does not spam the stream.
              private fun seekBy(deltaMs: Long) {
                  val p = mainPlayer ?: return
                  val dur = if (p.duration > 0) p.duration else (curPlayEp?.dur ?: 0) * 1000L
                  val base = if (scrubPos >= 0) scrubPos else p.currentPosition
                  var t = base + deltaMs
                  if (t < 0L) t = 0L
                  if (dur > 0 && t > dur - 1000L) t = max(0L, dur - 1000L)
                  scrubPos = t
                  pSeek.dur = dur
                  pSeek.pos = t
                  pSeek.invalidate()
                  pTime.text = fmtLeft(t, dur)
                  showPreview(t)
                  ui.removeCallbacks(commitRun)
                  ui.postDelayed(commitRun, 800)
              }

              private fun commitScrub() {
                  ui.removeCallbacks(commitRun)
                  val t = scrubPos
                  scrubPos = -1L
                  pPrev.visibility = View.GONE
                  if (t >= 0L) mainPlayer?.seekTo(t)
              }

              private fun cancelScrub() {
                  ui.removeCallbacks(commitRun)
                  scrubPos = -1L
                  pPrev.visibility = View.GONE
              }

              // ---- sprite sheet preview
              // sprite url: ..._<tileW>_<tileH>_<frames>.jpg  (frames are spread evenly over the episode duration)
              // sheet layout (columns) is detected from the real image width / tile width. Only the needed tile is decoded.
              private fun resetSprite() {
                  spriteTok++
                  spriteWant = -1
                  currentTileIdx = -1
                  synchronized(spriteLock) {
                      spriteDec?.let { try { it.recycle() } catch (e: Throwable) { } }
                      spriteDec = null
                      spriteCnt = 0
                  }
                  synchronized(spriteCache) { spriteCache.clear() }
                  pPrevImg.setImageDrawable(null)
              }

              private fun loadSprite(url: String?, tok: Int) {
                  if (url == null) return
                  val mt = Regex("_(\\d+)_(\\d+)_(\\d+)\\.[A-Za-z]+$").find(url.substringBefore("?")) ?: return
                  val tw = mt.groupValues[1].toInt()
                  val th = mt.groupValues[2].toInt()
                  val cnt = mt.groupValues[3].toInt()
                  if (tw <= 0 || th <= 0 || cnt <= 0) return
                  Thread {
                      try {
                          val req = Request.Builder().url(url)
                              .header("User-Agent", STREAM_UA)
                              .header("Origin", "https://www.sonyliv.com")
                              .header("Referer", "https://www.sonyliv.com/")
                              .build()
                          val bytes = Net.client.newCall(req).execute().use { r -> if (r.isSuccessful) r.body?.bytes() else null }
                              ?: return@Thread
                          val dec = BitmapRegionDecoder.newInstance(bytes, 0, bytes.size, false) ?: return@Thread
                          ui.post {
                              if (tok != spriteTok || !inPlayer) {
                                  try { dec.recycle() } catch (e: Throwable) { }
                                  return@post
                              }
                              synchronized(spriteLock) {
                                  spriteDec = dec
                                  spriteTW = tw; spriteTH = th; spriteCnt = cnt
                                  spriteCols = max(1, dec.width / tw)
                              }
                              if (scrubPos >= 0) showPreview(scrubPos)
                          }
                      } catch (e: Throwable) { }
                  }.apply { isDaemon = true; start() }
              }

              // returns the tile when cached, else decodes it in the background (only the latest wanted tile is decoded)
              private fun tileFor(idx: Int): Bitmap? {
                  synchronized(spriteCache) { spriteCache[idx] }?.let { return it }
                  if (spriteDec == null) return null
                  spriteWant = idx
                  val tok = spriteTok
                  spriteExec.execute {
                      if (tok != spriteTok || spriteWant != idx) return@execute
                      var bmp: Bitmap? = null
                      synchronized(spriteLock) {
                          val d = spriteDec
                          if (d != null && !d.isRecycled) {
                              val l = (idx % spriteCols) * spriteTW
                              val t = (idx / spriteCols) * spriteTH
                              if (l < d.width && t < d.height) {
                                  val r = Rect(l, t, min(d.width, l + spriteTW), min(d.height, t + spriteTH))
                                  val o = BitmapFactory.Options().apply { inSampleSize = 2; inPreferredConfig = Bitmap.Config.RGB_565 }
                                  try { bmp = d.decodeRegion(r, o) } catch (e: Throwable) { }
                              }
                          }
                      }
                      val b = bmp ?: return@execute
                      synchronized(spriteCache) { spriteCache[idx] = b }
                      ui.post { if (tok == spriteTok && scrubPos >= 0 && currentTileIdx == idx) pPrevImg.setImageBitmap(b) }
                  }
                  return null
              }

              private fun showPreview(posMs: Long) {
                  val dur = pSeek.dur
                  if (dur <= 0) return
                  val frac = (posMs.toFloat() / dur).coerceIn(0f, 1f)
                  pPrevTime.text = fmtClock(posMs)
                  val has = spriteDec != null && spriteCnt > 0
                  pPrevImg.visibility = if (has) View.VISIBLE else View.GONE
                  if (has) {
                      val idx = (frac * spriteCnt).toInt().coerceIn(0, spriteCnt - 1)
                      currentTileIdx = idx
                      tileFor(idx)?.let { pPrevImg.setImageBitmap(it) }
                  }
                  pPrev.visibility = View.VISIBLE
                  // follow the seek position
                  val loc = IntArray(2); val cl = IntArray(2)
                  pSeek.getLocationInWindow(loc); ctrl.getLocationInWindow(cl)
                  val d = resources.displayMetrics.density
                  val cx = (loc[0] - cl[0]) + 10f * d + (pSeek.width - 20f * d) * frac
                  val pw = prevW().toFloat()
                  pPrev.translationX = (cx - pw / 2f).coerceIn(u(20).toFloat(), max(u(20).toFloat(), W - pw - u(20)))
              }

              private fun showControls() {
                  if (!inPlayer || panel != 0) return
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = true
                  ctrl.animate().cancel()
                  ctrl.visibility = View.VISIBLE
                  ctrl.animate().alpha(1f).setDuration(150).start()
                  cueLift(true)
                  if (ctrl.findFocus() == null) pSeek.requestFocus()
                  schedHide()
              }

              private fun schedHide() {
                  ui.removeCallbacks(hideRun)
                  if (inPlayer && panel == 0 && mainPlayer?.playWhenReady == true) ui.postDelayed(hideRun, 5000)
              }

              private fun hideControls() {
                  ctrlVisible = false
                  ctrl.animate().cancel()
                  ctrl.animate().alpha(0f).setDuration(200).withEndAction { if (!ctrlVisible) ctrl.visibility = View.INVISIBLE }.start()
                  cueLift(false)
              }

              // all player key handling. returns true when the key was consumed.
              private fun playerKey(code: Int, repeat: Int): Boolean {
                  if (panel == 1) {                                  // drawer: up / down / OK handled by normal focus
                      return when (code) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> { closeDrawer(true); true }
                          KeyEvent.KEYCODE_DPAD_RIGHT -> true
                          else -> false
                      }
                  }
                  if (panel == 2) {                                  // episodes panel (same behaviour as the detail episodes page)
                      when (code) {
                          KeyEvent.KEYCODE_DPAD_UP -> if (currentFocus === epTab) { closePlayerEps(true); return true }
                          KeyEvent.KEYCODE_DPAD_LEFT -> if (inEpList()) return focusSeasonChip()
                      }
                      return false
                  }
                  when (code) {
                      KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { togglePause(); showControls(); return true }
                      KeyEvent.KEYCODE_MEDIA_PLAY -> { mainPlayer?.play(); return true }
                      KeyEvent.KEYCODE_MEDIA_PAUSE -> { mainPlayer?.pause(); return true }
                      KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> { seekBy(30000L); showControls(); return true }
                      KeyEvent.KEYCODE_MEDIA_REWIND -> { seekBy(-30000L); showControls(); return true }
                  }
                  val step = if (repeat > 3) 30000L else 10000L
                  if (!ctrlVisible) {                                // controls hidden: arrows seek, OK = pause / play
                      when (code) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> { seekBy(-step); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_RIGHT -> { seekBy(step); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER -> { togglePause(); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN -> { showControls(); return true }
                      }
                      return false
                  }
                  schedHide()
                  val f = currentFocus
                  val onPill = f === pillSub || f === pillSet || f === pillEps
                  val noEpsBtn = pillEps.visibility != View.VISIBLE
                  when (code) {
                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                          if (f === pSeek) { seekBy(-step); return true }
                          if (f === pillSub || f === pPause || f === pBack) return true
                      }
                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                          if (f === pSeek) { seekBy(step); return true }
                          if (f === pPause) { pSeek.requestFocus(); return true }
                          if (f === pillEps || f === pBack || (noEpsBtn && f === pillSet)) return true
                      }
                      KeyEvent.KEYCODE_DPAD_UP -> {
                          if (f === pSeek) pPause.requestFocus()
                          else if (f === pPause) pBack.requestFocus()
                          else if (onPill) pSeek.requestFocus()
                          return true
                      }
                      KeyEvent.KEYCODE_DPAD_DOWN -> {
                          if (f === pBack) pPause.requestFocus()
                          else if (f === pSeek || f === pPause) pillSub.requestFocus()
                          return true
                      }
                  }
                  return false
              }

              // ---- drawer: Subtitle & Audio (kind 1) / Settings = video quality (kind 2)
              private fun trackLabel(f: Format, i: Int): String {
                  f.label?.takeIf { it.isNotBlank() }?.let { return it }
                  val lang = f.language
                  if (!lang.isNullOrBlank() && lang != "und") {
                      val n = Locale.forLanguageTag(lang).getDisplayLanguage(Locale.ENGLISH)
                      return if (n.isNotBlank()) n else lang
                  }
                  return "Track " + (i + 1)
              }

              private fun drawerHeader(t: String): TextView {
                  val h = TextView(this).apply {
                      text = t; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                      setPadding(u(8), u(16), u(8), u(10))
                  }
                  tx(h, 20f)
                  return h
              }

              private fun drawerRow(label: String, selected: Boolean, onClick: () -> Unit): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(u(16), u(14), u(16), u(14))
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  val ck = ImageView(this).apply {
                      setImageResource(R.drawable.ic_check)
                      visibility = if (selected) View.VISIBLE else View.INVISIBLE
                  }
                  val tv = TextView(this).apply { text = label; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                  tx(tv, 18f)
                  row.addView(ck, LinearLayout.LayoutParams(u(24), u(24)).apply { rightMargin = u(16) })
                  row.addView(tv, LinearLayout.LayoutParams(0, -2, 1f))
                  fun st() {
                      val f = row.isFocused
                      tv.setTextColor(if (f) Color.parseColor("#222222") else Color.WHITE)
                      tv.typeface = if (f || selected) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                      ck.setColorFilter(if (f) Color.parseColor("#777777") else Color.parseColor("#FFC107"))
                      row.background = if (f) GradientDrawable().apply { cornerRadius = u(8).toFloat(); setColor(Color.WHITE) } else null
                  }
                  st()
                  row.setOnFocusChangeListener { _, _ -> st() }
                  row.setOnClickListener { onClick() }
                  return row
              }

              private class QOpt(val h: Int, val g: Tracks.Group, val idx: Int, val br: Int)

              private fun qualityOptions(): List<QOpt> {
                  val p = mainPlayer ?: return emptyList()
                  val best = HashMap<Int, QOpt>()
                  for (g in p.currentTracks.groups) {
                      if (g.type != C.TRACK_TYPE_VIDEO) continue
                      for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          val f = g.getTrackFormat(i)
                          if (f.height <= 0) continue
                          val cur = best[f.height]
                          if (cur == null || f.bitrate > cur.br) best[f.height] = QOpt(f.height, g, i, f.bitrate)
                      }
                  }
                  return best.values.sortedByDescending { it.h }
              }

              private fun selectText(g: Tracks.Group?, idx: Int) {
                  val p = mainPlayer ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (g == null) b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                  else {
                      b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                      b.setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx))
                  }
                  p.trackSelectionParameters = b.build()
                  if (g == null) { pCue.text = ""; pCue.visibility = View.GONE }
              }

              private fun selectAudio(g: Tracks.Group, idx: Int) {
                  val p = mainPlayer ?: return
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx)).build()
              }

              private fun selectQuality(o: QOpt?) {
                  val p = mainPlayer ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (o == null) { b.clearOverridesOfType(C.TRACK_TYPE_VIDEO); qualitySel = 0 }
                  else { b.setOverrideForType(TrackSelectionOverride(o.g.mediaTrackGroup, o.idx)); qualitySel = o.h }
                  p.trackSelectionParameters = b.build()
              }

              private fun openDrawer(kind: Int) {
                  val p = mainPlayer ?: return
                  if (panel != 0) return
                  drawerKind = kind
                  drawerCol.removeAllViews()
                  var focusV: View? = null
                  fun add(v: LinearLayout, sel: Boolean) {
                      drawerCol.addView(v, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = u(6) })
                      if (sel && focusV == null) focusV = v
                  }
                  val tracks = p.currentTracks
                  if (kind == 1) {
                      drawerCol.addView(drawerHeader("Subtitles"))
                      val off = p.trackSelectionParameters.disabledTrackTypes.contains(C.TRACK_TYPE_TEXT)
                      class TR(val g: Tracks.Group, val i: Int, val label: String, val sel: Boolean)
                      val tl = ArrayList<TR>()
                      for (g in tracks.groups) if (g.type == C.TRACK_TYPE_TEXT) for (i in 0 until g.length) {
                          if (g.isTrackSupported(i)) tl.add(TR(g, i, trackLabel(g.getTrackFormat(i), tl.size), !off && g.isTrackSelected(i)))
                      }
                      add(drawerRow("OFF", off || tl.none { it.sel }) { selectText(null, 0); closeDrawer(true) }, off || tl.none { it.sel })
                      for (t in tl) add(drawerRow(t.label, t.sel) { selectText(t.g, t.i); closeDrawer(true) }, t.sel)

                      drawerCol.addView(drawerHeader("Audio"))
                      var anyAudio = false
                      for (g in tracks.groups) if (g.type == C.TRACK_TYPE_AUDIO) for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          anyAudio = true
                          val sel = g.isTrackSelected(i)
                          add(drawerRow(trackLabel(g.getTrackFormat(i), i), sel) { selectAudio(g, i); closeDrawer(true) }, sel)
                      }
                      if (!anyAudio) add(drawerRow("Default", true) { closeDrawer(true) }, true)
                  } else {
                      drawerCol.addView(drawerHeader("Video Quality"))
                      add(drawerRow("Auto", qualitySel == 0) { selectQuality(null); closeDrawer(true) }, qualitySel == 0)
                      for (o in qualityOptions()) {
                          add(drawerRow(o.h.toString() + "p", qualitySel == o.h) { selectQuality(o); closeDrawer(true) }, qualitySel == o.h)
                      }
                  }
                  panel = 1
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = false
                  cancelScrub()
                  cueLift(false)
                  ctrl.animate().cancel(); ctrl.alpha = 0f; ctrl.visibility = View.INVISIBLE
                  ctrl.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  drawer.animate().cancel()
                  drawer.visibility = View.VISIBLE
                  drawer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  drawer.translationX = drawerW.toFloat()
                  drawer.animate().translationX(0f).setDuration(220).setInterpolator(DecelerateInterpolator()).start()
                  ui.postDelayed({
                      if (inPlayer && panel == 1) (focusV ?: drawerCol.getChildAt(1))?.requestFocus()
                  }, 100)
              }

              private fun closeDrawer(refocus: Boolean) {
                  if (panel != 1) return
                  panel = 0
                  drawer.animate().cancel()
                  drawer.animate().translationX(drawerW.toFloat()).setDuration(200)
                      .withEndAction {
                          if (panel != 1) { drawer.visibility = View.GONE; drawer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS }
                      }.start()
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  if (refocus) {
                      showControls()
                      (if (drawerKind == 1) pillSub else pillSet).requestFocus()
                  }
              }

              // ---- episodes panel inside the player = the SAME episodes page (same list, same seasons), just see-through
              private fun moveEpLayerToPlayer() {
                  if (epLayer.parent === playerLayer) return
                  (epLayer.parent as? ViewGroup)?.removeView(epLayer)
                  playerLayer.addView(epLayer, lp(-1, -1))
              }

              private fun moveEpLayerToDetail() {
                  if (epLayer.parent !== detail) {
                      (epLayer.parent as? ViewGroup)?.removeView(epLayer)
                      detail.addView(epLayer, 1, lp(-1, -1))
                  }
                  epLayer.setBackgroundColor(Color.argb(255, 12, 13, 20))
                  epLayer.animate().cancel()
                  if (epMode) {
                      epLayer.visibility = View.VISIBLE; epLayer.translationY = 0f
                      epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  } else {
                      epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()
                      epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  }
              }

              private fun openPlayerEps() {
                  if (panel != 0 || seasons.isEmpty() || pillEps.visibility != View.VISIBLE) return
                  panel = 2
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = false
                  cancelScrub()
                  cueLift(false)
                  ctrl.animate().cancel(); ctrl.alpha = 0f; ctrl.visibility = View.INVISIBLE
                  ctrl.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  moveEpLayerToPlayer()
                  epLayer.setBackgroundColor(Color.argb(205, 8, 9, 14))      // a little transparent: video is still visible behind
                  epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.visibility = View.VISIBLE
                  epLayer.animate().cancel()
                  epLayer.translationY = H.toFloat()
                  epLayer.animate().translationY(0f).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
                  epAdapter.notifyDataSetChanged()
                  if (eps.isEmpty()) loadEpisodes()
                  ui.postDelayed({ if (inPlayer && panel == 2) focusPlayingEp() }, 220)
              }

              private fun closePlayerEps(refocus: Boolean) {
                  if (panel != 2) return
                  panel = 0
                  selRun?.let { ui.removeCallbacks(it) }
                  epLayer.animate().cancel()
                  epLayer.animate().translationY(H.toFloat()).setDuration(260).setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          if (panel != 2) { epLayer.visibility = View.GONE; epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS }
                      }.start()
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  if (refocus) {
                      showControls()
                      pillEps.requestFocus()
                  }
              }

              private fun closePlayer() {
                  saveProgress()                                    // remember where the user left (Resume on the detail page)
                  playToken++
                  inPlayer = false
                  panel = 0
                  cancelScrub()
                  resetSprite()
                  ui.removeCallbacks(hideRun); ui.removeCallbacks(tickRun)
                  mainPlayer?.let { it.stop(); it.clearVideoSurface(); it.release() }
                  mainPlayer = null
                  pSpin.visibility = View.GONE
                  pThumb.animate().cancel(); pThumb.visibility = View.GONE
                  Glide.with(this).clear(pThumb)
                  pCue.text = ""; pCue.visibility = View.GONE
                  drawer.animate().cancel(); drawer.visibility = View.GONE; drawer.translationX = drawerW.toFloat()
                  drawer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  ctrl.animate().cancel(); ctrl.alpha = 1f; ctrl.visibility = View.VISIBLE; ctrlVisible = true
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  playerLayer.visibility = View.GONE
                  Prefetch.paused = false
                  Prefetch.gate = true
                  if (playFromHome) {
                      // opened from a listing card: go back to that page (same card focused, trailer resumes)
                      playFromHome = false
                      pillEps.visibility = View.VISIBLE
                      restoreHome()
                      return
                  }
                  moveEpLayerToDetail()
                  detail.visibility = View.VISIBLE
                  epAdapter.notifyDataSetChanged()
                  updateResume()                                    // new position / finished (>= 95%) => Resume block updates
                  if (epMode) {
                      heroLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                      ui.postDelayed({ if (inDetail && epMode && !inPlayer) focusPlayingEp() }, 150)
                  } else {
                      heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                      val back: View = lastBtn ?: (if (dResumeBox.visibility == View.VISIBLE) dResumeBtn else dWatch)
                      back.requestFocus()                           // back on the button that started the player (Watch Movie / Watch Trailer ...)
                      detailTrailerUrl?.let { schedulePlay(it, false) }
                  }
              }

              // ---------------------------------------------------------------- Adapters
              inner class RowVH(val root: LinearLayout, val title: TextView, val rv: RecyclerView) : RecyclerView.ViewHolder(root)
              inner class CardVH(val card: FrameLayout, val iv: ImageView, val border: View, val tv: TextView,
                                 val rank: TextView?, val t1: TextView?, val t2: TextView?) : RecyclerView.ViewHolder(card)
              inner class EpVH(
                  val row: LinearLayout, val thumb: FrameLayout, val iv: ImageView, val badge: TextView, val border: View,
                  val t1: TextView, val t2: TextView, val t3: TextView
              ) : RecyclerView.ViewHolder(row)

              // One view type per row kind => a recycled row ViewHolder only ever shows rows of the SAME kind, and all horizontal lists
              // of one kind share ONE view pool. Scrolling vertically therefore re-uses already built card views (no re-inflating),
              // and each row keeps its own cached CardAdapter (no new adapter / views every time a row is bound).
              inner class RowAdapter : RecyclerView.Adapter<RowVH>() {
                  override fun getItemCount() = rows.size
                  override fun getItemViewType(position: Int): Int = kindTypes.indexOf(rows[position].kind).coerceAtLeast(0)

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): RowVH {
                      val r = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.BOTTOM
                          clipChildren = false; clipToPadding = false
                          layoutParams = RecyclerView.LayoutParams(-1, rowH)       // fixed row height => exact snapping
                      }
                      // the list is full screen wide: every row (cards + banners) starts at the CONTENT_LEFT line via the left padding of its own list
                      val tv = TextView(this@MainActivity).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER_VERTICAL; setPadding(u(CONTENT_LEFT), 0, 0, 0)
                          maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                      }
                      tx(tv, 20f)
                      val lm = LinearLayoutManager(this@MainActivity, LinearLayoutManager.HORIZONTAL, false).apply {
                          recycleChildrenOnDetach = true          // card views of a row that scrolls away go back to the shared pool
                          initialPrefetchItemCount = 6            // cards of a row that is about to appear get built ahead of time
                      }
                      val rv = RecyclerView(this@MainActivity).apply {
                          layoutManager = lm
                          clipChildren = false; clipToPadding = false; itemAnimator = null
                          overScrollMode = View.OVER_SCROLL_NEVER
                          isFocusable = false; isFocusableInTouchMode = false
                          isNestedScrollingEnabled = false
                          setHasFixedSize(true); setItemViewCacheSize(6)
                          setRecycledViewPool(cardPools.getOrPut(t) { RecyclerView.RecycledViewPool().apply { setMaxRecycledViews(0, 16) } })
                          setPadding(u(CONTENT_LEFT), padV, u(60), padV)
                      }
                      r.addView(tv, LinearLayout.LayoutParams(-1, titleH))
                      r.addView(rv, LinearLayout.LayoutParams(-1, cardH + 2 * padV))
                      return RowVH(r, tv, rv)
                  }

                  override fun onBindViewHolder(h: RowVH, pos: Int) {
                      val r = rows[pos]
                      h.title.text = r.title
                      // spotlight: strip sits at the bottom of its row, title hidden
                      h.title.visibility = if (hasTitle(r)) View.VISIBLE else View.GONE          // no header => no header area, next rows move up
                      val rh = rowHeight(r)
                      val rlp = h.root.layoutParams
                      if (rlp.height != rh) { rlp.height = rh; h.root.layoutParams = rlp }
                      // card / promo rows: no vertical padding; they start at the CONTENT_LEFT line and keep CARD_RIGHT_GAP on the right
                      val card = r.kind == "card"
                      h.rv.setPadding(u(CONTENT_LEFT), padOf(r), if (card) u(CARD_RIGHT_GAP) else u(60), padOf(r))
                      val l = h.rv.layoutParams
                      val nh = kh(r) + 2 * padOf(r)
                      if (l.height != nh) { l.height = nh; h.rv.layoutParams = l }
                      val ad = (r.ad as? CardAdapter) ?: CardAdapter(r, pos).also { r.ad = it }
                      if (h.rv.adapter !== ad) h.rv.adapter = ad
                  }
              }

              inner class CardAdapter(private val row: Row, private val rowPos: Int) : RecyclerView.Adapter<CardVH>() {
                  private val k = row.kind
                  private val isCard = k == "card"
                  private val trending = k == "trending"
                  private val ch = kh(row)          // focus frame height
                  private val iw = imgW(row)        // image inside the frame
                  private val ih = imgH(row)
                  private val rankPx = rankSize()
                  private val ovl = (rankPx * RANK_OVERLAP).toInt()
                  private val rp = Paint(Paint.ANTI_ALIAS_FLAG).apply { typeface = Typeface.DEFAULT_BOLD; textSize = rankPx }
                  private val rb = Rect()
                  override fun getItemCount() = row.items.size

                  // decode the next cards into memory + download their title images ahead of the focus
                  private fun warm(pos: Int) {
                      for (n in 1..7) {
                          val it = row.items.getOrNull(pos + n) ?: break
                          cardReq(rowImg(k, it), iw, ih).priority(Priority.LOW).preload()
                          if (!row.spotlight) Prefetch.add(it.logo)
                      }
                      row.items.getOrNull(pos - 1)?.let { cardReq(rowImg(k, it), iw, ih).priority(Priority.LOW).preload() }
                  }

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): CardVH {
                      val card = FrameLayout(this@MainActivity).apply {
                          layoutParams = RecyclerView.LayoutParams(iw, ch).apply { rightMargin = if (isCard) 0 else u(12) }
                          clipChildren = false
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      val tl = Gravity.TOP or Gravity.START
                      val iv = ImageView(this@MainActivity).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(26, 28, 42))
                          outlineProvider = roundOutline; clipToOutline = true               // card banners are rounded too now (they sit inside the content area)
                      }
                      // text-only slide fallback (no image available)
                      val tvl = TextView(this@MainActivity).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                          maxLines = 4; ellipsize = TextUtils.TruncateAt.END
                          setPadding(u(8), u(8), u(8), u(8)); visibility = View.GONE
                      }
                      tx(tvl, 14f)
                      val border = View(this@MainActivity).apply {
                          background = GradientDrawable().apply {
                              setColor(Color.TRANSPARENT); setStroke(u(3), Color.WHITE); cornerRadius = u(8).toFloat()
                          }
                          alpha = 0f
                      }
                      var rank: TextView? = null
                      if (trending) {                                // big rank number left of the poster (1, 2, 3 ... 10), size + position set per number in bind
                          val pm = Paint()
                          pm.typeface = Typeface.DEFAULT_BOLD; pm.textSize = rankPx
                          val desc = pm.fontMetrics.descent
                          val rt = TextView(this@MainActivity).apply {
                              setTextColor(Color.parseColor("#8E8E99")); typeface = Typeface.DEFAULT_BOLD
                              gravity = Gravity.BOTTOM or Gravity.START
                              includeFontPadding = false
                              setPadding(0, 0, 0, 0)
                              setTextSize(TypedValue.COMPLEX_UNIT_PX, rankPx)
                              translationY = desc                                // baseline sits on the bottom edge of the poster
                          }
                          rank = rt
                          card.addView(rt, FrameLayout.LayoutParams(iw, ih, tl))
                      }
                      card.addView(iv, FrameLayout.LayoutParams(iw, ih, tl))
                      card.addView(tvl, FrameLayout.LayoutParams(iw, ih, tl))
                      card.addView(border, FrameLayout.LayoutParams(iw, ih, tl))
                      var t1: TextView? = null
                      var t2: TextView? = null
                      if (k == "square" || k == "landscape") {       // title + subtitle UNDER the tile
                          val a = TextView(this@MainActivity).apply {
                              setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                              maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                          }
                          tx(a, 14f)
                          val b = TextView(this@MainActivity).apply {
                              setTextColor(Color.parseColor("#B4B8C8"))
                              maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                          }
                          tx(b, 12f)
                          card.addView(a, FrameLayout.LayoutParams(iw, -2, tl).apply { topMargin = ih + u(8) })
                          card.addView(b, FrameLayout.LayoutParams(iw, -2, tl).apply { topMargin = ih + u(30) })
                          t1 = a; t2 = b
                      }
                      if (row.spotlight) {
                          val play = TextView(this@MainActivity).apply { text = "▶"; setTextColor(Color.WHITE) }
                          tx(play, 12f)
                          card.addView(play, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { setMargins(u(8), 0, 0, u(6)) })
                      }
                      return CardVH(card, iv, border, tvl, rank, t1, t2)
                  }

                  // sizes can differ between rows of the same kind (banner height, rank number width) => apply them on every bind,
                  // but only touch the layout params that really changed
                  private fun fit(h: CardVH, lw: Int) {
                      val fw = iw + lw
                      val rm = if (isCard) 0 else if (trending) u(RANK_GAP) else u(12)
                      val cl = h.card.layoutParams as RecyclerView.LayoutParams
                      if (cl.width != fw || cl.height != ch || cl.rightMargin != rm) {
                          cl.width = fw; cl.height = ch; cl.rightMargin = rm
                          h.card.layoutParams = cl
                      }
                      place(h.iv, iw, ih, lw, 0)
                      place(h.tv, iw, ih, lw, 0)
                      place(h.border, iw, ih, lw, 0)
                  }

                  override fun onBindViewHolder(h: CardVH, pos: Int) {
                      val item = row.items[pos]
                      var lw = 0
                      val rt = h.rank
                      if (rt != null) {
                          // number box = exact ink width of THIS number (single digit: tight to the poster, two digits: 1 and 0 pulled together),
                          // the number tucks a tiny bit under the poster so there is no gap, and the next number starts right after the poster
                          val s = (pos + 1).toString()
                          val ls = if (s.length > 1) RANK_TIGHT else 0f
                          rp.letterSpacing = ls
                          rp.getTextBounds(s, 0, s.length, rb)
                          val adv = rp.measureText(s)
                          lw = max(0, rb.width() - ovl)
                          rt.letterSpacing = ls
                          rt.text = s
                          rt.translationX = -rb.left.toFloat()
                          place(rt, adv.toInt() + u(6), ih, 0, 0)
                      }
                      fit(h, lw)
                      val url = rowImg(k, item)
                      cardReq(url, iw, ih).priority(Priority.HIGH).into(h.iv)
                      if (pos == 0) warm(0)
                      h.tv.text = item.title
                      h.tv.visibility = if (url == null) View.VISIBLE else View.GONE
                      val a = h.t1
                      val b = h.t2
                      if (a != null && b != null) {
                          val ept = item.epTitle
                          if (k == "landscape") {
                              a.text = if (ept.isNotBlank()) ept else item.title
                              b.text = if (ept.isNotBlank()) item.title else ""
                          } else {
                              a.text = item.title
                              b.text = item.subtitle
                          }
                          a.visibility = if (a.text.isNullOrBlank()) View.GONE else View.VISIBLE
                          b.visibility = if (b.text.isNullOrBlank()) View.GONE else View.VISIBLE
                      }
                      val sc = if (isCard) 1f else 1.1f               // edge banners are not zoomed (the border would be cut at the screen top)
                      h.card.animate().cancel()
                      h.card.scaleX = 1f; h.card.scaleY = 1f; h.border.alpha = 0f; h.card.translationZ = 0f
                      h.card.setOnFocusChangeListener { v, has ->
                          v.animate().scaleX(if (has) sc else 1f).scaleY(if (has) sc else 1f).setDuration(150).start()
                          h.border.animate().alpha(if (has) 1f else 0f).setDuration(150).start()
                          v.translationZ = if (has) u(10).toFloat() else 0f
                          if (has) { warm(pos); onCardFocus(item, row, pos, rowPos) }
                      }
                      // SHOW / MOVIE_BUNDLE -> detail page, VOD -> player, promo / card / square tile -> its cta (asset or landing page)
                      h.card.setOnClickListener { onItemClick(item, h.card) }
                  }
              }

              // vertical episode list: thumbnail left, title / "E16 • 08 Nov 2026 • 1h 14m" / description right.
              // The text block is EXACTLY as tall as the thumbnail and spread out (title top, info middle, description fills
              // the rest) => no empty space above / below the text.
              inner class EpAdapter : RecyclerView.Adapter<EpVH>() {
                  override fun getItemCount() = eps.size

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): EpVH {
                      val row = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          layoutParams = RecyclerView.LayoutParams(-1, epImgH + u(40))
                          setPadding(u(8), u(8), u(8), u(8))
                          clipChildren = false; clipToPadding = false
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      val thumb = FrameLayout(this@MainActivity).apply { clipChildren = false }
                      val iv = ImageView(this@MainActivity).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(26, 28, 42))
                          outlineProvider = roundOutline; clipToOutline = true
                      }
                      val badge = TextView(this@MainActivity).apply {
                          text = "LATEST"; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                          setPadding(u(8), u(3), u(8), u(3)); visibility = View.GONE
                          background = GradientDrawable().apply { cornerRadius = u(5).toFloat(); setColor(Color.argb(210, 90, 100, 190)) }
                      }
                      tx(badge, 12f)
                      val border = View(this@MainActivity).apply {
                          background = GradientDrawable().apply {
                              setColor(Color.TRANSPARENT); setStroke(u(3), Color.WHITE); cornerRadius = u(8).toFloat()
                          }
                          alpha = 0f
                      }
                      thumb.addView(iv, FrameLayout.LayoutParams(-1, -1))
                      thumb.addView(badge, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply { setMargins(0, u(8), u(8), 0) })
                      thumb.addView(border, FrameLayout.LayoutParams(-1, -1))

                      // text block = same height as the thumbnail card, content spread across it
                      val texts = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_VERTICAL
                          clipChildren = true
                      }
                      val t1 = TextView(this@MainActivity).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                      }
                      tx(t1, 26f)
                      val t2 = TextView(this@MainActivity).apply { setTextColor(Color.parseColor("#C8C8D0")) }
                      tx(t2, 18f)
                      val t3 = TextView(this@MainActivity).apply {
                          setTextColor(Color.parseColor("#E4E4EA")); maxLines = 4; ellipsize = TextUtils.TruncateAt.END
                      }
                      tx(t3, 19f)
                      texts.addView(t1, LinearLayout.LayoutParams(-1, -2))
                      texts.addView(t2, LinearLayout.LayoutParams(-1, -2).apply { topMargin = u(10) })
                      texts.addView(t3, LinearLayout.LayoutParams(-1, -2).apply { topMargin = u(12) })

                      row.addView(thumb, LinearLayout.LayoutParams(epImgW, epImgH))
                      row.addView(texts, LinearLayout.LayoutParams(0, epImgH, 1f).apply { leftMargin = u(22) })
                      return EpVH(row, thumb, iv, badge, border, t1, t2, t3)
                  }

                  override fun onBindViewHolder(h: EpVH, pos: Int) {
                      val ep = eps[pos]
                      cardReq(img(ep.thumb, W_EP), epImgW, epImgH).priority(Priority.HIGH).into(h.iv)
                      h.t1.text = ep.title
                      val bits = ArrayList<String>()
                      if (ep.num > 0) bits.add("E" + ep.num)
                      fmtDate(ep.air, true).takeIf { it.isNotEmpty() }?.let { bits.add(it) }
                      fmtDur(ep.dur).takeIf { it.isNotEmpty() }?.let { bits.add(it) }
                      h.t2.text = bits.joinToString(" • ")
                      h.t3.text = ep.desc
                      if (inPlayer && curPlayEp?.id == ep.id) { h.badge.text = "Now Playing"; h.badge.visibility = View.VISIBLE }
                      else if (pos == 0 && curSeason == 0) { h.badge.text = "LATEST"; h.badge.visibility = View.VISIBLE }
                      else h.badge.visibility = View.GONE
                      h.thumb.scaleX = 1f; h.thumb.scaleY = 1f; h.border.alpha = 0f
                      h.row.setOnFocusChangeListener { _, has ->
                          h.thumb.animate().scaleX(if (has) 1.05f else 1f).scaleY(if (has) 1.05f else 1f).setDuration(150).start()
                          h.border.animate().alpha(if (has) 1f else 0f).setDuration(150).start()
                          if (has) {
                              // look-ahead: decode the next episode thumbnails into memory, download further ones
                              for (k in 1..6) eps.getOrNull(pos + k)?.let {
                                  cardReq(img(it.thumb, W_EP), epImgW, epImgH).priority(Priority.LOW).preload()
                              }
                              for (k in 7..14) eps.getOrNull(pos + k)?.let { Prefetch.add(img(it.thumb, W_EP)) }
                              if (pos >= eps.size - 8) loadEpisodes()      // load next 30 early
                          }
                      }
                      // click an episode => player (from the detail page) or switch episode (inside the player)
                      h.row.setOnClickListener { playEpisode(ep) }
                  }
              }
          }

