              private var saveTick = 0

              // ---- seek preview (sprite sheet, Netflix style)
              private var scrubPos = -1L               // >= 0 while the user is scrubbing (seek is applied after a short pause / OK)
              private val spriteLock = Any()
              private val spriteExec = Executors.newSingleThreadExecutor()
              private var spriteDec: BitmapRegionDecoder? = null
              private var spriteTW = 0; private var spriteTH = 0; private var spriteCnt = 0; private var spriteCols = 1
              private var spriteTok = 0
              @Volatile private var spriteWant = -1
              private var currentTileIdx = -1
              private val spriteCache = object : LinkedHashMap<Int, Bitmap>(32, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<Int, Bitmap>?): Boolean = size > 40
              }
              private val commitRun = Runnable { commitScrub() }

              private val hideRun = Runnable {
                  if (inPlayer && panel == 0 && mainPlayer?.playWhenReady == true) hideControls()
              }
              private val tickRun = object : Runnable {
                  override fun run() {
                      updateProgress()
                      saveTick++
                      if (saveTick % 10 == 0) saveProgress()          // every ~5s
                      if (inPlayer) ui.postDelayed(this, 500)
                  }
              }

              private fun isHomeTab() = homeTabs.containsKey(tab)
              private fun dkey(cid: String, movie: Boolean) = (if (movie) "m" else "s") + cid

              // identical options for preload + real load => disk/memory cache hit, downsampled decode
              private fun cardReq(url: String?, w: Int, h: Int) = Glide.with(this).load(url).override(w, h).centerCrop()
                  .format(DecodeFormat.PREFER_RGB_565).diskCacheStrategy(DiskCacheStrategy.ALL)
              private fun bgReq(url: String?) = Glide.with(this).load(url).override(bgW, bgH).centerCrop()
                  .diskCacheStrategy(DiskCacheStrategy.ALL)
              private fun bgBigReq(url: String?) = Glide.with(this).load(url)
                  .override(min(W, 1200), min(W, 1200) * 9 / 16).centerCrop()
                  .diskCacheStrategy(DiskCacheStrategy.ALL)
              // title images: forced ARGB_8888 (keeps transparency), transparent border trimmed first, then fitted
              // => the artwork itself touches the left text edge, no empty frame around it
              private fun logoReq(url: String?, w: Int, h: Int) = Glide.with(this).load(url).override(w, h)
                  .format(DecodeFormat.PREFER_ARGB_8888)
                  .transform(TrimTransform(), FitCenter())
                  .diskCacheStrategy(DiskCacheStrategy.ALL)
              private val roundOutline = object : ViewOutlineProvider() {
                  override fun getOutline(view: View, outline: Outline) {
                      outline.setRoundRect(0, 0, view.width, view.height, u(8).toFloat())
                  }
              }

              private fun doneListener(cb: () -> Unit) = object : RequestListener<Drawable> {
                  override fun onLoadFailed(e: GlideException?, model: Any?, target: Target<Drawable>, isFirstResource: Boolean): Boolean {
                      cb(); return false
                  }
                  override fun onResourceReady(resource: Drawable, model: Any, target: Target<Drawable>, dataSource: DataSource, isFirstResource: Boolean): Boolean {
                      cb(); return false
                  }
              }

              private fun lp(w: Int, h: Int, g: Int = Gravity.NO_GRAVITY) = FrameLayout.LayoutParams(w, h, g)

              // changes size / margins of a FrameLayout child only when they really differ (no needless relayout while scrolling)
              private fun place(v: View, w: Int, h: Int, left: Int, top: Int) {
                  val p = v.layoutParams as FrameLayout.LayoutParams
                  if (p.width != w || p.height != h || p.leftMargin != left || p.topMargin != top) {
                      p.width = w; p.height = h; p.leftMargin = left; p.topMargin = top
                      v.layoutParams = p
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val dm = resources.displayMetrics
                  W = max(dm.widthPixels, dm.heightPixels)
                  H = min(dm.widthPixels, dm.heightPixels)
                  cardH = (H * 0.27f * 1.3f).toInt(); cardW = cardH * 2 / 3          // portrait cards 1.3x
                  stripH = (H * 0.155f).toInt(); stripW = stripH * 16 / 9
                  sqS = (cardH * 0.72f).toInt()                                       // square tiles (title + subtitle under them)
                  lsH = (cardH * 0.62f).toInt(); lsW = lsH * 16 / 9                   // landscape tiles
                  rankW = (cardW * 0.62f).toInt()                                     // room for the big rank number (trending)
                  bannerW = W; bannerH = min(cardH, (bannerW / 5.4f).toInt())
                  padV = (H * 0.024f).toInt(); titleH = (H * 0.06f).toInt()
                  rowH = titleH + cardH + 2 * padV
                  rvH = rowH                                                          // exactly ONE row visible, no next-row title peek
                  logoH = (H * 0.27f).toInt(); logoW = logoH * 16 / 9
                  // listing page logo: title png on top, details right above the rows => limit the logo so everything fits
                  val maxLogo = H - rvH - (H * 0.008f).toInt() - (H * 0.035f).toInt() - (H * 0.2f).toInt()
                  homeLogoH = min((logoH * HOME_LOGO_SCALE).toInt(), max(maxLogo, (H * 0.15f).toInt())); homeLogoW = homeLogoH * 16 / 9
                  detLogoH = (logoH * DETAIL_LOGO_SCALE).toInt(); detLogoW = detLogoH * 16 / 9    // detail page logo
                  bgW = min(W, 1200); bgH = bgW * 9 / 16
                  homeBoxW = (W * 0.67f * 1.25f).toInt(); homeBoxH = (H * 0.725f * 1.25f).toInt()
                  detBoxW = (W * 0.67f * 1.5f).toInt(); detBoxH = (H * 0.725f * 1.5f).toInt()
                  curBoxW = homeBoxW; curBoxH = homeBoxH
                  epImgW = (W * 0.24f).toInt(); epImgH = epImgW * 9 / 16             // bigger episode cards
                  seasonColW = (W * 0.2f).toInt()
                  drawerW = (W * 0.36f).toInt()
                  homeTabs[1] = TabData(1, HOME_URL)
                  homeTabs[2] = TabData(2, "")                  // My List: rows come from the saved list, no api
                  homeTabs[3] = TabData(3, ORIGINALS_URL)
                  homeTabs[4] = TabData(4, SHOWS_URL)
                  homeTabs[5] = TabData(5, SPORTS_URL)
                  homeTabs[6] = TabData(6, MOVIES_URL)
                  buildUi()
                  setContentView(root)
                  hideBars()
                  selectTab(1)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              @Suppress("DEPRECATION")
              private fun hideBars() {
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
              }

              // ---------------------------------------------------------------- UI
              // Listing skeleton: title logo block + meta + description lines on the left, a row title + a row of cards at the bottom
              private fun buildHomeSkel(): FrameLayout {
                  val f = FrameLayout(this).apply { visibility = View.GONE }
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(sk(10), LinearLayout.LayoutParams((homeLogoW * 0.55f).toInt(), (homeLogoH * 0.5f).toInt()))
                  col.addView(sk(6), LinearLayout.LayoutParams(u(280), u(16)).apply { topMargin = u(18) })
                  col.addView(sk(6), LinearLayout.LayoutParams(u(520), u(14)).apply { topMargin = u(16) })
                  col.addView(sk(6), LinearLayout.LayoutParams(u(470), u(14)).apply { topMargin = u(10) })
                  col.addView(sk(6), LinearLayout.LayoutParams(u(380), u(14)).apply { topMargin = u(10) })
                  f.addView(col, lp(-2, -2, Gravity.BOTTOM or Gravity.START).apply { leftMargin = u(CONTENT_LEFT); bottomMargin = rvH + (H * 0.008f).toInt() + u(10) })

                  val rowBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.BOTTOM }
                  val tl = FrameLayout(this)
                  tl.addView(sk(6), lp(u(220), u(20), Gravity.CENTER_VERTICAL).apply { leftMargin = u(46) })
                  rowBox.addView(tl, LinearLayout.LayoutParams(-1, titleH))
                  val cards = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(u(46), padV, 0, padV) }
                  for (i in 0 until 9) cards.addView(sk(8), LinearLayout.LayoutParams(cardW, cardH).apply { rightMargin = u(12) })
                  rowBox.addView(cards, LinearLayout.LayoutParams(-1, cardH + 2 * padV))
                  f.addView(rowBox, lp(-1, rvH, Gravity.BOTTOM).apply { leftMargin = u(80); bottomMargin = (H * 0.008f).toInt() })
                  return f
              }

              private fun buildUi() {
                  val dark = Color.argb(255, 5, 6, 12)
                  root = FrameLayout(this).apply { setBackgroundColor(dark) }
                  content = FrameLayout(this)
                  root.addView(content, lp(-1, -1))

                  bg = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  content.addView(bg, lp(-1, -1))

                  // trailer: 1.25x, stuck to the top-right edge
                  videoBox = FrameLayout(this).apply { alpha = 0f; visibility = View.GONE }
                  videoView = TextureView(this)
                  videoBox.addView(videoView, lp(homeBoxW, homeBoxH, Gravity.CENTER))
                  content.addView(videoBox, lp(homeBoxW, homeBoxH, Gravity.TOP or Gravity.END))
                  curBox = videoBox; curVideo = videoView; curBg = bg

                  val left = View(this).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(dark, Color.argb(235, 5, 6, 12), Color.argb(0, 5, 6, 12)))
                  }
                  content.addView(left, lp((W * 0.62).toInt(), -1))
                  val bottom = View(this).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.BOTTOM_TOP,
                          intArrayOf(dark, Color.argb(240, 5, 6, 12), Color.argb(0, 5, 6, 12)))
                  }
                  content.addView(bottom, lp(-1, (H * 0.62).toInt(), Gravity.BOTTOM))

                  info = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  // logo view HUGS the trimmed artwork (wrap_content): its left edge is exactly the left edge of the text under it
                  logo = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_START
                      adjustViewBounds = true
                      maxWidth = homeLogoW
                      maxHeight = homeLogoH
                  }
                  titleTv = TextView(this).apply {
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; maxLines = 2; visibility = View.GONE
                  }
                  tx(titleTv, 40f)
                  metaTv = TextView(this).apply { setTextColor(Color.parseColor("#E8E8E8")); typeface = Typeface.DEFAULT_BOLD }
                  tx(metaTv, 16f)
                  descTv = TextView(this).apply {
                      setTextColor(Color.parseColor("#DADAE2")); maxLines = 3; ellipsize = TextUtils.TruncateAt.END
                  }
                  tx(descTv, 17f)
                  info.addView(logo, LinearLayout.LayoutParams(-2, -2).apply { leftMargin = u(LOGO_SHIFT_X) })
                  info.addView(titleTv, LinearLayout.LayoutParams(-2, -2))
                  info.addView(metaTv, LinearLayout.LayoutParams(-2, -2).apply { topMargin = u(8) })
                  info.addView(descTv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = u(8) })
                  content.addView(info, lp(max((W * 0.42).toInt(), homeLogoW + u(LOGO_SHIFT_X) + u(20)), -2, Gravity.BOTTOM or Gravity.START).apply {
                      leftMargin = u(CONTENT_LEFT); bottomMargin = rvH + (H * 0.008f).toInt() + u(10)      // details sit right above the rows, title png above them
                  })

                  // vertical rows: we drive scrolling ourselves (smooth, fixed duration), so block the default jump-scroll.
                  // The list spans the FULL screen width; every row (cards AND banners) starts at the CONTENT_LEFT line via its own left padding.
                  // Normal mode: one row high, glued to the bottom. Card mode: full screen high (see setCardMode).
                  rowRv = object : RecyclerView(this@MainActivity) {
                      override fun requestChildRectangleOnScreen(child: View, rect: Rect, immediate: Boolean): Boolean = false
                  }.apply {
                      layoutManager = LinearLayoutManager(this@MainActivity)
                      clipChildren = false; clipToPadding = false
                      itemAnimator = null
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isFocusable = false; isFocusableInTouchMode = false
                      isNestedScrollingEnabled = false
                      setHasFixedSize(false)
                      setItemViewCacheSize(8)
                      for (t in kindTypes.indices) recycledViewPool.setMaxRecycledViews(t, 4)
                      setPadding(0, 0, 0, rvH - rowH)
                  }
                  rowAdapter = RowAdapter()
                  rowRv.adapter = rowAdapter
                  content.addView(rowRv, lp(-1, rvH, Gravity.BOTTOM).apply { leftMargin = 0; bottomMargin = (H * 0.008f).toInt() })

                  // page skeleton (shown while the page api is loading)
                  skelHome = buildHomeSkel()
                  content.addView(skelHome, lp(-1, -1))

                  buildDetail()
                  buildPlayer()

                  // status / error text (loading itself is shown as skeleton)
                  status = TextView(this).apply {
                      setTextColor(Color.WHITE); gravity = Gravity.CENTER; text = ""; visibility = View.GONE
                  }
                  tx(status, 18f)
                  root.addView(status, lp(-1, -2, Gravity.CENTER))

                  // sidebar: icons only; when a tab gets focus the bar expands and shows the names, focused tab = white pill
                  side = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(u(10), 0, u(10), 0)
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.argb(230, 0, 0, 0), Color.argb(0, 0, 0, 0)))
                  }
                  val icons = intArrayOf(R.drawable.ic_search, R.drawable.ic_home, R.drawable.ic_add,
                      R.drawable.ic_check, R.drawable.ic_tv, R.drawable.ic_sports, R.drawable.ic_movie)
                  for (i in icons.indices) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                          setPadding(u(12), u(8), u(12), u(8))
                          contentDescription = tabNames[i]
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      val iv = ImageView(this).apply { setImageResource(icons[i]) }
                      val tv = TextView(this).apply {
                          text = tabNames[i]; typeface = Typeface.DEFAULT_BOLD; maxLines = 1; visibility = View.GONE
                          setTextColor(Color.WHITE)
                      }
                      tx(tv, 17f)
                      row.addView(iv, LinearLayout.LayoutParams(u(22), u(22)))
                      row.addView(tv, LinearLayout.LayoutParams(-2, -2).apply { leftMargin = u(16) })
                      row.setOnFocusChangeListener { _, _ -> styleTab(i); ui.post { updateSide() } }
                      row.setOnClickListener { selectTab(i) }
                      tabViews.add(row); tabIcons.add(iv); tabLabels.add(tv)
                      side.addView(row, LinearLayout.LayoutParams(-1, u(42)).apply { topMargin = u(12) })
                  }
                  root.addView(side, lp(u(76), -1))

                  brand = TextView(this).apply {
                      text = "liv"; setTextColor(Color.parseColor("#FFC107")); typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC)
                  }
                  tx(brand, 26f)
                  root.addView(brand, lp(-2, -2).apply { leftMargin = u(16); topMargin = u(14) })

                  buildRemote()
              }

              // expands the sidebar (names visible) while one of its tabs has focus, collapses it to icons otherwise
              private fun updateSide() {
                  val open = tabViews.any { it.isFocused }
                  if (open == sideOpen) return
                  sideOpen = open
                  val l = side.layoutParams
                  l.width = if (open) u(250) else u(76)
                  side.layoutParams = l
                  side.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      if (open) intArrayOf(Color.argb(250, 0, 0, 0), Color.argb(235, 0, 0, 0), Color.argb(0, 0, 0, 0))
                      else intArrayOf(Color.argb(230, 0, 0, 0), Color.argb(0, 0, 0, 0)))
                  for (k in tabViews.indices) {
                      tabLabels[k].visibility = if (open) View.VISIBLE else View.GONE
                      tabViews[k].gravity = if (open) (Gravity.CENTER_VERTICAL or Gravity.START) else Gravity.CENTER
                      styleTab(k)
                  }
              }

              // pill button used on the detail page
              private fun heroBtn(label: String, onClick: () -> Unit): TextView {
                  val t = TextView(this).apply {
                      text = label; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      setPadding(u(34), u(13), u(34), u(13))
                      maxLines = 1
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  tx(t, 17f)
                  fun st() {
                      val f = t.isFocused
                      t.setTextColor(if (f) Color.BLACK else Color.WHITE)
                      t.background = GradientDrawable().apply {
                          cornerRadius = u(10).toFloat()
                          setColor(if (f) Color.WHITE else Color.argb(110, 120, 124, 140))
                      }
                  }
                  st()
                  t.setOnFocusChangeListener { _, _ -> st() }
                  t.setOnClickListener { lastBtn = t; onClick() }
                  return t
              }

              // compact detail button: only the icon while not focused, icon + name (white pill) when focused. child 0 = icon, child 1 = name
              private fun heroIconBtn(icon: Int, label: String, onClick: () -> Unit): LinearLayout {
                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                      setPadding(u(16), u(13), u(16), u(13))
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  val iv = ImageView(this).apply { setImageResource(icon) }
                  val tv = TextView(this).apply {
                      text = label; typeface = Typeface.DEFAULT_BOLD; maxLines = 1; visibility = View.GONE
                  }
                  tx(tv, 17f)
                  ll.addView(iv, LinearLayout.LayoutParams(u(24), u(24)))
                  ll.addView(tv, LinearLayout.LayoutParams(-2, -2).apply { leftMargin = u(10) })
                  fun st() {
                      val f = ll.isFocused
                      tv.visibility = if (f) View.VISIBLE else View.GONE
                      tv.setTextColor(if (f) Color.BLACK else Color.WHITE)
                      iv.setColorFilter(if (f) Color.BLACK else Color.WHITE)
                      ll.background = GradientDrawable().apply {
                          cornerRadius = u(10).toFloat()
                          setColor(if (f) Color.WHITE else Color.argb(110, 120, 124, 140))
                      }
                  }
                  st()
                  ll.setOnFocusChangeListener { _, _ -> st() }
                  ll.setOnClickListener { lastBtn = ll; onClick() }
                  return ll
              }

