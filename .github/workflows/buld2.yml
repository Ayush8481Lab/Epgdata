              override fun onResume() {
                  super.onResume()
                  updateResume(); updateList()
              }

              private fun loadBg(url: String?) {
                  if (url == null) return
                  Glide.with(this).load(url).override(resources.displayMetrics.widthPixels, resources.displayMetrics.widthPixels * 10 / 16).centerCrop()
                      .diskCacheStrategy(DiskCacheStrategy.ALL).into(bgIv)
              }

              private fun setLogo(url: String?, title: String) {
                  if (url != null) {
                      logoIv.visibility = View.VISIBLE; titleTv.visibility = View.GONE
                      Glide.with(this).load(url).override(dpx(420), dpx(170)).format(DecodeFormat.PREFER_ARGB_8888)
                          .transform(TrimTransform(), FitCenter()).into(logoIv)
                  } else {
                      logoIv.setImageDrawable(null); logoIv.visibility = View.GONE
                      titleTv.text = title; titleTv.visibility = View.VISIBLE
                  }
              }

              private fun load() {
                  err.visibility = View.GONE
                  skel.visibility = View.VISIBLE
                  val t = ++tok
                  Thread {
                      val j = Api.get(DETAIL_URL + item.cid + (if (movie) MOVIE_DETAIL_Q else ""))
                      runOnUiThread { if (t == tok && !isFinishing) bind(j) }
                  }.start()
              }

              private fun bind(j: JSONObject?) {
                  skel.visibility = View.GONE
                  val show = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                  if (show == null) { mShowError(err, mOffline(this)); return }
                  val m = show.optJSONObject("metadata") ?: JSONObject()
                  val e = m.optJSONObject("emfAttributes") ?: JSONObject()
                  val title = m.str("title") ?: item.title
                  showTitle = title
                  val desc = m.str("shortDescription") ?: m.str("longDescription") ?: item.desc
                  val movieChild = if (movie) childBySubtype(show, "MOVIE") else null
                  val trailerChild = if (movie) childBySubtype(show, "MOVIE_TRAILER") else null
                  val mm = movieChild?.optJSONObject("metadata")
                  val me = mm?.optJSONObject("emfAttributes")

                  val parts = ArrayList<String>()
                  (m.str("languageLabel") ?: e.str("region_of_origin"))?.let { parts.add(it) }
                  m.str("year")?.let { parts.add(it) }
                  m.str("pcVodLabel")?.let { parts.add(it) }
                  if (movie) {
                      val d = fmtDur(mm?.optInt("duration") ?: 0)
                      if (d.isNotEmpty()) parts.add(d)
                  } else {
                      val sn = m.optInt("seasonCount")
                      if (sn > 1) parts.add("$sn Seasons")
                      val ec = m.optInt("episodeCount")
                      if (ec > 0) parts.add("$ec Episodes")
                  }
                  m.optJSONArray("genres")?.let { g ->
                      val l = (0 until g.length()).map { k -> g.optString(k) }.filter { s -> s.isNotBlank() }
                      if (l.isNotEmpty()) parts.add(l.joinToString(", "))
                  }
                  metaTv.text = parts.joinToString(" • ")
                  descTv.text = desc
                  val tag = e.str("highlight_text") ?: (if (movie) m.optJSONObject("badges")?.str("primary_tag") else null)
                  if (tag != null) { tagTv.text = tag; tagTv.visibility = View.VISIBLE } else tagTv.visibility = View.GONE

                  detailItem = item.copy(
                      title = title, desc = desc, meta = parts.joinToString(" • "),
                      bg = rawBgOf(show) ?: item.bg, logo = detLogoUrl(show) ?: item.logo,
                      portrait = e.str("portrait_thumb") ?: item.portrait, landscape = e.str("thumbnail") ?: item.landscape)

                  val logoUrl = detLogoUrl(show) ?: item.logo
                  val bgUrl = detBgUrl(show) ?: img(item.bg ?: item.landscape, W_BG)
                  if (logoUrl != shownLogo || (logoUrl == null && shownLogo == null)) { shownLogo = logoUrl; setLogo(logoUrl, title) }
                  if (bgUrl != null && bgUrl != shownBg) { shownBg = bgUrl; loadBg(bgUrl) }

                  val tUrl = trailerUrlAny(show)
                  if (tUrl != null) {
                      val tm = trailerChild?.optJSONObject("metadata")
                      val tid = trailerIdFrom(show) ?: (tm?.optString("contentId") ?: "")
                      trailerUrl = tUrl
                      trailerEp = Ep(tid, "Trailer", 0, desc, e.str("thumbnail") ?: item.landscape, tm?.optInt("duration") ?: 0, 0L)
                      trailerBtn.visibility = View.VISIBLE
                  } else { trailerUrl = null; trailerEp = null; trailerBtn.visibility = View.GONE }

                  if (movie) {
                      val mid = mm?.optString("contentId").orEmpty()
                      movieEp = if (movieChild != null && mid.isNotBlank())
                          Ep(mid, "", 0, desc, me?.str("thumbnail") ?: e.str("thumbnail") ?: item.landscape, mm?.optInt("duration") ?: 0, mm?.optLong("originalAirDate") ?: 0L)
                      else null
                      watchBtn.text = "▶  Watch Movie"
                      setExtra(movieExtraRows(e, me))
                  } else {
                      val data = parseSeasons(show)
                      seasons.clear(); seasons.addAll(data.seasons)
                      data.latest?.let { setWatchLabel(it) }
                  }
                  updateResume(); updateList()
                  if (!movie && seasons.isNotEmpty()) {
                      epHead.visibility = View.VISIBLE
                      buildSeasonChips()
                      selectSeason(0)
                  }
              }

              private fun setWatchLabel(ep: Ep) {
                  latestEp = ep
                  watchBtn.text = "▶  Watch Latest Episode" + (if (ep.num > 0) "  •  E${ep.num}" else "")
              }

              private fun setExtra(list: List<Pair<String, String>>) {
                  extra.removeAllViews()
                  for ((k, v) in list) {
                      if (v.isBlank()) continue
                      val sb = SpannableStringBuilder()
                      sb.append(k).append("   ")
                      sb.setSpan(ForegroundColorSpan(Color.parseColor("#9AA0B4")), 0, k.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.setSpan(StyleSpan(Typeface.BOLD), 0, k.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.append(v)
                      val t = TextView(this).apply { setTextColor(Color.parseColor("#E4E4EA")); textSize = 13f; text = sb }
                      extra.addView(t, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(6) })
                  }
              }

              private fun movieExtraRows(e: JSONObject, me: JSONObject?): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val al = e.optJSONArray("audio_language_list") ?: me?.optJSONArray("audio_language_list")
                  val audio = LinkedHashSet<String>()
                  if (al != null) for (k in 0 until al.length()) al.optJSONObject(k)?.str("lang_label")?.let { audio.add(it) }
                  out.add("Audio" to audio.joinToString(", "))
                  val sl = e.optJSONArray("subtitle_language_list") ?: me?.optJSONArray("subtitle_language_list")
                  val subs = LinkedHashSet<String>()
                  if (sl != null) for (k in 0 until sl.length()) {
                      val o = sl.optJSONObject(k) ?: continue
                      val n = o.str("subtitleDisplayName") ?: o.str("subtitleLanguageName") ?: continue
                      subs.add(if (o.optString("subtitleType").equals("CC", true)) "$n (CC)" else n)
                  }
                  out.add("Subtitles" to subs.joinToString(", "))
                  val crew = e.str("cast_and_crew") ?: me?.str("cast_and_crew") ?: ""
                  var cast = ""; var dir = ""
                  for (seg in crew.split("|")) {
                      val key = seg.substringBefore(":").trim().lowercase()
                      val value = seg.substringAfter(":", "").trim()
                      if (key == "cast") cast = value.split(",").map { s -> s.trim() }.filter { s -> s.isNotEmpty() }.take(8).joinToString(", ")
                      else if (key == "director") dir = value
                  }
                  out.add("Cast" to cast)
                  out.add("Director" to dir)
                  e.str("snp_tags")?.let { t -> out.add("Advisory" to t.split(",").map { s -> s.trim() }.filter { s -> s.isNotEmpty() }.joinToString(", ")) }
                  val q = LinkedHashSet<String>()
                  for (src in listOf(me, e)) {
                      if (src == null) continue
                      for (k in listOf("Maximum_Resolution", "Maximum_Video_Quality", "Maximum_Audio_Quality")) src.str(k)?.let { q.add(qLabel(it)) }
                  }
                  out.add("Quality" to q.joinToString("  •  "))
                  return out
              }

              // ---------------- buttons
              private fun onWatch() {
                  if (movie) {
                      val mv = movieEp
                      if (mv != null) playEp(mv, 0, true, 0L, "") else mToast(this, "Movie not available yet")
                  } else {
                      val ep = latestEp
                      if (ep != null) playEp(ep, seasons.firstOrNull()?.num ?: 0, false, 0L, seasons.firstOrNull()?.id ?: "")
                  }
              }

              private fun playEp(ep: Ep, seasonNum: Int, noEps: Boolean, start: Long, seasonId: String) {
                  val d = detailItem ?: item
                  val i = Intent(this, MobilePlayerActivity::class.java)
                  i.putExtra("cid", ep.id); i.putExtra("ep_title", ep.title); i.putExtra("show_title", showTitle)
                  i.putExtra("ep_num", ep.num); i.putExtra("season", seasonNum); i.putExtra("thumb", ep.thumb ?: ""); i.putExtra("dur", ep.dur)
                  i.putExtra("show_cid", d.cid); i.putExtra("show_sub", d.sub); i.putExtra("track", true)
                  i.putExtra("start", start); i.putExtra("season_id", seasonId); i.putExtra("noeps", noEps)
                  startActivity(i)
              }

              private fun playTrailer() {
                  val u = trailerUrl ?: return
                  val te = trailerEp
                  val i = Intent(this, MobilePlayerActivity::class.java)
                  i.putExtra("cid", te?.id ?: ""); i.putExtra("ep_title", "Trailer"); i.putExtra("show_title", showTitle)
                  i.putExtra("thumb", te?.thumb ?: ""); i.putExtra("direct", u); i.putExtra("noeps", true)
                  startActivity(i)
              }

              private fun toggleList() {
                  val d = detailItem ?: item
                  val now = Store.toggle(d)
                  updateList()
                  mToast(this, if (now) "Added to My List" else "Removed from My List")
              }

              private fun updateList() {
                  val on = Store.inList(item.cid)
                  listBtn.text = if (on) "✓  In My List" else "+  My List"
              }

              private fun updateResume() {
                  val r = Store.getResume(item.cid)
                  if (r == null || r.dur <= 0) { resumeBox.visibility = View.GONE; return }
                  val durMs = r.dur * 1000L
                  val pre = if (movie) "Resume Movie" else ("Resume " + (if (r.season > 0) "S${r.season} " else "") + (if (r.num > 0) "E${r.num}" else "")).trim()
                  resumeBtn.text = "▶  $pre"
                  resumeBar.frac = (r.pos.toFloat() / durMs).coerceIn(0f, 1f)
                  resumeBar.invalidate()
                  resumeTime.text = fmtMinLeft(r.pos, durMs)
                  resumeBox.visibility = View.VISIBLE
              }

              private fun resumeNow() {
                  val r = Store.getResume(item.cid) ?: return
                  val ep = Ep(r.epId, r.title, r.num, "", r.thumb, r.dur, 0L)
                  val sid = seasons.firstOrNull { s -> s.num == r.season }?.id ?: seasons.firstOrNull()?.id ?: ""
                  playEp(ep, r.season, movie, r.pos, sid)
              }

              // ---------------- seasons + episodes
              private fun buildSeasonChips() {
                  chips.clear(); seasonRow.removeAllViews()
                  if (seasons.size <= 1) { seasonScroll.visibility = View.GONE; return }
                  seasonScroll.visibility = View.VISIBLE
                  for (i in seasons.indices) {
                      val c = TextView(this).apply {
                          text = seasons[i].title; typeface = Typeface.DEFAULT_BOLD; textSize = 14f
                          setPadding(dpx(16), dpx(8), dpx(16), dpx(8)); isClickable = true
                          setOnClickListener { selectSeason(i) }
                      }
                      chips.add(c)
                      seasonRow.addView(c, LinearLayout.LayoutParams(-2, -2).apply { rightMargin = dpx(8) })
                  }
              }

              private fun styleChips() {
                  for (i in chips.indices) {
                      val sel = i == curSeason
                      chips[i].setTextColor(if (sel) Color.BLACK else Color.WHITE)
                      chips[i].background = mBg(if (sel) Color.WHITE else Color.argb(255, 38, 42, 60), dpx(18))
                  }
              }

              private fun selectSeason(i: Int) {
                  if (i !in seasons.indices) return
                  curSeason = i
                  epToken++
                  epFrom = 0; epHasMore = true; epLoading = false
                  epCol.removeAllViews()
                  moreBtn.visibility = View.GONE
                  styleChips()
                  loadEpisodes()
              }

              private fun loadEpisodes() {
                  if (epLoading || !epHasMore || curSeason !in seasons.indices) return
                  epLoading = true
                  val t = epToken
                  val s = seasons[curSeason]
                  val from = epFrom
                  val url = EP_URL + s.id + "?from=" + from + "&to=" + (from + EP_PAGE - 1) + "&orderBy=episodeNumber&sortOrder=desc&kids_safe=false"
                  if (from == 0) epSkel.visibility = View.VISIBLE
                  moreBtn.visibility = View.GONE
                  Thread {
                      val j = Api.get(url)
                      val arr = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.optJSONArray("containers")
                      val list = ArrayList<Ep>()
                      if (arr != null) for (k in 0 until arr.length()) parseEp(arr.optJSONObject(k))?.let { list.add(it) }
                      runOnUiThread {
                          if (t != epToken || isFinishing) return@runOnUiThread
                          epLoading = false
                          epSkel.visibility = View.GONE
                          if (j == null) {
                              if (epCol.childCount == 0) epCol.addView(TextView(this).apply { text = "Could not load episodes. Tap to retry."; setTextColor(Color.WHITE); setPadding(0, dpx(12), 0, dpx(12)); setOnClickListener { epCol.removeAllViews(); loadEpisodes() } })
                              return@runOnUiThread
                          }
                          epFrom = from + EP_PAGE
                          if (list.size < EP_PAGE || (s.count > 0 && epFrom >= s.count)) epHasMore = false
                          if (from == 0 && curSeason == 0 && list.isNotEmpty()) setWatchLabel(list[0])
                          for (ep in list) addEpRow(ep)
                          if (epCol.childCount == 0) epCol.addView(TextView(this).apply { text = "No episodes"; setTextColor(Color.WHITE); setPadding(0, dpx(12), 0, dpx(12)) })
                          moreBtn.visibility = if (epHasMore) View.VISIBLE else View.GONE
                      }
                  }.start()
              }

              private fun addEpRow(ep: Ep) {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(0, dpx(8), 0, dpx(8)); isClickable = true
                      setOnClickListener {
                          val sid = seasons.getOrNull(curSeason)?.id ?: ""
                          playEp(ep, seasons.getOrNull(curSeason)?.num ?: 0, false, 0L, sid)
                      }
                  }
                  val top = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val tw = dpx(140)
                  val th = tw * 9 / 16
                  val iv = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP; setBackgroundColor(M_CARD); mRound(this, dpx(8)) }
                  Glide.with(iv).load(img(ep.thumb, W_EP)).override(tw, th).centerCrop().diskCacheStrategy(DiskCacheStrategy.ALL).into(iv)
                  top.addView(iv, LinearLayout.LayoutParams(tw, th))
                  val tc = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  tc.addView(TextView(this).apply {
                      text = (if (ep.num > 0) "${ep.num}. " else "") + ep.title
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; textSize = 15f; maxLines = 2; ellipsize = TextUtils.TruncateAt.END
                  })
                  val bits = ArrayList<String>()
                  if (ep.num > 0) bits.add("E" + ep.num)
                  fmtDate(ep.air, true).takeIf { s -> s.isNotEmpty() }?.let { bits.add(it) }
                  fmtDur(ep.dur).takeIf { s -> s.isNotEmpty() }?.let { bits.add(it) }
                  tc.addView(TextView(this).apply { text = bits.joinToString(" • "); setTextColor(Color.parseColor("#B4B8C8")); textSize = 12f }, LinearLayout.LayoutParams(-2, -2).apply { topMargin = dpx(4) })
                  top.addView(tc, LinearLayout.LayoutParams(0, -2, 1f).apply { leftMargin = dpx(12) })
                  row.addView(top, LinearLayout.LayoutParams(-1, -2))
                  if (ep.desc.isNotBlank()) {
                      row.addView(TextView(this).apply {
                          text = ep.desc; setTextColor(Color.parseColor("#C8C8D0")); textSize = 12f; maxLines = 2; ellipsize = TextUtils.TruncateAt.END
                      }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dpx(6) })
                  }
                  epCol.addView(row, LinearLayout.LayoutParams(-1, -2))
              }
          }

