              // IST date vs GMT date: between 00:00 and 05:30 IST the api day (GMT) is still yesterday => today = offset 1
              private fun liveBaseOffset(): Int {
                  val c = java.util.Calendar.getInstance(java.util.TimeZone.getTimeZone("Asia/Kolkata"))
                  val mins = c.get(java.util.Calendar.HOUR_OF_DAY) * 60 + c.get(java.util.Calendar.MINUTE)
                  return if (mins < 330) 1 else 0
              }

              // date column of the catchup panel: Today, Yesterday, 10 Nov ... (offset down to -7)
              private fun liveDays(): List<Season> {
                  val out = ArrayList<Season>()
                  val base = liveBaseOffset()
                  val f = SimpleDateFormat("dd MMM", Locale.ENGLISH).apply { timeZone = java.util.TimeZone.getTimeZone("Asia/Kolkata") }
                  for (d in 0..7) {
                      val off = base - d
                      if (off < -7) break
                      val label = when (d) { 0 -> "Today"; 1 -> "Yesterday"; else -> f.format(Date(System.currentTimeMillis() - d * 86400000L)) }
                      out.add(Season(off.toString(), label, 0, 0, 0L))
                  }
                  return out
              }

              // live: base_url?hdnea=...   catchup: master-archive.m3u8?startTime=..&endTime=..&hdnea=...
              private fun liveStream(): StreamInfo? {
                  val ch = liveCh ?: return null
                  val tk = LiveAuth.token() ?: return null
                  val url = if (liveStartS > 0L)
                      ch.base.replace("master.m3u8", "master-archive.m3u8") + "?startTime=" + liveStartS + "&endTime=" + liveEndS + "&" + tk
                  else ch.base + "?" + tk
                  return StreamInfo(url, false, "", "", emptyList())
              }

              private fun playLive(c: Chan, card: View) {
                  liveLastCard = card
                  liveCh = c; liveStartS = 0L; liveEndS = 0L
                  liveMode = true
                  showTitle = "Live"
                  seasons.clear(); eps.clear(); epAdapter.notifyDataSetChanged()
                  seasons.addAll(liveDays())
                  buildSeasonCol()
                  epTab.text = "Catchup"
                  (pillEps.getChildAt(1) as TextView).text = "Catchup"
                  liveLayer.visibility = View.GONE
                  openPlayer(Ep("", c.name, 0, "", null, 0, 0L), 0, true, false, "live://")
                  pillEps.visibility = View.VISIBLE
                  selectSeason(0, false)
              }

              private fun playCatchup(ep: Ep) {
                  val ch = liveCh ?: return
                  val now = System.currentTimeMillis()
                  val st = ep.air
                  val en = ep.air + ep.dur * 1000L
                  if (st > now) { toast("This program has not aired yet"); return }
                  if (now < en) {                                       // airing right now => live
                      liveStartS = 0L; liveEndS = 0L
                      showTitle = "Live"
                      openPlayer(Ep(ep.id, ch.name, 0, ep.desc, null, 0, 0L), 0, true, false, "live://")
                      return
                  }
                  if (st < now - 7 * 86400000L) { toast("Catchup is available for the last 7 days only"); return }
                  val endCap = min(en, now - 30000L)                    // end time must be at least 30s in the past
                  if (endCap <= st) { toast("Not available yet"); return }
                  liveStartS = st / 1000L; liveEndS = endCap / 1000L
                  showTitle = ch.name
                  openPlayer(Ep(ep.id, ep.title, 0, ep.desc, null, ((endCap - st) / 1000L).toInt(), ep.air), 0, true, false, "live://")
              }

              private fun loadLiveEpg() {
                  val ch = liveCh ?: return
                  if (curSeason !in seasons.indices) return
                  val tok = epToken
                  val off = seasons[curSeason].id.toIntOrNull() ?: 0
                  epLoading = true
                  Thread {
                      val list = fetchEpg(ch.jio, off)
                      ui.post {
                          if (tok != epToken || !liveMode) return@post
                          epLoading = false
                          showEpSkel(false)
                          if (list == null) {
                              if (eps.isEmpty()) { epStatus.text = "Could not load programs"; epStatus.visibility = View.VISIBLE }
                              return@post
                          }
                          eps.clear()
                          for (p in list) eps.add(Ep("live" + p.start, p.name, 0, p.desc, p.thumb, ((p.end - p.start) / 1000L).toInt(), p.start))
                          epAdapter.notifyDataSetChanged()
                          if (eps.isEmpty()) { epStatus.text = "No programs"; epStatus.visibility = View.VISIBLE } else epStatus.visibility = View.GONE
                          if (epActive() && wantEpFocus) { wantEpFocus = false; focusFirstEp(12) }
                      }
                  }.start()
              }

              private fun liveNowIndex(): Int {
                  val n = System.currentTimeMillis()
                  return eps.indexOfFirst { it.air <= n && n < it.air + it.dur * 1000L }
              }

