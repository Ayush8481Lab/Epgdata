              private fun typeKey(k: String) {
                  if (k == "<") { if (sQuery.isNotEmpty()) sQuery = sQuery.dropLast(1) }
                  else if (k == " ") { if (sQuery.isNotEmpty() && !sQuery.endsWith(" ")) sQuery += " " }
                  else if (sQuery.length < 40) sQuery += k
                  renderInput()
                  onQueryChanged()
              }

              private fun onQueryChanged() {
                  sRun?.let { ui.removeCallbacks(it) }
                  sTok++
                  val q = sQuery.trim()
                  if (q.length < 2) {                                   // minimum 2 letters: below that the trending grid is shown
                      if (trendItems.isNotEmpty()) showGrid(trendItems, "Trending in India", "")
                      else loadTrending()
                      return
                  }
                  val tok = sTok
                  val r = Runnable { doSearch(q, tok) }
                  sRun = r
                  ui.postDelayed(r, 450)
              }

              private fun showGrid(list: List<Item>, head: String, empty: String) {
                  sItems.clear(); sItems.addAll(list)
                  sAdapter.notifyDataSetChanged()
                  sHead.text = head
                  sGrid.scrollToPosition(0)
                  if (list.isEmpty()) { sStatus.text = empty; sStatus.visibility = View.VISIBLE } else sStatus.visibility = View.GONE
              }

              // search / trending asset -> Item that opens a detail page. Shows + movie bundles only.
              // A plain MOVIE asset is mapped to its MOVIE_BUNDLE parent (that is the id the movie detail page needs).
              private fun parseSearch(o: JSONObject): Item? {
                  val it0 = parseItem(o) ?: return null
                  if (it0.cid.isBlank()) return null
                  if (it0.sub == SUB_SHOW || it0.sub == SUB_MOVIE_BUNDLE) return it0
                  if (it0.sub == "MOVIE") {
                      val ps = o.optJSONArray("parents")
                      if (ps != null) for (i in 0 until ps.length()) {
                          val p = ps.optJSONObject(i) ?: continue
                          val pid = p.optString("parentId")
                          if (p.optString("parentSubType").equals(SUB_MOVIE_BUNDLE, true) && pid.isNotBlank() && pid != "0")
                              return it0.copy(id = pid, cid = pid, sub = SUB_MOVIE_BUNDLE)
                      }
                  }
                  return null
              }

              private fun collectSearch(arr: JSONArray?, out: ArrayList<Item>, seen: HashSet<String>, depth: Int) {
                  if (arr == null || depth > 3) return
                  for (i in 0 until arr.length()) {
                      val c = arr.optJSONObject(i) ?: continue
                      val p = parseSearch(c)
                      if (p != null) { if (seen.add(p.cid)) out.add(p); continue }
                      collectSearch(c.optJSONArray("containers"), out, seen, depth + 1)
                      collectSearch(c.optJSONArray("assets"), out, seen, depth + 1)
                  }
              }

              private fun loadTrending() {
                  if (trendLoading) return
                  trendLoading = true
                  if (sItems.isEmpty()) { sStatus.text = "Loading..."; sStatus.visibility = View.VISIBLE }
                  Thread {
                      val j = Api.get(TRENDING_URL)
                      val list = ArrayList<Item>()
                      collectSearch(j?.optJSONObject("resultObj")?.optJSONArray("containers"), list, HashSet(), 0)
                      ui.post {
                          trendLoading = false
                          trendItems = list
                          if (sQuery.trim().length < 2) {
                              showGrid(list, "Trending in India", "Could not load trending\n" + Api.lastError)
                          }
                      }
                  }.start()
              }

              private fun doSearch(q: String, tok: Int) {
                  if (sItems.isEmpty()) { sStatus.text = "Searching..."; sStatus.visibility = View.VISIBLE }
                  Thread {
                      val url = SEARCH_URL + java.net.URLEncoder.encode(q, "UTF-8") + "&from=0&to=15"
                      val j = Api.get(url)
                      val list = ArrayList<Item>()
                      collectSearch(j?.optJSONObject("resultObj")?.optJSONArray("containers"), list, HashSet(), 0)
                      ui.post {
                          if (tok != sTok || tab != 0) return@post
                          if (j == null) showGrid(emptyList(), "Search results", "Search failed\n" + Api.lastError)
                          else showGrid(list, "Search results", "No results found")
                      }
                  }.start()
              }

