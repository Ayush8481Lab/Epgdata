name: Merge EPG Smart

on:
  schedule:
    # GitHub Actions uses UTC. IST is UTC+5:30
    - cron: '30 18 * * *'  # Runs at 12:00 AM IST (midnight)
    - cron: '30 3 * * *'   # Runs at 9:00 AM IST
    - cron: '0 9 * * *'    # Runs at 2:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge EPG Files
        run: |
          cat > merge_epg.py << 'PYTHON_EOF'
          import os
          import sys
          import re
          import glob
          import gzip
          from datetime import datetime, timedelta

          def parse_epg_content(content):
              channels = {}
              programmes = []
              
              channel_pattern = r'<channel\s+id="([^"]+)"[^>]*>.*?</channel>'
              for match in re.finditer(channel_pattern, content, re.DOTALL):
                  channel_id = match.group(1)
                  if channel_id not in channels:
                      channels[channel_id] = match.group(0)
              
              programme_pattern = r'<programme\s+[^>]*>.*?</programme>'
              for match in re.finditer(programme_pattern, content, re.DOTALL):
                  prog_xml = match.group(0)
                  channel_match = re.search(r'channel="([^"]+)"', prog_xml)
                  if channel_match:
                      start_match = re.search(r'start="([^"]+)"', prog_xml)
                      programmes.append({
                          'channel': channel_match.group(1),
                          'xml': prog_xml,
                          'start': start_match.group(1) if start_match else ''
                      })
              
              return channels, programmes

          def format_xml_block(xml_string):
              # 1. Clean up random/bad spacing from original source files
              xml_string = re.sub(r'>\s+<', '><', xml_string.strip())
              
              # 2. Force standardized line breaks for SAX Parsers
              xml_string = xml_string.replace('><', '>\n<')
              
              # 3. Apply perfect 2-space and 4-space indentation exactly like your sample
              lines = xml_string.split('\n')
              formatted_lines = []
              for i, line in enumerate(lines):
                  if i == 0 or i == len(lines) - 1:
                      # Outer tags (e.g. <channel...> and </channel>) get 2 spaces
                      formatted_lines.append("  " + line)
                  else:
                      # Inner tags (e.g. <title...>, <desc...>) get 4 spaces
                      formatted_lines.append("    " + line)
                      
              return '\n'.join(formatted_lines)

          def write_compressed_file(xml_content, output_path):
              xml_bytes = xml_content.encode('utf-8')
              compressed_data = gzip.compress(xml_bytes, compresslevel=9, mtime=0)
              
              with open(output_path, 'wb') as f:
                  f.write(compressed_data)

          def build_xml(channels, programmes):
              # CRITICAL: Sort programmes by channel so they are grouped sequentially!
              programmes.sort(key=lambda x: (x['channel'], x['start']))
              
              # Sort channels alphabetically to match programme blocks
              sorted_channel_ids = sorted(channels.keys())
              
              # Standard XMLTV Header
              xml_parts = [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<tv generator-info-name="SmartEPG">'
              ]
              
              # Inject perfectly formatted Channel blocks first
              for ch_id in sorted_channel_ids:
                  xml_parts.append(format_xml_block(channels[ch_id]))
              
              # Inject perfectly formatted Programme blocks next
              for prog in programmes:
                  xml_parts.append(format_xml_block(prog['xml']))
              
              xml_parts.append('</tv>\n')
              
              return '\n'.join(xml_parts)

          def main():
              print("=" * 70)
              print("EPG SMART MERGER - CATCHUP & LIVE")
              print("=" * 70)
              
              today = datetime.now().date()
              today_str = today.strftime('%Y-%m-%d')
              tomorrow_str = (today + timedelta(days=1)).strftime('%Y-%m-%d')
              
              full_channels = {}
              full_programmes_dict = {} 
              
              live_channels = {}
              live_programmes_dict = {} 
              
              # 1. Process Catchup files (Day0Catchup to Day6Catchup)
              catchup_files_found = 0
              catchup_progs_added = 0
              
              for i in range(7):
                  filename = f"Day{i}Catchup.xml"
                  path_in_epg = os.path.join("Epg", filename)
                  path_in_root = filename
                  
                  file_path = path_in_epg if os.path.exists(path_in_epg) else (path_in_root if os.path.exists(path_in_root) else None)
                      
                  if file_path:
                      catchup_files_found += 1
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          channels, programmes = parse_epg_content(content)
                          for ch_id, ch_xml in channels.items():
                              full_channels[ch_id] = ch_xml
                                  
                          for prog in programmes:
                              prog_key = (prog['channel'], prog['start'])
                              full_programmes_dict[prog_key] = prog
                              catchup_progs_added += 1
                              
                          print(f"  ✓ {file_path} -> Added {len(programmes)} programmes")
                      except Exception as e:
                          print(f"  ✗ Error reading {file_path}: {e}")
              
              # 2. Process Today & Tomorrow files
              for target_date in [today_str, tomorrow_str]:
                  files = sorted(glob.glob(f"Epg/{target_date}*.xml"))
                  for file_path in files:
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          channels, programmes = parse_epg_content(content)
                          print(f"  📅 {target_date}: {os.path.basename(file_path)} ({len(programmes)} programmes)")
                          
                          for ch_id, ch_xml in channels.items():
                              full_channels[ch_id] = ch_xml
                              live_channels[ch_id] = ch_xml
                          
                          for prog in programmes:
                              prog_key = (prog['channel'], prog['start'])
                              full_programmes_dict[prog_key] = prog
                              live_programmes_dict[prog_key] = prog
                              
                      except Exception as e:
                          print(f"    ✗ Error: {e}")
              
              # Build and write final outputs
              full_programmes = list(full_programmes_dict.values())
              live_programmes = list(live_programmes_dict.values())

              if full_programmes:
                  print("\n📦 Building Full EPG...")
                  build_xml_content = build_xml(full_channels, full_programmes)
                  write_compressed_file(build_xml_content, 'Epg.xml.gz')
              
              if live_programmes:
                  print("📦 Building Live EPG...")
                  build_xml_content = build_xml(live_channels, live_programmes)
                  write_compressed_file(build_xml_content, 'LiveEpg.xml.gz')
              
              print("✅ Process Completed Successfully!")

          if __name__ == "__main__":
              main()
          PYTHON_EOF
          
          python3 merge_epg.py

      - name: Commit and Push
        run: |
          rm -f merge_epg.py Epg.xml LiveEpg.xml
          
          if [ -f Epg.xml.gz ] && [ -f LiveEpg.xml.gz ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add Epg.xml.gz LiveEpg.xml.gz
            
            if git diff --cached --quiet; then
              echo "ℹ️ No changes to commit"
            else
              git commit -m "Auto update EPG: $(date +%Y-%m-%d_%H-%M) [skip ci]"
              git push
              echo "✓ Successfully pushed!"
            fi
          else
            echo "❌ ERROR: Output files were not created!"
            exit 1
          fi
